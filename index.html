<title>针灸学习知识库</title>
<style>
/* ===== 基础：设计变量 ===== */
:root{
  --bg:#f6f3ec; --bg2:#fffdf8; --card:#fffdf8; --line:#e2dacb; --line2:#cfc4b0;
  --tx:#26221c; --tx2:#6a6259; --tx3:#8d857a;
  --acc:#8a2f27; --acc2:#b4483c; --acc-bg:#f7ece9;
  --ok:#21715c; --warn:#9a6a12; --warn-bg:#fdf5e3; --err:#a3382c; --err-bg:#fbeceb;
  --sh:0 2px 10px rgba(38,34,28,.08);
  --r:12px; --r2:8px; --sp:12px;
  --tabh:56px; --headh:52px;
}
@media (prefers-color-scheme: dark){
  html[data-theme="auto"]{
    --bg:#14120f; --bg2:#1b1815; --card:#1e1b17; --line:#332e28; --line2:#463f37;
    --tx:#ece6dc; --tx2:#aca294; --tx3:#877e72;
    --acc:#e08b7f; --acc2:#c9705f; --acc-bg:#2c1f1c;
    --ok:#63b79b; --warn:#d8ac5c; --warn-bg:#2a2417; --err:#e08b7f; --err-bg:#2c1d1b;
    --sh:0 2px 10px rgba(0,0,0,.4);
  }
}
html[data-theme="dark"]{
  --bg:#14120f; --bg2:#1b1815; --card:#1e1b17; --line:#332e28; --line2:#463f37;
  --tx:#ece6dc; --tx2:#aca294; --tx3:#877e72;
  --acc:#e08b7f; --acc2:#c9705f; --acc-bg:#2c1f1c;
  --ok:#63b79b; --warn:#d8ac5c; --warn-bg:#2a2417; --err:#e08b7f; --err-bg:#2c1d1b;
  --sh:0 2px 10px rgba(0,0,0,.4);
}

/* ===== 基础：重置与排版 ===== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
  font-size:16px; line-height:1.6; overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,h4{margin:0 0 8px; line-height:1.35; font-weight:700}
h1{font-size:1.35rem} h2{font-size:1.15rem} h3{font-size:1rem} h4{font-size:.95rem}
p{margin:0 0 10px}
a{color:var(--acc); text-decoration:none}
a:hover{text-decoration:underline}
ul,ol{margin:0 0 10px; padding-left:1.2em}
button,input,select,textarea{font-family:inherit; font-size:16px; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc); outline-offset:2px}
hr{border:0; border-top:1px solid var(--line); margin:14px 0}
img,svg{max-width:100%}
.skip{position:absolute; left:-9999px; top:0; background:var(--card); padding:10px; z-index:90}
.skip:focus{left:8px; top:8px}
.hide{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== 布局：应用骨架 ===== */
#app{display:flex; flex-direction:column; min-height:100dvh; height:100dvh}
.app-head{
  flex:0 0 auto; display:flex; align-items:center; gap:8px;
  height:var(--headh); padding:0 10px;
  padding-top:env(safe-area-inset-top);
  background:var(--bg2); border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:30;
}
.app-main{
  flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
}
.view{max-width:1040px; margin:0 auto; padding:12px 12px 20px}
.app-foot{
  flex:0 0 auto; padding:10px 14px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
  background:var(--bg2); border-top:1px solid var(--line);
  color:var(--tx3); font-size:.75rem; line-height:1.5; text-align:center;
}
.app-foot b{color:var(--tx2); font-weight:600}
@media (min-width:768px){
  .app-foot{padding-bottom:10px}
}

/* ===== 布局：品牌与按钮 ===== */
.brand{display:flex; align-items:center; gap:8px; min-width:0}
.brand-mark{
  flex:0 0 auto; width:30px; height:30px; border-radius:50%;
  background:var(--acc); color:#fff; display:grid; place-items:center;
  font-size:.85rem; font-weight:700; letter-spacing:.5px;
}
.brand-txt{min-width:0}
.brand-title{font-size:.98rem; font-weight:700; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.brand-sub{font-size:.68rem; color:var(--tx3); line-height:1.2}
.icon-btn{
  flex:0 0 auto; width:44px; height:44px; display:grid; place-items:center;
  border:0; background:transparent; border-radius:10px; color:var(--tx);
}
.icon-btn:hover{background:var(--bg)}
.icon-btn:active{background:var(--line)}
.icon-btn svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round}
.head-spacer{flex:1 1 auto}
.head-ver{font-size:.7rem; color:var(--tx3)}

/* ===== 布局：桌面导航 ===== */
.nav-desktop{display:none}
@media (min-width:768px){
  .nav-desktop{display:flex; align-items:center; gap:2px; flex:1 1 auto; overflow-x:auto; scrollbar-width:none}
  .nav-desktop::-webkit-scrollbar{display:none}
  .nav-desktop a{
    flex:0 0 auto; padding:9px 12px; border-radius:8px; color:var(--tx2);
    font-size:.9rem; white-space:nowrap;
  }
  .nav-desktop a:hover{background:var(--bg); text-decoration:none}
  .nav-desktop a.on{background:var(--acc-bg); color:var(--acc); font-weight:600}
  .only-mobile{display:none !important}
}

/* ===== 布局：移动端底部 Tab ===== */
.nav-tabs{
  flex:0 0 auto; display:grid; grid-template-columns:repeat(5,1fr);
  background:var(--bg2); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom); z-index:30;
}
.nav-tabs a{
  min-height:var(--tabh); display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:2px; color:var(--tx3); font-size:.68rem; text-decoration:none;
}
.nav-tabs a:hover{text-decoration:none}
.nav-tabs a.on{color:var(--acc)}
.nav-tabs a.on .tab-ico{background:var(--acc-bg)}
.tab-ico{width:26px; height:22px; display:grid; place-items:center; border-radius:7px; font-size:.95rem; line-height:1}
@media (min-width:768px){ .nav-tabs{display:none} }

/* ===== 布局：抽屉 ===== */
.mask{
  position:fixed; inset:0; background:rgba(20,18,15,.5); z-index:40;
  opacity:0; pointer-events:none; transition:opacity .2s;
}
.mask.open{opacity:1; pointer-events:auto}
.drawer{
  position:fixed; top:0; bottom:0; right:0; width:min(82vw,320px); z-index:41;
  background:var(--bg2); border-left:1px solid var(--line);
  transform:translateX(102%); transition:transform .24s ease;
  display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
}
.drawer.open{transform:translateX(0)}
.drawer-head{
  flex:0 0 auto; display:flex; align-items:center; gap:8px;
  padding:10px 10px 10px 14px; border-bottom:1px solid var(--line);
}
.drawer-head h2{margin:0; font-size:1rem; flex:1 1 auto}
.drawer-body{flex:1 1 auto; overflow-y:auto; padding:8px 8px 16px}
.drawer-sec{padding:10px 6px 4px; font-size:.72rem; color:var(--tx3); letter-spacing:.04em}
.drawer-link{
  display:flex; align-items:center; gap:10px; min-height:46px; padding:8px 10px;
  border-radius:10px; color:var(--tx); text-decoration:none;
}
.drawer-link:hover{background:var(--bg); text-decoration:none}
.drawer-link.on{background:var(--acc-bg); color:var(--acc); font-weight:600}
.drawer-link .dl-ico{width:24px; text-align:center; font-size:1rem}
.drawer-link .dl-t{flex:1 1 auto; font-size:.95rem}
.drawer-link .dl-s{font-size:.68rem; color:var(--tx3); border:1px solid var(--line2); border-radius:99px; padding:1px 6px}
.drawer-foot{padding:10px 14px; border-top:1px solid var(--line); font-size:.7rem; color:var(--tx3)}

/* ===== 通用：卡片 ===== */
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:12px; margin:0 0 12px; box-shadow:var(--sh);
}
.card-t{display:flex; align-items:center; gap:8px; margin-bottom:8px}
.card-t h2,.card-t h3{margin:0; flex:1 1 auto}
.card-note{font-size:.78rem; color:var(--tx3)}
.grid{display:grid; gap:10px; grid-template-columns:1fr}
@media (min-width:480px){ .grid.g2{grid-template-columns:1fr 1fr} }
@media (min-width:1024px){ .grid.g3{grid-template-columns:repeat(3,1fr)} .grid.g2{grid-template-columns:1fr 1fr} }

/* ===== 通用：小部件 ===== */
.chip{
  display:inline-flex; align-items:center; gap:4px;
  border:1px solid var(--line2); background:var(--bg); color:var(--tx2);
  border-radius:99px; padding:3px 10px; font-size:.72rem; line-height:1.5;
}
.chip.acc{border-color:var(--acc); color:var(--acc); background:var(--acc-bg)}
.chip.warn{border-color:var(--warn); color:var(--warn); background:var(--warn-bg)}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  min-height:44px; padding:9px 16px; border-radius:10px;
  border:1px solid var(--line2); background:var(--bg2); color:var(--tx);
  font-size:.95rem; font-weight:500; text-decoration:none;
}
.btn:hover(){text-decoration:none; border-color:var(--acc)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--acc); border-color:var(--acc); color:#fff}
.btn.primary:hover{background:var(--acc2)}
.btn.block{width:100%}
.btn.sm{min-height:36px; padding:5px 10px; font-size:.82rem; border-radius:8px}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.inp{
  width:100%; min-height:44px; padding:9px 12px; border-radius:10px;
  border:1px solid var(--line2); background:var(--bg2); color:var(--tx);
}
.inp::placeholder{color:var(--tx3)}
.list-plain{list-style:none; margin:0; padding:0}
.row{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.meta{font-size:.78rem; color:var(--tx3)}
.todo{border-left:3px solid var(--warn); background:var(--warn-bg); border-radius:0 var(--r2) var(--r2) 0; padding:8px 10px; color:var(--tx2); font-size:.82rem}
.todo b{color:var(--warn)}
.kbd{font-family:ui-monospace,Menlo,Consolas,monospace; border:1px solid var(--line2); border-bottom-width:2px; border-radius:5px; padding:0 5px; font-size:.75rem; background:var(--bg)}
.stat{display:flex; align-items:baseline; gap:6px}
.stat b{font-size:1.3rem}
.stat span{font-size:.75rem; color:var(--tx3)}

/* ===== 通用：吐司 ===== */
#toast()-wrap{
  position:fixed; left:50%; transform:translateX(-50%); z-index:70;
  bottom:calc(var(--tabh) + 18px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:8px; align-items:center;
  width:max-content; max-width:88vw; pointer-events:none;
}
@media (min-width:768px){ #toast()-wrap{bottom:24px} }
.toast(){
  background:rgba(28,25,21,.94); color:#f7f3ea; padding:9px 14px; border-radius:10px;
  font-size:.85rem; box-shadow:0 4px 16px rgba(0,0,0,.3);
  opacity:0; transform:translateY(6px); transition:opacity .2s, transform .2s;
  max-width:88vw; text-align:center;
}
.toast().show{opacity:1; transform:translateY(0)}

/* ===== 适配：横屏与小屏 ===== */
@media (max-height:430px) and (orientation:landscape){
  .app-head{height:44px}
  .nav-tabs a{min-height:48px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important; transition-duration:.01ms !important}
}
</style>

<script>

/* =====================================================================
   针灸学习知识库 · 单文件纯前端应用：应用骨架 / hash 路由 / LocalStorage 封装 / 底部 Tab + 抽屉
   ===================================================================== */
'use strict';

/* ===== 工具：DOM ===== */
var $ = function(id){ return document.getElementById(id); };
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function debounce(fn, ms){
  var t = 0;
  ms = ms == null ? 200 : ms;
  return function(){
    var self = this, args = arguments;
    clearTimeout(t);
    t = setTimeout(function(){ fn.apply(self, args); }, ms);
  };
}
function throttle(fn, ms){
  var last = 0, timer = 0, lastArgs = null;
  ms = ms || 300;
  return function(){
    var now = Date.now, self = this;
    lastArgs = arguments;
    if (now - last >= ms){
      last = now; fn.apply(self, lastArgs);
    } else if (!timer){
      timer = setTimeout(function(){
        timer = 0; last = Date.now; fn.apply(self, lastArgs);
      }, ms - (now - last));
    }
  };
}
/* 数据缺失时统一显示破折号 */
var PENDING = '—';
var EMPTY_FIELD = '—';

/* ===== 工具：LocalStorage ===== */
var LS_PREFIX = 'zj:';
var LS_KEYS = {
  favorites:'zj:favorites',
  notes:'zj:notes',
  wrongQuestions:'zj:wrongQuestions',
  progress:'zj:progress',
  settings:'zj:settings',
  version:'zj:version',
  quizBookmarks:'zj:quizBookmarks'
};
var DATA_VERSION = '0.1.0';

var Store = (function(){
  var mem = {};          /* 内存影子，读取更快、写入可合并 */
  var dirty = {};        /* 待落盘 */
  var available = true;

  function rawGet(k){
    try { return localStorage.getItem(k); }
    catch(e){ available = false; return mem[k] == null ? null : mem[k]; }
  }
  /* v === null 表示删除该键 */
  function rawSet(k, v){
    mem[k] = v;
    try {
      if (v === null) localStorage.removeItem(k);
      else localStorage.setItem(k, v);
      return true;
    }
    catch(e){ available = false; return false; }
  }
  var flush = function(){
    var ks = Object.keys(dirty);
    if (!ks.length) return;
    var ok = true;
    for (var i = 0; i < ks.length; i++){
      var k = ks[i];
      if (!rawSet(k, dirty[k])) ok = false;
    }
    dirty = {};
    if (!ok) toast('本地存储写入失败（可能是隐私模式或空间不足）','warn');
  };
  var flushSoon = debounce(flush, 250);

  function read(key, fallback){
    if (mem[key] === undefined){
      var t = rawGet(LS_PREFIX + key);
      if (t == null){ mem[key] = fallback; }
      else {
        try { mem[key] = JSON.parse(t); }
        catch(e){ mem[key] = fallback; }
      }
    }
    return mem[key];
  }
  function write(key, val){
    mem[key] = val;
    dirty[LS_PREFIX + key] = JSON.stringify(val);
    flushSoon;
    return val;
  }
  function remove(key){
    delete mem[key];
    dirty[LS_PREFIX + key] = null;   /* 落盘时转成 removeItem */
    flushSoon;
  }

  function keys(){ return LS_KEYS; }
  function isAvailable(){ return available; }
  function snapshot(){
    var o = {};
    for (var k in LS_KEYS){ o[LS_KEYS[k]] = read(k, null); }
    o[LS_PREFIX + 'exportedAt'] = new Date().toISOString();
    return o;
  }
  function clearAll(){
    for (var k in LS_KEYS){
      delete mem[k];
      try { localStorage.removeItem(LS_KEYS[k]); }
      catch(e){ available = false; }
    }
  }
  function ensureVersion(){
    var v = read('version', null);
    if (v == null){
      write('version', DATA_VERSION);
    } else if (v !== DATA_VERSION){
      write('version', DATA_VERSION);      /* 预留：做数据迁移 */
    }
  }
  window.addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'hidden') flush;
  });

  return {
    read:read, write:write, remove:remove, flush:flush,
    keys:keys, snapshot:snapshot, clearAll:clearAll,
    ensureVersion:ensureVersion, isAvailable:isAvailable
  };
})();

/* ===== 工具：集合读写 ===== */
var Prefs = {
  settings:function(){
    var s = Store.read('settings', null);
    if (!s || typeof s !== 'object'){
      s = { theme:'auto', fontSize:'normal', svgLabels:true };
      Store.write('settings', s);
    }
    return s;
  },
  setSetting:function(k, v){
    var s = Prefs.settings();
    s[k] = v;
    Store.write('settings', s);
    return s;
  },
  list:function(name){
    var a = Store.read(name, []);
    return Object.prototype.toString.call(a) === '[object Array]' ? a : [];
  },
  has:function(name, id){ return Prefs.list(name).indexOf(id) > -1; },
  toggle:function(name, id){
    var a = Prefs.list(name), i = a.indexOf(id);
    if (i > -1) a.splice(i, 1); else a.unshift(id);
    Store.write(name, a);
    return i === -1;                       /* true = 已加入 */
  },
  add:function(name, id){
    var a = Prefs.list(name);
    if (a.indexOf(id) === -1){ a.unshift(id); Store.write(name, a); }
    return true;
  },
  remove:function(name, id){
    var a = Prefs.list(name), i = a.indexOf(id);
    if (i > -1){ a.splice(i, 1); Store.write(name, a); }
    return true;
  },
  notes:function(){
    var n = Store.read('notes', {});
    return (n && typeof n === 'object' && Object.prototype.toString.call(n) !== '[object Array]') ? n : {};
  },
  note:function(ref){ return Prefs.notes()[ref] || null; },
  setNote:function(ref, text, tags){
    var n = Prefs.notes();
    if (!text && !(tags && tags.length)){ delete n[ref]; }
    else {
      n[ref] = { text:String(text || ''), tags:tags || [], updatedAt:new Date().toISOString() };
    }
    Store.write('notes', n);
    return n[ref] || null;
  }

  };
}

function buildAcupointIndex(){
  ACUPOINTS = [];
  ACUPOINT_INDEX = {};
  for (var i = 0; i < ACUPOINT_RAW.length; i++){
    var a = normalizeAcupoint(ACUPOINT_RAW[i]);
    /* 经外奇穴代码形如 EX-HN3，没有“本经流注序号”，按数据顺序编号 */
    if (a.meridianId === 'ex') a.order = i + 1;
    ACUPOINTS.push(a);
    ACUPOINT_INDEX[a.code] = a;
    ACUPOINT_INDEX[a.code.toUpperCase()] = a;
  }
  /* 同一经脉内按 order 排序 */
  ACUPOINTS.sort(function(x, y){
    if (x.meridianId === y.meridianId) return x.order - y.order;
    return 0;
  });
  /* 把奇穴挂到 EXTRA_MERIDIAN 上，供经络页与筛选使用 */
  var ex = [];
  for (var k = 0; k < ACUPOINTS.length; k++){
    if (ACUPOINTS[k].meridianId === 'ex') ex.push(ACUPOINTS[k].code);
  }
  EXTRA_MERIDIAN.acupoints = ex;
  EXTRA_MERIDIAN.acupointCount = ex.length;
  return ACUPOINTS.length;
}

function getAcupoint(code){
  if (!code) return null;
  return ACUPOINT_INDEX[code] || ACUPOINT_INDEX[String(code).toUpperCase()] || null;
}
function acupointsOf(meridianId){
  var m = getMeridian(meridianId);
  if (!m) return [];
  var out = [];
  for (var i = 0; i < ACUPOINTS.length; i++){
    if (ACUPOINTS[i].meridianId === m.id) out.push(ACUPOINTS[i]);
  }
  return out;
}
/* 数据统计：给首页、经络页与设置页显示规模用 */
function dataStats(){
  var filled = 0, plan = 0;
  for (var i = 0; i < ACUPOINTS.length; i++){
    if (ACUPOINTS[i].plan) plan++; else filled++;
  }
  var total = 0;
  for (var j = 0; j < MERIDIANS.length; j++) total += MERIDIANS[j].acupointCount;
  return { total:total, written:ACUPOINTS.length, filled:filled, plan:plan };
}

  ["LI4", "合谷", "he gu", 4, "在手背，第1、2掌骨间，第2掌骨桡侧的中点处；简便取穴：以对侧拇指指间关节横纹压在虎口指蹼缘上，拇指尖所指处", "直刺0.5～1寸；可灸", "疏风解表、清热镇痛、通络开窍、调理气血", "头痛、目赤肿痛、齿痛、鼻衄、咽喉肿痛、牙关紧闭、口眼歪斜等头面五官病症；发热恶寒等外感表证；上肢疼痛、不遂；经闭、滞产", ["原穴"], "手背向上自然放松，向第2掌骨掌侧或掌心方向直刺0.5～1寸，得气后行捻转提插，针感可向指端或前臂传导；治面口疾患多用泻法，留针20～30分钟", "孕妇禁针，尤其禁强刺激，以免引起子宫收缩；刺激过强可出现酸麻胀痛或晕针，体弱者宜卧位轻刺；穴区血管神经丰富，出针后按压以防血肿", "孕妇禁刺；局部皮肤感染、溃疡者禁刺；大汗、极度疲劳、饥饿或精神高度紧张时暂缓针刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["LI5", "阳溪", "yang xi", 5, "在腕区，腕背侧远端横纹桡侧，桡骨茎突远端，解剖学鼻烟窝（拇指上翘时腕背桡侧的凹陷）中；即拇长伸肌腱与拇短伸肌腱之间", "直刺0.5～0.8寸；可灸", "清热散风、通利关节、清利头目", "头痛、目赤肿痛、齿痛、咽喉肿痛、耳鸣耳聋；腕臂酸痛、手腕无力；热病心烦", ["五输穴·经"], "拇指自然伸展，于鼻烟窝中央直刺0.5～0.8寸，行捻转手法使酸胀感向手背放散；治腕部劳损可配合温针灸，留针20分钟", "鼻烟窝底部有桡动脉经过，进针不宜过深，避免刺伤血管；出现剧痛或放电样麻木应退针调整方向", "局部皮肤破损、感染者禁刺；腕部骨折急性期、严重腕关节积液者禁深刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["LI6", "偏历", "pian li", 6, "在前臂，腕背侧远端横纹上3寸，阳溪与曲池的连线上；屈肘侧掌，于桡骨外侧缘按取", "直刺或斜刺0.3～0.5寸；可灸", "清热利水、通调水道、宣肺利咽", "鼻衄、目赤肿痛、耳鸣耳聋、咽喉肿痛；手臂酸痛、面瘫；水肿、小便不利", ["络穴"], "沿桡骨外侧缘直刺或向肘部斜刺0.3～0.5寸，捻转得气即可；本穴为络穴，可平补平泻，留针15～20分钟", "深层有桡神经浅支与前臂外侧皮神经，出现放电样麻感应立即退针调整；不宜过深以防刺及骨膜与血管", "局部皮肤感染、溃疡者禁刺；桡骨骨膜炎症明显处慎刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["LI7", "温溜", "wen liu", 7, "在前臂，腕背侧远端横纹上5寸，阳溪与曲池的连线上；于桡骨外侧缘、腕横纹上5寸处取穴", "直刺0.5～1寸；可灸", "清热消肿、调理肠胃、通络止痛", "急性腹痛、肠鸣、泄泻；齿痛、咽喉肿痛、面肿、鼻衄；前臂酸痛、头痛", ["郄穴"], "直刺0.5～1寸，得气后行提插捻转，本穴为郄穴，急症时多用较强刺激并适当延长留针；可配艾条温和灸", "穴下有桡侧腕伸肌群与骨间背侧神经分支，针刺以局部酸胀为度，避免强电刺激引起肌肉抽搐", "局部皮肤感染、溃疡者禁刺；急性腹痛原因未明时应先明确诊断，不可仅依赖针刺止痛。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["LI8", "下廉", "xia lian", 8, "在前臂，肘横纹下4寸，阳溪与曲池的连线上；屈肘侧掌，于桡骨外侧缘腕上约8寸处取穴", "直刺0.5～1寸；可灸", "通络止痛、调理肠胃、清利头目", "肘臂酸痛、上肢麻木不遂；腹胀、腹痛、肠鸣；头痛、眩晕、目痛", null, "屈肘侧掌直刺0.5～1寸，行捻转手法使酸胀向腕部或肘部放散；治上肢痹痛常配曲池、手三里，可加温和灸", "深层邻近桡神经深支，进针时若出现向手背放射的麻电感，应退针少许并调整方向，避免反复刺激神经干", "局部皮肤感染、溃疡或血肿者禁刺；上肢急性外伤肿胀期慎用。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["LI9", "上廉", "shang lian", 9, "在前臂，肘横纹下3寸，阳溪与曲池的连线上；屈肘侧掌，于下廉上1寸处取穴", "直刺0.5～1寸；可灸", "通经活络、调理肠腑、清利头目", "肘臂酸痛麻木、上肢不遂；腹痛、肠鸣、泄泻；头痛、头晕", null, "直刺0.5～1寸，得气后行平补平泻捻转法；治上肢痿痹可加电针疏密波，治肠腑病症常配足三里", "邻近桡神经深支与骨间背侧血管，深刺或强刺激易致麻电感放射，应控制深度与刺激量", "局部皮肤感染、溃疡者禁刺；前臂急性软组织损伤肿胀期慎刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["LI10", "手三里", "shou san li", 10, "在前臂，肘横纹下2寸，阳溪与曲池的连线上；屈肘侧掌，于曲池下2寸、肌肉丰厚处取穴", "直刺0.8～1.2寸；可灸", "通经活络、理气和胃、消肿止痛", "肘臂酸痛麻木、上肢不遂、肩臂痛；腹胀、腹痛、泄泻、消化不良；齿痛、面颊肿痛", null, "屈肘侧掌直刺0.8～1.2寸，行提插捻转使酸胀感向前臂或肩部放散，为治上肢痿痹常用穴；可配温针灸或电针", "穴区肌肉较厚，深刺时仍应避开桡神经深支走行区；出现向手背放射的强烈麻电感应立即停止手法", "局部皮肤感染、溃疡者禁刺；针刺后出现明显血肿时应压迫止血并暂停再次针刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],

  ["LI11", "曲池", "qu chi", 11, "在肘区，屈肘成直角时肘横纹外侧纹头与肱骨外上髁连线的中点；屈肘90度，于肘横纹桡侧端与肱骨外上髁之间取穴", "直刺1～1.5寸；可灸", "清热解表、调和气血、疏经通络、降逆和胃", "发热、咽喉肿痛、齿痛、目赤肿痛、头痛等热性病症；上肢不遂、肘臂疼痛、肩臂痛；腹痛吐泻、痢疾、便秘；风疹、湿疹等皮肤瘙痒病症", ["五输穴·合"], "屈肘90度，直刺1～1.5寸，可透刺少海方向，行提插捻转使酸胀感向上臂或前臂放散；退热多用泻法，留针20～30分钟", "深部邻近桡神经本干与桡侧返动脉，不宜盲目深刺或反复提插，以免损伤神经血管；体质虚弱者手法宜轻，防止晕针", "肘关节急性化脓性炎症、局部皮肤感染或溃疡者禁刺；孕妇不宜强刺激。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["LI12", "肘髎", "zhou liao", 12, "在肘区，肱骨外上髁上缘，髁上嵴的前缘；屈肘，于曲池穴外上方约1寸、肱骨外上髁上方的凹陷中取穴", "直刺0.5～1寸；可灸", "舒筋活络、通利关节、止痛", "肘臂酸痛、麻木、拘挛；上肢不遂、肩臂疼痛；肱骨外上髁炎（网球肘）之局部疼痛", null, "屈肘，沿肱骨外上髁上缘向肘关节方向直刺或斜刺0.5～1寸，行捻转手法使酸胀感向肘部放散；常配阿是穴、曲池同用", "穴下贴近骨面与肘关节囊，进针遇坚硬阻力时不可强行深入，以免刺伤骨膜或进入关节腔", "肘关节腔积液、急性感染或局部皮肤破损者禁刺；关节置换术后局部慎刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["LI13", "手五里", "shou wu li", 13, "在臂部，肘横纹上3寸，曲池与肩髃的连线上；屈肘，于肱骨外侧、曲池上3寸处取穴", "直刺0.5～1寸；可灸，本穴古有禁灸之说，今多慎灸", "通经活络、行气散结、消肿止痛", "肘臂挛急疼痛、上肢不遂；瘰疬、腋下肿痛；肩臂痛", null, "避开肱动脉走行，于肱骨外侧缘直刺0.5～1寸，得气后行平补平泻捻转法；因穴区血管神经较集中，手法宜轻柔", "穴区深部有肱动脉与桡神经，针刺前应避开血管搏动处，不宜深刺或大幅度提插；出现放射样麻电感应立即退针", "局部皮肤感染、溃疡者禁刺；凝血功能障碍或有明显出血倾向者慎刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["LI14", "臂臑", "bi nao", 14, "在臂部，曲池上7寸，三角肌前缘处；屈肘，于曲池与肩髃连线上，三角肌止点处取穴", "直刺或向上斜刺0.8～1.5寸；可灸", "通经活络、理气消痰、明目止痛", "肩臂疼痛、上肢不遂、颈项拘挛；瘰疬、瘿气；目疾如目赤肿痛、视物模糊", ["交会穴"], "垂臂或屈肘，向三角肌方向直刺或略向上斜刺0.8～1.5寸，使酸胀感向肩部放散；治肩臂痛常配肩髃、曲池同用，可加温和灸", "穴区深部邻近桡神经与肱深动脉，深刺时若出现向前臂放射的麻电感，应退针并改变角度，避免损伤神经", "局部皮肤感染、溃疡者禁刺；肩关节急性脱位或骨折未愈者慎用。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["LI15", "肩髃", "jian yu", 15, "在三角肌区，肩峰外侧缘前端与肱骨大结节两骨间凹陷中；上臂外展至水平位时，肩峰前下方的凹陷即是", "直刺或向下斜刺0.8～1.5寸；可灸", "疏经通络、理气化痰、通利肩关节", "肩臂疼痛、肩关节活动不利、上肢不遂、肩周炎；风疹、瘰疬；肩部畏寒怕冷", ["交会穴"], "上臂外展或自然下垂时，向三角肌方向直刺或向下斜刺0.8～1.5寸，行提插捻转使酸胀向肩臂放散；治肩周炎常配肩髎、臂臑并配合肩关节功能锻炼", "穴下为三角肌与肩关节囊，不宜向内深刺以免进入关节腔；肩关节急性损伤、脱位或骨折急性期禁深刺、禁大幅度行针", "肩关节急性化脓性炎症、局部皮肤感染或开放性损伤者禁刺；体内有心脏起搏器者局部禁用强电刺激。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["LI16", "巨骨", "ju gu", 16, "在肩胛区，锁骨肩峰端与肩胛冈之间的凹陷中；正坐垂肩，于肩锁关节内下方的凹陷处取穴", "直刺0.5～0.8寸，或向肩关节方向斜刺0.5～1寸；可灸", "通经活络、消肿散结、理气止痛", "肩背疼痛、上肢不遂、肩关节活动受限；瘰疬、瘿气；肩臂不得屈伸", ["交会穴"], "正坐垂肩，沿锁骨肩峰端后方向下直刺或略向肩关节斜刺0.5～0.8寸，得气后行捻转手法；治肩背痛常配肩髃、肩井同用", "穴区深部为肩胛上动静脉与臂丛神经走行区，严禁向后下方深刺，以免造成气胸或损伤神经血管；进针遇骨性阻力不可强行深入", "局部皮肤感染、溃疡或肩部外伤骨折者禁刺；锁骨或肩胛骨病变处慎刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["LI17", "天鼎", "tian ding", 17, "在颈部，横平环状软骨，胸锁乳突肌后缘；正坐仰靠，于扶突穴直下约1寸、胸锁乳突肌后缘取穴", "直刺0.3～0.5寸，宜浅刺；可灸，多用温和灸", "清利咽喉、理气化痰、消肿散结", "咽喉肿痛、声音嘶哑、吞咽困难；瘰疬、瘿气、颈部肿痛；呃逆、暴喑", null, "正坐仰靠，先触清胸锁乳突肌后缘与颈部血管搏动位置，避开血管后直刺0.3～0.5寸，行轻柔捻转，不宜提插；一般不留针过久", "颈侧部有颈总动脉、颈内静脉与迷走神经等重要结构，必须浅刺，严禁深刺或反复提插；出现剧烈放射痛、头晕、心悸等应立即退针并观察", "颈部血管病变（如颈动脉硬化斑块、动脉瘤）、颈部肿块性质未明者禁刺；局部皮肤感染或甲状腺急性炎症期慎刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["LI18", "扶突", "fu tu", 18, "在颈部，横平喉结，胸锁乳突肌前缘与后缘的中点；正坐仰靠，于喉结旁开约3寸处取穴", "直刺0.5～0.8寸，宜浅刺；可灸，多用温和灸", "清利咽喉、理气化痰、止咳平喘", "咽喉肿痛、声音嘶哑、吞咽不利；咳嗽、气喘、呃逆；瘰疬、瘿气", null, "正坐仰靠，于胸锁乳突肌肌腹中点避开血管后直刺0.5～0.8寸，行轻柔捻转使局部酸胀；亦可向颈椎方向斜刺，进针宜缓，不提插", "穴区深部有颈总动脉、颈内静脉、迷走神经与臂丛神经，浅刺为要，严禁向内深刺或大幅度行针；针刺中若患者出现剧痛、咳嗽、心慌应立即停止操作", "颈部动脉硬化斑块、动脉瘤、颈部肿物性质未明者禁刺；甲状腺功能亢进急性期、局部皮肤感染者慎刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["LI19", "口禾髎", "kou he liao", 19, "在面部，鼻孔外缘直下，横平人中沟上1/3与下2/3交点处；即水沟穴旁开约0.5寸处取穴", "直刺或斜刺0.2～0.3寸，亦可向内上方平刺0.3～0.5寸；可灸，一般少灸", "宣通鼻窍、疏风清热、通络牵正", "鼻塞、鼻衄、不闻香臭、鼻息肉；口眼歪斜、牙关紧闭、面颊肿痛", null, "仰靠或仰卧，针尖略向上内方斜刺0.2～0.3寸，行轻微捻转使局部酸胀；治面瘫常配地仓、颊车、合谷同用，留针20分钟左右", "面部血管丰富且邻近鼻腔与上唇动脉，进针宜浅、手法宜轻，起针后按压片刻以防出血青紫；不宜向内深刺以免刺入鼻腔", "局部皮肤感染、痤疮破溃或鼻部急性出血期禁刺；面部有血管瘤或出血倾向者慎刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["LI20", "迎香", "ying xiang", 20, "在面部，鼻翼外缘中点旁，鼻唇沟中；正坐或仰卧，于鼻翼旁开约0.5寸的鼻唇沟凹陷处取穴", "略向内上方斜刺或平刺0.3～0.5寸；可灸，一般少灸", "通利鼻窍、疏风清热、散结消肿", "鼻塞、鼻衄、不闻香臭、鼻渊、鼻息肉等鼻部病症；口眼歪斜、面痒面肿；胆道蛔虫症之胆绞痛", ["交会穴"], "仰卧或正坐，针尖略向内上方朝鼻根方向斜刺或平刺0.3～0.5寸，行轻柔捻转，使局部酸胀并向鼻部放散；治鼻塞可配合鼻通、印堂，留针15～20分钟", "面部血管丰富，禁向内上方深刺以免刺入鼻腔引起出血；针后出血或明显青紫时应压迫止血，面部感染时不宜针刺", "鼻部急性出血、鼻部手术后创面未愈、局部皮肤感染者禁刺；高血压控制不佳者慎用强刺激。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  /* ---- 足阳明胃经（45 穴） ---- */
  ["ST1", "承泣", "cheng qi", 1, "在面部，眼球与眶下缘之间，瞳孔直下；正坐或仰卧，闭目取穴", "以左手拇指轻推眼球向上固定，右手持针沿眶下缘缓慢直刺0.3～0.7寸，不提插捻转；禁灸", "疏风清热、明目止泪、通络牵正", "目赤肿痛、迎风流泪、夜盲、眼睑瞤动；口眼歪斜", ["交会穴"], "进针宜缓，针尖贴眶下缘骨面缓慢推进，得气后留针，出针时用消毒干棉球按压1～2分钟，防止眶内出血与皮下瘀血", "位于眼眶内，进针方向须始终贴眶下缘，严禁向上深刺入眶腔，以免损伤眼球或视神经；出针后按压防血肿", "禁灸；眼眶周围有感染、外伤、术后或出血倾向者不宜针刺；针刺后出现眼球胀痛、复视应立即停止并就医。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["ST2", "四白", "si bai", 2, "在面部，眶下孔处；正坐，瞳孔直下，眶下缘下约0.3寸可扪及凹陷", "直刺0.3～0.5寸，不可深刺；可灸，但施灸须避开眼球", "祛风明目、通络止痛、牵正", "目赤痒痛、目翳、眼睑瞤动、迎风流泪；面痛、口眼歪斜、头痛眩晕", ["交会穴"], "针尖略向内下方缓慢进针，得气后行小幅提插或捻转；亦可用指压按揉代替针刺作保健", "眶下孔内有眶下血管神经束，进针不宜过深、过猛，以免损伤血管致眼周血肿或刺伤眶下神经分支", "禁向上深刺入眶；局部皮肤感染、破损或瘢痕体质者慎用；孕妇及体弱者手法宜轻。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["ST3", "巨髎", "ju liao", 3, "在面部，横平鼻翼下缘，瞳孔直下；正坐或仰卧取穴", "直刺0.3～0.6寸，或向地仓方向平刺；可灸", "祛风通络、消肿止痛、牵正", "口眼歪斜、眼睑瞤动、鼻塞、齿痛、面痛；唇颊肿", ["交会穴"], "直刺时紧贴骨面缓慢进针，勿大幅提插；向地仓透刺可增强牵正作用，透刺时沿皮下平刺", "深部有面动、静脉与眶下神经分支，深刺易出血形成面部血肿；手法宜轻柔，出针后按压片刻", "面部急性感染、皮肤破损处禁刺；有出血倾向或长期抗凝治疗者慎刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["ST4", "地仓", "di cang", 4, "在面部，口角旁开约0.4寸；正坐或仰卧，于口角外侧取穴", "向颊车方向平刺0.5～1.5寸，或直刺0.2寸；可灸", "祛风通络、牵正止涎、消肿", "口眼歪斜、流涎、齿痛、面痛、唇缓不收；口角瞤动", ["交会穴"], "治面瘫常沿皮下向颊车透刺，进针后行轻柔捻转，避免提插损伤血管；可配合局部温和灸", "面部血管神经丰富，透刺时须沿皮下浅层走行，切忌深刺与强刺激，以防血肿和面肌痉挛", "面部感染、溃疡或外伤处禁刺；瘢痕体质者不宜反复针刺同一部位。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["ST5", "大迎", "da ying", 5, "在下颌角前方，咬肌附着部前缘，面动脉搏动处；闭口鼓气时下颌骨边缘出现沟形凹陷，于凹陷下端取穴", "斜刺或平刺0.3～0.5寸；可灸，但须避开面动脉搏动处", "祛风通络、消肿止痛、开噤", "口眼歪斜、牙关紧闭、齿痛、颊肿、面痛；颈项痛", null, "针尖向下颌骨面斜刺，得气即止，不宜反复提插；施灸可用温和灸，勿直接灸以免留疤", "穴下有面动脉搏动，进针须避开血管或先以指按压推开，防止刺破血管引起出血与血肿", "面动脉硬化、局部感染或血肿处禁刺；凝血功能异常者慎用。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["ST6", "颊车", "jia che", 6, "在面部，下颌角前上方约一横指，咬肌隆起最高点处；用力咬牙时肌隆起处取穴", "直刺0.3～0.6寸，或向地仓方向平刺0.5～1.5寸；可灸", "祛风通络、开关通窍、消肿止痛", "口眼歪斜、牙关不利、齿痛、颊肿、痄腮；颈项强痛", null, "直刺时垂直咬肌隆起刺入，得气后捻转；透刺地仓治面瘫多用平刺，透刺后留针20～30分钟", "深部有咬肌动脉与面神经分支，针刺后若出现局部明显肿胀、疼痛加重应停止治疗并观察", "下颌关节急性炎症、腮腺化脓或局部皮肤感染者禁刺；孕妇手法宜轻。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["ST7", "下关", "xia guan", 7, "在面部，颧弓下缘中央与下颌切迹之间凹陷中；闭口取穴，张口时凹陷消失", "直刺0.5～1.0寸，留针时宜闭口；可灸", "疏风清热、通关利窍、通络止痛", "牙关不利、颞颌关节痛、齿痛、口眼歪斜、面痛；耳鸣、耳聋、聤耳", ["交会穴"], "闭口进针，针尖略向后下方刺入，得气后留针并嘱患者保持闭口，不可大张口，以免弯针或滞针", "深部有上颌动脉分支与下颌神经，刺入过深或患者张口可致弯针，并可能损伤血管神经；严格消毒以防颞下颌关节腔感染", "颞下颌关节急性炎症、化脓性中耳炎急性期或局部感染者禁刺；留针期间禁大张口。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["ST8", "头维", "tou wei", 8, "在头部，额角发际直上0.5寸，前正中线旁开4.5寸；正坐或仰卧取穴", "平刺0.5～1.0寸，沿头皮向后或向下刺；可灸，宜温和灸", "疏风清头、明目止痛、通络", "偏正头痛、目眩、目赤肿痛、迎风流泪、眼睑瞤动；面痛", ["交会穴"], "沿头皮帽状腱膜下层平刺，行快速捻转以增强针感，留针20～30分钟，可配合电针", "该处头皮血管丰富，出针后应延长按压时间以防皮下血肿；婴幼儿囟门未闭者不宜针刺", "头皮感染、外伤、皮肤病或近期颅内手术者禁刺；有出血倾向者慎用。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["ST9", "人迎", "ren ying", 9, "在颈部，横平喉结，胸锁乳突肌前缘，颈总动脉搏动处；正坐或仰卧取穴", "避开动脉直刺0.2～0.5寸，手法轻柔；禁灸或慎灸", "利咽散结、理气降逆、通经活络", "咽喉肿痛、瘿气、瘰疬；高血压、头痛、眩晕、气逆喘息", ["交会穴"], "以左手食指将颈总动脉向外推开，右手持针于其内侧缓慢直刺，得气即止，不留针或短留针，严禁提插捻转等强刺激", "穴下即颈总动脉与颈动脉窦，刺激过强可致心率血压骤变、脑供血不足甚至晕厥；严禁两侧同时针刺，出针后按压针孔", "颈动脉硬化斑块、颈动脉窦过敏、严重心脑血管疾病及甲状腺术后局部肿胀者禁刺；初中学生等未成年人慎用。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["ST10", "水突", "shui tu", 10, "在颈部，横平环状软骨，胸锁乳突肌前缘；正坐或仰卧取穴", "直刺0.3～0.5寸，或斜刺0.5～1.0寸；可灸，宜温和灸", "利咽散结、降逆止咳、理气", "咽喉肿痛、声音嘶哑、咳嗽气喘、瘿瘤瘰疬；颈项强痛", null, "沿胸锁乳突肌前缘缓慢进针，得气后行小幅捻转，不宜深刺及大幅度提插", "深部有颈总动脉、颈内静脉与迷走神经，深刺或强刺激可致血压心率改变，须控制深度并避开血管", "颈部感染、甲状腺肿大压迫气管或颈部血管病变者慎刺；不宜两侧同时深刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],

  ["ST11", "气舍", "qi she", 11, "在胸锁乳突肌区，锁骨上小窝内，胸锁乳突肌胸骨头与锁骨头之间；正坐或仰卧取穴", "直刺0.3～0.5寸，宜浅刺或斜刺；可灸，宜温和灸", "利咽消肿、理气散结、降逆定喘", "咽喉肿痛、瘿瘤、瘰疬、气喘、呃逆；颈项强痛", null, "针尖向内下方缓慢刺入，得气即止，不做大幅度提插捻转，留针时间宜短", "深部为肺尖与锁骨下动、静脉，深刺可致气胸或血管损伤，必须浅刺；颈部血管神经密集，操作须由专业人员完成", "肺气肿、肺大疱、严重心肺功能不全者禁深刺；局部感染或淋巴结化脓者禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["ST12", "缺盆", "que pen", 12, "在颈外侧区，锁骨上大窝，锁骨上缘凹陷中，前正中线旁开4寸；正坐或仰卧取穴", "直刺0.3～0.5寸，宜浅刺，严禁深刺；可灸，宜温和灸", "宣肺利咽、理气散结、止咳平喘", "咳嗽气喘、咽喉肿痛、瘿瘤瘰疬、缺盆中痛；上肢麻木", null, "以指甲或押手指固定穴位，针尖向后下方沿锁骨上缘缓慢浅刺，得气即止，不留针或短留针", "穴下为肺尖与锁骨下动、静脉及臂丛，深刺极易造成气胸或血管神经损伤，必须严格掌握浅刺，进针后如出现剧痛、放电感应立即退针", "肺气肿、肺大疱、消瘦体型及严重心肺疾病者禁刺或禁深刺；孕妇慎用。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["ST13", "气户", "qi hu", 13, "在胸部，锁骨下缘，前正中线旁开4寸；正坐或仰卧取穴", "斜刺或平刺0.5～0.8寸，不可直刺深刺；可灸，宜温和灸", "宽胸理气、止咳平喘、通络止痛", "咳嗽、气喘、胸胁胀满、胸痛；呃逆、胁肋痛", null, "沿肋间隙向外斜刺或平刺，针体贴近胸壁浅层推进，得气后行轻柔捻转，留针期间嘱患者平静呼吸", "胸壁较薄，深部为肺与胸膜，直刺或深刺可致气胸，必须斜刺或平刺并控制深度；胸廓畸形者尤须谨慎", "肺气肿、肺大疱、严重呼吸系统疾病及胸壁感染者禁刺；孕妇及体弱者手法宜轻。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["ST14", "库房", "ku fang", 14, "在胸部，第1肋间隙，前正中线旁开4寸；正坐或仰卧取穴", "斜刺或平刺0.5～0.8寸，不可深刺；可灸，宜温和灸", "宽胸理气、止咳化痰、清热散结", "咳嗽、气喘、咳吐脓血、胸胁胀痛；乳痈初起", null, "沿肋间隙向外斜刺或平刺，缓慢进针，得气后捻转行针，不留针过久", "深部为肺脏与胸膜，直刺深刺可致气胸，须严格斜刺并控制进针深度；针刺中患者出现胸闷气促应立即停止", "肺气肿、肺大疱及胸部手术后者禁深刺；局部皮肤感染者禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["ST15", "屋翳", "wu yi", 15, "在胸部，第2肋间隙，前正中线旁开4寸；正坐或仰卧取穴", "斜刺或平刺0.5～0.8寸，不可深刺；可灸，宜温和灸", "宽胸理气、活络通乳、止咳化痰", "咳嗽气喘、胸胁胀满；乳痈、乳癖、乳房胀痛", null, "沿肋间隙向外斜刺，得气后行捻转手法，治乳疾可向乳房方向平刺并配合局部取穴", "深部为肺与胸膜，禁直刺深刺以防气胸；乳腺组织血供丰富，针刺后应充分按压防血肿", "乳腺急性化脓性炎症、乳腺癌局部及胸部皮肤感染者禁刺该处；孕期慎用。请以教材、国家标准和专业医师指导为准。", null, null, true, null],

  ["ST33", "阴市", "yin shi", 33, "在股前区，髌底上3寸，髂前上棘与髌底外侧端连线上；仰卧或正坐取穴", "直刺1.0～1.5寸；可灸", "温经散寒、祛风除湿、通络止痛", "膝腿冷痛、屈伸不利、下肢痿痹、腰痛；疝气", null, "仰卧伸膝，垂直进针至得气，行捻转提插手法，寒证可加温和灸或温针灸", "穴下有股外侧肌与膝上外侧动脉分支，深刺过深可致局部血肿；膝关节急性炎症期进针宜浅", "局部感染、血肿或膝关节急性化脓性炎症期禁刺；出血倾向者慎用。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["ST34", "梁丘", "liang qiu", 34, "在股前区，髌底上2寸，股外侧肌与股直肌肌腱之间；仰卧或正坐屈膝取穴", "直刺1.0～1.5寸；可灸", "理气和胃、通络止痛、舒筋活络", "急性胃痛、膝胫痹痛、屈伸不利、乳痈；下肢不遂", ["郄穴"], "屈膝取穴，垂直进针得气后行捻转提插手法，治急性胃痛可用较强刺激并留针至痛减", "深层有膝上外侧动静脉与股神经分支，深刺或强烈提插可能损伤血管神经；局部肿胀者应查明原因后再针刺", "膝关节腔积液、急性化脓性关节炎及局部感染者禁刺；出血倾向者慎用。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["ST35", "犊鼻", "du bi", 35, "在膝前区，髌韧带外侧凹陷中；屈膝90度取穴，又称外膝眼", "向后内斜刺0.5～1.0寸；可灸，宜温和灸", "祛风除湿、通经活络、消肿止痛", "膝痛、屈伸不利、下肢麻痹、脚气；膝关节劳损", ["八会穴"], "屈膝90度使髌韧带放松，针尖向内侧膝眼方向斜刺，得气后捻转，可配内外膝眼同用并加温和灸", "针刺须避开髌韧带与关节腔，严禁刺入关节腔以免引入感染；关节明显肿胀积液时应先明确诊断", "膝关节化脓性炎症、关节腔积液未控制、局部皮肤破损或感染者禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["ST36", "足三里", "zu san li", 36, "在小腿外侧，犊鼻下3寸，胫骨前嵴外一横指处；正坐屈膝或仰卧取穴", "直刺1.0～2.0寸；可灸，常用温和灸或温针灸", "健脾和胃、补中益气、通经活络、扶正培元", "胃痛、呕吐、腹胀、泄泻、便秘、消化不良；下肢痿痹、膝痛；虚劳羸瘦、失眠、眩晕；乳痈", ["五输穴·合","下合穴"], "垂直进针得气后行提插捻转补法，使针感向足背放散，留针20～30分钟；保健常用温和灸或艾条悬灸", "深部有胫前动静脉与腓深神经，过深或强刺激可致剧痛、放电感与血管损伤，出现放电感应立即退针调整", "局部皮肤感染、下肢静脉血栓或严重水肿者慎刺；实热证与急性重症宜由专业医师辨证施治。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["ST37", "上巨虚", "shang ju xu", 37, "在小腿外侧，犊鼻下6寸，胫骨前嵴外一横指处；正坐屈膝或仰卧取穴", "直刺1.0～2.0寸；可灸", "调理肠腑、理气止痛、通经活络", "腹痛、泄泻、痢疾、便秘、肠痈；下肢痿痹、膝痛", ["下合穴"], "垂直进针至得气，行提插捻转手法，治肠腑病常配天枢、足三里，可加电针", "深层有胫前动静脉与腓深神经，深刺或大幅度提插可损伤血管神经；针刺中出现足背放电感须立即退针", "急腹症需外科处理者不宜单用针刺；局部感染、下肢静脉血栓者慎刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["ST38", "条口", "tiao kou", 38, "在小腿外侧，犊鼻下8寸，胫骨前嵴外一横指处；正坐屈膝或仰卧取穴", "直刺1.0～1.5寸，或向承山方向透刺；可灸", "舒筋活络、理气和胃、祛湿止痛", "膝胫酸痛、下肢痿痹、转筋、肩背痛；脘腹疼痛", null, "直刺得气后行捻转手法；治肩周疾患可向承山方向透刺，进针后行较强捻转并嘱患者活动肩部", "透刺时进针较深，须熟悉局部解剖，避免损伤胫前血管与腓深神经；透刺中出现麻木放电应立即停止", "局部感染、下肢静脉血栓、严重骨质疏松者慎用透刺；出血倾向者慎刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["ST39", "下巨虚", "xia ju xu", 39, "在小腿外侧，犊鼻下9寸，胫骨前嵴外一横指处；正坐屈膝或仰卧取穴", "直刺1.0～1.5寸；可灸", "调理肠腑、通络止痛、清利湿热", "小腹痛、泄泻、痢疾、乳痈；下肢痿痹、腰脊痛、睾丸痛", ["下合穴"], "垂直进针得气后行捻转提插手法，治小肠疾患常配上巨虚、天枢，可配合温和灸", "深层有胫前动静脉与腓深神经，深刺过猛可致血肿及神经损伤；进针后注意询问有无足部放电感", "局部感染、下肢静脉血栓或严重下肢水肿者慎刺；急腹症应先明确诊断。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["ST40", "丰隆", "feng long", 40, "在小腿外侧，外踝尖上8寸，胫骨前嵴外两横指处；正坐屈膝或仰卧取穴", "直刺1.0～1.5寸；可灸", "健脾化痰、和胃降逆、宁心安神、通络", "咳嗽痰多、哮喘、头晕头痛、癫狂痫、失眠；下肢痿痹、便秘", ["络穴"], "垂直进针至得气，行较强提插捻转手法使针感向上下放散，治痰证常配中脘、足三里、内关", "深层有胫前动静脉与腓深神经，强刺激时须防神经损伤与局部血肿；体弱者手法宜轻，避免晕针", "局部感染、下肢静脉血栓、严重心功能不全者慎用强刺激；孕妇手法宜轻。请以教材、国家标准和专业医师指导为准。", null, null, true, null],

  ["ST41", "解溪", "jie xi", 41, "在踝前区，踝关节前面中央凹陷中，拇长伸肌腱与趾长伸肌腱之间；正坐或仰卧取穴", "直刺0.5～1.0寸；可灸", "清胃降逆、舒筋活络、宁心安神", "踝关节痛、足下垂、下肢痿痹、头痛眩晕、腹胀便秘；癫狂", ["五输穴·经"], "令患者足背屈以显露肌腱，于两腱之间垂直或略向后方进针，得气后捻转，可配温和灸", "穴下有胫前动脉与腓深神经，进针须避开血管搏动处，不宜过深或强刺激，以防出血与神经损伤", "踝关节急性扭伤肿胀明显、感染或骨折未愈合者禁刺；出血倾向者慎用。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["ST42", "冲阳", "chong yang", 42, "在足背，第2跖骨基底部与中间楔状骨之间，可扪及足背动脉搏动处；正坐或仰卧取穴", "直刺0.3～0.5寸，须避开动脉；可灸，宜温和灸", "和胃健脾、通络止痛、宁神通窍", "胃痛腹胀、食欲不振、口眼歪斜、面肿齿痛；足痿无力、足背肿痛、癫狂痫", ["原穴"], "先以指尖扪清足背动脉位置，于其内侧缓慢进针，得气即止，不宜提插捻转，出针后按压针孔", "穴下即足背动脉，针刺易出血形成血肿，须严格避开血管；下肢动脉硬化或糖尿病足患者慎刺", "足背动脉搏动消失、下肢动脉闭塞、糖尿病足溃疡或局部感染者禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["ST43", "陷谷", "xian gu", 43, "在足背，第2、3跖骨间，第2跖趾关节近端凹陷中；正坐或仰卧取穴", "直刺0.3～0.5寸，或向上斜刺0.5～1.0寸；可灸", "清热利水、和胃降逆、通络止痛", "足背肿痛、下肢痿痹、面目浮肿、水肿、腹痛肠鸣；目赤肿痛", ["五输穴·输"], "沿跖骨间隙缓慢进针，得气后行捻转手法；治水肿可向上斜刺并配合阴陵泉、三阴交", "跖骨间有足背动静脉分支与足背神经，进针过深或反复提插可致血肿与局部疼痛；足部有感染时禁刺", "足背皮肤感染、痛风急性发作红肿期或骨折者禁刺；糖尿病足患者慎用。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["ST44", "内庭", "nei ting", 44, "在足背，第2、3趾间，趾蹼缘后方赤白肉际处；正坐或仰卧取穴", "直刺或斜刺0.3～0.5寸；可灸", "清胃泻火、理气止痛、清热利湿", "齿痛、咽喉肿痛、口歪、鼻衄、胃痛吞酸、腹胀便秘；足背肿痛、热病", ["五输穴·荥"], "向足跟方向斜刺或直刺，得气后行捻转泻法，治胃火牙痛常配合谷、颊车，可点刺放血但须严格消毒", "趾间皮肤薄嫩、血供丰富，进针过深易出血与感染，须严格消毒并控制深度；糖尿病患者足部针刺尤须谨慎", "足癣破损、趾间感染、糖尿病足或出血性疾病者禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["ST45", "厉兑", "li dui", 45, "在足趾，第2趾末节外侧，趾甲根角侧后方0.1寸；正坐或仰卧取穴", "浅刺0.1寸，或点刺出血；可灸，宜小艾炷或温和灸", "清热泻火、醒神开窍、安神定志", "齿痛、咽喉肿痛、鼻衄、口歪、热病；多梦、失眠、癫狂、晕厥", ["五输穴·井"], "以三棱针点刺挤出少量血液，或用毫针浅刺0.1寸，得气后即出针；灸法宜小艾炷，勿灼伤趾端皮肤", "趾端皮肤菲薄、感觉敏锐，针刺与放血须严格消毒，深度不可超过0.2寸，防止趾背动脉损伤出血与感染", "趾端感染、甲沟炎、糖尿病足、末梢循环障碍或凝血功能异常者禁刺禁放血。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  /* ---- 足太阴脾经（21 穴） ---- */
  ["SP1", "隐白", "yin bai", 1, "在足趾，大趾末节内侧，趾甲根角侧后方0.1寸；正坐垂足或仰卧，于足大趾内侧爪甲角旁取穴", "浅刺0.1～0.2寸，或三棱针点刺出血；可灸", "健脾统血、调经止崩、醒神定志", "月经过多、崩漏、便血、尿血；癫狂、多梦、惊风；腹胀、食不下", ["五输穴·井"], "多以浅刺或点刺出血为主，得气即止，不留针或短留针；出血证可用小艾炷灸或艾条温和灸，灸至局部温热为度。", "穴在足大趾末端，皮薄而感觉敏锐，针刺疼痛明显，宜快速浅刺；有出血倾向或正在使用抗凝药物者慎用点刺放血。", "局部皮肤感染、破损或溃疡时不宜针刺与放血；孕妇及出血性疾病患者慎用强刺激。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SP2", "大都", "da du", 2, "在足趾，第1跖趾关节远端赤白肉际凹陷中；正坐垂足或仰卧，于足大趾内侧本节前下方凹陷处取穴", "直刺0.3～0.5寸；可灸", "健脾和胃、清热化湿、宁心安神", "腹胀、胃痛、呕吐、泄泻、便秘；热病无汗、心烦；心痛、小儿惊风", ["五输穴·荥"], "直刺得气后行提插捻转平补平泻手法，留针20～30分钟；虚寒证可配艾条温和灸5～10分钟。", "穴旁即第1跖趾关节，进针应避开关节腔与骨面，手法不可过强，以免损伤关节囊或引起局部血肿。", "局部皮肤感染、破损或痛风急性红肿期不宜针刺；关节腔有病变者慎用。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SP3", "太白", "tai bai", 3, "在跖区，第1跖趾关节近端赤白肉际凹陷中；正坐垂足，沿足内侧赤白肉际向后推按，凹陷处取穴", "直刺0.5～0.8寸；可灸", "健脾益气、和胃化湿、舒筋活络", "胃痛、腹胀、呕吐、泄泻、便秘、痢疾；体重节痛、足痛；心痛、胸胁胀痛", ["五输穴·输","原穴"], "直刺得气后行平补平泻捻转手法，留针20～30分钟；脾胃虚弱者可用艾条温和灸或温针灸以温补中焦。", "进针宜紧贴第1跖骨内侧骨面，避免刺入跖趾关节腔或伤及足背血管；局部感觉敏锐，手法宜轻，防止晕针。", "局部皮肤感染、破损、溃疡时禁针刺；足部急性扭伤肿胀期慎用。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SP4", "公孙", "gong sun", 4, "在跖区，第1跖骨底的前下缘赤白肉际处；正坐垂足，于太白穴后1寸、足内侧赤白肉际取穴", "直刺0.6～1.2寸；可灸", "健脾和胃、理气止痛、调理冲脉", "胃痛、呕吐、腹痛、泄泻、痢疾；心胸痛、心悸；月经不调、带下", ["络穴","八脉交会穴"], "直刺得气后行捻转提插手法，针感可向足底或小腿内侧放散；留针20～30分钟，虚寒证可配艾条温和灸。", "穴在足内侧，进针不宜过深过内，以免伤及足底血管神经；孕妇及体质虚弱者手法宜轻，刺激量不宜过大。", "局部皮肤感染、破损者禁刺；艾灸时防止烫伤，感觉减退者慎灸。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SP5", "商丘", "shang qiu", 5, "在踝区，内踝前下方，舟骨粗隆与内踝尖连线的中点凹陷中；正坐垂足，于内踝前下方凹陷处取穴", "直刺0.3～0.5寸；可灸", "健脾化湿、通调肠胃、利咽消肿", "腹胀、肠鸣、泄泻、便秘、痔疾；足踝肿痛、踝部扭伤；咽喉肿痛、舌本强痛", ["五输穴·经"], "直刺得气后行平补平泻捻转手法，留针20～30分钟；可艾条温和灸5～10分钟，或用温针灸。", "穴在内踝前方，进针应避开大隐静脉与内踝骨面，不可向踝关节腔内深刺，以免引起关节损伤或出血。", "踝关节急性扭伤肿胀明显、局部皮肤感染或破损者不宜针刺；大隐静脉曲张处禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SP6", "三阴交", "san yin jiao", 6, "在小腿内侧，内踝尖上3寸，胫骨内侧缘后际；正坐垂足或仰卧，自内踝尖沿胫骨内缘向上量3寸取穴", "直刺1～1.5寸；可灸", "健脾利湿、调补肝肾、行气活血、调理冲任", "腹胀、肠鸣、泄泻、消化不良；月经不调、痛经、带下、遗精、阳痿、小便不利；失眠、下肢痿痹", ["交会穴"], "直刺得气后行提插捻转手法，针感可向足底或膝部放散；留针20～30分钟，虚证可配艾灸，孕妇禁用本法。", "本穴为足三阴经交会处，孕妇针刺可能诱发子宫收缩，属禁针范围；进针不可过深过内，以免伤及胫后血管神经。", "孕妇禁针禁灸；月经期妇女慎用强刺激；局部皮肤感染、破损或下肢静脉血栓者禁用。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SP7", "漏谷", "lou gu", 7, "在小腿内侧，内踝尖上6寸，胫骨内侧缘后际；正坐垂足，于三阴交上3寸、胫骨内侧面后缘取穴", "直刺1～1.5寸；可灸", "健脾和胃、渗湿利尿、通络止痛", "腹胀、肠鸣、饮食不化、小便不利；下肢痿痹、腿膝厥冷；带下、遗精", null, "直刺得气后行平补平泻捻转手法，留针20～30分钟；寒湿证可艾条温和灸或温针灸10～15分钟。", "进针应贴近胫骨内侧缘后际，避免向内后方深刺伤及胫后血管神经；局部静脉曲张者慎刺。", "局部皮肤感染、破损或下肢深静脉血栓者禁刺；艾灸时注意防止烫伤。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SP8", "地机", "di ji", 8, "在小腿内侧，阴陵泉下3寸，胫骨内侧缘后际；正坐垂足，于阴陵泉与内踝尖连线上取穴", "直刺1～1.5寸；可灸", "健脾渗湿、调经止痛、固摄小便", "痛经、月经不调、崩漏；腹胀、腹痛、泄泻、痢疾；小便不利、水肿、遗精", ["郄穴"], "直刺得气后行提插捻转手法，痛经发作时可较强刺激并持续行针；留针20～30分钟，可配艾灸温经。", "本穴为脾经郄穴，主治急性痛证，刺激量可稍强但须密切观察反应；进针勿向后深刺，以免伤及胫后血管神经。", "孕妇慎用，月经量多者经期不宜强刺激；局部皮肤感染、破损者禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SP9", "阴陵泉", "yin ling quan", 9, "在小腿内侧，胫骨内侧髁下缘与胫骨内侧缘之间的凹陷中；正坐屈膝或仰卧，沿胫骨内缘由下向上推至凹陷处取穴", "直刺1～2寸；可灸", "健脾利水、通利三焦、祛湿通络", "腹胀、腹泻、黄疸、水肿、小便不利；遗尿、遗精；膝痛、下肢痿痹", ["五输穴·合"], "直刺得气后行提插捻转手法，针感可向小腿内侧或足部放散；留针20～30分钟，寒湿证可加艾灸或温针灸。", "穴位紧邻胫骨内侧髁，进针应沿骨缘后方刺入，避免向后深刺伤及胫后血管神经；针刺过深易致局部剧烈酸胀。", "局部皮肤感染、破损、溃疡者禁刺；膝关节急性炎症或关节积液明显者慎用深刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SP10", "血海", "xue hai", 10, "在股前区，髌底内侧端上2寸，股内侧肌隆起处；屈膝，医者以掌心按于髌骨上缘、拇指自然分开，拇指尖下即是", "直刺1～1.5寸；可灸", "活血化瘀、调经统血、祛风止痒", "月经不调、痛经、闭经、崩漏；湿疹、瘾疹、皮肤瘙痒、丹毒；膝股内侧痛", null, "直刺得气后行提插捻转手法，血瘀证可用较强刺激；留针20～30分钟，可配艾条温和灸或温针灸。", "针刺应避开股内侧浅静脉与股动脉分支，进针不宜过深过猛，以免引起出血或血肿；有出血倾向者慎用强刺激。", "局部皮肤感染、破损或静脉曲张明显处禁刺；孕妇慎用强刺激。请以教材、国家标准和专业医师指导为准。", null, null, true, null],

  ["SP11", "箕门", "ji men", 11, "在股前区，髌底内侧端与冲门连线上1/3与下2/3交点，长收肌与缝匠肌交角的动脉搏动处；仰卧或正坐，于缝匠肌内侧缘取穴", "直刺0.8～1寸；可灸", "健脾利湿、通利小便、清利下焦", "小便不利、遗尿、癃闭；腹股沟肿痛、下肢内侧痛；遗精、带下", null, "直刺得气后行平补平泻捻转手法，留针20～30分钟；进针前须先触摸动脉搏动位置，确认后避开血管缓慢刺入。", "本穴紧邻股动脉及其分支，针刺前必须确认动脉搏动位置并避开，切忌盲目深刺或反复提插，以防出血、血肿。", "局部有动脉瘤、静脉血栓或皮肤感染者禁刺；有出血倾向者禁用。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SP12", "冲门", "chong men", 12, "在腹股沟区，腹股沟斜纹中，髂外动脉搏动处的外侧；仰卧，先摸清股动脉搏动，于其外侧缘取穴", "直刺0.5～1寸，须避开动脉；可灸", "调理下焦、理气止痛、健脾利湿", "腹痛、疝气、痔疾；小便不利、带下、崩漏；腹股沟及下肢内侧痛", ["交会穴"], "直刺得气后行平补平泻捻转手法，留针15～20分钟；进针前明确动脉位置，缓慢刺入并避免大幅提插。", "穴位紧邻髂外动脉与股神经，针刺须避开血管，不可深刺或反复提插，以防出血、血肿或神经损伤；孕妇禁针。", "孕妇禁用；腹股沟淋巴结肿大、疝气嵌顿、局部感染或有出血倾向者禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SP13", "府舍", "fu she", 13, "在下腹部，脐中下4.3寸，前正中线旁开4寸；仰卧，于冲门上0.7寸、前正中线旁开4寸处取穴", "直刺1～1.5寸；可灸", "健脾理气、散结止痛、调理下焦", "腹痛、腹胀、疝气、腹中积块；便秘、泄泻；月经不调", ["交会穴"], "直刺得气后行平补平泻捻转手法，留针20～30分钟；可艾条温和灸，腹部进针宜缓慢，深度需适中。", "本穴位于下腹部，深部为小肠与结肠，针刺不宜过深，避免刺伤肠管；膀胱充盈时不宜针刺，孕妇禁针。", "孕妇禁用；腹部手术后粘连、腹壁疝、局部皮肤感染或急腹症诊断未明者禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SP14", "腹结", "fu jie", 14, "在下腹部，脐中下1.3寸，前正中线旁开4寸；仰卧，于府舍上3寸、大横下1.3寸处取穴", "直刺1～2寸；可灸", "温中散寒、行气止痛、通调肠腑", "腹痛、腹泻、便秘、痢疾；疝气、腹中冷痛", null, "直刺得气后行提插捻转手法，留针20～30分钟；寒性腹痛可配艾条温和灸或温针灸，进针宜缓慢。", "腹部进针不宜过深过猛，以免刺伤肠管；膀胱充盈者应先排尿再针，孕妇禁针，消瘦者应适当减浅深度。", "孕妇禁用；急腹症、腹壁疝、局部皮肤感染或腹部手术后近期者禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SP15", "大横", "da heng", 15, "在腹部，脐中旁开4寸；仰卧，于脐水平线上、前正中线旁开4寸处取穴，约当乳头直下与脐水平线交点内侧", "直刺1～2寸；可灸", "温中散寒、调理肠胃、通便导滞", "腹痛、腹泻、便秘、痢疾；肥胖、水肿；肠痈、腹中痞块", ["交会穴"], "直刺得气后行捻转提插手法，留针20～30分钟；虚寒证可艾条温和灸10～15分钟，肥胖者需注意实际进针深度。", "本穴位于腹部，深部为小肠与结肠，针刺不宜过深；膀胱充盈时禁针，孕妇禁针，体型消瘦者进针深度须相应减少。", "孕妇禁用；急腹症、肠梗阻、腹部肿块性质不明或局部皮肤感染者禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SP16", "腹哀", "fu ai", 16, "在上腹部，脐中上3寸，前正中线旁开4寸；仰卧，于大横上3寸、前正中线旁开4寸处取穴", "直刺1～1.5寸；可灸", "健脾和胃、理气止痛、消食化积", "胃痛、腹痛、消化不良、便秘、痢疾；胁肋胀痛", ["交会穴"], "直刺得气后行平补平泻捻转手法，留针20～30分钟；可艾条温和灸，进针宜缓，避免针尖深入腹腔。", "穴位位于上腹部，深部为胃与横结肠，须控制进针深度，避免刺伤内脏；饱餐后不宜立即针刺，孕妇禁针。", "孕妇禁用；胃溃疡活动期、急腹症、腹部手术后近期或局部皮肤感染者禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SP17", "食窦", "shi dou", 17, "在胸部，第5肋间隙，前正中线旁开6寸；仰卧，于第5肋间隙、锁骨中线外开2寸处取穴", "沿肋间隙斜刺或平刺0.5～0.8寸；可灸", "宽胸理气、健脾和胃、宣肺利水", "胸胁胀痛、胸中烦满；腹胀、肠鸣、反胃、食入即吐；水肿", null, "针尖沿肋间隙向外斜刺或平刺，得气后行捻转手法，留针15～20分钟；不宜直刺深刺，宜用艾条温和灸。", "本穴位于胸部，深部为胸膜与肺脏，严禁直刺深刺，进针须沿肋间隙、针尖略向外斜，以防造成气胸。", "严重肺疾病致胸廓畸形者慎用；局部皮肤感染、肋骨骨折处禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SP18", "天溪", "tian xi", 18, "在胸部，第4肋间隙，前正中线旁开6寸；仰卧，于第4肋间隙、乳头外开2寸处取穴", "沿肋间隙斜刺或平刺0.5～0.8寸；可灸", "宽胸理气、止咳化痰、通乳消痈", "胸痛、咳嗽、气喘；乳汁不足、乳痈、乳房肿痛", null, "沿肋间隙向外斜刺或平刺，得气后行捻转手法，留针15～20分钟；可艾条温和灸，不宜用艾炷直接灸。", "深部为胸膜与肺脏，禁止直刺深刺；女性乳腺组织丰富，进针应避开乳腺导管，防止气胸与局部感染。", "哺乳期乳腺炎化脓期、局部皮肤感染或胸壁肿物处禁刺；肺气肿患者慎用。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SP19", "胸乡", "xiong xiang", 19, "在胸部，第3肋间隙，前正中线旁开6寸；仰卧，于第3肋间隙、锁骨中线外开2寸处取穴", "沿肋间隙斜刺或平刺0.5～0.8寸；可灸", "宽胸理气、宣肺止咳、舒筋通络", "胸胁胀痛、胸痛引背、咳嗽、气喘；肋间神经痛", null, "沿肋间隙斜刺或平刺，得气后行捻转手法，留针15～20分钟；起针后按压针孔片刻，以防局部出血。", "穴下即为胸膜与肺，严禁直刺、深刺，针尖应顺肋间隙走行，防止刺破胸膜造成气胸，体形消瘦者尤须谨慎。", "严重肺气肿、胸廓畸形、肋骨骨折或局部皮肤感染者禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SP20", "周荣", "zhou rong", 20, "在胸部，第2肋间隙，前正中线旁开6寸；仰卧，于第2肋间隙、锁骨中线外开2寸处取穴", "沿肋间隙斜刺或平刺0.5～0.8寸；可灸", "宽胸理气、宣肺化痰、止咳平喘", "咳嗽、气喘、胸胁胀满；食不下、呃逆", null, "沿肋间隙斜刺或平刺，得气后行捻转手法，留针15～20分钟；宜用艾条温和灸，不可深刺。", "本穴位于上胸部，深部邻近胸膜顶与肺尖区域，严禁直刺深刺，以免引起气胸或损伤胸膜。", "肺气肿、肺结核活动期、胸壁感染或肋骨骨折者禁刺；体质虚弱者慎用强刺激。请以教材、国家标准和专业医师指导为准。", null, null, true, null],

  ["SP21", "大包", "da bao", 21, "在胸外侧区，第6肋间隙，腋中线上；侧卧或仰卧，于腋中线上第6肋间隙处取穴", "沿肋间隙斜刺或平刺0.5～0.8寸；可灸", "宽胸理气、宣肺止咳、通络止痛、统血养经", "胸胁胀痛、咳嗽、气喘；全身疼痛、四肢无力；肋间神经痛", ["络穴"], "沿肋间隙斜刺或平刺，得气后行捻转手法，留针15～20分钟；可艾条温和灸，严禁直刺深刺。", "本穴为脾之大络，深部为胸膜与肺下叶，针刺必须沿肋间隙浅刺，防止气胸；肝脾肿大者进针更须谨慎。", "肝脾肿大明显、胸壁肿物、肋骨骨折或局部皮肤感染者禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  /* ---- 手少阴心经（9 穴） ---- */
  ["HT1", "极泉", "ji quan", 1, "在腋区，腋窝中央，腋动脉搏动处；上臂外展，于腋窝顶点两筋之间取穴", "避开腋动脉，直刺或斜刺0.3～0.5寸；可灸，但艾炷宜小、时间宜短", "宽胸理气、通经活络", "心痛、胸闷、心悸；肩臂疼痛不举、上肢痿痹、腋下肿痛；瘰疬", null, "进针前先用指腹扪清腋动脉搏动位置，自搏动处外侧或内侧缓慢刺入，得气后行提插捻转，针感可放散至上臂或小指；不留针久置，出针后按压针孔片刻。", "穴下即腋动、静脉与臂丛神经，严禁盲目深刺或反复提插捣刺，以免损伤血管引起血肿或刺伤神经干；一旦出现剧痛、放电样麻木应即刻退针。", "腋下有急性感染、淋巴结明显肿大破溃、局部皮肤破损或出血倾向者禁刺；禁用粗针、禁用大幅提插；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["HT2", "青灵", "qing ling", 2, "在臂前区，肘横纹上3寸，肱二头肌内侧沟中；屈肘，于少海与极泉连线上取穴", "直刺0.5～1寸；可灸", "行气活血、通络止痛", "头痛、目黄；胁痛；肩臂红肿疼痛、上肢不遂", null, "沿肱二头肌内侧沟缓慢直刺，得气后行小幅提插捻转，使针感向下放散至前臂；可配合艾条温和灸或温针灸。", "穴区内侧邻近肱动、静脉与正中神经，进针不宜过深、不宜向内侧偏斜，以免刺中血管神经束引起剧痛或血肿。", "局部皮肤感染、破损或凝血功能障碍者禁刺；孕妇及体弱者慎用强刺激；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["HT3", "少海", "shao hai", 3, "在肘前区，横平肘横纹，肱骨内上髁前缘；屈肘成直角，于肘横纹内侧端与肱骨内上髁连线中点取穴", "直刺0.5～1寸；可灸", "宁心安神、通络止痛、清热散结", "心痛、心悸、癫狂善笑；肘臂挛痛、手颤、上肢不遂；瘰疬、腋胁痛", ["五输穴·合"], "屈肘定位后直刺，得气后行捻转提插，针感可传至前臂尺侧；治瘰疬可配合温和灸。", "穴下邻近尺神经与尺侧下副动脉，针刺时若出现向小指放散的强烈麻电感，提示触及神经，应稍退针或调整方向，不宜反复刺激。", "局部皮肤感染、破损或肘关节急性损伤肿胀明显者暂不宜针刺；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["HT4", "灵道", "ling dao", 4, "在前臂前区，腕掌侧远端横纹上1.5寸，尺侧腕屈肌腱的桡侧缘；仰掌，沿尺侧腕屈肌腱桡侧取穴", "直刺0.3～0.5寸；可灸", "宁心安神、宽胸理气、通络止痛", "心痛、心悸怔忡；暴喑、舌强不语；肘臂挛痛、手指麻木", ["五输穴·经"], "紧靠尺侧腕屈肌腱桡侧缘直刺，进针宜缓，得气后小幅捻转，使酸胀感向手掌或肘部放散；可配艾条温和灸。", "穴下紧邻尺神经与尺动脉，进针不可过深、不可偏向尺侧，避免刺伤神经干或血管；出现触电样麻痛须立即退针。", "局部皮肤感染、破损或前臂急性外伤者禁刺；不宜使用电针强刺激；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["HT5", "通里", "tong li", 5, "在前臂前区，腕掌侧远端横纹上1寸，尺侧腕屈肌腱的桡侧缘；仰掌取穴", "直刺0.3～0.5寸；可灸", "宁心安神、通利舌窍、活血通络", "心悸、怔忡、心痛；暴喑、舌强不语；腕臂痛、上肢内侧痛", ["络穴"], "沿尺侧腕屈肌腱桡侧缘垂直缓刺，得气后行捻转令针感向掌侧或小指方向传导；治舌强不语常与廉泉、哑门等相配。", "穴区深层有尺神经与尺动脉伴行，针刺深度宜浅，避免向尺侧深刺造成神经损伤或出血。", "局部皮肤感染、破损或出血倾向者禁刺；留针期间避免腕关节剧烈活动；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["HT6", "阴郄", "yin xi", 6, "在前臂前区，腕掌侧远端横纹上0.5寸，尺侧腕屈肌腱的桡侧缘；仰掌取穴", "直刺0.3～0.5寸；可灸", "滋阴清热、宁心止汗、安神定悸", "心痛、惊悸；骨蒸盗汗、阴虚发热；吐血、衄血", ["郄穴"], "直刺后行小幅捻转，得气即止；治盗汗常配合复溜同用，可加艾条温和灸或药物敷贴。", "邻近尺神经与尺动脉，针刺不宜过深或偏斜；本穴对盗汗等症状的调理作用需结合病因诊断，不可替代系统诊治。", "局部皮肤感染、破损或凝血功能异常者禁刺；不宜自行长期反复针刺；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["HT7", "神门", "shen men", 7, "在腕前区，腕掌侧远端横纹尺侧端，尺侧腕屈肌腱的桡侧缘；仰掌，于豌豆骨上缘桡侧凹陷中取穴", "直刺0.3～0.5寸；可灸", "宁心安神、清心调气、养血通络", "失眠、健忘、心悸、怔忡、癫狂痫、痴呆；心烦、脏躁；胸胁痛、腕关节痛", ["五输穴·输","原穴"], "仰掌定位，避开可见血管垂直缓刺，得气后行平补平泻捻转，使局部酸胀或向掌指放散；安神多用轻刺激，留针时间可稍长。", "深层有尺神经本干与尺动脉，针刺深度以0.3～0.5寸为宜，不可深刺或向尺侧偏刺，以免损伤神经血管。", "腕部皮肤感染、破损或腕管综合征急性期慎刺，避免加重神经受压；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["HT8", "少府", "shao fu", 8, "在手掌，横平第5掌指关节近端，第4、5掌骨之间；握拳时小指尖所指处取穴", "直刺0.2～0.3寸；可灸", "清心泻火、行气活血、宁神止痒", "心悸、胸痛、烦满；小便不利、阴痒、阴痛；掌心热、小指挛痛、手癣", ["五输穴·荥"], "手掌向上自然放松，于第4、5掌骨间垂直缓刺，得气后小幅捻转，针感多为局部胀痛；掌部针刺刺激较强，手法宜轻。", "掌侧皮肤厚、神经末梢丰富，进针疼痛较明显，宜用细针快速透皮；穴下为掌腱膜与掌骨间隙，不可深刺以免损伤深部血管神经与腱膜。", "手掌皮肤感染、破损、湿疹渗出或手部急性外伤者禁刺；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["HT9", "少冲", "shao chong", 9, "在手指，小指末节桡侧，距指甲根角侧上方0.1寸；小指伸直，于指甲桡侧角旁取穴", "浅刺0.1寸，或用三棱针点刺出血；可灸", "开窍醒神、清心泻热、苏厥回逆", "心悸、心痛、癫狂；中风昏迷、热病神昏、晕厥；胸胁痛、咽喉肿痛", ["五输穴·井"], "多采用三棱针点刺出血或毫针浅刺，出血1～3滴后以消毒干棉球按压止血；急救常与中冲、人中（水沟）等穴配合使用。", "指端感觉敏锐、血管丰富，操作前须严格消毒，点刺不可过深以免伤及指骨与甲床；有凝血功能障碍或正在抗凝治疗者不宜点刺放血。", "局部甲沟炎、皮肤感染、手指外伤者禁刺；糖尿病末梢循环差者慎用放血法；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  /* ---- 手太阳小肠经（19 穴） ---- */
  ["SI1", "少泽", "shao ze", 1, "在手指，小指末节尺侧，指甲根角侧上方0.1寸；微握拳、掌心向下取穴，井穴位于指甲角旁", "浅刺0.1寸，或用三棱针点刺出血；可灸", "清热利窍、通乳活络、苏厥开窍", "乳汁不足、乳痈；咽喉肿痛、目翳；热病、昏迷", ["五输穴·井"], "多取三棱针点刺出血，或毫针浅刺后略捻转即出针，不宜久留；灸法宜小炷艾条温和灸，以局部温热为度", "指端感觉敏锐，刺激量宜轻；点刺放血须严格消毒，凝血功能异常者慎用", "局部皮肤破损、感染或瘢痕处禁刺；孕妇及体虚者慎用强刺激。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SI2", "前谷", "qian gu", 2, "在手指，第5掌指关节尺侧远端，掌指横纹头赤白肉际处；微握拳取穴", "直刺0.2～0.3寸；可灸", "清热解表、聪耳明目、通络止痛", "头痛、目痛、耳鸣、咽喉肿痛；热病汗不出；手指挛急、肘臂痛", ["五输穴·荥"], "毫针直刺后行小幅捻转，得气即止；艾条温和灸5～10分钟，注意避免烫伤", "穴位浅表、靠近指关节，进针不宜过深，避免刺入关节腔或伤及指神经", "局部皮肤破损、感染时禁刺；关节红肿急性期慎用。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SI3", "后溪", "hou xi", 3, "在手掌尺侧，第5掌指关节后方，第5掌骨头后缘赤白肉际凹陷中；轻握拳、掌横纹尽头取穴", "直刺0.5～1寸；可灸", "舒经通络、清心安神、通督脉、清热解表", "头项强痛、腰背痛、手指及肘臂挛痛；目赤肿痛、耳鸣耳聋、咽喉肿痛；热病、疟疾，亦用于癫痫及神经衰弱", ["五输穴·输","八脉交会穴"], "握拳取穴，毫针直刺后行提插捻转，针感可向指端或前臂放散；治颈项腰背痛时可边行针边嘱患者活动患部", "不宜穿透掌骨间隙过深而伤及掌侧血管神经；艾灸时防止灸疮", "局部皮肤破损、感染或严重水肿时禁刺；孕妇慎用强刺激。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SI4", "腕骨", "wan gu", 4, "在腕区，第5掌骨基底部与三角骨之间的赤白肉际凹陷中；沿第5掌骨尺侧缘向近端推按至凹陷处取穴", "直刺0.3～0.5寸；可灸", "清热利湿、通络止痛、明目退黄", "头痛、项强、耳鸣、目翳；腕痛、指挛；黄疸、热病、疟疾", ["原穴"], "毫针直刺，行捻转手法使局部酸胀并向手掌或前臂放散；艾条温和灸5～10分钟", "紧邻腕关节，进针宜浅，避免刺入关节腔或损伤尺神经手背支", "腕部急性外伤、骨折或局部感染时禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SI5", "阳谷", "yang gu", 5, "在腕后区，尺骨茎突与三角骨之间的凹陷中；掌心向前、手腕尺侧取穴", "直刺0.3～0.5寸；可灸", "清心明目、通络止痛、镇惊安神", "头痛、目赤肿痛、耳鸣耳聋；腕痛、颈项肿痛；热病、癫狂痫", ["五输穴·经"], "毫针直刺或略向尺侧斜刺，捻转行针至局部酸胀；艾条温和灸5～10分钟", "近尺骨茎突与腕关节，忌深刺与大幅提插，避免刺伤尺侧血管神经及关节结构", "腕部骨折、脱位或局部皮肤感染时禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SI6", "养老", "yang lao", 6, "在前臂后区，尺骨头桡侧缘的骨缝凹陷中；掌心向下、以另一手指按尺骨头，再转掌心向胸，指下陷窝处取穴", "直刺或斜刺0.5～0.8寸；可灸", "明目聪耳、舒筋活络、止痛", "目视不明、耳鸣耳聋；肩背肘臂酸痛、急性腰痛、落枕", ["郄穴"], "取穴时须先摆好腕部体位，随体位变化骨缝方显；毫针直刺或向肘方向斜刺，行捻转手法使酸胀向肩臂放散", "位于骨缝处，进针须避开尺骨茎突骨质，不可强刺硬顶，以免损伤骨膜", "局部皮肤感染、尺骨骨折未愈者禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SI7", "支正", "zhi zheng", 7, "在前臂后区，腕背侧远端横纹上5寸，尺骨尺侧缘与尺侧腕伸肌腱之间；阳谷与小海连线上取穴", "直刺或斜刺0.5～0.8寸；可灸", "清热解表、通经活络、安神定志", "头痛、目眩、热病、癫狂；项强、肘臂酸痛、手指挛痛；消渴、疣症", ["络穴"], "毫针直刺后行提插捻转，针感可向腕部或肘部传导；艾条温和灸5～10分钟", "前臂尺侧皮神经浅在，进针时手法宜稳，出现触电感立即退针调整", "局部皮肤破损、感染或前臂急性损伤时禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SI8", "小海", "xiao hai", 8, "在肘后区，尺骨鹰嘴与肱骨内上髁之间的凹陷中；屈肘、手掌向胸取穴", "直刺0.2～0.3寸；可灸", "清热祛风、通络止痛、安神定志", "肘臂疼痛麻木、上肢不遂；头痛、目眩、耳鸣耳聋；癫狂痫、热病", ["五输穴·合"], "屈肘取穴，毫针浅刺，行轻微捻转即可，得气为度，不留深针；可配合艾条温和灸", "穴下即尺神经沟，分布尺神经干，进针不可过深，忌用大幅度提插捻转，一旦出现向小指放射的触电感须立即退针", "尺神经损伤或肘管综合征急性期慎刺；局部感染、肘关节急性炎症时禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SI9", "肩贞", "jian zhen", 9, "在肩胛区，肩关节后下方，腋后纹头直上1寸；臂内收、正坐或俯卧取穴", "直刺1～1.5寸；可灸", "通络止痛、散结消肿、祛风利湿", "肩胛疼痛、肩关节周围炎、上肢不遂；瘰疬、腋下肿痛、耳鸣", null, "常令患者臂内收贴胸，毫针直刺后行提插捻转，使针感向肩或上臂放散；可配艾条温和灸或温针灸", "深部邻近腋神经与旋肱后血管，进针不宜过深或偏向腋窝方向，以免损伤神经血管；体质消瘦者更须控制深度", "腋窝淋巴结肿大原因未明、局部感染或肩关节急性外伤时禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SI10", "臑俞", "nao shu", 10, "在肩胛区，腋后纹头直上，肩胛冈下缘凹陷中；臂内收、正坐或俯卧取穴", "直刺或斜刺0.8～1.2寸；可灸", "舒筋通络、消肿散结、祛风止痛", "肩臂酸痛无力、肩关节周围炎、上肢不遂；瘰疬、颈项强痛", ["交会穴"], "毫针直刺或略向肩关节方向斜刺，行捻转提插手法使局部酸胀向肩臂放散；可温针灸或艾条温和灸", "深部为肩胛骨骨面，忌盲目前向内下方深刺，以免进入胸腔方向造成气胸；消瘦者尤须谨慎", "局部感染、肩部骨折未愈合或原因不明的腋下肿块处禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],

  ["SI11", "天宗", "tian zong", 11, "在肩胛区，肩胛冈中点与肩胛骨下角连线上约上1/3与下2/3交点处的冈下窝凹陷中；正坐或俯卧取穴", "直刺或向四周斜刺0.5～1寸；可灸", "舒筋活络、理气消肿、止咳平喘", "肩胛疼痛、肩背酸痛、肩关节周围炎；气喘、乳痈、乳腺增生", null, "常向肩胛骨骨面直刺，得气后行捻转手法使酸胀向肩臂放散；可配艾条温和灸或拔罐", "须以肩胛骨为依托掌握深度，不可向前内侧深刺穿透肩胛骨间隙，以免伤及胸壁与肺组织", "局部皮肤感染、肩胛骨骨折或严重骨质疏松者禁深刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SI12", "秉风", "bing feng", 12, "在肩胛区，肩胛冈中点上缘的凹陷中；正坐或俯卧、臂自然下垂取穴", "直刺或斜刺0.5～0.8寸；可灸", "祛风通络、舒筋止痛、止咳", "肩胛疼痛、肩臂酸痛麻木、上肢不遂；咳嗽、颈项强痛", ["交会穴"], "毫针直刺或向肩胛冈方向斜刺，行捻转手法得气为度；艾条温和灸5～10分钟", "穴下为肩胛冈骨质，进针遇骨即止，忌用力硬刺；向内下方深刺有入胸风险", "局部感染、肩胛骨病变或严重骨质疏松者慎刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SI13", "曲垣", "qu yuan", 13, "在肩胛区，肩胛冈内侧端上缘的凹陷中；正坐或俯卧取穴", "直刺或斜刺0.5～0.8寸；可灸", "舒筋活络、祛风止痛", "肩胛部拘挛疼痛、肩背酸痛、上肢不遂；颈项强痛", null, "毫针直刺或斜刺至肩胛骨骨面，行捻转手法使酸胀向肩背部放散；可温针灸或艾条温和灸", "脊柱旁开区域胸壁较薄，须贴骨面浅刺，禁止向前内侧深刺，以免造成气胸", "局部皮肤感染、背部外伤或严重肺气肿者慎刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SI14", "肩外俞", "jian wai shu", 14, "在脊柱区，第1胸椎棘突下旁开3寸；正坐或俯卧取穴", "斜刺0.5～0.8寸；可灸", "祛风散寒、舒筋通络、止痛", "肩背酸痛、颈项强痛、上肢冷痛麻木；落枕", null, "多向脊柱方向或向下斜刺，行捻转手法使局部酸胀；可配艾条温和灸、拔罐", "位于肩胛骨内上角上方、胸壁浅薄处，直刺不可过深，务必避免刺入胸腔引起气胸", "消瘦者、慢性肺病患者及局部皮肤感染者禁深刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SI15", "肩中俞", "jian zhong shu", 15, "在脊柱区，第7颈椎棘突下旁开2寸；正坐或俯卧、低头取穴", "斜刺0.3～0.5寸；可灸", "宣肺解表、舒筋通络、止咳平喘", "咳嗽、气喘、外感发热；肩背疼痛、颈项强痛、落枕", null, "毫针向脊柱方向斜刺或直刺浅刺，行小幅捻转，得气即止；艾条温和灸5～10分钟", "穴下即为肺尖（胸膜顶）区域，严禁深刺和向前下方斜刺，以免引起气胸；消瘦者尤须控制深度", "肺气肿、严重消瘦或局部感染者慎刺或改用灸法。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SI16", "天窗", "tian chuang", 16, "在颈部，横平喉结，胸锁乳突肌后缘凹陷中；正坐或仰卧、头略偏取穴", "直刺0.3～0.5寸；可灸", "清热利咽、聪耳开窍、消肿散结", "咽喉肿痛、暴喑、失音；耳鸣耳聋；颈项强痛、瘿气", null, "取穴时先嘱患者头偏向对侧使肌肉显露，毫针直刺后轻微捻转，得气即可，不留深针", "颈侧血管神经丰富，深部有颈动脉鞘与副神经，进针须浅、手法须轻，忌提插与大幅度捻转；出现触电感或搏动感应立即退针", "颈动脉硬化、颈动脉窦敏感者及局部淋巴结肿大原因未明者禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SI17", "天容", "tian rong", 17, "在颈部，下颌角后方，胸锁乳突肌前缘凹陷中；正坐或仰卧、头略偏取穴", "直刺0.5～0.8寸；可灸", "清热利咽、消肿散结、聪耳下气", "咽喉肿痛、咽中如梗、暴喑；耳鸣耳聋、颊肿；颈项强痛、瘿气", null, "毫针直刺，进针后行轻微捻转，使局部酸胀或咽喉部有感应即止；不宜反复提插", "深部有颈内动静脉、迷走神经与副神经等重要结构，须严格掌握角度与深度，禁止向内侧或深处大幅度提插；出现触电感、搏动感应立即退针", "颈动脉硬化、严重心肺疾病患者及原因不明的颈部肿块处禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SI18", "颧髎", "quan liao", 18, "在面部，颧骨下缘的凹陷中，约平鼻翼下缘、目外眦直下；正坐或仰卧取穴", "直刺0.3～0.5寸，或斜刺0.5～1寸；可灸，但面部宜慎灸", "祛风通络、清热消肿、牵正止痛", "面痛、面瘫、眼睑瞤动、齿痛；颊肿、目赤肿痛", ["交会穴"], "毫针直刺或向四周透刺，手法宜轻，得气后留针；面部腧穴一般不主张强刺激与大灸量", "面部血管丰富，进针宜浅、避开颧面血管；不宜重灸，以免遗留瘢痕影响面容；眶下缘方向进针过深有伤及眼球的风险", "面部急性感染、皮肤破损或出血倾向者禁刺；不宜瘢痕灸。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["SI19", "听宫", "ting gong", 19, "在面部，耳屏正中前方，下颌骨髁突后缘的凹陷中；微张口，于凹陷处取穴", "张口直刺0.5～1寸；可灸", "聪耳开窍、宁神止痛、通络利齿", "耳鸣、耳聋、聤耳；齿痛、下颌关节痛；癫狂痫", ["交会穴"], "必须张口取穴并保持张口位进针，得气后留针期间不可闭口；出针后再合口，按压针孔片刻", "留针时若闭口可致针体弯曲或滞针；耳前颞浅动脉分支浅在，进针应避开搏动处；耳部急性化脓性感染时不宜针刺", "耳部及耳周急性感染、耳膜穿孔急性期禁刺；下颌关节脱位或骨折时慎用。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  /* ---- 足太阳膀胱经（67 穴） ---- */
  ["BL1", "睛明", "jing ming", 1, "在面部，目内眦内上方凹陷中；正坐或仰卧，闭目取穴", "嘱患者闭目，医者左手轻推眼球向外侧固定，右手缓慢直刺0.5～1寸；不宜灸", "清热明目、祛风通络", "目赤肿痛、迎风流泪、近视、目视不明等目疾；急性腰扭伤、坐骨神经痛", ["交会穴"], "紧靠眶缘进针，手法宜轻缓，不宜提插捻转；出针后用消毒干棉球按压针孔1～2分钟，防止出血", "穴下为眼眶内重要结构，进针过深或手法过重易致眼内出血、血肿甚至刺伤眼球；针刺时须固定眼球、避开血管，出针后按压。", "禁灸；眼部急性炎症、出血性疾病及不配合者禁针或慎针。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["BL2", "攒竹", "cuan zhu", 2, "在面部，眉头凹陷中，额切迹处；正坐或仰卧取穴", "向眉中或眼眶方向平刺0.5～0.8寸，或点刺出血；不宜灸", "清热散风、明目止痛", "头痛、眉棱骨痛；目赤肿痛、眼睑下垂、迎风流泪；面瘫、呃逆", null, "沿皮平刺，可行轻微捻转；治呃逆时可指压或针刺并配合深吸气屏气；出针后按压针孔", "眶上缘处血管神经丰富，针刺宜浅、避免向内上方深刺，出针后按压以防局部血肿。", "禁灸；局部皮肤感染或血肿时不宜针刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["BL3", "眉冲", "mei chong", 3, "在头部，攒竹直上入发际0.5寸，神庭与曲差连线之中点；正坐或仰卧取穴", "沿皮平刺0.3～0.5寸；可灸", "疏风通络、清利头目", "头痛、眩晕、鼻塞；目视不明、癫痫", ["交会穴"], "沿头皮向后平刺，轻度捻转即可，不宜大幅提插；小儿囟门未闭者尤须轻浅", "头部穴位以平刺为主，不宜垂直深刺；小儿及颅骨缺损、术后患者慎针。", "局部头皮感染、溃疡者禁针。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["BL4", "曲差", "qu cha", 4, "在头部，前发际正中直上0.5寸，旁开1.5寸；正坐或仰卧取穴", "沿皮平刺0.3～0.5寸；可灸", "疏风清热、通窍明目", "头痛、目眩；鼻塞、鼻衄；目视不明", ["交会穴"], "向后沿皮平刺，捻转角度宜小；可配艾条温和灸5～10分钟", "头皮血管丰富，出针后按压针孔防出血；不宜向下方深刺。", "头皮局部感染或开放性损伤者禁针。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["BL5", "五处", "wu chu", 5, "在头部，前发际正中直上1寸，旁开1.5寸；正坐或仰卧取穴", "沿皮平刺0.3～0.5寸；可灸", "疏风清热、镇惊明目", "头痛、目眩；癫痫、小儿惊风；目视不明", ["交会穴"], "沿头皮平刺，轻微捻转；癫痫发作期不做强刺激，宜平补平泻", "头针操作禁大幅提插；婴幼儿及颅脑手术后患者慎针。", "局部皮肤感染者禁针。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["BL6", "承光", "cheng guang", 6, "在头部，前发际正中直上2.5寸，旁开1.5寸；正坐或仰卧取穴", "沿皮平刺0.3～0.5寸；可灸", "清热明目、疏风通窍", "头痛、眩晕、目视不明；鼻塞、多涕；癫痫", ["交会穴"], "向后沿皮平刺，行轻度捻转；可配合艾条温和灸", "不宜深刺或强刺激；出针后按压防头皮血肿。", "局部感染者禁针。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["BL7", "通天", "tong tian", 7, "在头部，前发际正中直上4寸，旁开1.5寸；正坐或仰卧取穴", "沿皮平刺0.3～0.5寸；可灸", "宣通鼻窍、疏风清头", "头痛、眩晕；鼻塞、鼻衄、鼻渊；颈项强痛", ["交会穴"], "沿皮向后平刺，捻转轻缓；鼻病可配迎香、印堂同用", "头部平刺，忌垂直深刺与大幅提插；局部有瘢痕或感染时禁针。", "局部皮肤病损者禁针。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["BL8", "络却", "luo que", 8, "在头部，前发际正中直上5.5寸，旁开1.5寸；正坐或仰卧取穴", "沿皮平刺0.3～0.5寸；可灸", "疏风清头、通络明目", "眩晕、耳鸣；鼻塞；目视不明、癫狂", ["交会穴"], "沿头皮平刺，宜轻柔捻转；眩晕发作期手法宜轻", "不可深刺；体虚、眩晕明显者针刺时取卧位，防止晕针。", "局部感染或瘢痕体质者不宜针刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["BL9", "玉枕", "yu zhen", 9, "在头部，后发际正中直上2.5寸，旁开1.3寸，横平枕外隆凸上缘；正坐或俯卧取穴", "沿皮平刺0.3～0.5寸；可灸", "疏风清头、明目通窍", "头痛、目痛、目视不明；鼻塞；枕项强痛", ["交会穴"], "向下或向外沿皮平刺，禁向内上方深刺；可行艾条温和灸", "深部邻近枕骨与延髓区域，严禁垂直深刺与大幅度提插，以免损伤中枢结构。", "枕部外伤、颅骨缺损或局部感染者禁针。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["BL10", "天柱", "tian zhu", 10, "在颈后部，横平第2颈椎棘突上际，斜方肌外缘凹陷中；正坐或俯卧取穴", "直刺或向下斜刺0.5～0.8寸，不可向内上方深刺；可灸", "疏风通络、清头明目、舒项", "头痛、眩晕、目视不明；鼻塞；项强、肩背痛；落枕", null, "缓慢进针，得气后行轻柔捻转；不宜提插幅度过大，不留针过久", "深部邻近延髓与椎动脉，严禁向内上方深刺或强捻转，以防蛛网膜下腔出血等严重意外；体弱者卧位针刺。", "颈椎骨折、脱位、严重骨质疏松及不配合者禁针；禁深刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],

  ["BL11", "大杼", "da zhu", 11, "在脊柱区，第1胸椎棘突下，后正中线旁开1.5寸；俯伏或俯卧取穴", "向内斜刺0.5～0.8寸；可灸", "强筋健骨、疏风解表、宣肺", "咳嗽、发热、头痛；项强、肩背痛；骨病、骨节疼痛", ["八会穴","交会穴"], "针尖斜向脊柱方向刺入，得气为度；可配艾条温和灸或温针灸", "不可直刺过深，以免刺入胸腔造成气胸；胸椎骨质疏松、脊柱畸形者慎针。", "胸背部穴位禁深刺；局部皮肤感染或有出血倾向者慎针。请以教材、国家标准和专业医师指导为准。", null, null, true, null],

  ["BL57", "承山", "cheng shan", 57, "在小腿后区，腓肠肌两肌腹与跟腱交角处；伸直小腿或提足跟时呈人字形凹陷处取穴", "直刺1～2寸；可灸", "舒筋活络、通肠疗痔、理气止痛", "腰腿拘急疼痛、腓肠肌痉挛、下肢痿痹；痔疾、便秘；腹痛", null, "直刺，得气后行提插捻转；腓肠肌痉挛时手法宜轻，可配合艾灸温通", "用力过强或深刺可致腓肠肌强烈痉挛、局部血肿；深部有胫神经血管，须缓慢进针。", "小腿急性损伤、深静脉血栓或局部感染者禁针。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["BL58", "飞扬", "fei yang", 58, "在小腿后区，昆仑直上7寸，腓肠肌外下缘处；俯卧或正坐取穴", "直刺0.7～1寸；可灸", "舒筋活络、清热利窍、宁神", "头痛、目眩、鼻塞、鼻衄；腰背痛、腿软无力、下肢痿痹；痔疾", ["络穴"], "直刺得气后轻捻转；本穴为膀胱经络穴，可配肾经太溪调理表里经气", "穴区深部邻近胫神经与腓肠肌，进针不宜过深，避免强刺激引起抽搐。", "局部感染、小腿深静脉血栓者禁针。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["BL59", "跗阳", "fu yang", 59, "在小腿后区，外踝尖上3寸，腓骨后缘；俯卧或正坐取穴", "直刺0.8～1.2寸；可灸", "舒筋活络、清头明目、强腰膝", "头痛、头重、目眩；腰腿痛、下肢痿痹、踝部肿痛；外踝扭伤", ["郄穴"], "直刺得气后行轻捻转；急性踝扭伤宜浅刺、弱刺激，不宜强手法", "深部为腓骨与胫神经分支，进针须避开骨面并控制深度，防止损伤神经。", "踝部骨折、局部严重肿胀或感染者禁针。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["BL60", "昆仑", "kun lun", 60, "在踝区，外踝尖与跟腱之间的凹陷中；正坐或俯卧取穴", "直刺0.5～0.8寸；可灸", "舒筋活络、清热止痛、通利腰脊", "头痛、项强、目眩、鼻衄；腰骶疼痛、足跟痛、外踝肿痛；难产", ["五输穴·经"], "直刺，得气后轻捻转；孕妇禁用，因本穴有通经下胎之说，操作须审慎", "穴下有腓肠神经与跟腱，忌向内踝方向深刺及强刺激，以免损伤神经或跟腱；孕妇禁针。", "孕妇禁用；跟腱损伤、局部感染者禁针。请以教材、国家标准和专业医师指导为准。", null, null, true, null],

  ["BL61", "仆参", "pu can", 61, "在跟区，昆仑直下，跟骨外侧，赤白肉际处；正坐或俯卧取穴", "直刺0.3～0.5寸；可灸", "舒筋活络、安神定志、通利腰膝", "足跟痛、下肢痿痹、踝关节肿痛；癫痫、晕厥；腰腿痛", ["交会穴"], "直刺浅刺，轻柔捻转；足跟痛者可配太溪、昆仑同用，宜加艾灸", "局部皮薄肉少、感觉较敏感，进针宜浅，避免刺伤骨膜引起剧痛。", "跟骨骨折、局部皮肤破损或感染者禁针。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["BL62", "申脉", "shen mai", 62, "在踝区，外踝尖直下，外踝下缘与跟骨之间的凹陷中；正坐或仰卧取穴", "直刺0.3～0.5寸；可灸", "宁心安神、舒筋通络、清利头目", "头痛、眩晕、失眠、癫狂痫；腰腿痛、足外翻、踝关节痛；项强", ["八脉交会穴","交会穴"], "直刺浅刺，轻捻转得气；本穴通阳跷脉，常与照海相配调理失眠与肢体阴阳失衡", "局部组织菲薄且邻近腓骨肌腱与神经分支，忌深刺与强刺激，防止损伤血管神经。", "踝部骨折、急性扭伤肿胀明显者慎针；局部感染者禁针。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["BL63", "金门", "jin men", 63, "在足背，外踝前缘直下，第5跖骨粗隆后方，骰骨下缘凹陷中；正坐或仰卧取穴", "直刺0.3～0.5寸；可灸", "舒筋活络、清神止痛、通利关节", "足痛、外踝痛、下肢痿痹；癫痫、小儿惊风；腰痛", ["郄穴"], "直刺浅刺，得气后轻捻转；急性足踝痛宜弱刺激，不宜强手法", "局部骨性突起明显、软组织薄，进针宜浅并避开骨面，防止骨膜损伤与剧痛。", "足部骨折、局部皮肤破损或感染者禁针。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["BL64", "京骨", "jing gu", 64, "在跖区，第5跖骨粗隆前下方，赤白肉际处；正坐或仰卧取穴", "直刺0.3～0.5寸；可灸", "清热明目、舒筋活络、宁心安神", "头痛、项强、目赤、目翳；腰腿痛、足痛；癫痫、心痛", ["原穴"], "直刺浅刺，轻捻转得气；本穴为膀胱经原穴，虚证可配艾灸补益", "足外侧皮薄，进针宜浅，避免刺及骨膜；局部肿胀明显时慎针。", "足部骨折、局部感染者禁针。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["BL65", "束骨", "shu gu", 65, "在跖区，第5跖趾关节后方，赤白肉际处；正坐或仰卧取穴", "直刺0.3～0.5寸；可灸", "舒筋活络、清头明目、宁神", "头痛、项强、目眩；腰腿痛、足趾痛；癫狂、癫痫", ["五输穴·输"], "直刺浅刺，轻柔捻转；头项痛者可配天柱、后溪同用", "穴位浅表、软组织薄，进针不可过深，避免刺伤骨膜与足趾神经分支。", "足部外伤、骨折或局部感染者禁针。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["BL66", "足通谷", "zu tong gu", 66, "在足趾，第5跖趾关节前方，第5趾近节趾骨底与跖骨结合部前方凹陷中，赤白肉际处；正坐或仰卧取穴", "直刺0.2～0.3寸；可灸", "清热安神、疏风清头", "头痛、项强、目眩、鼻衄；癫狂、失眠；足趾痛", ["五输穴·荥"], "浅刺，轻捻转；本穴为荥穴，热证可用泻法，不宜久留针", "穴区狭小、皮薄，进针宜浅缓，防止刺伤趾骨骨膜与趾神经；局部感染时不宜针刺。", "足趾外伤、骨折、甲沟炎或局部感染者禁针。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["BL67", "至阴", "zhi yin", 67, "在足趾，第5趾末节外侧，距趾甲角0.1寸（指寸）处；正坐或仰卧取穴", "浅刺0.1～0.2寸，或点刺出血；胎位不正用灸法；可灸", "清头明目、通利鼻窍、矫正胎位", "胎位不正、难产；头痛、目痛、鼻塞、鼻衄；足下热", ["五输穴·井"], "浅刺或三棱针点刺出血少量；矫正胎位多用艾条温和灸15～20分钟，操作期间须由医师监测胎心与胎动", "本穴为矫正胎位的常用穴，孕妇使用必须由专业医师操作并全程监护；非医疗人员不得自行施灸或针刺。", "孕妇禁用针刺，灸法矫正胎位须在医师指导下进行；局部感染者禁针。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  /* ---- 足少阴肾经（27 穴） ---- */
  ["KI1", "涌泉", "yong quan", 1, "在足底，屈足卷趾时足心最凹陷处，约当足底第2、3趾趾缝纹头端与足跟连线的前1/3与后2/3交点；仰卧或俯卧，卷足取穴", "直刺0.5～1寸；可灸", "开窍醒神、滋阴降火、平肝息风、引火归元", "昏厥、中暑、癫狂、小儿惊风、失眠；头痛、眩晕、咽喉肿痛、失音；足心热、下肢厥冷", ["五输穴·井"], "直刺得气后行捻转提插泻法或平补平泻，留针20～30分钟；急救多用强刺激或三棱针点刺出血，虚火上炎者可配艾条温和灸5～10分钟。", "穴在足底，皮厚且痛感强烈，进针宜快、手法由轻渐重；此处血管神经较丰富，刺激过强易致足底剧痛甚至晕针，体弱者与初次针刺者宜取卧位并减轻刺激量。", "局部皮肤感染、破损、溃疡或足底有严重胼胝裂口时不宜针刺；出血倾向者禁用点刺放血。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["KI2", "然谷", "ran gu", 2, "在足内侧，足舟骨粗隆下方，赤白肉际凹陷中；正坐垂足或仰卧，沿内踝前下方触摸舟骨粗隆取穴", "直刺0.5～0.8寸；可灸", "滋阴清热、益气固肾、通利下焦", "月经不调、带下、遗精、阳痿；消渴、咽干、咽喉肿痛；咳血、足跗肿痛、小儿脐风", ["五输穴·荥"], "直刺得气后行捻转平补平泻手法，留针20～30分钟；阴虚火旺者可用小艾炷灸3～5壮或艾条温和灸5～10分钟。", "穴下紧邻足舟骨粗隆骨面，进针应避开骨膜以免剧痛；局部有足底内侧动脉分支经过，不宜反复提插或大幅度捻转。", "局部皮肤感染、破损或足部急性扭伤肿胀期不宜针刺；孕妇下腹部及腰骶部相关病症需由医师评估后再行治疗。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["KI3", "太溪", "tai xi", 3, "在踝区，内踝尖与跟腱之间的凹陷中；正坐垂足或仰卧，于内踝尖向后按取凹陷处取穴", "直刺0.5～1寸；可灸", "滋阴益肾、壮腰强膝、清虚热、调理冲任", "头痛、目眩、失眠、健忘、耳鸣耳聋；月经不调、遗精、阳痿、小便频数；咽干、齿痛、咳喘、腰膝酸痛、足跟痛", ["五输穴·输","原穴"], "直刺得气后以捻转补法为主，留针20～30分钟；肾虚证常配艾条温和灸或温针灸10～15分钟，以局部温热、深层酸胀为度。", "穴在内踝与跟腱之间，深部有胫后动、静脉与胫神经通行，进针不宜过深、不宜大幅提插，得气即有麻电感向足底放射时应立即停止深入。", "局部皮肤感染、破损或踝关节急性损伤肿胀期不宜针刺；下肢静脉血栓、淋巴水肿者慎用。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["KI4", "大钟", "da zhong", 4, "在足跟区，内踝后下方，跟骨上缘，跟腱附着部前缘凹陷中；正坐垂足或仰卧，于太溪后下方取穴", "直刺0.3～0.5寸；可灸", "益肾平喘、调理二便、通经活络", "咯血、气喘、咳嗽；小便不利、癃闭、遗尿、便秘；痴呆、嗜卧、足跟痛", ["络穴"], "直刺得气后行捻转平补平泻手法，留针20～30分钟；肾气不足者可用艾条温和灸5～10分钟。", "穴在跟腱附着部前缘，进针应沿跟腱前缘方向，避免直接刺入跟腱造成肌腱损伤；深部邻近胫后血管神经束，不宜深刺。", "跟腱炎、跟腱损伤急性期及局部皮肤感染、破损时不宜针刺；正在使用抗凝药物者慎用。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["KI5", "水泉", "shui quan", 5, "在足内侧，内踝后下方，太溪直下1寸，跟骨结节内侧凹陷中；正坐垂足或仰卧取穴", "直刺0.3～0.5寸；可灸", "活血调经、通利小便、清热明目", "月经不调、痛经、闭经、阴挺；小便不利、淋证；目昏花、腹痛", ["郄穴"], "直刺得气后行捻转平补平泻手法，留针20～30分钟；痛经急性发作时可加强捻转刺激，虚证配艾条温和灸5～10分钟。", "穴在跟骨结节内侧，进针应避开骨面与跟腱；局部感觉敏锐，手法宜轻柔，防止引起足内侧放射性麻痛。", "局部皮肤感染、破损或跟骨骨刺急性疼痛期不宜针刺；孕妇下腹部及腰骶部相关病症须由医师评估。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["KI6", "照海", "zhao hai", 6, "在踝区，内踝尖下1寸，内踝下缘边际凹陷中；正坐垂足或仰卧，于内踝下缘凹陷处取穴", "直刺0.5～0.8寸；可灸", "滋阴清热、利咽安神、通调阴跷、通利小便", "咽喉干痛、目赤肿痛、失眠、癫痫；月经不调、带下、阴挺、小便不利、便秘", ["八脉交会穴","交会穴"], "直刺得气后行捻转平补平泻手法，留针20～30分钟；咽喉疾患常与列缺相配，虚热证可配艾条温和灸5～10分钟。", "穴在内踝下缘凹陷内，深部邻近胫后血管神经束与跗骨管结构，进针不宜过深，出现向足底放射的麻电感时应停止深入。", "局部皮肤感染、破损或踝部急性损伤肿胀期不宜针刺；孕妇下腹部及腰骶部相关病症须由医师评估。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["KI7", "复溜", "fu liu", 7, "在小腿内侧，内踝尖上2寸，跟腱的前缘；正坐垂足或仰卧，于太溪直上2寸跟腱前缘取穴", "直刺0.5～1寸；可灸", "补肾益阴、温阳利水、固表止汗", "水肿、腹胀、泄泻、小便不利；盗汗、无汗、热病汗不出；腰脊强痛、下肢痿痹、足跟痛", ["五输穴·经"], "直刺得气后行捻转补法，留针20～30分钟；汗证调理常配合谷，虚寒水肿者可加艾条温和灸或温针灸10～15分钟。", "穴在跟腱前缘，进针应向前方（胫骨方向）斜刺或直刺，避免刺入跟腱；深部有胫后血管神经束，不宜过深及大幅提插。", "局部皮肤感染、破损或跟腱病变急性期不宜针刺；严重下肢水肿伴静脉血栓者禁用针刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],

  ["KI22", "步廊", "bu lang", 22, "在胸部，第5肋间隙，前正中线旁开2寸；仰卧或正坐，于第5肋间隙锁骨中线内侧取穴", "斜刺或平刺0.5～0.8寸，不宜直刺深刺；可灸", "宽胸理气、止咳平喘、和胃降逆", "咳嗽、气喘、胸胁胀满、胸痛；呕吐、食欲不振、乳痈", ["交会穴"], "沿肋间隙向外斜刺或平刺，得气后行捻转平补平泻手法，留针15～20分钟；可配艾条温和灸5～10分钟，不宜在肋间隙做强刺激。", "穴在第5肋间隙，深面为胸膜与肺下叶，属胸部危险区，必须斜刺或平刺，严禁直刺深刺，以免引起气胸；体瘦者更应浅刺。", "肺气肿、严重肺心病患者慎用；气胸、胸腔积液、胸部皮肤感染或肋骨骨折未愈者禁用针刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["KI23", "神封", "shen feng", 23, "在胸部，第4肋间隙，前正中线旁开2寸；仰卧或正坐，于第4肋间隙取穴", "斜刺或平刺0.5～0.8寸，不宜直刺深刺；可灸", "宽胸理气、止咳平喘、宁心安神", "咳嗽、气喘、胸胁胀满；心悸、失眠、乳痈、呕吐", ["交会穴"], "沿肋间隙向外斜刺或平刺，得气后行轻柔捻转手法，留针15～20分钟；心悸失眠者可配艾条温和灸5～10分钟。", "穴在第4肋间隙，深面为胸膜与肺，且内侧邻近心脏，属胸部危险区，必须斜刺或平刺、控制深度，出现胸闷气促应立即起针观察。", "心肺功能严重不全、胸部皮肤感染、肋骨骨折或气胸病史者禁用针刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["KI24", "灵墟", "ling xu", 24, "在胸部，第3肋间隙，前正中线旁开2寸；仰卧或正坐，于第3肋间隙取穴", "斜刺或平刺0.5～0.8寸，不宜直刺深刺；可灸", "宽胸降逆、止咳平喘、疏肝理气", "咳嗽、气喘、痰多、胸胁胀痛；乳痈、呕吐、食欲不振", ["交会穴"], "沿肋间隙向外斜刺或平刺，得气后行轻柔捻转手法，留针15～20分钟；可配合艾条温和灸，灸时注意保护胸部皮肤。", "穴在第3肋间隙，深面为胸膜与肺上叶，属胸部危险区，务必斜刺或平刺浅刺，严禁直刺深刺以防气胸；胸壁薄者尤须谨慎。", "气胸、肺大疱、胸部皮肤感染或肋骨骨折者禁用针刺；严重肺疾病患者慎用。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["KI25", "神藏", "shen cang", 25, "在胸部，第2肋间隙，前正中线旁开2寸；仰卧或正坐，于第2肋间隙取穴", "斜刺或平刺0.5～0.8寸，不宜直刺深刺；可灸", "宽胸理气、止咳平喘、宁心安神", "咳嗽、气喘、胸痛、烦满；心悸、失眠、呕吐、食欲不振", ["交会穴"], "沿肋间隙向外斜刺或平刺，得气后行轻柔捻转手法，留针15～20分钟；虚证可配艾条温和灸5～10分钟。", "穴在第2肋间隙，深面为胸膜与肺上叶，属胸部危险区，必须斜刺或平刺，严禁直刺深刺；进针后若患者出现胸痛、气促需立即起针处理。", "气胸、肺大疱、胸部皮肤感染、肋骨骨折或严重心肺功能不全者禁用针刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["KI26", "彧中", "yu zhong", 26, "在胸部，第1肋间隙，前正中线旁开2寸；仰卧或正坐，于第1肋间隙取穴", "斜刺或平刺0.5～0.8寸，不宜直刺深刺；可灸", "宽胸理气、止咳化痰、降逆平喘", "咳嗽、气喘、痰涎壅盛、胸胁胀满；呕吐、不欲食", ["交会穴"], "沿肋间隙向外斜刺或平刺，得气后行轻柔捻转手法，留针15～20分钟；可配艾条温和灸，避免在肋间隙施重灸。", "穴在第1肋间隙，深面为胸膜顶与肺尖，位置高且胸壁较薄，属胸部危险区，严禁直刺深刺以防气胸；颈部短粗者尤须谨慎。", "肺尖部病变、气胸、胸部皮肤感染或肋骨骨折者禁用针刺；严重肺疾病患者慎用。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["KI27", "俞府", "shu fu", 27, "在胸部，锁骨下缘，前正中线旁开2寸；仰卧或正坐，于锁骨下缘凹陷中取穴", "斜刺或平刺0.5～0.8寸，不宜直刺深刺；可灸", "宽胸理气、止咳平喘、降逆和胃", "咳嗽、气喘、胸痛、胸胁胀满；呕吐、呃逆、食欲不振", ["交会穴"], "沿锁骨下缘向外下方斜刺或平刺，得气后行轻柔捻转手法，留针15～20分钟；虚喘者可配艾条温和灸5～10分钟。", "穴在锁骨下缘，深面为胸膜顶与肺尖，其内侧有锁骨下血管与臂丛神经经过，属胸部危险区，严禁直刺深刺；出现上肢麻电感时应立即退针。", "气胸、肺尖部病变、锁骨骨折未愈、胸部皮肤感染或严重心肺功能不全者禁用针刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  /* ---- 手厥阴心包经（9 穴） ---- */
  ["PC1", "天池", "tian chi", 1, "在胸部，第4肋间隙，前正中线旁开5寸；仰卧或正坐，于乳头外1寸、第4肋间取穴", "沿肋间隙向外斜刺或平刺0.3～0.5寸，不可直刺深刺；一般不灸或慎灸", "宽胸理气、清心化痰、散结通络", "胸闷、心痛、咳嗽、气喘、痰多；胁肋胀痛、腋下肿痛；乳痈、瘰疬", ["交会穴"], "仰卧暴露胸部，先扪清第4肋间隙，针体与胸壁近乎平行、沿肋间缓慢向外刺入，得气后轻微捻转，不提插捣刺；出针后按压针孔片刻。", "穴下深部为肺与心脏，胸壁较薄者深刺可致气胸或伤及心肺；定位不清、消瘦或肺气肿患者不宜针刺，操作须由专业医师完成。", "禁直刺、禁深刺、禁大幅提插；乳房肿块性质不明、局部皮肤感染破损、严重心肺疾病及出血倾向者禁刺；孕妇慎用；本穴一般不作艾灸；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["PC2", "天泉", "tian quan", 2, "在臂前区，腋前纹头下2寸，肱二头肌长、短头之间；垂臂屈肘，于腋前纹头与肘横纹连线上段取穴", "直刺0.5～0.8寸；可灸", "宽胸理气、活血通脉、通络止痛", "心痛、心悸、胸胁胀满；上臂内侧疼痛、上肢不遂；咳嗽", null, "垂臂屈肘，于肱二头肌两头之间缓慢直刺，得气后行小幅提插捻转，使酸胀感向上臂内侧或前臂放散；可配艾条温和灸。", "穴区深部有肱动脉与正中神经走行，进针不宜过深、不宜向内侧偏斜，以免刺伤血管神经束引起剧痛或血肿。", "局部皮肤感染、破损或上臂急性外伤者禁刺；出血倾向及体弱者慎用强刺激；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["PC3", "曲泽", "qu ze", 3, "在肘前区，肘横纹上，肱二头肌腱的尺侧缘；微屈肘，于肘横纹肱二头肌腱内侧凹陷中取穴", "直刺0.8～1寸，或点刺出血；可灸", "清心泻火、和胃降逆、舒筋活络", "心痛、心悸、善惊；热病烦躁、口干；胃痛、呕吐；肘臂挛痛、上肢颤动", ["五输穴·合"], "微屈肘使肌腱显露，紧贴肱二头肌腱尺侧缘直刺，得气后小幅提插捻转；亦可用三棱针于穴处浅静脉点刺放血，出血量宜少。", "穴下邻近肱动、静脉与正中神经，进针不可过深、不可反复捣刺；点刺放血必须严格消毒并压迫止血，凝血功能异常者不宜放血。", "局部皮肤感染、破损或有血肿者禁刺；凝血功能障碍、正在服用抗凝药物者禁点刺放血；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["PC4", "郄门", "xi men", 4, "在前臂前区，腕掌侧远端横纹上5寸，掌长肌腱与桡侧腕屈肌腱之间；仰掌，于两肌腱之间取穴", "直刺0.5～1寸；可灸", "宁心止痛、宽胸理气、凉血止血", "心痛、心悸、胸痛烦满；咳血、呕血、鼻出血；疔疮、癫痫", ["郄穴"], "仰掌微握，于两筋之间垂直缓慢进针，得气后行小幅提插捻转，使针感向指端或肘部放散；急症止痛时可用较强捻转，缓解后即减量。", "穴下正对正中神经走行区，若出现向中指放散的触电样麻感应立即退针或调整方向，严禁反复提插捣刺损伤神经干。", "局部皮肤感染、破损或前臂急性外伤者禁刺；不宜使用电针强刺激；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["PC5", "间使", "jian shi", 5, "在前臂前区，腕掌侧远端横纹上3寸，掌长肌腱与桡侧腕屈肌腱之间；仰掌，于两肌腱之间取穴", "直刺0.5～1寸；可灸", "宽胸理气、宁心安神、和胃化痰", "心痛、心悸、胃痛、呕吐、痰多；癫狂、痫证、失眠；热病、疟疾；肘臂挛痛", ["五输穴·经"], "仰掌，于掌长肌腱与桡侧腕屈肌腱之间直刺，得气后行提插捻转，针感可向手掌或肘部传导；虚证宜轻刺激，实证可稍加捻转。", "穴下有正中神经通过，针刺出现向手指放散的强烈麻电感时应稍退针，不可持续刺激或大幅度捣刺，以免造成神经损伤。", "局部皮肤感染、破损者禁刺；前臂急性扭挫伤肿痛明显处暂不针刺；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["PC6", "内关", "nei guan", 6, "在前臂前区，腕掌侧远端横纹上2寸，掌长肌腱与桡侧腕屈肌腱之间；仰掌，于两筋之间取穴", "直刺0.5～1寸；可灸", "宁心安神、宽胸理气、和胃降逆、镇静止痛", "心痛、心悸、胸闷、眩晕；胃痛、呕吐、呃逆、晕车晕船；失眠、癫狂痫、郁证；肘臂挛痛、偏头痛", ["络穴","八脉交会穴"], "仰掌，于两筋之间垂直进针，得气后行小幅提插捻转，使酸麻胀感向手掌或上臂放散；止呕、止晕可用较强捻转持续行针，留针期间可间歇运针。", "穴下即正中神经，出现向中指、无名指放散的触电样麻感时须立即退针或改变方向，不可强刺激或长时间电针，孕妇尤应慎用。", "局部皮肤感染、破损者禁刺；孕妇慎用或避免强刺激；严重心脏病患者不宜使用电针强刺激；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["PC7", "大陵", "da ling", 7, "在腕前区，腕掌侧远端横纹中，桡侧腕屈肌腱与掌长肌腱之间；仰掌，于腕横纹两筋之间凹陷中取穴", "直刺0.3～0.5寸；可灸", "清心宁神、和胃宽胸、清热散结", "心痛、心悸、癫狂、善笑、失眠；胃痛、呕吐、口臭；腕关节及周围软组织疼痛、腕下垂；疮疡、湿疹", ["五输穴·输","原穴"], "仰掌，于腕横纹两筋之间垂直缓慢进针，得气后轻微捻转，不宜大幅度提插；治腕部病痛可配合小幅提插并令患者轻微活动腕关节。", "穴下为腕管，内有正中神经与屈指肌腱，进针过深或反复提插可损伤神经、加重腕管症状；腕部肿胀明显或已有腕管综合征者慎刺。", "腕部急性外伤、骨折、关节腔感染或局部皮肤破损者禁刺；不宜用电针强刺激；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["PC8", "劳宫", "lao gong", 8, "在掌区，横平第3掌指关节近端，第2、3掌骨之间偏于第3掌骨；握拳屈指，中指尖所抵掌心处取穴", "直刺0.3～0.5寸；可灸", "清心泻火、醒神开窍、消肿止痒", "中风昏迷、中暑、癫狂痫；心痛、心烦、口疮、口臭；鹅掌风、手掌多汗、湿疹瘙痒", ["五输穴·荥"], "仰掌，于第2、3掌骨之间靠近第3掌骨处直刺，得气后轻微捻转，掌部酸胀感明显即可；急救开窍可用较强刺激并以指甲掐按替代。", "掌部神经血管丰富且皮肤较厚，进针不宜过深，以免刺伤掌腱膜、掌浅弓或指神经；出现剧烈刺痛或放电样麻感应即刻退针。", "手掌皮肤感染、破损、掌部急性外伤或腱鞘炎急性期者禁刺；避免大幅提插；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["PC9", "中冲", "zhong chong", 9, "在手指，中指末端最高点；仰掌，于中指末节尖端中央取穴", "浅刺0.1寸，或点刺出血；一般不灸", "开窍醒神、清心泻热、回阳救逆", "中风昏迷、中暑、昏厥、小儿惊风；热病、心烦、舌强肿痛；掌中热", ["五输穴·井"], "以左手固定中指末端，右手持针快速浅刺并即刻出针，或改用三棱针点刺挤压出血少许；急救时可同时配合指甲重掐。", "指端末梢神经丰富、感觉敏锐，针刺疼痛明显，年老体弱及晕针者慎用；点刺放血须严格消毒，指端有感染时不可操作。", "局部皮肤感染、破损、甲沟炎或出血倾向、凝血功能障碍者禁刺及禁放血；糖尿病末梢循环不良者慎用放血；本穴一般不灸；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  /* ---- 手少阳三焦经（23 穴） ---- */
  ["TE1", "关冲", "guan chong", 1, "在手指，第4指末节尺侧，指甲根角侧上方0.1寸（指寸）；微握拳、掌心向下，于无名指指甲尺侧角旁取穴", "浅刺0.1寸，或三棱针点刺出血；可灸", "清热开窍、利咽消肿、疏通三焦", "咽喉肿痛、口干、舌强；头痛、目赤、耳鸣；热病、昏厥、中暑", ["五输穴·井"], "多用三棱针点刺挤血数滴，或毫针浅刺后略捻转即出针，不留针；灸法宜小炷艾条温和灸，以局部温热为度", "指端末节组织菲薄、感觉敏锐，刺激量宜轻；点刺放血须严格消毒，凝血功能异常或正在抗凝治疗者慎用", "局部皮肤破损、感染或瘢痕处禁刺；体虚、孕妇慎用强刺激。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["TE2", "液门", "ye men", 2, "在手背，第4、第5指间，指蹼缘上方赤白肉际凹陷中；握拳取穴，于两指歧缝纹头处", "直刺0.3～0.5寸；可灸", "清热解表、利咽消肿、通络止痛", "头痛、目赤、耳鸣、咽喉肿痛；热病、疟疾；手背红肿、指臂挛痛", ["五输穴·荥"], "微握拳，沿掌骨间隙向掌心方向直刺或略斜刺，行小幅捻转使局部酸胀；艾条温和灸5～10分钟", "穴在指蹼处，皮肤薄、血管神经末梢丰富，进针不宜过深，避免伤及指背血管与指神经", "局部皮肤感染、湿疹或破损时禁刺；手部急性外伤肿胀期慎用。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["TE3", "中渚", "zhong zhu", 3, "在手背，第4、第5掌骨间，第4掌指关节近端凹陷中；微握拳，于液门后1寸掌骨间隙取穴", "直刺0.3～0.5寸；可灸", "清热通络、开窍聪耳、疏利三焦", "耳鸣、耳聋、目赤、咽喉肿痛；头痛、项强、热病；手指不能屈伸、肩背肘臂痛", ["五输穴·输"], "握拳，沿第4、5掌骨间隙向腕部斜刺或直刺0.3～0.5寸，捻转得气后局部酸胀可向指端放散；艾条温和灸5～10分钟", "穴在掌骨间隙，深刺易伤及骨间肌与掌背血管神经，不宜超过0.5寸或反复提插", "局部皮肤破损、感染或掌骨骨折未愈者禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["TE4", "阳池", "yang chi", 4, "在腕后区，腕背侧远端横纹上，指伸肌腱的尺侧缘凹陷中；伏掌，于腕背横纹中点稍偏尺侧取穴", "直刺0.3～0.5寸；可灸", "通调三焦、舒筋活络、清热利湿", "腕痛、腕关节扭伤、手指拘挛；目赤肿痛、耳鸣耳聋、咽喉肿痛；消渴、疟疾", ["原穴"], "伏掌，避开指伸肌腱于凹陷处直刺，行捻转手法使局部酸胀；艾条温和灸5～10分钟，不宜直接化脓灸", "穴下即为腕关节囊与伸肌腱，进针宜浅，忌深刺或大幅提插，以免进入关节腔或损伤肌腱", "腕部急性外伤、骨折、脱位或局部皮肤感染时禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["TE5", "外关", "wai guan", 5, "在前臂后区，腕背侧远端横纹上2寸，尺骨与桡骨间隙中点；伸臂俯掌，与掌侧内关相对处取穴", "直刺0.5～1寸；可灸", "解表清热、通经活络、聪耳利胁", "热病、感冒、头痛、目赤肿痛；耳鸣、耳聋、咽喉肿痛、瘰疬；胁肋痛、上肢痿痹不遂", ["络穴","八脉交会穴"], "伸臂俯掌直刺0.5～1寸，行提插捻转使酸胀向腕部或肘部放散；治胁肋痛、落枕可边行针边活动患部；艾条温和灸5～10分钟", "深层为前臂骨间膜与骨间背侧血管神经，不宜盲目深刺或强刺激，出现向手背放射的麻电感应退针调整", "局部皮肤感染、溃疡或前臂急性软组织损伤肿胀期禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["TE6", "支沟", "zhi gou", 6, "在前臂后区，腕背侧远端横纹上3寸，尺骨与桡骨间隙中点；于外关上1寸、两骨之间取穴", "直刺0.5～1寸；可灸", "清利三焦、通腑降逆、舒筋活络", "便秘、呕吐、胁肋痛；耳鸣、耳聋、暴喑、咽喉肿痛；肩臂酸痛、上肢不遂", ["五输穴·经"], "直刺0.5～1寸，行提插捻转泻法，治便秘常配天枢、上巨虚并留针20～30分钟；艾条温和灸5～10分钟", "穴下邻近骨间背侧神经与血管，进针时若出现向手背或指端放射的强烈麻电感，应立即停止手法并退针", "局部皮肤感染、溃疡者禁刺；孕妇便秘不宜在此穴行强刺激。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["TE7", "会宗", "hui zong", 7, "在前臂后区，腕背侧远端横纹上3寸，尺骨的桡侧缘；于支沟穴尺侧、尺骨边缘取穴", "直刺0.5～1寸；可灸", "通络止痛、聪耳安神、清利三焦", "耳鸣、耳聋；癫痫、上肢痹痛；前臂酸痛麻木", ["郄穴"], "直刺0.5～1寸，行捻转手法使酸胀向腕部或肘部放散；治耳疾常配外关、听会，艾条温和灸5～10分钟", "紧邻尺骨骨面，进针遇坚硬阻力时不可强行深入，避免刺伤骨膜；深部有骨间神经血管，忌反复捣刺", "局部皮肤感染、溃疡或前臂血肿者禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["TE8", "三阳络", "san yang luo", 8, "在前臂后区，腕背侧远端横纹上4寸，尺骨与桡骨间隙中点；于阳池与肘尖连线的上2/3与下1/3交点取穴", "直刺0.5～1寸；可灸", "通络开窍、利咽聪耳、清利三焦", "暴喑、失语、耳鸣、耳聋；齿痛、咽喉肿痛；上肢痹痛、前臂麻木", null, "直刺0.5～1寸，得气后行平补平泻捻转法；治失语、暴喑常配哑门、通里，艾条温和灸5～10分钟", "深部为骨间膜与骨间背侧神经血管束，进针不宜过深或反复提插，以免损伤神经血管", "局部皮肤感染、溃疡者禁刺；前臂急性外伤肿胀期慎用。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["TE9", "四渎", "si du", 9, "在前臂后区，肘尖下5寸，尺骨与桡骨间隙中点；俯掌，于前臂背侧两骨之间取穴", "直刺0.5～1寸；可灸", "疏利三焦、聪耳利咽、通络止痛", "耳鸣、耳聋、暴喑、齿痛、咽喉肿痛；偏头痛；上肢痹痛、前臂酸痛", null, "伸臂俯掌直刺0.5～1寸，行提插捻转使酸胀向前臂上下放散；艾条温和灸5～10分钟", "深部有骨间背侧神经与骨间后血管，忌深刺与大幅提插；出现放射性麻电感应立即停止手法", "局部皮肤感染、溃疡者禁刺；长期服用抗凝药者慎用。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["TE10", "天井", "tian jing", 10, "在肘后区，肘尖上1寸凹陷中；屈肘90度，于尺骨鹰嘴窝正中、肘尖直上1寸处取穴", "直刺0.5～1寸；可灸", "清热化痰、疏利三焦、散结止痛", "偏头痛、胁肋痛、耳聋；瘰疬、瘿气、肘臂痛；癫痫", ["五输穴·合"], "屈肘取穴，直刺0.5～1寸，行提插捻转使酸胀向肘部及前臂放散；艾条温和灸5～10分钟，瘰疬、瘿气常用灸法", "穴下为鹰嘴窝与肱三头肌腱，进针宜浅，不宜刺入肘关节腔；深层有桡神经及中副动脉，忌深刺捣刺", "肘关节急性炎症、积液或局部皮肤感染者禁刺；关节置换术后局部慎刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],

  ["TE11", "清冷渊", "qing leng yuan", 11, "在臂后区，肘尖与肩峰角连线上，肘尖上2寸；屈肘，于天井上1寸处取穴", "直刺0.8～1寸；可灸", "清热泻火、疏利三焦、通络止痛", "头痛、目痛、目黄；肩臂痛不能举、上肢痿痹；胁痛", null, "屈肘，沿肱骨后面直刺0.8～1寸，行捻转手法使酸胀向肩部或前臂放散；艾条温和灸5～10分钟", "深层为肱三头肌与桡神经沟附近，进针不宜过深或反复提插，出现向手背放射的麻电感应退针", "局部皮肤感染、溃疡者禁刺；上臂急性外伤肿胀期慎用。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["TE12", "消泺", "xiao luo", 12, "在臂后区，肘尖与肩峰角连线上，肘尖上5寸；于清冷渊上3寸、三角肌后下缘处取穴", "直刺0.8～1.2寸；可灸", "清热化痰、通络止痛、安神定志", "头痛、项强、齿痛；肩臂痛、上肢麻木不遂；癫痫", null, "正坐垂臂，直刺0.8～1.2寸，行提插捻转使酸胀向肩部或肘部放散；艾条温和灸5～10分钟", "穴区深层为肱骨桡神经沟与肱深血管，不宜盲目深刺或强刺激，以免损伤桡神经", "局部皮肤感染、溃疡者禁刺；上臂急性损伤或血肿时慎刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["TE13", "臑会", "nao hui", 13, "在臂后区，肩峰角下3寸，三角肌的后下缘；正坐垂臂，于肩髎与肘尖连线上取穴", "直刺0.8～1.2寸；可灸", "化痰散结、通络止痛、清利三焦", "瘰疬、瘿气；肩臂痛、上肢痿痹不遂；肩关节周围疼痛", null, "正坐垂臂，向肱骨方向直刺0.8～1.2寸，行提插捻转使酸胀向肩部放散；艾条温和灸5～10分钟", "深层邻近桡神经与肱深血管，进针角度宜与肱骨长轴平行，不宜向内侧深刺，以免伤及神经血管", "局部皮肤感染、溃疡或上臂血肿者禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["TE14", "肩髎", "jian liao", 14, "在三角肌区，肩峰角与肱骨大结节两骨间凹陷中；上臂外展平举时，于肩峰后下方出现的凹陷处取穴", "直刺0.8～1.2寸；可灸", "祛风除湿、舒筋利节、通络止痛", "肩臂痛、肩关节活动不利、上肢痿痹不遂；风疹、肩部麻木", null, "上臂外展或垂臂，向肩关节方向直刺0.8～1.2寸，行提插捻转使酸胀向肩部及上臂放散；可配温针灸或电针", "深部有旋肱后动脉与腋神经，肩关节囊亦在穴下，忌向内下方深刺或反复捣刺，以免损伤神经血管或进入关节腔", "肩关节急性化脓性炎症、脱位、骨折或局部皮肤感染者禁刺；肩部急性损伤期慎用强刺激。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["TE15", "天髎", "tian liao", 15, "在肩胛区，肩胛骨上角骨际凹陷中；正坐垂臂，于曲垣与肩井连线中点、肩胛骨上角处取穴", "直刺0.5～0.8寸；可灸", "祛风除湿、舒筋通络、清热解表", "肩臂酸痛、颈项强痛、肩胛部疼痛；热病、胸中烦满", ["交会穴"], "正坐垂臂，直刺或略向下斜刺0.5～0.8寸，行捻转手法使酸胀向肩胛部放散；艾条温和灸5～10分钟", "穴下肌层较薄，其深部即为胸膜顶与肺尖，严禁向内下方深刺或大幅度提插，以免造成气胸；体形消瘦者尤须浅刺", "肺气肿、肺大疱等肺病患者禁深刺；局部皮肤感染或肩胛骨骨折未愈者禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["TE16", "天牖", "tian you", 16, "在颈部，横平下颌角，胸锁乳突肌的后缘凹陷中；正坐，于乳突后下方、发际下取穴", "直刺0.5～0.8寸；可灸", "清头明目、通利耳窍、消痰散结", "头痛、头晕、目痛、耳鸣耳聋；项强、咽喉肿痛；瘰疬", null, "正坐或俯伏，于胸锁乳突肌后缘直刺或略向下斜刺0.5～0.8寸，行小幅捻转，不宜深刺及大幅提插；艾条温和灸5～10分钟", "颈侧深层有椎动脉、颈神经根与脊髓，深刺或向内上方斜刺风险极高，必须严格掌握角度与深度；穴下还有副神经与枕小神经，刺激量宜轻", "颈椎不稳、椎动脉供血不足者禁刺或慎刺；局部皮肤感染、颈部淋巴结化脓时禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["TE17", "翳风", "yi feng", 17, "在颈部，耳垂后方，乳突下端前方凹陷中；正坐或侧伏，耳垂微向下折，于耳垂根后方凹陷取穴", "直刺0.5～1寸；可灸", "聪耳通窍、疏风清热、散结通络", "耳鸣、耳聋、聤耳等耳疾；口眼歪斜、牙关紧闭、面痛、颊肿；瘰疬", ["交会穴"], "正坐或侧伏，于耳垂根后方凹陷向鼻尖方向直刺0.5～1寸，行小幅捻转使耳内或面颊部有酸胀感；艾条温和灸5～10分钟", "深部为面神经干自茎乳孔穿出处，其内侧还有颈内动静脉与迷走神经，进针方向与深度必须严格控制，忌向内上深刺或反复提插，以免引起面肌痉挛或损伤血管", "急性化脓性中耳炎、乳突炎急性期及局部皮肤感染者禁刺；腮腺肿大明显者慎用。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["TE18", "瘈脉", "chi mai", 18, "在头部，乳突中央；于翳风与角孙沿耳轮弧形连线的上2/3与下1/3交点处取穴", "平刺0.3～0.5寸，或三棱针点刺出血；可灸", "息风止痉、活络通窍、清热镇惊", "头痛、耳鸣、耳聋；小儿惊风、癫痫；呕吐、泄泻", null, "沿皮平刺0.3～0.5寸，行轻微捻转；治小儿惊风可用三棱针点刺出血，须严格消毒；艾条温和灸3～5分钟，小儿慎用", "耳后皮肤薄、血管丰富，点刺放血后应压迫止血；婴幼儿耳后组织娇嫩，刺激量宜轻，防止出血与感染", "局部皮肤破损、感染或出血性疾病者禁刺；婴幼儿慎用点刺放血。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["TE19", "颅息", "lu xi", 19, "在头部，于翳风与角孙沿耳轮弧形连线的上1/3与下2/3交点处；正坐或侧伏，于耳后发际内取穴", "平刺0.3～0.5寸；可灸", "熄风解痉、活络通窍、清热镇惊", "头痛、耳鸣、耳聋；小儿惊风、癫痫；身热、胁痛", null, "沿皮平刺0.3～0.5寸，行轻微捻转，以局部酸胀为度；艾条温和灸3～5分钟，勿用大炷直接灸", "穴在耳后靠近颅骨，进针宜平刺且不宜过深；《针灸甲乙经》有刺入过深出血致害的告诫，应严格消毒并避免伤及耳后血管", "局部皮肤感染、破损或凝血功能障碍者禁刺；小儿囟门未闭或颅骨缺损处禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["TE20", "角孙", "jiao sun", 20, "在头部，耳尖正对发际处；正坐或侧伏，折耳向前，于耳廓上端直上发际取穴", "平刺0.3～0.5寸；可灸", "清热明目、消肿散结、通络止痛", "目赤肿痛、目翳、齿痛、颊肿；偏头痛、项强；痄腮、耳部红肿", ["交会穴"], "沿皮向后平刺0.3～0.5寸，行轻微捻转；治痄腮、颊肿可用灯心草灸或艾条温和灸3～5分钟，施灸时避开头发", "头皮血管丰富，出针后应稍加按压以防出血；灯心草灸须由专业人员操作，避免灼伤皮肤与耳廓", "局部皮肤感染、破损或头皮血肿者禁刺；瘢痕体质者慎用灸法。请以教材、国家标准和专业医师指导为准。", null, null, true, null],

  ["TE21", "耳门", "er men", 21, "在耳区，耳屏上切迹与下颌骨髁突之间的凹陷中；微张口，于听宫直上0.5寸、耳屏上切迹前方凹陷取穴", "微张口，直刺0.5～1寸；可灸", "开窍聪耳、泻热活络、消肿止痛", "耳鸣、耳聋、聤耳等耳疾；齿痛、颈颔痛；下颌关节痛", null, "微张口，于耳屏上切迹前凹陷直刺0.5～1寸，行小幅捻转使耳内酸胀；艾炷灸1～3壮或艾条温和灸3～5分钟", "穴前有颞浅动静脉与耳颞神经，深部为下颌骨髁突与关节囊，进针须避开血管、不宜深刺，以免出血或进入关节腔", "中耳炎急性化脓期、耳部皮肤感染或下颌关节急性炎症时禁刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["TE22", "和髎", "he liao", 22, "在头部，鬓发后缘，颞浅动脉后缘；正坐，于耳门前上方、平耳郭根前取穴", "避开动脉，斜刺或平刺0.3～0.5寸；可灸", "祛风通络、聪耳开窍、消肿止痛", "头痛、耳鸣、牙关紧闭、口眼歪斜；颌肿、面痛", null, "正坐，先以指扪清颞浅动脉搏动，于其后方沿皮斜刺或平刺0.3～0.5寸，行轻微捻转；艾条温和灸3～5分钟", "穴下即为颞浅动脉与耳颞神经，进针必须避开血管，出针后按压片刻以防出血；面部刺激宜轻，避免损伤面神经分支", "局部皮肤感染、颞浅动脉炎或血管瘤者禁刺；瘢痕体质者慎用。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["TE23", "丝竹空", "si zhu kong", 23, "在面部，眉梢凹陷中；正坐或仰卧，于眉毛外端与眶上缘之间的凹陷处取穴", "平刺0.3～0.5寸；不灸（古有禁灸之说）", "疏风清热、清头明目、镇惊止痛", "目赤肿痛、眼睑瞤动、目视不明；偏头痛、齿痛；癫痫", null, "沿皮向后平刺0.3～0.5寸，行轻微捻转，以局部酸胀为度；出针后按压针孔片刻，本穴一般不施灸", "位于眼周眉梢处，组织菲薄，进针须沿皮平刺并固定眼球方向，严禁向眶内深刺或大幅提插，以免伤及眼球、眼肌与眶内血管；局部易出血，起针后应充分按压", "眼周感染、急性结膜炎、青光眼急性发作期及局部皮肤破损者禁刺；本穴禁灸。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  /* ---- 足少阳胆经（44 穴） ---- */
  ["GB1", "瞳子髎", "tong zi liao", 1, "在面部，目外眦外侧约0.5寸的凹陷中；正坐或仰卧位，闭目取穴", "向后平刺0.3～0.5寸，或点刺出血；可灸（艾条温和灸，慎用直接灸）", "疏风散热、清肝明目、通络止痛", "目赤肿痛、迎风流泪、目翳、眼睑瞤动；头痛、面痛", ["交会穴"], "沿皮向后平刺，进针宜缓，不作大幅捻转提插；出针后按压针孔片刻以防局部瘀血；灸法宜温灸，时间宜短", "位于眼周，深刺易伤及眼球与眼周血管；出针后需充分按压止血，防止眼周血肿", "眼周穴位不宜深刺与大幅提插；局部皮肤感染、破损者禁刺；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["GB2", "听会", "ting hui", 2, "在面部，耳屏间切迹与下颌骨髁突之间的凹陷中；张口取穴，闭口进针", "直刺0.5～0.8寸，或微向后斜刺；可灸（艾条温和灸）", "聪耳开窍、疏风通络", "耳鸣、耳聋、聤耳；面痛、齿痛、口眼歪斜", ["交会穴"], "张口取穴定位后闭口进针，得气后行小幅捻转，使耳内或面颊有酸胀感；不宜反复大幅提插", "深部邻近颞浅动脉与面神经分支，进针不可过深、不可大幅捣刺，以免损伤血管神经", "耳部急性感染、局部皮肤破损者慎用或禁刺；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["GB3", "上关", "shang guan", 3, "在头部，颧弓上缘中央凹陷中，约当目外眦与耳尖连线的中点；正坐或仰卧取穴", "直刺0.3～0.5寸，或平刺0.5～0.8寸；可灸（艾条温和灸，不宜瘢痕灸）", "聪耳开窍、疏风清热、通络止痛", "耳鸣、耳聋、聤耳；偏头痛、齿痛、面痛、口眼歪斜", ["交会穴"], "沿颧弓上缘缓慢进针，得气后小幅捻转；因深处为颞肌与脑膜中动脉投影区，不宜深刺", "深层邻近脑膜中动脉与颞肌，严禁深刺与大幅提插，以免引起出血", "局部皮肤感染、破损者禁刺；婴幼儿囟门未闭者慎用；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["GB4", "颔厌", "han yan", 4, "在头部，从头维至曲鬓的弧形连线（鬓发前缘）上1/4与下3/4交点处；正坐或仰卧取穴", "向后平刺0.5～0.8寸；可灸（艾条温和灸）", "疏风清热、通络止痛", "偏头痛、眩晕、目外眦痛；耳鸣、齿痛、癫痫", ["交会穴"], "沿头皮向后平刺，得气后行小幅快速捻转；不宜向前下方深刺", "位于颞部，深层有颞浅动脉分支，出针后按压针孔以防出血与血肿", "头皮局部感染、破损者禁刺；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["GB5", "悬颅", "xuan lu", 5, "在头部，从头维至曲鬓的弧形连线上，中点处；正坐或仰卧取穴", "向后平刺0.5～0.8寸；可灸（艾条温和灸）", "疏风清热、通络止痛", "偏头痛、目外眦痛、齿痛；面肿、鼻鼽", ["交会穴"], "沿皮向后平刺，捻转幅度宜小，使局部有胀感即可；避免反复提插", "颞部血管较丰富，进针与出针均应避开可见血管，出针后充分按压", "头皮感染、破损者禁刺；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["GB6", "悬厘", "xuan li", 6, "在头部，从头维至曲鬓的弧形连线上，下1/4与上3/4交点处；正坐或仰卧取穴", "向后平刺0.5～0.8寸；可灸（艾条温和灸）", "疏风清热、消肿止痛", "偏头痛、目外眦痛、耳鸣；面肿、齿痛", ["交会穴"], "沿头皮向后平刺，小幅捻转至局部胀感；进针前先以指按压分开血管", "邻近颞浅动脉，操作宜轻缓，防止局部出血与血肿", "局部皮肤感染、破损者禁刺；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["GB7", "曲鬓", "qu bin", 7, "在头部，耳前鬓角发际后缘与耳尖水平线的交点处；正坐或仰卧取穴", "向后平刺0.5～0.8寸；可灸（艾条温和灸）", "疏风清热、通络止痛、开关利窍", "偏头痛、目赤肿痛、齿痛；牙关紧闭、暴喑、颈项强痛", ["交会穴"], "向后沿皮平刺，得气后小幅捻转；治疗牙关紧闭可配合局部按摩", "深层邻近颞浅动脉与颞肌，禁深刺及大幅提插，出针后按压止血", "局部感染、破损者禁刺；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["GB8", "率谷", "shuai gu", 8, "在头部，耳尖直上入发际1.5寸，角孙直上方；正坐或侧伏取穴", "平刺0.5～0.8寸，可向后方透刺；可灸（艾条温和灸）", "平肝息风、清热止痛、醒脑开窍", "偏头痛、眩晕、小儿急慢惊风；目痛、呕吐", ["交会穴"], "沿皮向后或向下平刺，得气后快速小幅捻转；小儿惊风多用浅刺疾出", "位于颞顶部，婴幼儿囟门未闭者不宜针刺；出针后按压针孔", "局部皮肤感染、破损者禁刺；婴幼儿囟门未闭处禁刺；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["GB9", "天冲", "tian chong", 9, "在头部，耳根后缘直上入发际2寸，率谷后约0.5寸；正坐或侧伏取穴", "向后平刺0.5～0.8寸；可灸（艾条温和灸）", "疏风清热、宁心安神", "头痛、眩晕、耳鸣；心悸、癫痫、齿龈肿痛", ["交会穴"], "沿头皮向后平刺，小幅捻转，局部胀感为度；不作大幅提插", "邻近耳后血管与枕小神经，操作宜轻，出针后按压以防血肿", "局部感染、破损者禁刺；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["GB10", "浮白", "fu bai", 10, "在头部，耳后乳突后上方，天冲与完骨连线的上1/3与下2/3交点处；正坐或侧伏取穴", "向后平刺0.5～0.8寸；可灸（艾条温和灸）", "疏风清热、理气散结、聪耳", "头痛、颈项强痛、耳鸣、耳聋；瘿气、齿痛", ["交会穴"], "沿皮向后平刺，得气后小幅捻转；局部有酸胀感即止，不宜追求强针感", "深层邻近耳后动脉与枕小神经，不可深刺，防出血及神经刺激症状", "局部皮肤感染、破损者禁刺；请以教材、国家标准和专业医师指导为准。", null, null, true, null],

  ["GB11", "头窍阴", "tou qiao yin", 11, "在头部，耳后乳突后上方，天冲与完骨连线的下1/3与上2/3交点处；正坐或侧伏取穴", "向后平刺0.5～0.8寸；可灸（艾条温和灸）", "聪耳开窍、疏风清热、平肝", "耳鸣、耳聋、头痛、眩晕；颈项强痛、瘿气", ["交会穴"], "沿皮平刺，进针缓慢，得气后小幅捻转；耳部症状可配合听会、翳风同用", "邻近耳后血管神经与乳突，避免深刺及向内下方斜刺", "耳部急性炎症、局部破损者禁刺；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["GB12", "完骨", "wan gu", 12, "在头部，耳后乳突的后下方凹陷中；正坐或侧伏取穴", "直刺或向下斜刺0.5～0.8寸；可灸（艾条温和灸）", "宁心安神、疏风清热、通络止痛", "头痛、颈项强痛、失眠、癫痫；耳鸣、齿痛、面痛", ["交会穴"], "紧贴乳突后缘缓慢进针，得气后小幅捻转；不宜向前内侧深刺", "深部邻近椎动脉与枕大神经，严禁深刺及向内上方斜刺，以免损伤血管神经", "局部感染、破损者禁刺；有颈椎不稳或椎动脉供血不足者慎用；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["GB13", "本神", "ben shen", 13, "在头部，前发际正中直上0.5寸，再旁开3寸处；正坐或仰卧取穴", "向后平刺0.5～0.8寸；可灸（艾条温和灸）", "宁心安神、平肝息风、醒脑开窍", "头痛、眩晕、失眠、癫痫、小儿惊风；目赤肿痛、鼻塞", ["交会穴"], "沿头皮向后平刺，得气后小幅快速捻转；神志病症常配神庭、四神聪", "位于前额发际处，婴幼儿囟门未闭者禁刺；出针后按压针孔", "局部皮肤感染、破损者禁刺；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["GB14", "阳白", "yang bai", 14, "在头部，瞳孔直上，眉上1寸处；正坐或仰卧，闭目取穴", "沿皮向下平刺0.5～0.8寸，可向鱼腰方向透刺；可灸（艾条温和灸，慎用直接灸）", "疏风明目、清头止痛、通络牵正", "前额痛、眼睑下垂、眼睑瞤动、目赤肿痛、视物模糊；面瘫、口眼歪斜", ["交会穴"], "针尖向下沿皮透向鱼腰，进针缓慢，不作大幅提插；眼睑下垂可配合温和灸以助升提", "位于眶上缘上方，禁向下深刺入眶内，以免损伤眼球与眶上神经血管", "眼周急性炎症、局部破损者禁刺；针刺后避免揉压局部；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
