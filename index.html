};

/* ===== 页面：答题 ===== */
PAGES['quiz/run'] = function(r){
  var start = r.query.start || '';
  if (start === 'quick10'){
    QUIZ.ids = quizBuild({ limit:10 });
    QUIZ.i = 0; QUIZ.answers = {}; QUIZ.seed = Date.now() % 99991; QUIZ.on = true;
    quizSave();
  } else if (r.query.type || r.query.tag || r.query.diff || r.query.ids){
    QUIZ.ids = r.query.ids ? String(r.query.ids).split(',') : quizBuild({
      types: r.query.type ? [r.query.type] : null,
      tag: r.query.tag || '',
      diff: r.query.diff || ''
    });
    QUIZ.i = 0; QUIZ.answers = {}; QUIZ.seed = Date.now() % 99991; QUIZ.on = true;
    quizSave();
  } else if (!QUIZ.on){
    if (!quizRestore()){
      QUIZ.ids = quizBuild({});
      QUIZ.i = 0; QUIZ.answers = {}; QUIZ.seed = Date.now() % 99991; QUIZ.on = true;
      quizSave();
    }
  }
  if (!QUIZ.ids.length){
    return pageHead('没有可用的题目', '当前筛选条件下没有题目', '#/quiz') +
      '<section class="card"><div class="empty-box">换个题型或去掉标签筛选再试。' +
      '<div class="row" style="margin-top:10px"><a class="btn primary" href="#/quiz">返回习题首页</a></div></div></section>';
  }
  if (QUIZ.i >= QUIZ.ids.length) return quizResultPage(r);

  var q = getQuestion(QUIZ.ids[QUIZ.i]);
  if (!q){
    QUIZ.i++;
    return PAGES['quiz/run'](r);
  }
  var order = orderOptions(q, QUIZ.seed + QUIZ.i);
  var st = QUIZ.answers[q.id] || {};
  var marked = Prefs.has('quizBookmarks', q.id);
  var left = q.type === 'match' ? matchLeft(q) : [];

  var body = '';
  if (q.type === 'single' || q.type === 'multi' || q.type === 'judge'){
    body = order.map(function(orig, disp){
      var key = LETTERS[disp];
      var isAns = (q.type === 'judge')
        ? ((q.answer === 'T' ? 0 : 1) === orig)
        : (typeof q.answer === 'string' ? LETTERS.indexOf(q.answer) === orig : (q.answer || []).indexOf(LETTERS[orig]) > -1);
      var picked = q.type === 'multi'
        ? (st.pick || []).indexOf(key) > -1
        : st.pick === key;
      var cls = 'opt' + (picked ? ' on' : '');
      if (st.judged){
        if (isAns) cls = 'opt ok';
        else if (picked) cls = 'opt bad';
        else cls = 'opt';
      }
      return '<button class="' + cls + '" type="button" data-opt="' + key + '"' + (st.judged ? ' disabled' : '') + '>' +
        '<span class="key">' + key + '</span><span>' + esc(q.options[orig]) + '</span></button>';
    }).join('');
  } else if (q.type === 'blank'){
    var nBlank = (q.answer || []).length;
    body = renderStem(q) +
      '<div class="card-note" style="margin-top:6px">共 ' + nBlank + ' 空；答案顺序与题干一致。</div>';
  } else if (q.type === 'match'){
    body = '<div class="card-note" style="margin-bottom:8px">右列候选：' +
        q.options.map(function(o, i){ return esc(LETTERS[i] + '．' + o); }).join('　') + '</div>' +
      left.map(function(txt, i){
        var pick = (st.pick || [])[i];
        var right = (q.answer || [])[i];
        var cls = 'match-row';
        if (st.judged) cls += (String(pick) === String(right)) ? ' ok' : ' bad';
        return '<div class="' + cls + '">' +
          '<span class="ml">' + esc(txt) + '</span>' +
          '<select data-match="' + i + '"' + (st.judged ? ' disabled' : '') + ' aria-label="' + esc(txt) + ' 的配对">' +
            '<option value="">选择</option>' +
            q.options.map(function(o, j){
              return '<option value="' + j + '"' + (String(pick) === String(j) ? ' selected' : '') + '>' + esc(LETTERS[j] + '．' + o) + '</option>';
            }).join('') +
          '</select>' +
          (st.judged ? '<span class="chip ' + (String(pick) === String(right) ? '' : 'warn') + '">' + esc(LETTERS[right]) + '</span>' : '') +
        '</div>';
      }).join('');
  }

  var verdict = '';
  if (st.judged){
    verdict = '<div class="verdict ' + (st.right ? 'ok' : 'bad') + '">' +
      '<b>' + (st.right ? '回答正确' : '回答错误') + '</b>' +
      '正确答案：' + esc(answerText(q)) + '<br>' +
      '解析：' + esc(q.explanation) + '</div>';
  }

  return '' +
  pageHead('第 ' + (QUIZ.i + 1) + ' / ' + QUIZ.ids.length + ' 题', esc(QTYPE_LABEL[q.type] || q.type) + ' · 难度 ' +
    (q.difficulty === 1 ? '易' : q.difficulty === 2 ? '中' : '难') + ' · ' + esc((q.tags || []).join(' / ')), '#/quiz') +

  '<section class="card">' +
    '<div class="quiz-head">' +
      '<div class="progress-line"><i style="width:' + Math.round(QUIZ.i / QUIZ.ids.length * 100) + '%"></i></div>' +
      '<button class="btn sm" type="button" id="qMark">' + (marked ? '★ 已收藏' : '☆ 收藏') + '</button>' +
    '</div>' +
    '<div class="q-meta">' +
      '<span class="chip">' + esc(QTYPE_LABEL[q.type] || q.type) + '</span>' +
      '<span class="chip">' + esc(q.id) + '</span>' +
      (st.judged ? '<span class="chip ' + (st.right ? 'acc' : 'warn') + '">' + (st.right ? '已答对' : '已答错') + '</span>' : '') +
    '</div>' +
    '<div class="q-stem">' + (q.type === 'blank' ? '' : esc(q.stem)) + '</div>' +
    '<div id="qBody">' + body + '</div>' +
    verdict +
    '<div class="quiz-foot">' +
      (st.judged
        ? '<button class="btn primary" type="button" id="qNext">' + (QUIZ.i + 1 >= QUIZ.ids.length ? '看成绩' : '下一题') + '</button>'
        : '<button class="btn primary" type="button" id="qSubmit">提交答案</button>') +
      '<button class="btn" type="button" id="qSkip">跳过</button>' +
      '<a class="btn" href="#/quiz">退出</a>' +
    '</div>' +
  '</section>' +

  '<section class="card">' +
    '<div class="card-note">' + DATA_SCOPE_NOTE + '题目为练习用途，不是考试真题。' + SAFE_NOTE + '</div>' +
  '</section>';
};

/* ===== 页面：成绩 ===== */
function quizResultPage(r){
  var ids = QUIZ.ids;
  var right = 0, wrongList = [];
  ids.forEach(function(id){
    var st = QUIZ.answers[id];
    var q = getQuestion(id);
    if (st && st.judged && st.right) right++;
    else if (st && st.judged) wrongList.push(q);
  else wrongList.push(q);
  });
  var done = ids.filter(function(id){ return QUIZ.answers[id] && QUIZ.answers[id].judged; }).length;
  var rate = done ? Math.round(right / done * 100) : 0;
  var p = qProgress();

  return '' +
  pageHead('本轮成绩', done + ' / ' + ids.length + ' 题已作答', '#/quiz') +
  '<section class="card">' +
    '<div class="ring">' +
      '<div><div class="score-big">' + rate + '%</div><div class="card-note">正确率</div></div>' +
      '<div style="flex:1 1 auto"><div class="row">' +
        '<span class="stat"><b>' + right + '</b><span>答对</span></span>' +
        '<span class="stat"><b>' + (done - right) + '</b><span>答错</span></span>' +
        '<span class="stat"><b>' + (ids.length - done) + '</b><span>未答</span></span>' +
      '</div></div>' +
    '</div>' +
    '<div class="row" style="margin-top:12px">' +
      '<button class="btn primary" type="button" id="qAgain">再练一轮</button>' +
      (wrongList.length ? '<a class="btn" href="#/quiz/run?ids=' + encodeURIComponent(wrongList.map(function(q){ return q.id; }).join(',')) + '">只练本轮错题（' + wrongList.length + '）</a>' : '') +
      '<a class="btn" href="#/wrong">错题本</a>' +
    '</div>' +
    '<div class="card-note" style="margin-top:8px">累计：作答 ' + p.quizDone + ' 次，正确 ' + p.quizRight + ' 次。</div>' +
  '</section>' +
  (wrongList.length
    ? '<section class="card"><div class="card-t"><h3>本轮错题 / 未答</h3></div>' +
        wrongList.map(function(q){
          return '<div class="q-list-item">' +
            '<div class="qt"><b>' + esc(q.id) + '</b> ' + esc(String(q.stem).slice(0, 40)) +
              '<span>' + esc(answerText(q)) + '</span></div>' +
            '<a class="btn sm" href="#/quiz/run?ids=' + encodeURIComponent(q.id) + '">重做</a>' +
          '</div>';
        }).join('') + '</section>'
    : '<section class="card"><div class="empty-box">本轮全部答对，继续保持。</div></section>') +
  '<section class="card"><div class="card-note">成绩只保存在本机，可作为复习进度参考，不代表考试水平。' + SAFE_NOTE + '</div></section>';
}

/* ===== 页面：错题本 ===== */
PAGES.wrong = function(r){
  var w = wrongBook();
  var ids = Object.keys(w).sort(function(a, b){
    return String((w[b] || {}).at || '').localeCompare(String((w[a] || {}).at || ''));
  });
  var rows = ids.map(function(id){
    var q = getQuestion(id);
    var rec = w[id] || {};
    if (!q) return '';
    return '<div class="q-list-item">' +
      '<div class="qt"><b>' + esc(q.id) + '</b> ' + esc(String(q.stem).slice(0, 44)) +
        '<span>' + esc(QTYPE_LABEL[q.type] || q.type) + ' · 错 ' + (rec.times || 1) + ' 次 · 正确答案：' + esc(answerText(q)) + '</span></div>' +
      '<a class="btn sm" href="#/quiz/run?ids=' + encodeURIComponent(q.id) + '">重做</a>' +
      '<button class="btn sm" type="button" data-unwrong="' + esc(q.id) + '">移除</button>' +
    '</div>';
  }).join('');

  return '' +
  pageHead('错题本', '共 ' + ids.length + ' 题', '#/quiz') +
  '<section class="card">' +
    '<div class="row">' +
      (ids.length ? '<a class="btn primary" href="#/quiz/run?ids=' + encodeURIComponent(ids.join(',')) + '">全部重做（' + ids.length + '）</a>' : '') +
      (ids.length ? '<button class="btn" type="button" id="wrongClear">清空错题本</button>' : '') +
      '<a class="btn" href="#/quiz">回到习题</a>' +
    '</div>' +
  '</section>' +
  '<section class="card">' + (rows || '<div class="empty-box">错题本是空的。答错的题会自动收集到这里。</div>') + '</section>' +
  '<section class="card"><div class="card-note">错题记录在你的浏览器本地，导出备份在“设置与数据”。' + SAFE_NOTE + '</div></section>';
};

/* ===== 页面：收藏题 ===== */
PAGES.bookmarks = function(r){
  var ids = bookmarkIds();
  var rows = ids.map(function(id){
    var q = getQuestion(id);
    if (!q) return '';
    return '<div class="q-list-item">' +
      '<div class="qt"><b>' + esc(q.id) + '</b> ' + esc(String(q.stem).slice(0, 44)) +
        '<span>' + esc(QTYPE_LABEL[q.type] || q.type) + ' · ' + esc((q.tags || []).join(' / ')) + '</span></div>' +
      '<a class="btn sm" href="#/quiz/run?ids=' + encodeURIComponent(q.id) + '">练习</a>' +
      '<button class="btn sm" type="button" data-unmark="' + esc(q.id) + '">取消收藏</button>' +
    '</div>';
  }).join('');
  return '' +
  pageHead('收藏题', '共 ' + ids.length + ' 题', '#/quiz') +
  '<section class="card">' +
    '<div class="row">' +
      (ids.length ? '<a class="btn primary" href="#/quiz/run?ids=' + encodeURIComponent(ids.join(',')) + '">练习收藏题</a>' : '') +
      '<a class="btn" href="#/quiz">回到习题</a>' +
    '</div>' +
  '</section>' +
  '<section class="card">' + (rows || '<div class="empty-box">还没有收藏题目。答题时点“☆ 收藏”即可加入。</div>') + '</section>';
};

/* ===== 习题交互 ===== */
(function(){
  var curPick = null;      /* 单选/多选当前选择 */
  var curBlanks = [];
  var curMatch = [];

  function nowQ(){
    if (!QUIZ.on || QUIZ.i >= QUIZ.ids.length) return null;
    return getQuestion(QUIZ.ids[QUIZ.i]);
  }
  function submit(){
    var q = nowQ();
    if (!q) return;
    var st = QUIZ.answers[q.id] || {};
    if (st.judged) return;
    var pick;
    if (q.type === 'single' || q.type === 'judge') pick = curPick;
    else if (q.type === 'multi') pick = (curPick || []).slice;
    else if (q.type === 'blank'){
      pick = [];
      var inputs = document.querySelectorAll('#qBody .blank-in');
      for (var i = 0; i < inputs.length; i++) pick.push(inputs[i].value);
      if (!pick.length || pick.every(function(v){ return !String(v).trim(); })){
        toast('先填空再提交');
        return;
      }
    } else if (q.type === 'match'){
      pick = [];
      var sels = document.querySelectorAll('#qBody select[data-match]');
      for (var m = 0; m < sels.length; m++) pick.push(sels[m].value);
      if (!pick.length || pick.some(function(v){ return v === '' || v == null; })){
        toast('每一项都要选一个配对');
        return;
      }
    } else pick = null;

    if ((q.type === 'single' || q.type === 'judge') && !pick){ toast('先选一个答案'); return; }
    if (q.type === 'multi' && (!pick || !pick.length)){ toast('至少选一个'); return; }

    var right = scoreAnswer(q, pick);
    st.pick = pick; st.judged = true; st.right = right;
    QUIZ.answers[q.id] = st;
    quizSave();
    qSetProgress({
      quizDone: qProgress().quizDone + 1,
      quizRight: qProgress().quizRight + (right ? 1 : 0)
    });
    if (!right) markWrong(q.id, pick); else clearWrong(q.id);
    render();
    var v = document.querySelector('.verdict');
    if (v && v.scrollIntoView) v.scrollIntoView({ block:'center', behavior:'smooth' });
  }
  function next(){
    QUIZ.i++;
    if (QUIZ.i >= QUIZ.ids.length){
      qSetProgress({ quizSessions: qProgress().quizSessions + 1 });
      QUIZ.on = false;
    }
    curPick = null; curBlanks = []; curMatch = [];
    quizSave();
    window.scrollTo(0, 0);
    var m = document.getElementById('appMain');
    if (m) m.scrollTop = 0;
    render();
  }

  document.addEventListener('click', function(e){
    var t = e.target;
    if (!t || !t.closest) return;

    var opt = t.closest('[data-opt]');
    if (opt && document.getElementById('qBody')){
      var q = nowQ();
      if (!q) return;
      var st = QUIZ.answers[q.id] || {};
      if (st.judged) return;
      var key = opt.getAttribute('data-opt');
      if (q.type === 'multi'){
        curPick = curPick || [];
        var i = curPick.indexOf(key);
        if (i > -1) curPick.splice(i, 1); else curPick.push(key);
        var all = document.querySelectorAll('#qBody .opt');
        for (var j = 0; j < all.length; j++){
          all[j].classList.toggle('on', curPick.indexOf(all[j].getAttribute('data-opt')) > -1);
        }
      } else {
        curPick = key;
        var all2 = document.querySelectorAll('#qBody .opt');
        for (var k = 0; k < all2.length; k++){
          all2[k].classList.toggle('on', all2[k].getAttribute('data-opt') === key);
        }
        /* 单选与判断：点完稍等一拍自动提交，手感更顺 */
        setTimeout(function(){ if (nowQ() && !(QUIZ.answers[q.id] || {}).judged) submit(); }, 180);
      }
      return;
    }

    if (t.id === 'qSubmit'){ submit(); return; }
    if (t.id === 'qNext'){ next(); return; }
    if (t.id === 'qSkip'){ next(); return; }
    if (t.id === 'qMark'){
      var q2 = nowQ();
      if (!q2) return;
      var added = Prefs.toggle('quizBookmarks', q2.id);
      t.textContent = added ? '★ 已收藏' : '☆ 收藏';
      toast(added ? '已收藏本题' : '已取消收藏');
      return;
    }
    if (t.id === 'qAgain'){
      QUIZ.ids = quizBuild({});
      QUIZ.i = 0; QUIZ.answers = {}; QUIZ.seed = Date.now() % 99991; QUIZ.on = true;
      quizSave();
      go('#/quiz/run');
      return;
    }
    if (t.id === 'quizStart'){
      QUIZ.ids = quizBuild({});
      QUIZ.i = 0; QUIZ.answers = {}; QUIZ.seed = Date.now() % 99991; QUIZ.on = true;
      quizSave();
      go('#/quiz/run');
      return;
    }
    var un = t.getAttribute && t.getAttribute('data-unwrong');
    if (un){ clearWrong(un); toast('已从错题本移除'); render(); return; }
    var um = t.getAttribute && t.getAttribute('data-unmark');
    if (um){ Prefs.remove('quizBookmarks', um); toast('已取消收藏'); render(); return; }
    if (t.id === 'wrongClear'){
      if (confirmBox('清空错题本？此操作不可撤销。')){
        Store.write('wrongQuestions', {});
        toast('错题本已清空');
        render();
      }
      return;
    }
  });

  document.addEventListener('change', function(e){
    var t = e.target;
    if (!t || !t.getAttribute) return;
    var mi = t.getAttribute('data-match');
    if (mi != null && mi !== ''){
      curMatch[+mi] = t.value;
    }
  });

  /* 进入答题页时初始化当前题的选择状态 */
  var prev = window.afterRender;
  window.afterRender = function(r){
    if (typeof prev === 'function') prev(r);
    if (r.page !== 'quiz/run') return;
    curPick = null; curBlanks = []; curMatch = [];
    var q = nowQ();
    if (!q) return;
    var st = QUIZ.answers[q.id] || {};
    if (q.type === 'multi') curPick = (st.pick || []).slice;
    else if (st.pick) curPick = st.pick;
    if (q.type === 'match') curMatch = (st.pick || []).slice;
  };
})();
</script>

<script>
/* =====================================================================
   页面：病症配穴· #/diseases、#/disease/{id}
   ===================================================================== */

/* 穴位小胶囊：能点到穴位详情 */
function ptChip(code, main){
  var a = getAcupoint(code);
  if (!a) return '<span class="pt-chip">' + esc(code) + '<i>—</i></span>';
  return '<a class="pt-chip' + (main ? ' main' : '') + '" href="#/acupoint/' + encodeURIComponent(a.code) + '">' +
    esc(a.name) + '<i>' + esc(a.code) + '</i></a>';
}
function ptRow(list, main){
  if (!list || !list.length) return '<span class="card-note">' + PENDING + '</span>';
  return list.map(function(c){ return ptChip(c, main); }).join('');
}
function diseaseCard(d){
  return '' +
  '<a class="disease-card" href="#/disease/' + encodeURIComponent(d.id) + '">' +
    '<div class="dc-head"><b>' + esc(d.name) + '</b>' +
      '<span class="chip">' + esc(d.category) + '</span>' +
      ((d.alias || []).length ? '<span class="card-note">' + esc(d.alias.join(' / ')) + '</span>' : '') +
    '</div>' +
    '<div class="dc-sub">' + esc(String(d.overview).slice(0, 62)) + (String(d.overview).length > 62 ? '…' : '') + '</div>' +
    '<div class="dc-foot">' +
      '<span class="chip acc">主穴 ' + d.mainPoints.length + '</span>' +
      '<span class="chip">配穴 ' + d.adjunctPoints.length + '</span>' +
      '<span class="chip">加减 ' + (d.patternAdd || []).length + ' 证型</span>' +
    '</div>' +
  '</a>';
}

/* 病症结果区与分类标签各自成函数：输入关键词时只换这两块的 innerHTML，
   输入框元素原地不动（重建输入框会打断中文输入法的合成）。 */
function diseaseListHtml(kw, cat){
  kw = kw || '';
  var list = DISEASES.filter(function(d){
    if (cat && d.category !== cat) return false;
    if (!kw) return true;
    var hay = [d.name, (d.alias || []).join(' '), d.overview, d.category, (d.tags || []).join(' '),
      d.mainPoints.join(' ')].join(' ');
    return hay.toLowerCase().indexOf(kw.toLowerCase()) > -1;
  });
  return '<div class="result-head"><h2>' + list.length + ' 个病症</h2>' +
      (cat ? '<span class="chip acc">' + esc(cat) + '</span>' : '') +
      (kw ? '<span class="chip">关键词：' + esc(kw) + '</span>' : '') +
    '</div>' +
    '<section>' + (list.length ? list.map(diseaseCard).join('') : '<div class="empty-box">没有匹配的病症。</div>') + '</section>';
}

function diseaseCatChipsHtml(kw, cat){
  var counts = {};
  DISEASES.forEach(function(d){ counts[d.category] = (counts[d.category] || 0) + 1; });
  return '<a class="f-chip' + (!cat ? ' on' : '') + '" href="#/diseases' + (kw ? '?kw=' + encodeURIComponent(kw) : '') + '">全部<small>' + DISEASES.length + '</small></a>' +
    DISEASE_CATEGORIES.map(function(c){
      return '<a class="f-chip' + (cat === c ? ' on' : '') + '" href="#/diseases?cat=' + encodeURIComponent(c) +
        (kw ? '&kw=' + encodeURIComponent(kw) : '') + '">' +
        esc(c) + '<small>' + counts[c] + '</small></a>';
    }).join('');
}

PAGES.diseases = function(r){
  var cat = r.query.cat || '';
  var kw = r.query.kw || '';

  return '' +
  pageHead('病症配穴', '共 ' + DISEASES.length + ' 个病症，' + DISEASE_CATEGORIES.length + ' 个分类') +
  '<section class="card">' +
    '<div class="search-bar">' +
      '<div class="search-input-wrap">' +
        '<span class="ic" aria-hidden="true">⌕</span>' +
        '<input id="disKw" class="inp search-input" type="search" autocomplete="off" placeholder="搜索病症、别名、症状" value="' + esc(kw) + '" aria-label="搜索病症">' +
      '</div>' +
      '<a class="btn" href="#/diseases">清空</a>' +
    '</div>' +
    '<div class="f-row" id="catChips">' + diseaseCatChipsHtml(kw, cat) + '</div>' +

/* 病症搜索：与检索页同一套规则 —— 输入期间绝不整页重绘，只换结果区。
   中文输入法合成期间连地址都不动（否则拼音会被强制上屏，无法选字）。 */
(function(){
  var timer = 0;
  var composing = false;

  /* 只改地址，不触发 hashchange（hashchange → render() → 输入框被销毁重建） */
  function syncHash(url){
    if (location.hash === url) return;
    try {
      if (window.history && history.replaceState) history.replaceState(null, '', url);
    } catch (err){
      /* file:// 下个别浏览器不允许写地址栏：放弃，功能不受影响 */
    }
  }
  function apply(kw){
    var cat = (parseHash().query.cat) || '';
    syncHash('#/diseases' + (kw ? '?kw=' + encodeURIComponent(kw) : (cat ? '?cat=' + encodeURIComponent(cat) : '')));
    var box = document.getElementById('diseaseList');
    if (box){
      box.innerHTML = diseaseListHtml(kw, cat);
      var chips = document.getElementById('catChips');
      if (chips) chips.innerHTML = diseaseCatChipsHtml(kw, cat);
      return;
    }
    if (typeof render === 'function') render();
  }

  document.addEventListener('compositionstart', function(e){
    if (!e.target || e.target.id !== 'disKw') return;
    composing = true;
    clearTimeout(timer);
  });
  document.addEventListener('compositionend', function(e){
    var t = e.target;
    if (!t || t.id !== 'disKw') return;
    composing = false;
    clearTimeout(timer);
    apply(t.value.trim());
  });
  document.addEventListener('input', function(e){
    var t = e.target;
    if (!t || t.id !== 'disKw') return;
    /* 浏览器自己报的 isComposing 最可信；compositionend 万一没送到也能自愈 */
    if (!e.isComposing && e.keyCode !== 229) composing = false;
    clearTimeout(timer);
    if (composing || e.isComposing || e.keyCode === 229) return;   /* 合成中什么都不做 */
    timer = setTimeout(function(){ apply(t.value.trim()); }, 200);
  });

  /* 输入不再整页重绘，只需在整页跳转后把输入框的值对齐地址 */
  var prevAfter = window.afterRender;
  window.afterRender = function(r){
    if (typeof prevAfter === 'function') prevAfter(r);
    if (r.page !== 'diseases' || composing) return;
    var el = document.getElementById('disKw');
    if (!el) return;
    var cur = (r.query && r.query.kw) || '';
    if (el.value !== cur) el.value = cur;
  };
})();
</script>

/* ===== 设置页交互：导出 / 导入 / 清空 ===== */
(function(){
  function exportPayload(){
    var payload = Store.snapshot();
    payload['zj:meta'] = {
      app: '针灸学习知识库',
      exportedAt: new Date().toISOString(),
      dataVersion: DATA_VERSION,
      counts: {
        acupoints: ACUPOINTS.length,
        meridians: MERIDIANS.length,
        diseases: DISEASES.length,
        questions: QUESTIONS.length,
        contra: CONTRA_ITEMS.length
      }
    };
    return payload;
  }
  function fileName(){
    var d = new Date();
    function p2(n){ return (n < 10 ? '0' : '') + n; }
    return 'zhenjiu-backup-' + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) +
      '-' + p2(d.getHours()) + p2(d.getMinutes()) + '.json';
  }
  function download(name, text){
    try {
      var blob = new Blob([text], { type:'application/json;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
      return true;
    } catch(e){ return false; }
  }

  /* 合并导入：数组取并集，对象按键合并，数字型进度累加 */
  function mergeImport(payload){
    var report = { lists:0, objects:0, progress:0, settings:0, skipped:0 };
    Object.keys(LS_KEYS).forEach(function(k){
      var key = LS_KEYS[k];
      if (!(key in payload)) { report.skipped++; return; }
      var incoming = payload[key];
      if (incoming == null) return;

      if (k === 'favorites' || k === 'quizBookmarks'){
        var cur = Prefs.list(k);
        (incoming || []).forEach(function(x){ if (cur.indexOf(x) === -1) cur.unift(x); });
        Store.write(k, cur);
        report.lists++;
      } else if (k === 'notes'){
        var n = Prefs.notes();
        Object.keys(incoming || {}).forEach(function(ref){
          var a = incoming[ref] || {};
          var b = n[ref];
          if (!b || String(a.updatedAt || '') > String(b.updatedAt || '')) n[ref] = a;
        });
        Store.write('notes', n);
        report.objects++;
      } else if (k === 'wrongQuestions'){
        var w = wrongBook();
        Object.keys(incoming || {}).forEach(function(id){
          var a = incoming[id] || {};
          var b = w[id];
          if (!b) w[id] = a;
          else { b.times = Math.max(b.times || 1, a.times || 1); b.at = String(a.at || '') > String(b.at || '') ? a.at : b.at; }
        });
        Store.write('wrongQuestions', w);
        report.objects++;
      } else if (k === 'progress'){
        var p = qProgress();
        ['quizDone','quizRight','quizSessions'].forEach(function(f){
          p[f] = (p[f] || 0) + (incoming[f] || 0)        });
        Store.write('progress', p);
        report.progress++;
      } else if (k === 'settings'){
        var s = Prefs.settings();
        Object.keys(incoming || {}).forEach(function(f){ s[f] = incing[f]; });
        Store.write('settings', s);
        applyTheme();
        report.settings++;
      } else if (k === 'version'){
        Store.write('version', incoming || DATA_VERSION);
        report.skipped++;
      }
    });
    return report;
  }

  document.addEventListener('click', function(e){
    var t = e.target;
    if (!t || !t.id) return;

    if (t.id === 'expBtn'){
      var text = JSON.stringify(exportPayload(), null, 1);
      var area = document.getElementById('expArea');
      if (area) area.value = text;
      var ok = download(fileName(), text);
      toast(ok ? '已导出并开始下载备份文件' : '已生成备份内容，请手动复制文本框');
      return;
    }
    if (t.id === 'copyBtn'){
      var area2 = document.getElementById('expArea');
      var text2 = (area2 && area2.value) || JSON.stringify(exportPayload(), null, 1);
      if (area2 && !area2.value) area2.value = text2;
      copyText(text2).then(function(ok2){
        toast(ok2 ? '备份内容已复制到剪贴板' : '复制失败，请手动选中文本框内容');
      });
      return;
    }
    if (t.id === 'impBtn'){
      var f = document.getElementById('impFile');
      if (f) f.click();
      return;
    }
    if (t.id === 'clearFav'){
      if (confirmBox('清空全部收藏？')){ Store.write('favorites', []); toast('收藏已清空'); render(); }
      return;
    }
    if (t.id === 'clearNotes'){
      if (confirmBox('清空全部笔记？此操作不可撤销。')){ Store.write('notes', {}); toast('笔记已清空'); render(); }
      return;
    }
    if (t.id === 'clearWrong'){
      if (confirmBox('清空错题本？')){ Store.write('wrongQuestions', {}); toast('错题本已清空'); render(); }
      return;
    }
    if (t.id === 'clearAll'){
      if (!confirmBox('将清空收藏、笔记、错题、答题进度与设置，确定继续？')) return;
      if (!confirmBox('最后确认：这些数据删除后无法恢复，建议先导出备份。')) return;
      Store.clearAll();
      Store.ensureVersion();
      applyTheme();
      toast('本地数据已清空');
      render();
      return;
    }
  });

  document.addEventListener('change', function(e){
    var t = e.target;
    if (!t || t.id !== 'impFile') return;
    var file = t.files && t.files[0];
    if (!file) return;
    var reader = new FileReader;
    reader.onload = function(){
      var text = String(reader.result || '');
      var payload;
      try {
        payload = JSON.parse(text);
      } catch(err){
        toast('导入失败：不是合法的 JSON 文件', 'warn');
        return;
      }
      if (!payload || typeof payload !== 'object' || !('zj:favorites' in payload || 'zj:notes' in payload || 'zj:settings' in payload)){
        if (!confirmBox('这个文件里没有找到本系统的数据标记（zj: 前缀），仍然尝试导入吗？')) return;
      }
      var rep = mergeImport(payload);
      Store.flush();
      toast('导入完成：列表 ' + rep.lists + ' 项，记录 ' + rep.objects + ' 项，进度 ' + rep.progress + ' 项');
      render();
      renderNav();
    };
    reader.onerror = function(){ toast('读取文件失败', 'warn'); };
    reader.readAsText(file, 'utf-8');
    t.value = '';
  });
})();
</script>

<script>
/* ===== 路由 ===== */
/* match 数组决定底部 Tab 的高亮归属；
   更具体的入口要排在前面（navKey 取第一个命中），否则会被宽泛规则抢走。 */
var NAV_TABS = [
  { hash:'#/home',        label:'首页', ico:'⌂',  match:['home'] },
  { hash:'#/meridians',   label:'经络', ico:'☰',  match:['meridians','meridian'] },
  { hash:'#/diseases',    label:'配穴', ico:'✚',  match:['diseases','disease'] },
  { hash:'#/quiz',        label:'习题', ico:'✎',  match:['quiz','wrong','bookmarks'] },
  { hash:'#/me',          label:'我的', ico:'★',  match:['me','favorites','notes','settings'] }
];
var NAV_MORE = [
  /* 穴位总表必须排在“经络与穴位”之前：
     /acupoints（总表）属于前者，/acupoint/XXX（单穴详情）才归属后者。 */
  { hash:'#/acupoints',         label:'穴位总表',   ico:'≡', group:'知识库', match:['acupoints'] },
  { hash:'#/meridians',         label:'经络与穴位', ico:'☰', group:'知识库', match:['meridians','meridian','acupoint'] },
  { hash:'#/diseases',          label:'病症配穴', ico:'✚', group:'知识库', match:['diseases','disease'] },
  { hash:'#/contraindications', label:'针灸禁忌', ico:'!', group:'知识库', match:['contraindications'] },
  { hash:'#/search',            label:'穴位检索', ico:'⌕', group:'知识库', match:['search'] },
  { hash:'#/notes',             label:'我的笔记', ico:'✐', group:'知识库', match:['notes'] },
  { hash:'#/wrong',             label:'错题本',   ico:'✗', group:'练习', match:['wrong'] },
  { hash:'#/bookmarks',         label:'收藏题',   ico:'✎', group:'练习', match:['bookmarks'] },
  { hash:'#/settings',          label:'设置与数据', ico:'⚙', group:'其他', match:['settings'] },
  { hash:'#/more',              label:'全部功能', ico:'⋯', group:'其他', match:['more'] }
];
var NAV_ALL = NAV_TABS.concat(NAV_MORE);

/* PAGES 由各页面模块往自己身上挂渲染函数，这里不再重复声明 */

function parseHash(){
  var h = location.hash || '';
  if (!h || h === '#' || h === '#/' ) h = '#/home';
  if (h.charAt(0) !== '#') h = '#' + h;
  var body = h.slice(1);
  if (body.charAt(0) === '/') body = body.slice(1);

  /* 查询串先剥掉再切路径，否则 ?m=lu 会被当成路径的一部分 */
  var qi = body.indexOf('?');
  var qs = '';
  if (qi > -1){ qs = body.slice(qi + 1); body = body.slice(0, qi); }

  var seg = body.split('/').filter(function(s){ return s !== ''; });
  var page = seg.length ? safeDecode(seg[0]) : 'home';
  var param = seg.length > 1 ? safeDecode(seg[1]) : '';
  var query = {};
  if (qs){
    qs.split('&').forEach(function(p){
      if (!p) return;
      var kv = p.split('=');
      query[safeDecode(kv[0])] = safeDecode((kv[1] || '').replace(/\+/g, ' '));
    });
  }
  return { path:'#/' + seg.join('/'), page:page, param:param, query:query };
}

/* decodeURIComponent 遇到坏编码会抛错，路由不能因为一个 % 就整页白屏 */
function safeDecode(s){
  if (s == null) return '';
  try { return decodeURIComponent(s); }
  catch(e){ return String(s); }
}

function go(hash, replace){
  if (replace) location.replace(hash);
  else location.hash = hash;
}

/* 在给定的一组导航项里找高亮项：
   第一轮按 match 前缀匹配（顺序即优先级），第二轮退回 exact hash。
   匹配时若某项的 hash 正好等于当前路径，优先用它；
   因此专属入口（如 #/wrong、#/settings）不会被拥有宽泛 match 的 Tab 抢走。 */
function navKey(page, list){
  list = list || NAV_ALL;
  var path = '#/' + page, i, n;

  /* 1) 精确命中 hash */
  for (i = 0; i < list.length; i++){
    if (list[i].hash === path) return list[i].hash;
  }
  /* 2) match 前缀匹配（顺序即优先级） */
  for (i = 0; i < list.length; i++){
    n = list[i];
    if (n.match && n.match.indexOf(page) > -1) return n.hash;
  }
  return '';
}
/* 底部 Tab 与抽屉各用一套高亮，避免“我的/习题”把设置、错题本等入口抢走 */
function tabKey(page){ return navKey(page, NAV_TABS); }
function drawerKey(page){ return navKey(page, NAV_TABS.concat(NAV_MORE)); }
function isNavReady(item){
  var p = PAGES[item.hash.replace('#/','')];
  return !!p;
}

function renderNav(){
  var r = parseHash();
  var curTab = tabKey(r.page);
  var curDrawer = drawerKey(r.page);

  var tabs = NAV_TABS.map(function(t){
    return '<a href="' + t.hash + '" class="' + (curTab === t.hash ? 'on' : '') + '">' +
             '<span class="tab-ico" aria-hidden="true">' + t.ico + '</span>' +
             '<span>' + esc(t.label) + '</span>' +
           '</a>';
  }).join('');
  $('navTabs').innerHTML = tabs;

  var desk = NAV_MORE.filter(function(n){ return !n.dev; }).map(function(n){
    return '<a href="' + n.hash + '" class="' + (curDrawer === n.hash ? 'on' : '') + '">' + esc(n.label) + '</a>';
  }).join('');
  $('navDesktop').innerHTML = desk;

  var groups = [{ title:'核心', items:NAV_TABS }];
  ['知识库','练习','其他'].forEach(function(gname){
    var items = NAV_MORE.filter(function(n){ return (n.group || '其他') === gname; });
    if (items.length) groups.push({ title:gname, items:items });
  });
  $('drawerBody').innerHTML = groups.map(function(g){
    return '<div class="drawer-sec">' + esc(g.title) + '</div>' + g.items.map(function(n){
      return '<a class="drawer-link ' + (curDrawer === n.hash ? 'on' : '') + '" href="' + n.hash + '">' +
               '<span class="dl-ico" aria-hidden="true">' + n.ico + '</span>' +
               '<span class="dl-t">' + esc(n.label) + '</span>' +
             '</a>';
    }).join('');
  }).join('');
}

var render = function(){
  var r = parseHash();
  /* 二级路由（如 quiz/run）优先匹配两段式键，再退回单段式 */
  var fn = PAGES[r.page + '/' + r.param] || PAGES[r.page];
  var view = $('view');
  if (typeof fn === 'function'){
    document.title = (PAGE_TITLES[r.page] ? PAGE_TITLES[r.page] + ' · ' : '') + '针灸学习知识库';
    view.innerHTML = fn(r);
  } else {
    document.title = '页面未实现 · 针灸学习知识库';
    view.innerHTML = PAGES._404(r);
  }
  renderNav();
  /* 不要再在骨架里把 window.afterRender 置空：
     各页面模块（检索/习题/笔记…）会在骨架脚本之前挂上钩子，
     这里一赋 null 就会把它们全冲掉，依赖钩子的页面会静默失效。 */
  if (typeof window.afterRender === 'function') window.afterRender(r);
};
var PAGE_TITLES = { home:'首页', settings:'设置与数据', more:'全部功能' };

window.addEventListener('hashchange', function(){
  closeDrawer();
  render();
  /* 移动端切页后回到顶部 */
  var m = $('appMain');
  if (m) m.scrollTop = 0;
  window.scrollTo(0, 0);
});
window.addEventListener('DOMContentLoaded', function(){
  Store.ensureVersion();
  buildAcupointIndex();      /* 穴位数据就位后再建索引，免得页面先渲染出空列表 */
  renderNav();
  render();                  /* 首屏渲染就靠这两句；漏掉 () 会一直是白屏 */
});

/* ===== 布局：抽屉菜单与遮罩 ===== */
var lastFocus = null;
function openDrawer(){
  lastFocus = document.activeElement;
  var d = $('drawer'), m = $('mask');
  m.hidden = false;
  requestAnimationFrame(function(){ m.classList.add('open'); d.classList.add('open'); });
  d.setAttribute('aria-hidden','false');
  $('btnMenu').setAttribute('aria-expanded','true');
  document.body.style.overflow = 'hidden';
  var first = d.querySelector('.drawer-link');
  if (first) first.focus;
}
function closeDrawer(){
  var d = $('drawer'), m = $('mask');
  if (!d.classList.contains('open')) return;
  d.classList.remove('open');
  m.classList.remove('open');
  d.setAttribute('aria-hidden','true');
  $('btnMenu').setAttribute('aria-expanded','false');
  document.body.style.overflow = '';
  setTimeout(function(){ m.hidden = true; }, 240);
  if (lastFocus && lastFocus.focus) lastFocus.focus;
  lastFocus = null;
}
$('btnMenu').addEventListener('click', openDrawer);
$('btnDrawerClose').addEventListener('click', closeDrawer);
$('mask').addEventListener('click', closeDrawer);
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') closeDrawer;
  if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){
    e.preventDefault; go('#/search');
  }
  /* 抽屉内 Tab 循环 */
  if (e.key === 'Tab' && $('drawer').classList.contains('open')){
    var f = $('drawer').querySelectorAll('a,button');
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault; last.focus; }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault; first.focus; }
  }
});

/* ===== 组件：吐司提示 ===== */
function toast(msg, kind, ms){
  var wrap = $('toast-wrap');
  if (!wrap) return;
  var el = document.createElement('div');
  el.className = 'toast' + (kind === 'warn' ? ' toast-warn' : '');
  el.textContent = msg;
  wrap.appendChild(el);
  requestAnimationFrame(function(){ el.classList.add('show'); });
  setTimeout(function(){
    el.classList.remove('show');
    setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 220);
  }, ms || 2000);
}

/* ===== 工具：简易确认框 ===== */
function confirmBox(msg){
  return window.confirm(msg);
}

/* 首页与设置页见 parts（39-page-home / 40-page-settings） */

/* 设置与数据页见 parts（40-page-settings），这里不再定义 PAGES.settings */

/* ===== 页面：全部功能 ===== */
PAGES.more = function(){
  var items = NAV_ALL.filter(function(n){ return n.hash !== '#/more'; });
  var groups = [['核心', NAV_TABS]];
  ['知识库','练习','其他'].forEach(function(g){
    var list = NAV_MORE.filter(function(n){ return (n.group || '其他') === g; });
    if (list.length) groups.push([g, list]);
  });
  return '' +
  pageHead('全部功能', '共 ' + items.length + ' 个入口，全部可用') +
  groups.map(function(g){
    return '<section class="card">' +
      '<div class="card-t"><h3>' + esc(g[0]) + '</h3></div>' +
      '<ul class="list-plain">' + g[1].map(function(n){
        return '<li style="border-bottom:1px solid var(--line)">' +
          '<a class="drawer-link" href="' + n.hash + '">' +
            '<span class="dl-ico" aria-hidden="true">' + n.ico + '</span>' +
            '<span class="dl-t">' + esc(n.label) + '</span>' +
          '</a></li>';
      }).join('') + '</ul>' +
    '</section>';
  }).join('');
};

/* ===== 页面：404 ===== */
PAGES._404 = function(r){
  return '' +
  '<section class="card">' +
    '<h1>页面不存在</h1>' +
    '<p class="card-note">没有匹配路由 <code>#' + esc(r.page) + '</code> 的页面。</p>' +
    '<div class="row"><a class="btn primary" href="#/home">返回首页</a>' +
    '<a class="btn" href="#/more">查看全部功能</a></div>' +
  '</section>';
};

/* ===== 启动：设置页的交互（事件委托，避免重复绑定） ===== */
document.addEventListener('click', function(e){
  var t = e.target;
  if (!t || !t.getAttribute) return;
  var th = t.getAttribute('data-theme-set');
  if (th){
    Prefs.setSetting('theme', th);
    applyTheme();
    render();
    toast('已切换为' + (th === 'auto' ? '跟随系统' : th === 'dark' ? '深色' : '浅色') + '主题');
  }
});
