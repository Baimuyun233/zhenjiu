  ["GB37", "光明", "guang ming", 37, "在小腿外侧，外踝尖上5寸，腓骨前缘处；正坐或仰卧取穴", "直刺0.5～0.8寸；可灸（艾条温和灸）", "清肝明目、通经活络、疏调肝胆", "目痛、夜盲、视物模糊、目翳；下肢痿痹、乳房胀痛", ["络穴"], "沿腓骨前缘缓慢直刺，得气后小幅捻转，使针感向足部放散；眼病常配睛明、风池、肝俞", "邻近腓浅神经与胫前血管分支，禁过深进针与大幅提插，以免损伤神经血管", "局部皮肤感染、破损者禁刺；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["GB38", "阳辅", "yang fu", 38, "在小腿外侧，外踝尖上4寸，腓骨前缘稍前方的凹陷中；正坐或仰卧取穴", "直刺0.5～0.8寸；可灸（艾条温和灸）", "清肝泻胆、疏经活络、消肿止痛", "偏头痛、目外眦痛、胸胁胀痛、腋下肿；下肢痿痹、瘰疬", ["五输穴·经"], "紧贴腓骨前缘进针，得气后小幅捻转提插，使酸胀感沿小腿外侧向下传导；不宜强刺激", "邻近腓浅神经，深部有胫前血管，禁深刺与大幅捣刺，防止神经损伤与出血", "局部皮肤感染、破损者禁刺；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["GB39", "悬钟", "xuan zhong", 39, "在小腿外侧，外踝尖上3寸，腓骨前缘处；正坐或仰卧取穴", "直刺0.5～0.8寸；可灸（艾条温和灸）", "平肝息风、益髓健脑、舒筋活络", "颈项强痛、落枕、中风、半身不遂、痴呆；下肢痿痹、脚气", ["八会穴"], "沿腓骨前缘缓慢进针，得气后小幅捻转，使针感向足部或局部放散；髓海不足之证常配风池、足三里并加灸", "邻近腓浅神经与胫前血管，进针不宜过深，避免损伤神经血管", "局部皮肤感染、破损者禁刺；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["GB40", "丘墟", "qiu xu", 40, "在踝区，足外踝的前下方，趾长伸肌腱外侧的凹陷中；正坐或仰卧取穴", "直刺0.5～0.8寸；可灸（艾条温和灸）", "疏肝利胆、通经活络、消肿止痛", "胸胁胀痛、口苦、黄疸；外踝肿痛、足下垂、下肢痿痹、颈项痛", ["原穴"], "在踝前凹陷处直刺，得气后小幅捻转，使局部酸胀并向足背放散；不宜向踝关节腔内深刺", "邻近踝关节囊与足背血管神经，禁深刺入关节腔；踝部急性扭伤肿胀明显时不宜强刺激", "踝关节急性化脓性炎症、局部皮肤感染或破损者禁刺；请以教材、国家标准和专业医师指导为准。", null, null, true, null],

  ["GB41", "足临泣", "zu lin qi", 41, "在足背，第4、5跖骨底结合部的前方，第5趾长伸肌腱外侧的凹陷中；正坐或仰卧取穴", "直刺0.3～0.5寸；可灸（艾条温和灸）", "疏肝利胆、清头明目、通调带脉、消肿止痛", "偏头痛、目赤肿痛、胁肋疼痛、乳痈；月经不调、足跗肿痛、瘰疬", ["五输穴·输","八脉交会穴"], "沿跖骨间隙向后上方缓慢斜刺，得气后小幅捻转，使酸胀感向足背或足趾放散；不宜穿透骨间隙过深", "邻近足背动脉分支与足背皮神经，禁深刺穿透跖骨间隙，以免损伤血管与骨间肌", "足部急性感染、局部皮肤破损者禁刺；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["GB42", "地五会", "di wu hui", 42, "在足背，第4、5跖骨间，第4跖趾关节近端凹陷中；正坐或仰卧取穴", "直刺0.3～0.5寸；可灸（艾条温和灸）", "疏肝利胆、清泄郁热、消肿止痛", "足跗肿痛、目赤肿痛、耳鸣；胁痛、乳痈、腰痛", null, "沿跖骨间隙缓慢直刺，得气后小幅捻转；进针前先以指切法分开浅表血管，出针后按压针孔", "邻近足背动静脉与足背皮神经，禁深刺与大幅提插，防止局部出血与神经刺激", "足部感染、局部皮肤破损者禁刺；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["GB43", "侠溪", "xia xi", 43, "在足背，第4、5趾间，趾蹼缘后方赤白肉际处；正坐或仰卧取穴", "直刺0.3～0.5寸；可灸（艾条温和灸，时间宜短）", "清肝泻胆、疏风止痛、聪耳明目", "偏头痛、目赤肿痛、耳鸣、耳聋；颊肿、胁肋痛、足跗肿痛", ["五输穴·荥"], "沿趾缝向后方缓慢直刺，得气后小幅捻转，局部酸胀即可；趾间皮肤薄，进针宜浅", "趾间皮肤薄嫩、血管神经表浅，禁深刺与大幅提插；有足癣、皮肤破损者不宜针刺", "足癣糜烂、趾间皮肤破损或感染者禁刺；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["GB44", "足窍阴", "zu qiao yin", 44, "在足趾，第4趾末节外侧，趾甲根角侧后方0.1寸处；正坐或仰卧取穴", "浅刺0.1～0.2寸，或点刺出血；可灸（艾条温和灸，时间宜短）", "清肝泻胆、疏风清热、聪耳明目", "偏头痛、目赤肿痛、耳鸣、耳聋、咽喉肿痛；胁痛、足跗肿痛、失眠", ["五输穴·井"], "沿趾甲角后方向近端浅刺，或三棱针点刺挤出少量血液；点刺后需清洁消毒并压迫止血", "趾端感觉敏锐、血管表浅，手法宜轻；有出血倾向或正在使用抗凝药者禁用点刺放血", "局部皮肤感染、破损者禁刺；凝血功能障碍者禁用点刺出血；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  /* ---- 足厥阴肝经（14 穴） ---- */
  ["LR1", "大敦", "da dun", 1, "在足趾，第1趾末节外侧，趾甲根角侧后方0.1寸（指寸）；正坐或仰卧，于足大趾外侧趾甲角旁取穴", "浅刺0.1～0.2寸，或用三棱针点刺出血；可灸，艾炷宜小、壮数宜少", "疏肝理气、调经止痛、清利下焦", "疝气、少腹疼痛、遗尿、癃闭、遗精；月经不调、崩漏、阴挺；癫痫", ["五输穴·井"], "以左手固定足大趾，右手持针沿趾甲根角后方缓慢浅刺，行小幅捻转，局部胀痛为度；点刺放血须严格消毒，出血后用干棉球按压片刻。", "穴处皮薄肉少、感觉敏锐，刺激量宜轻，不可深刺或大幅提插，以免伤及趾背动、静脉与趾神经，引起剧痛、出血或血肿。", "局部皮肤感染、破溃，凝血功能障碍或正在抗凝治疗者禁点刺放血；糖尿病足末梢血循不良者慎用；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["LR2", "行间", "xing jian", 2, "在足背，第1、2趾间，趾蹼缘后方赤白肉际处；正坐或仰卧，于趾蹼缘后方凹陷中取穴", "直刺0.5～0.8寸；可灸", "清肝泻火、息风止痉、调经止痛", "头痛、目赤肿痛、耳鸣、口歪；胁痛、疝气、小便不利；月经不调、痛经、带下", ["五输穴·荥"], "向足跟方向直刺或略斜刺，得气后行提插捻转泻法，使针感向趾端或足背放散；实热证可配合艾条温和灸或点刺出血。", "穴在趾蹼缘，皮肤薄、血管较丰富，进针不宜过深，以免刺伤趾背动、静脉而出血；孕妇慎用强刺激，以免诱发子宫收缩。", "局部皮肤破损、感染或足部急性炎症者禁刺；有出血倾向者慎用；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["LR3", "太冲", "tai chong", 3, "在足背，第1、2跖骨间，跖骨底结合部前方凹陷中，或触及动脉搏动处；由趾蹼缘向后推至两骨间凹陷取穴", "直刺0.5～0.8寸；可灸", "平肝息风、疏肝理气、清利头目", "头痛、眩晕、目赤肿痛、口歪；胁痛、腹胀、疝气、癃闭；月经不调、痛经、下肢痿痹", ["五输穴·输","原穴"], "沿第1、2跖骨间隙向足跟方向缓慢直刺，得气后行提插捻转，针感可放散至足趾或足底；实证用泻法、虚证用补法，亦可配合温和灸。", "穴下有足背动脉与腓深神经分支，进针应避开搏动处血管，出现放电样麻木或剧痛须退针调整，不宜反复捣刺。", "局部皮肤感染、破损或下肢静脉血栓形成者禁刺；孕妇慎用强刺激；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["LR4", "中封", "zhong feng", 4, "在踝区，内踝前方，胫骨前肌腱内侧缘凹陷中；足背屈时，于内踝前两筋之间凹陷处取穴", "直刺0.5～0.8寸；可灸", "清利下焦、舒筋活络、行气止痛", "疝气、少腹疼痛、遗精、小便不利；踝关节及周围软组织疼痛、下肢痿痹；胁痛", ["五输穴·经"], "嘱患者足背屈以显露胫骨前肌腱，于肌腱内侧缘凹陷处缓慢直刺，得气后行小幅提插捻转，针感可传至足背或内踝。", "穴位紧邻胫骨前肌腱、内踝与踝关节囊，进针须避开肌腱与关节间隙，不宜过深或大幅提插，以免损伤肌腱、关节囊。", "踝部急性扭伤肿胀明显、局部皮肤感染或关节腔积液活动期禁刺；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["LR5", "蠡沟", "li gou", 5, "在小腿内侧，内踝尖上5寸，胫骨内侧面的中央；正坐或仰卧，于胫骨内侧面下段取穴", "平刺0.5～0.8寸；可灸", "疏肝理气、清利湿热、调经止带", "月经不调、带下、阴痒、阴挺；小便不利、疝气；下肢痿痹、胫部酸痛", ["络穴"], "沿胫骨内侧面由下向上平刺，得气后行捻转手法，局部酸胀为度；因肌层浅薄，一般不做大幅提插。", "胫骨内侧面皮下组织浅薄、深部即骨膜，进针宜平刺而不宜垂直深刺，以免刺伤骨膜引起剧痛；局部静脉曲张处应避开。", "局部皮肤感染、破溃，下肢静脉曲张明显或血栓性静脉炎者禁刺；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["LR6", "中都", "zhong du", 6, "在小腿内侧，内踝尖上7寸，胫骨内侧面的中央；正坐或仰卧，于胫骨内侧面中下段取穴", "平刺0.5～0.8寸；可灸", "疏肝理气、活血止痛、调经止血", "小腹疼痛、疝气、崩漏、恶露不尽；胁痛、腹胀；下肢痿痹、胫部疼痛", ["郄穴"], "沿胫骨内侧面平刺或略斜刺，得气后行捻转泻法，急性痛证可适当加大刺激量；常配合艾条灸或温针灸。", "穴区肌层薄、紧邻胫骨骨膜与大隐静脉，进针不宜过深或垂直刺入，以免刺伤骨膜、血管；局部有静脉曲张者慎用。", "局部皮肤感染、破溃，下肢静脉血栓或出血倾向者禁刺；孕妇慎用强刺激；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["LR7", "膝关", "xi guan", 7, "在膝部，胫骨内侧髁下方，阴陵泉后1寸；屈膝，于胫骨内侧髁下缘、腓肠肌内侧头前缘取穴", "直刺0.8～1寸；可灸", "疏风除湿、通利关节、散寒止痛", "膝关节内侧肿痛、屈伸不利、下肢痿痹；寒湿脚气；咽喉肿痛", null, "屈膝定位后向腘窝方向缓慢直刺，得气后行提插捻转，使针感向膝关节内或小腿放散；常配合温针灸或艾条灸。", "穴区邻近膝关节囊、内侧副韧带与腓肠肌内侧头，进针不宜过深或向关节腔方向强力刺入，以免损伤关节内结构。", "膝关节急性肿胀积液、化脓性关节炎或局部皮肤感染者禁刺；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["LR8", "曲泉", "qu quan", 8, "在膝部，屈膝时腘横纹内侧端，半腱肌、半膜肌肌腱内缘凹陷中；屈膝取穴", "直刺1～1.5寸；可灸", "清利湿热、养血柔筋、通调下焦", "小腹疼痛、小便不利、遗精、阴痒、阴挺；月经不调、痛经、带下；膝内侧疼痛、下肢痿痹", ["五输穴·合"], "屈膝定位，于肌腱内缘凹陷处缓慢直刺，得气后行捻转提插，针感可沿大腿内侧放散；虚证多用补法并配合灸法。", "穴下邻近腘动、静脉与胫神经，进针方向应偏向前内侧，避免向腘窝深部直刺；出现向小腿放电样麻木须立即退针。", "腘窝囊肿、下肢深静脉血栓、局部感染或出血倾向者禁刺；孕妇慎用强刺激；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["LR9", "阴包", "yin bao", 9, "在股前区，髌底上4寸，股内侧肌与缝匠肌之间；正坐或仰卧屈膝，于大腿内侧中下段取穴", "直刺0.8～1.5寸；可灸", "疏肝理气、调经止痛、通利小便", "月经不调、痛经、小便不利、遗尿；小腹及腰骶疼痛；下肢痿痹", null, "于股内侧肌与缝匠肌之间的肌间隙缓慢直刺，得气后行提插捻转，使针感向大腿内侧或膝部放散；可配艾条温和灸。", "穴区有股神经前皮支及股血管分支走行，进针不宜过深或偏向内侧血管走行区，以免刺伤血管引起出血与血肿。", "局部皮肤感染、破损、下肢静脉血栓或血肿者禁刺；孕妇大腿内侧及下腹部慎用强刺激；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["LR10", "足五里", "zu wu li", 10, "在股前区，气冲直下3寸，动脉搏动处；仰卧伸腿，于大腿根部内侧、股动脉搏动处取穴", "避开动脉直刺0.8～1.5寸；可灸", "疏肝理气、清利湿热、通调下焦", "小腹胀痛、小便不利、阴挺、睾丸肿痛；倦怠嗜卧、瘰疬；股内侧疼痛", null, "先用指腹扪清股动脉搏动位置，自其外侧或内侧缓慢进针，得气后行小幅捻转，针感可向大腿内侧放散；不宜长时间留针。", "穴下紧邻股动、静脉与股神经，严禁刺中血管或神经干，不可大幅提插捣刺，以免形成大血肿或神经损伤；出针后按压针孔。", "局部感染、淋巴结肿大破溃、下肢静脉血栓、出血倾向或抗凝治疗中者禁刺；孕妇下腹部及股内侧禁针灸；请以教材、国家标准和专业医师指导为准。", null, null, true, null],

  ["LR11", "阴廉", "yin lian", 11, "在股前区，气冲直下2寸；仰卧伸腿，于大腿根部内侧、耻骨结节下方取穴", "直刺0.8～1.5寸；可灸", "疏肝调经、清利下焦、通络止痛", "月经不调、带下、阴痒、不孕；小腹疼痛、股内侧痛；下肢痿痹", null, "仰卧并轻度外展屈髋，于肌肉间隙缓慢直刺，得气后行提插捻转，局部酸胀并向股内侧放散为佳；可配合灸法。", "穴区邻近股动、静脉与腹股沟淋巴结，进针不宜过深或偏向内侧血管区，以免刺伤血管导致血肿或继发感染；孕妇禁深刺。", "腹股沟淋巴结肿大、局部感染、下肢静脉血栓或出血倾向者禁刺；孕妇下腹部及股内侧禁针灸；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["LR12", "急脉", "ji mai", 12, "在腹股沟区，横平耻骨联合上缘，前正中线旁开2.5寸；仰卧，于腹股沟股动脉搏动处内侧取穴", "避开股动脉直刺0.5～1寸；可灸", "疏肝理气、通络止痛、清利下焦", "小腹疼痛、疝气、睾丸肿痛、阴挺；股内侧疼痛", null, "仰卧定位后以指腹确认股动脉搏动并予避开，自血管内侧缘缓慢直刺，得气即止，不做大幅提插；一般不长时间留针。", "穴下为股动、静脉与股神经，邻近腹股沟韧带及腹膜，严禁刺中血管、神经或穿透腹股沟深部，出针后须按压针孔以防血肿；孕妇禁针。", "孕妇及经期妇女下腹部禁针灸；局部感染、淋巴结肿大、疝嵌顿、下肢静脉血栓或出血倾向者禁刺；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["LR13", "章门", "zhang men", 13, "在侧腹部，第11肋游离端的下际；侧卧或仰卧，屈上臂，于第11肋游离端下缘取穴", "直刺0.8～1寸，不宜深刺；可灸", "疏肝健脾、理气散结、和胃消积", "腹胀、腹痛、肠鸣、泄泻、痞块；胁痛、黄疸；倦怠乏力", ["募穴","八会穴","交会穴"], "侧卧或仰卧，于第11肋游离端下缘斜刺或直刺，得气后行小幅捻转，不做大幅提插；可配合艾条温和灸。", "深部右侧为肝右叶、左侧为脾脏，并有结肠与右肾，第11肋为浮肋缺乏骨性保护，必须严格控制进针深度与方向，严禁深刺或向外上斜刺；肝脾肿大者尤须谨慎。", "肝脾明显肿大、腹部急症、局部皮肤感染或饱食后不宜针刺；孕妇侧腹部禁针灸；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["LR14", "期门", "qi men", 14, "在胸部，第6肋间隙，前正中线旁开4寸；仰卧，于锁骨中线第6肋间隙取穴", "沿肋间隙斜刺或平刺0.5～0.8寸，不宜直刺深刺；可灸", "疏肝理气、和胃降逆、活血化瘀", "胸胁胀痛、乳痈、呕吐吞酸、呃逆；腹胀、泄泻；奔豚气", ["募穴","交会穴"], "仰卧取穴，沿肋间隙自内向外或自外向内斜刺、平刺，得气后行小幅捻转，针感向胁肋部放散；留针不宜过久，可配合艾条温和灸。", "穴下依次为肋间肌、胸膜与肺，右侧深部为肝脏右叶，严禁直刺或深刺，以免刺破胸膜造成气胸、或刺伤肝脏；肝脾肿大、肺气肿者尤须谨慎。", "肝脾明显肿大、严重肺气肿、胸部皮肤感染或饱食后不宜针刺；孕妇胸部及胁肋部慎针灸；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  /* ---- 任脉（24 穴） ---- */
  ["CV1", "会阴", "hui yin", 1, "在会阴部，男性为阴囊根部与肛门连线的中点，女性为大阴唇后联合与肛门连线的中点；仰卧屈膝、臀部略垫高，或取膝胸位暴露取穴", "直刺0.5～1寸；可灸，急救多以指掐或艾灸代替针刺", "醒神开窍、通利下焦、调经止带", "溺水窒息、昏迷、癫狂痫；小便不利、遗尿、遗精、阳痿；月经不调、阴挺、脱肛、痔疾", ["交会穴"], "进针前须充分消毒并缓慢刺入，局部以酸胀感为主，可向肛门及前阴放散；用于昏厥抢救时多用重力掐按或艾条雀啄灸，不强调留针。", "位于会阴部，皮肤薄嫩、汗腺与血管神经丰富，疼痛明显且极易污染，针刺必须严格无菌操作；孕妇禁用。", "孕妇禁针；局部皮肤破溃、感染、湿疹或患性传播疾病者禁针；非常规保健穴，非专业医师不得自行操作。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["CV2", "曲骨", "qu gu", 2, "在下腹部，耻骨联合上缘的中点，前正中线上；仰卧并排空膀胱后取穴", "直刺0.5～1寸；可灸。针前务必排尿", "通利膀胱、温阳固精、调经止带", "小便不利、遗尿、癃闭、淋证；遗精、阳痿；月经不调、痛经、带下", ["交会穴"], "排尿后取仰卧位，针尖略向下缓慢直刺，得气时局部酸胀并可向下腹及外阴放散，不宜反复大幅提插。", "深部紧邻膀胱，必须先排空膀胱再进针，严禁深刺或大幅度捣刺，以防刺伤膀胱；孕妇禁针。", "孕妇禁用；膀胱充盈时针刺属禁忌；耻骨上区术后瘢痕、局部感染者慎用或不用。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["CV3", "中极", "zhong ji", 3, "在下腹部，脐中下4寸，前正中线上；仰卧并排空膀胱取穴", "直刺0.5～1寸；可灸，虚寒证宜温灸", "通利膀胱、温肾调经、化气止带", "遗尿、小便不利、癃闭、淋证；遗精、阳痿；月经不调、痛经、带下、不孕", ["募穴","交会穴"], "仰卧排空膀胱后缓慢直刺，得气以局部沉胀并向外阴放散为佳；虚寒证可配艾条温和灸10～15分钟。", "膀胱充盈时针刺易伤及膀胱，须排空后操作且不可深刺；孕妇禁针，经期亦不宜强刺激。", "孕妇禁用；膀胱充盈时禁针；下腹部急性炎症、局部皮肤感染者慎用。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["CV4", "关元", "guan yuan", 4, "在下腹部，脐中下3寸，前正中线上；仰卧并排空膀胱取穴", "直刺0.5～1寸；可灸，多用温和灸、隔姜灸", "培元固本、温肾壮阳、调理冲任", "遗尿、尿频、癃闭；遗精、阳痿、早泄；月经不调、痛经、不孕、带下；虚劳羸瘦、中风脱证", ["募穴","交会穴"], "仰卧排空膀胱后直刺，得气时小腹坠胀可向外阴放散；补虚常用艾条温和灸或隔姜灸十余分钟至皮肤潮红为度。", "孕妇禁针、禁重灸，深刺可伤及子宫；膀胱充盈时不可深刺；本穴为强壮要穴，宜以灸法为主，针刺刺激不宜过强。", "孕妇及经期妇女禁用；膀胱充盈时针刺属禁忌；下腹部肿瘤、急性腹膜炎者不宜针刺。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["CV5", "石门", "shi men", 5, "在下腹部，脐中下2寸，前正中线上；仰卧取穴", "直刺0.5～1寸；可灸", "温肾利水、通利下焦、调经止带", "腹胀、腹痛、水肿、小便不利；遗精、阳痿；月经不调、带下、崩漏", ["募穴"], "仰卧放松腹肌后缓慢直刺，得气以局部胀感为主，可行小幅捻转；水肿者宜配灸法。", "古有针石门影响生育的记载，孕妇及有生育要求者应避免针刺；深部为小肠，不可深刺。", "孕妇禁用，育龄期有生育计划者慎针；膀胱充盈或腹部胀气明显时针刺宜浅。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["CV6", "气海", "qi hai", 6, "在下腹部，脐中下1.5寸，前正中线上；仰卧取穴", "直刺0.5～1寸；可灸，补虚多用灸法", "益气培元、温阳固脱、调理下焦", "腹痛、泄泻、便秘；遗尿、遗精、阳痿；月经不调、痛经、崩漏；虚脱、气短乏力", null, "仰卧直刺，得气时局部酸胀可向下腹放散；气虚下陷者以艾条温和灸或隔姜灸为宜，灸至皮肤温热红晕。", "孕妇下腹部禁针禁灸；膀胱充盈时不宜深刺，腹部手术后瘢痕处慎针。", "孕妇禁用；下腹部急性炎症、皮肤感染或溃破者禁针禁灸；实热证不宜重灸。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["CV7", "阴交", "yin jiao", 7, "在下腹部，脐中下1寸，前正中线上；仰卧取穴", "直刺0.5～1寸；可灸", "温通下焦、调经止带、利水消肿", "绕脐冷痛、腹胀、水肿、小便不利；月经不调、带下、崩漏", ["交会穴"], "仰卧直刺，手法宜轻缓，得气以脐周及小腹沉胀为度；寒证可加艾条温和灸。", "孕妇禁针；穴下为小肠，禁止深刺与大幅度提插，以防伤及肠管。", "孕妇禁用；腹部急性炎症、肠梗阻或局部皮肤感染者禁针。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["CV8", "神阙", "shen que", 8, "在上腹部，脐中央；仰卧充分暴露脐部取穴", "禁针刺；宜灸，常用隔盐灸、隔姜灸或艾条温和灸", "温阳救逆、利水固脱、健脾和胃", "腹痛、泄泻、脱肛；水肿、小便不利；虚脱、中风脱证", null, "一般不针；施灸多取隔盐灸或隔姜灸，艾炷灸数壮至十余壮，或艾条温和灸10～20分钟，以脐周温热舒适、皮肤潮红为度。", "脐部皱褶多、皮肤薄，消毒困难，针刺极易引起感染，故列为禁针穴；灸治时须防止烫伤，小儿、老人及感觉减退者尤应密切观察。", "禁止针刺；脐部皮肤破损、感染、渗液或脐疝嵌顿时禁灸；孕妇慎用。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["CV9", "水分", "shui fen", 9, "在上腹部，脐中上1寸，前正中线上；仰卧取穴", "直刺0.5～1寸；可灸", "健脾利水、和胃理气", "水肿、小便不利；腹胀、腹痛、泄泻；反酸、呕吐", null, "仰卧直刺，进针宜缓，得气以局部沉胀为度；水肿患者可配合艾条温和灸。", "穴下为小肠与胃下缘，禁深刺；腹水或高度腹胀者针刺宜浅，避免刺入腹腔脏器。", "孕妇慎用；腹部急性炎症、脏器肿大明显或局部皮肤感染者禁针。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["CV10", "下脘", "xia wan", 10, "在上腹部，脐中上2寸，前正中线上；仰卧取穴", "直刺0.5～1寸；可灸", "和胃健脾、消食导滞、降逆止呕", "脘腹胀痛、食积不化、呕吐、泄泻；痞块", ["交会穴"], "仰卧直刺，得气以胃脘部沉胀为佳，可小幅捻转行针；食积者常配艾条温和灸。", "深部为胃与小肠，饱食后不宜针刺，禁止深刺与大幅提插，以防刺穿胃壁。", "饱食后、急性胃扩张或胃部手术后近期禁针；孕妇慎用。请以教材、国家标准和专业医师指导为准。", null, null, false, null],

  ["CV11", "建里", "jian li", 11, "在上腹部，脐中上3寸，前正中线上；仰卧取穴", "直刺0.5～1寸；可灸", "和胃健脾、降逆利水、宽中除满", "胃痛、呕吐、食欲不振、腹胀肠鸣；水肿", null, "仰卧直刺，进针缓慢，得气以胃脘胀感为主；脾胃虚弱者可加艾条温和灸。", "穴下为胃体，不可深刺或向上斜刺过深；饱食后与高度胃扩张者不宜针刺。", "孕妇慎用；饱食后、急性胃炎发作期或局部皮肤感染者禁针。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["CV12", "中脘", "zhong wan", 12, "在上腹部，脐中上4寸，前正中线上，约当胸剑联合与脐中连线的中点；仰卧取穴", "直刺1～1.5寸；可灸，脾胃虚寒者常用灸法", "和胃健脾、降逆化滞、温中补虚", "胃痛、腹胀、呕吐、吞酸、泄泻、便秘；黄疸；失眠、癫狂", ["募穴","八会穴","交会穴"], "仰卧放松腹部后缓慢直刺，得气时上腹部沉胀可向两胁或下腹放散，可行小幅提插捻转；虚寒证配合艾条温和灸或隔姜灸。", "深部为胃幽门部与胰腺，饱食后禁针，禁止深刺，以免刺入胃腔或腹腔引起穿孔与感染；肝脾明显肿大者慎针。", "饱食后、急性胃穿孔、腹膜炎或上腹部术后近期禁针；孕妇慎用。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["CV13", "上脘", "shang wan", 13, "在上腹部，脐中上5寸，前正中线上；仰卧取穴", "直刺1～1.5寸；可灸", "和胃降逆、化痰宁神、宽胸利膈", "胃痛、呕吐、呃逆、腹胀；癫痫、失眠、心悸", ["交会穴"], "仰卧直刺，进针缓慢，得气以上腹沉胀为度，行针手法宜轻柔；呕吐者常配内关同用。", "深部为肝左叶与胃，禁深刺及向右上方斜刺，肝大者尤须谨慎，以防刺伤肝脏引起出血。", "饱食后禁针；肝脾肿大、肝硬化或上腹部术后近期慎用。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["CV14", "巨阙", "ju que", 14, "在上腹部，脐中上6寸，前正中线上；仰卧取穴", "向下斜刺0.5～1寸；可灸", "宁心安神、宽胸化痰、和胃降逆", "心悸、心痛、癫狂痫；胃痛、呕吐、吞酸、呃逆", ["募穴"], "仰卧取穴，针尖向下沿腹壁斜刺，得气以局部沉胀为度，不宜行大幅提插；心阳不足者可配艾条温和灸。", "穴下为肝脏与心脏投影区，必须向下斜刺，严禁直刺深刺，以防伤及肝脏、膈肌乃至心脏；肝大者禁用。", "直刺深刺属禁忌；肝脾明显肿大、心脏扩大或装有心脏起搏器者慎用。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["CV15", "鸠尾", "jiu wei", 15, "在上腹部，胸剑联合下1寸，前正中线上；仰卧或端正坐位取穴", "向下斜刺0.5～1寸；可灸，宜温和灸", "宽胸化痰、宁心安神、和胃降逆", "胸闷、心痛、心悸；癫狂痫；呕吐、呃逆、腹胀", ["络穴"], "取仰卧位，针尖向下沿腹白线斜刺，进针缓慢并嘱患者平稳呼吸，得气即止，不追求强刺激。", "本穴正当膈肌、肝脏与心脏投影处，古人即谓不可大针，必须向下斜刺，严禁直刺深刺，以免刺破膈肌伤及肝脏或心脏。", "直刺深刺与向上斜刺属禁忌；肝大、膈疝、心脏病患者禁用。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["CV16", "中庭", "zhong ting", 16, "在胸部，胸剑联合的中点，前正中线上，约平第5肋间隙；仰卧取穴", "平刺0.3～0.5寸；可灸", "宽胸理气、和胃降逆", "胸胁胀满、心痛；呕吐、噎膈、小儿吐乳", null, "沿胸骨表面向上或向下平刺，进针宜慢，局部酸胀即可，不提插；可配艾条温和灸数分钟。", "穴下为胸骨与纵隔，须平刺，禁止直刺深刺；局部骨膜敏感，刺激量宜小，灸时防止烫伤。", "胸骨骨折、局部皮肤感染或胸部术后未愈者禁针禁灸。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["CV17", "膻中", "dan zhong", 17, "在胸部，横平第4肋间隙，前正中线上，约当两乳头连线的中点；仰卧或正坐取穴", "平刺0.3～0.5寸；可灸", "宽胸理气、宣肺化痰、通乳散结", "咳嗽、气喘、胸闷、心痛；噎膈、呃逆；产后乳汁不足、乳痈", ["募穴","八会穴"], "沿胸骨面自上而下或自下而上平刺，得气为局部胀感，一般不行提插；气滞胸闷者可配艾条温和灸。", "穴下为胸骨与纵隔，只能平刺，严禁直刺深刺，以免伤及心脏与大血管；胸部皮肤薄，灸治须防烫伤。", "胸部肿瘤、胸骨骨折或局部皮肤感染者禁针禁灸；心肺功能严重不全者慎用。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["CV18", "玉堂", "yu tang", 18, "在胸部，横平第3肋间隙，前正中线上；仰卧取穴", "平刺0.3～0.5寸；可灸", "宽胸理气、止咳化痰", "咳嗽、气喘、胸痛、胸闷；呕吐", null, "沿胸骨表面平刺，缓慢进针，得气即止，留针期间不宜大幅行针；可配艾条温和灸。", "穴下为胸骨与纵隔，须平刺，禁止直刺深刺；深部为大血管与心肺，不可盲目深刺。", "胸骨病变、局部皮肤感染或胸部术后近期禁针；心肺功能不全者慎用。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["CV19", "紫宫", "zi gong", 19, "在胸部，横平第2肋间隙，前正中线上；仰卧取穴", "平刺0.3～0.5寸；可灸", "宽胸理气、止咳平喘、清利咽喉", "咳嗽、气喘、胸痛；喉痹、咽干", null, "沿胸骨面平刺，进针缓慢，局部酸胀为度；气喘者可配艾条温和灸，灸量宜小。", "穴下为胸骨、纵隔与胸膜，须平刺，禁直刺深刺；瘦弱患者更应控制进针深度。", "胸部皮肤感染、胸骨骨折或严重心肺疾病者禁针禁用重灸。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["CV20", "华盖", "hua gai", 20, "在胸部，横平第1肋间隙，前正中线上；仰卧取穴", "平刺0.3～0.5寸；可灸", "宽胸理气、清肺止咳、利咽", "咳嗽、气喘、胸痛；咽喉肿痛", null, "沿胸骨表面平刺，缓慢进针，得气为局部胀感，不行提插；可配艾条温和灸数分钟。", "穴下为胸骨柄、胸腺区与纵隔大血管，须平刺，禁直刺深刺，以免误入纵隔或伤及大血管。", "胸骨病变、上纵隔肿物、局部皮肤感染者禁针禁灸。请以教材、国家标准和专业医师指导为准。", null, null, false, null],

  ["CV21", "璇玑", "xuan ji", 21, "在胸部，胸骨柄上缘的凹陷中，前正中线上，当天突下1寸；仰卧或正坐取穴", "平刺0.3～0.5寸；可灸", "宽胸利咽、止咳平喘", "咳嗽、气喘、胸痛；咽喉肿痛、吞咽不利", null, "沿胸骨柄表面向下平刺，进针宜浅宜慢，得气即止；咽部症状者可配少商等穴，不单独深刺。", "穴下即胸骨柄、气管与纵隔，只能平刺，严禁直刺深刺，以免刺入气管或纵隔造成气胸、出血等严重后果。", "气管移位、纵隔气肿、胸骨病变或局部皮肤感染者禁针禁灸。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["CV22", "天突", "tian tu", 22, "在颈前区，胸骨上窝的中央，前正中线上；取仰靠坐位或仰卧位，头略后仰", "先直刺0.2寸，再将针尖转向下方，沿胸骨柄后缘缓慢刺入0.5～1寸；可灸", "宣肺利咽、化痰止咳、降逆止呕", "咳嗽、气喘、咽喉肿痛、失音；噎膈、呕吐、呃逆、梅核气", ["交会穴"], "仰头取穴，先以针尖垂直刺入皮下，随即改为向下沿胸骨柄后缘与气管前缘之间缓慢进针，进针过程嘱患者屏息或浅呼吸，得气即退针，不宜留针过久。", "深部为气管、主动脉弓、无名静脉与肺尖等重要结构，严禁向左右两侧深刺或大幅度提插捻转；若患者出现剧烈咳嗽、气促、面色改变，须立即停止并退针观察。", "禁止向两侧斜刺或深刺；肺气肿、肺大疱、严重心肺疾病及颈部肿物压迫气管者禁用针刺。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["CV23", "廉泉", "lian quan", 23, "在颈前区，喉结上方，舌骨上缘的凹陷中，前正中线上；取仰靠坐位，头略后仰", "向舌根方向斜刺0.5～0.8寸；可灸，一般不灸或仅温和灸", "利咽开音、清热化痰、通利舌络", "舌强不语、吞咽困难、流涎；咽喉肿痛、失音、舌下神经麻痹", ["交会穴"], "仰头取穴，针尖向舌根方向缓慢斜刺，得气时舌根部有酸胀感或唾液增多，行针宜轻，不留针过久；亦可点刺放血治咽喉急症。", "深部为舌根、会厌与气管，进针须缓慢，不可深刺或大幅提插；局部血管丰富，须避开颈前静脉，防止出血形成血肿压迫气道。", "颈部肿物、喉头水肿、急性会厌炎或凝血功能障碍者禁针；有出血倾向者慎用点刺放血。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["CV24", "承浆", "cheng jiang", 24, "在面部，颏唇沟的正中凹陷中，前正中线上；正坐或仰卧取穴", "斜刺0.3～0.5寸；可灸，面部一般少灸", "祛风通络、清热利咽、宁心安神", "口眼歪斜、流涎、齿龈肿痛、口舌生疮；癫狂、面肿", ["交会穴"], "取正坐或仰卧位，针尖向上或向病侧斜刺，进针宜浅，得气为局部酸胀，行针以小幅捻转为主，不宜提插。", "面部血管丰富，进针后不可大幅提插捻转，起针后需按压片刻，以免出血形成瘀斑或血肿；操作时避开口唇与牙齿。", "局部皮肤感染、痤疮破溃、口腔急性炎症或凝血功能障碍者禁针；面部一般不宜直接灸。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  /* ---- 督脉（28 穴） ---- */
  ["GV1", "长强", "chang qiang", 1, "在会阴区，尾骨端下方，尾骨端与肛门连线的中点处；胸膝位或侧卧屈膝取穴", "紧靠尾骨前面斜刺0.8～1寸；可灸", "通督固脱、调理下焦、清利湿热", "便血、痔疮、脱肛、泄泻；癫狂痫、腰脊尾骶痛；遗精、阳痿", ["络穴","交会穴"], "针尖沿尾骨前面向上斜刺，捻转行针，使局部酸胀或向肛门放散；可艾条温和灸或雀啄灸。", "穴旁为肛门与尾骨，须严格消毒以防感染；进针不宜过深或刺破直肠壁，本穴邻近肛门，感染风险较高。", "局部皮肤感染、肛周脓肿、开放性伤口处禁针灸；孕妇慎用。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["GV2", "腰俞", "yao shu", 2, "在骶区，正对骶管裂孔，后正中线上；俯卧或侧卧取穴", "向上斜刺0.5～1寸；可灸", "通督调经、强腰利湿、清利下焦", "腰脊强痛、下肢痿痹；月经不调、痛经、遗精；痔疾、脱肛、泄泻", null, "针尖向上沿骶管裂孔方向斜刺，缓慢捻转，使酸胀感向腰骶放散；可艾条灸或温针灸。", "穴下即骶管裂孔，深刺可进入椎管，切勿盲目深刺或反复提插，以免损伤马尾神经或引起蛛网膜下腔出血。", "孕妇腰骶部禁针灸；局部感染、破溃或骶部皮肤病变处禁针。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["GV3", "腰阳关", "yao yang guan", 3, "在脊柱区，第4腰椎棘突下凹陷中，后正中线上；俯卧取穴", "向上斜刺0.5～1寸；可灸", "温阳强腰、祛寒除湿、调理下焦", "腰骶疼痛、下肢痿痹；遗精、阳痿；月经不调、带下", null, "针尖稍向上斜刺，行提插捻转手法，使局部酸胀或向下肢放散；宜用艾条温和灸或温针灸以温阳散寒。", "穴下为棘突间韧带与椎管方向，进针须沿棘突上缘缓慢深入，忌大幅度提插，防止刺入椎管损伤脊髓。", "孕妇腰骶部禁针灸；局部皮肤感染、脊柱结核或肿瘤部位禁针。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["GV4", "命门", "ming men", 4, "在脊柱区，第2腰椎棘突下凹陷中，后正中线上；俯卧取穴", "向上斜刺0.5～1寸；可灸，常用温针灸或艾条灸", "温补肾阳、强健腰膝、固摄下元", "腰痛、腰脊强痛；遗精、阳痿、早泄、不育；月经不调、带下、遗尿", null, "针尖略向上斜刺，以捻转手法为主，得气后留针；本穴为温阳要穴，多用艾条灸或温针灸。", "穴下为棘间韧带与椎管，须控制进针深度与角度，不可直刺过深，以免伤及脊髓或引起硬膜外血肿。", "孕妇腰骶部禁针灸；局部感染、皮肤病或腰椎术后未愈者禁针。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["GV5", "悬枢", "xuan shu", 5, "在脊柱区，第1腰椎棘突下凹陷中，后正中线上；俯卧取穴", "向上斜刺0.5～1寸；可灸", "健脾和胃、强腰固肾、涩肠止泻", "腰脊强痛；泄泻、腹痛、完谷不化；脱肛", null, "沿棘突上缘向上斜刺，缓慢捻转行针，使局部酸胀；可艾条温和灸或温针灸。", "深部为椎管，针刺须缓慢并控制深度，出现下肢放电样麻感应立即退针。", "孕妇腰骶部禁针灸；局部皮肤感染或破溃处禁针。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["GV6", "脊中", "ji zhong", 6, "在脊柱区，第11胸椎棘突下凹陷中，后正中线上；俯卧取穴", "向上斜刺0.5～1寸；可灸", "健脾利湿、宁神定志、强健腰脊", "泄泻、痢疾、脱肛、便血；癫痫、小儿疳积；腰脊强痛、黄疸", null, "针尖向上斜刺，捻转为主、手法宜轻，得气后留针；可艾条温和灸。", "深面为脊髓与椎管，严禁直刺深刺或大幅提插；本穴传统记载不宜灸，临床施灸须谨慎并遵教材与医师意见。", "孕妇腰背部禁针灸；局部皮肤感染、脊柱畸形或病变处禁针。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["GV7", "中枢", "zhong shu", 7, "在脊柱区，第10胸椎棘突下凹陷中，后正中线上；俯卧取穴", "向上斜刺0.5～1寸；可灸", "健脾和胃、疏利肝胆、强腰止痛", "胃痛、腹胀、食欲不振、呕吐；黄疸、胁痛；腰背强痛", null, "沿棘突上缘向上斜刺，行捻转手法，得气后留针10～20分钟；可艾条温和灸。", "穴下为棘间韧带与椎管，胸段椎管较窄，须浅刺缓进，防止刺伤脊髓。", "孕妇腰背部禁针灸；局部皮肤感染、破溃者禁针。请以教材、国家标准和专业医师指导为准。", null, null, false, null],

  ["GV25", "素髎", "su liao", 25, "在面部，鼻尖正中央处；正坐或仰靠取穴", "向上斜刺0.3～0.5寸，或点刺出血；不宜灸", "通利鼻窍、泄热开窍、回阳救逆", "鼻塞、鼻渊、鼻衄、酒齄鼻；昏迷、晕厥、休克；小儿惊风", null, "针尖向上斜刺，小幅度捻转或轻浅提插，得气即止；急救可用三棱针点刺出血，须严格消毒。", "鼻尖部组织菲薄、血运丰富，针刺疼痛明显且易出血，进针不可过深；本穴传统不灸，急救放血须由专业医师操作。", "鼻部皮肤感染、酒齄鼻破溃或鼻部术后未愈者禁针灸；有出血倾向者禁点刺放血。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["GV26", "水沟", "shui gou", 26, "在面部，人中沟上1/3与中1/3交点处；正坐或仰靠取穴", "向上斜刺0.3～0.5寸，或指掐；急救用雀啄法，不宜灸", "醒脑开窍、回阳救逆、清热息风", "昏迷、晕厥、休克、中暑；癫狂痫、小儿惊风；口眼歪斜、急性腰扭伤", ["交会穴"], "针尖向上斜刺，采用雀啄泻法，强刺激至患者眼球湿润或流泪为度；急救可先用拇指指甲重掐按压。", "本穴刺激强烈，面部血管丰富，针刺易出血，出针后应按压；不可向外侧深刺，以免损伤鼻部组织与血管。", "局部皮肤感染、破溃者禁针灸；本穴不灸；有出血倾向者慎用强刺激手法。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["GV27", "兑端", "dui duan", 27, "在面部，上唇尖端，人中沟下端的皮肤与唇红移行处；正坐或仰靠取穴", "向上斜刺0.2～0.3寸，或点刺出血；不宜灸", "清热开窍、息风止痉、消肿止痛", "昏迷、晕厥、癫狂痫；口歪、齿龈肿痛、口疮；鼻衄", null, "针尖向上斜刺，轻捻得气即止；实热证可三棱针点刺出血，须严格消毒。", "唇部组织薄、血管丰富，针刺疼痛明显且易出血，进针宜浅；癫痫发作时不可强行针刺，须先保护患者防止咬伤。", "唇部感染、溃疡或疱疹处禁针灸；有出血倾向者禁点刺放血。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["GV28", "龈交", "yin jiao", 28, "在上唇内，上唇系带与上齿龈的交点处；正坐或仰靠、向上掀唇取穴", "向上斜刺0.2～0.3寸，或点刺出血；不宜灸", "清热消肿、通利龈齿、醒脑开窍", "牙龈肿痛、口疮、口臭；鼻渊、鼻塞；癫狂痫、腰痛", ["交会穴"], "掀起上唇，针尖向上斜刺，轻捻得气即止；痔疾与口腔疾患可用三棱针点刺出血，须严格消毒。", "口腔黏膜血运丰富、易出血且消毒条件要求高，针刺须严格无菌操作；针后嘱患者勿立即进食、漱口，必要时用消毒棉球压迫。", "口腔黏膜溃疡、感染、齿龈急性炎症或有出血倾向者禁针刺及放血。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  /* ---- 经外奇穴·头颈部（10 穴） ---- */
  ["EX-HN1", "四神聪", "si shen cong", 1, "在头顶部，百会前、后、左、右各旁开1寸，共4穴；正坐或仰卧位取穴，先定百会再向四方量取", "沿头皮平刺0.5～0.8寸，可向前后或左右透刺；可灸", "醒脑开窍、安神定志、清头明目", "头痛、眩晕、失眠、健忘；癫痫；目疾", null, "针身与头皮呈15度左右夹角刺入帽状腱膜下层，得气后行捻转手法；也可对准百会方向透刺，留针期间可配合电针", "头皮血管丰富，出针后按压片刻以防皮下血肿；小儿囟门未闭者禁刺；局部有感染、破溃或瘢痕时避开进针", "囟门未合者禁用；不宜大幅提插以免损伤骨膜。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["EX-HN2", "当阳", "dang yang", 2, "在头部，瞳孔直上，前发际上1寸处；正坐或仰卧位取穴，左右各一", "沿皮平刺0.3～0.5寸；可灸", "清头明目、疏风通窍", "头痛、头昏、眩晕；目赤肿痛、鼻塞", null, "针尖向后或向下沿皮刺入，行小幅捻转，局部以酸胀感为主，一般留针20～30分钟", "本穴靠近发际，进针宜浅；婴幼儿囟门未闭或局部皮肤破损者不宜针刺", "局部感染者禁刺；不宜深刺伤及骨膜。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["EX-HN3", "印堂", "yin tang", 3, "在头部，两眉毛内侧端中间的凹陷中；正坐或仰卧取穴", "提捏局部皮肤，向下平刺0.3～0.5寸；或用三棱针点刺出血；可灸", "安神定志、通鼻开窍、清头明目", "头痛、眩晕、失眠；鼻渊、鼻塞、鼻衄；目痛", null, "提捏眉间皮肤后针尖向下沿皮刺入，行轻捻转手法；鼻病可向鼻根方向透刺，局部胀感可向鼻部扩散", "该处皮肤薄、血管较浅，点刺出血须严格消毒并压迫止血；不宜深刺与大幅提插", "局部皮肤感染或破损者禁刺。请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["EX-HN4", "鱼腰", "yu yao", 4, "在额部，瞳孔直上，眉毛的中点处；正坐或仰卧，闭目取穴，左右各一", "沿皮平刺0.3～0.5寸；禁灸", "疏风明目、通络止痛", "眉棱骨痛、眼睑下垂、眼睑瞤动；目赤肿痛", null, "向眉头或眉尾方向沿皮透刺，进针宜缓，以局部酸胀为度，不行大幅度提插", "穴在眼睑上方，操作须轻缓，出针后按压以防眼睑血肿；不可向眶内深刺", "禁灸；局部感染或眼睑水肿明显者不宜针刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["EX-HN5", "太阳", "tai yang", 5, "在颞部，眉梢与目外眦之间向后约一横指的凹陷中；正坐或仰卧取穴，左右各一", "直刺或斜刺0.3～0.5寸；或用三棱针点刺出血；可灸", "清热消肿、清头明目、疏风止痛", "偏正头痛、目赤肿痛、目眩；齿痛、面痛", null, "向后下方斜刺，局部酸胀可扩散至同侧颞部；点刺出血须消毒后轻刺，出血量宜少", "该处有颞浅动静脉经过，进针与点刺前宜避开搏动明显的血管，出针后按压止血", "局部皮肤感染、溃疡者禁刺；出血倾向者慎用点刺放血。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["EX-HN6", "耳尖", "er jian", 6, "在耳区，折耳向前时耳廓上方的尖端处；正坐或侧伏位取穴，左右各一", "直刺0.1～0.2寸；或三棱针点刺出血；可灸", "清热消肿、清脑明目、息风止痛", "目赤肿痛、目翳、咽喉肿痛；偏正头痛、高热、麦粒肿", null, "多采用点刺放血：先揉按耳廓使其充血，消毒后快速点刺，挤出少量血液并以干棉球压迫止血", "耳廓血供相对不足，须严格消毒、放血量适度，避免感染导致耳廓软骨膜炎；冬季注意局部保暖", "耳廓局部冻伤、感染、湿疹者禁用；凝血功能障碍者慎用放血。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["EX-HN7", "球后", "qiu hou", 7, "在眶区，眶下缘外1/4与内3/4交界处；仰靠或仰卧位，闭目，眼球向上轻推后取穴，左右各一", "轻推眼球向上固定，沿眶下缘缓慢直刺0.5～1寸，不提插不捻转；禁灸", "清热明目、通络退翳", "目赤肿痛、目翳、视物昏蒙；目眶疼痛", null, "选用细针，进针后仅作小幅缓慢捻转或留针，出针后按压针孔1～2分钟并观察有无眼球胀痛、复视", "眼区高危穴位：须由针灸专业医师操作；进针务必缓慢、不可提插捣刺，如出现剧痛、眼球突出或复视应立即停止并处理；出针后按压以防眶内出血", "禁灸；青光眼、严重眼内疾病、眶内占位或出凝血异常者禁用。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["EX-HN8", "上迎香", "shang ying xiang", 8, "在面部，鼻翼软骨与鼻甲的交界处，近鼻唇沟上端；正坐或仰卧取穴，左右各一", "向内上方斜刺0.3～0.5寸；可灸", "通鼻开窍、疏风清热", "鼻塞、鼻渊、鼻息肉、鼻衄；头痛、迎风流泪", null, "针尖朝内上方沿鼻翼缘缓慢刺入，局部以酸胀感为度，一般留针15～20分钟", "穴近鼻腔与眼区，进针方向与深度须严格控制，不可向眼眶方向深刺；局部血管丰富，出针后按压以防出血", "鼻部及面部急性感染、酒渣鼻溃破者不宜针刺。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["EX-HN9", "内迎香", "nei ying xiang", 9, "在鼻孔内，与上迎香相对的鼻腔黏膜上；仰靠位，略掀鼻翼后取穴，左右各一", "三棱针点刺出血，出血量宜少；不灸，不留针", "清热开窍、通鼻消肿", "鼻塞、鼻渊、鼻部红肿；咽喉肿痛、中暑、眩晕", null, "充分暴露鼻腔黏膜，消毒后以三棱针轻点黏膜表面使其少量出血，随后以消毒干棉球填塞压迫止血", "鼻腔黏膜血管密集且位置特殊，属高危点刺区：须由专业医师操作，动作轻快、切忌深入；出血体质或鼻腔炎症明显者不宜进行；老人、儿童慎用", "鼻腔急性炎症、鼻部溃疡、凝血功能障碍者禁用；不做深刺与留针。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["EX-HN10", "翳明", "yi ming", 10, "在项部，翳风后1寸处；正坐或俯伏位，耳垂后方与乳突之间的凹陷后量取，左右各一", "直刺0.5～1寸，亦可向眼眶方向透刺；可灸", "聪耳明目、宁心安神、疏风通络", "耳鸣、耳聋、目疾、失眠；头痛、眩晕", null, "针尖略向内下缓慢直刺，以局部酸胀并向颞部或耳部放散为佳，留针20分钟左右", "项部高危穴位：深部邻近颈动脉鞘、迷走神经与椎动脉走行区，禁止盲目深刺与大幅提插；须由专业医师操作，出现头晕、心慌或肢体麻木感立即停止", "颈部血管病变、严重颈椎病不稳定者慎用。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  /* ---- 经外奇穴·胸腹部（2 穴） ---- */
  ["EX-CA1", "子宫", "zi gong", 1, "在下腹部，脐中下4寸，前正中线旁开3寸；左右各一。仰卧取穴，先定中极（脐中下4寸）再水平旁开3寸，或由耻骨联合上缘中点向上量1寸为准", "直刺0.8～1.2寸；可灸，宜艾条温和灸", "调经止带、理气止痛、升提固脱", "月经不调、痛经、经闭、带下；阴挺（子宫脱垂）、不孕；少腹坠痛、疝气", null, "仰卧并排空膀胱，直刺或向耻骨联合方向斜刺，得气以少腹酸胀、可向外阴部放散为佳，留针20～30分钟；妇科虚寒证多配艾条温和灸10～15分钟，阴挺常与关元、气海、三阴交同用。", "穴区深面为小肠、膀胱，女性深面为子宫与附件，须排空膀胱后进针并控制深度，不可大幅提插捣刺，以防刺伤脏器或引起出血。", "孕妇禁针禁灸；膀胱充盈时针刺属禁忌；下腹部急性炎症、肿块性质未明或腹部手术后早期禁用。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["EX-CA2", "三角灸", "san jiao jiu", 2, "在下腹部，以患者两口角之间的长度为准作等边三角形，顶点置于脐心，底边水平，两底角处即是；左右各一，灸时据病位左右取用", "以灸法为主，艾炷无瘢痕灸或艾条温和灸，一般不作针刺", "温经散寒、行气止痛、升提固脱", "疝气、少腹冷痛、睾丸坠痛；痛经、月经不调；肠鸣腹痛、腹泻", null, "仰卧暴露腹部，以艾炷着肤无瘢痕灸5～7壮，或艾条悬灸10～15分钟，以局部皮肤红晕、温热舒适为度；习惯左病取右、右病取左，亦可两侧同灸，每日或隔日1次，多配关元、气海、三阴交。", "穴在脐旁下腹，皮肤较薄，施灸须控制艾炷大小、及时更换以防烫伤起疱；灸法奏效需连续多个疗程，不可因短期未效而自行加大灸量。", "孕妇禁用；局部皮肤破损、感染、溃疡或瘢痕处禁灸；疝气发生嵌顿、剧痛、呕吐等急症表现时须立即转外科处理，不得依赖本法。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  /* ---- 经外奇穴·背部（4 穴） ---- */
  ["EX-B1", "定喘", "ding chuan", 1, "在背部，第7颈椎棘突下，旁开0.5寸处；左右各一，正坐低头或俯卧位取穴", "直刺0.5～0.8寸，或向脊柱方向斜刺0.5～1寸；可灸", "止咳平喘、通宣理肺、舒筋通络", "哮喘、咳嗽、气急；落枕、肩背痛；上肢疼痛不遂", null, "针尖略向内下方斜刺，使针感向肩背或胸前放散；艾条温和灸5～15分钟，或艾炷灸3～5壮，亦可用穴位贴敷。", "本穴位于颈胸交界，深部为肺尖与胸膜顶，严禁直刺过深或大幅提插，以防造成气胸；不宜长时间强刺激。", "局部皮肤感染、溃疡、瘢痕或严重骨质疏松者不宜针刺；孕妇及体弱者慎用强刺激；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["EX-B2", "夹脊", "jia ji", 2, "在背腰部，第1胸椎至第5腰椎各棘突下旁开0.5寸，一侧17穴；左右各一，俯卧位取穴", "直刺0.3～0.5寸，或向脊柱方向斜刺0.5～1寸；可灸", "调理脏腑、舒筋通络、通调气血", "上胸部穴主治心肺与上肢病证，下胸部穴主治胃肠病证，腰部穴主治腰腹及下肢病证", null, "按病变节段选取相应穴位，针尖偏向脊柱方向斜刺，使针感沿肋间或向腰腹放散；可配合艾灸、拔罐或电针。", "胸段夹脊穴深部为肋间隙与胸膜，颈椎段邻近椎动脉与脊髓，均须控制进针深度与角度，不可向内深刺；操作应由专业人员施行。", "脊柱结核、肿瘤、骨折、严重畸形或局部感染者禁用；凝血功能障碍者禁用针刺；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["EX-B3", "胃脘下俞", "wei wan xia shu", 3, "在背部，第8胸椎棘突下，旁开1.5寸处；左右各一，俯卧位取穴", "斜刺0.5～0.8寸，针尖向脊柱方向；可灸", "和胃止痛、健脾理气、生津止渴", "胃痛、腹痛、胸胁痛；消渴；咽干", null, "向内下方斜刺，使针感向胸腹或胃脘部传导；艾灸5～15分钟或艾炷灸3～5壮。", "穴下为胸廓下部，深部即为胸膜与肺下叶，禁止直刺深刺以防气胸；肝脾肿大者更须浅刺。", "局部皮肤破损、感染或严重心肺功能不全者慎用；孕妇不宜强刺激；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["EX-B4", "腰眼", "yao yan", 4, "在腰区，第4腰椎棘突下，旁开约3.5寸的凹陷中；左右各一，俯卧位取穴", "直刺0.5～1寸；可灸", "强腰健肾、活血通络、调经止带", "腰痛、腰肌劳损、腰腿痛；月经不调、带下；尿频", null, "直刺或略向脊柱方向斜刺，使局部酸胀感向腰骶放散；艾条温和灸10～15分钟，或拔罐、推拿。", "本穴位于腰部软组织，进针不宜过深，以免伤及肾脏与腰神经；消瘦者尤须浅刺。", "腰部皮肤感染、开放性损伤或腰椎骨折急性期禁用；孕妇禁针禁灸；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  /* ---- 经外奇穴·上肢（11 穴） ---- */
  ["EX-UE1", "肘尖", "zhou jian", 1, "在肘后部，屈肘成直角，尺骨鹰嘴的尖端处；只此一穴，取穴时令患者屈肘，于肘尖最高点定取", "以艾炷灸或艾条温和灸为主，可灸5～7壮或10～15分钟；一般不针，需针刺时沿皮浅刺0.1～0.2寸，不可深刺入肘关节腔", "消肿散结、清热化痰、通络止痛", "瘰疬、痰核；疔疮、痈疽等疮疡肿毒；肘臂疼痛", null, "艾炷着肤灸以局部温热、皮肤微红为度，化脓灸须由专业医师掌握；若用针刺，只作沿皮浅刺，得气即可，不留针或短暂留针", "肘尖紧邻尺骨鹰嘴与肘关节囊，深刺易伤及关节腔、骨膜与尺神经，须严格避免；化脓灸创伤较大，须防感染并保持灸疮清洁", "局部皮肤破损、感染、溃疡或骨结核活动期禁灸禁针；瘰疬已破溃流脓者不宜在溃口处施灸；请以教材、国家标准和专业医师指导为准。", null, null, false, null],
  ["EX-UE2", "二白", "er bai", 2, "在前臂前区，腕掌侧远端横纹上4寸，桡侧腕屈肌腱的两侧，一臂2穴，左右各一；伸臂仰掌，于肌腱桡侧与尺侧分别定取", "直刺0.5～1寸，得气后可行提插捻转；可灸，艾条温和灸5～10分钟，或艾炷灸3～5壮", "调理气血、止痔止血、缓急止痛", "痔疮、痔漏下血、脱肛；胸胁疼痛；前臂疼痛", null, "两穴可同时进针，进针时避开桡侧腕屈肌腱，针尖直抵肌腱两侧的肌间沟；留针15～20分钟，期间可行针1～2次", "进针须避开桡侧腕屈肌腱，不宜沿肌腱纤维方向反复捣刺；邻近桡动脉与正中神经，出现触电样放散感时应立即退针并调整方向", "局部皮肤感染、破损或瘢痕粘连明显处不宜针刺；孕妇及有出血倾向者慎用；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["EX-UE3", "中泉", "zhong quan", 3, "在前臂后区，腕背侧远端横纹上，指总伸肌腱桡侧的凹陷中，左右各一；伸臂俯掌或握拳取穴，于腕背横纹中点的桡侧凹陷处定取", "直刺0.3～0.5寸，或向掌侧斜刺0.5～0.8寸；可灸，艾条温和灸5～10分钟", "理气宽胸、和胃止痛、舒筋利节", "胸闷、心痛、咳嗽气喘；胃痛、腹胀；腕臂疼痛、掌指关节痛", null, "握拳时指总伸肌腱显露更清楚，便于辨识凹陷；针刺得气后留针15～20分钟，腕部活动不利者可配合小幅捻转手法", "穴下即为腕背关节囊与伸肌腱，进针不宜过深或向上斜刺，以免刺入关节腔或损伤肌腱；手背静脉网丰富，出针后应按压片刻防血肿", "腕背局部红肿、感染、痛风急性发作期禁刺；有出血倾向或正服用抗凝药物者慎用；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["EX-UE4", "中魁", "zhong kui", 4, "在手指，中指背面，近侧指间关节横纹的中点处，左右各一；屈指时于横纹中点定取", "以艾炷灸或艾条温和灸为主，可灸3～5壮或5～10分钟；一般不针，必要时浅刺0.1～0.2寸，或三棱针点刺出血", "降逆和胃、止呕止呃、宽胸利膈", "噎膈、反胃、呕吐、呃逆；食欲不振；指关节疼痛", null, "施灸多采用小艾炷着肤灸，以局部潮红、患者觉温热而能耐受为度；点刺出血须以75%酒精常规消毒后操作，出血1～2滴即可", "指背皮肤薄、皮下组织少，艾灸须防烫伤起疱，瘢痕体质者不宜着肤灸；针刺或点刺易出血、疼痛明显，须严格消毒并压迫止血", "指关节局部红肿、感染、开放性损伤或甲沟炎时禁针禁灸；糖尿病末梢循环差、凝血功能异常者慎用点刺；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["EX-UE5", "大骨空", "da gu kong", 5, "在手指，拇指背面，指间关节横纹的中点处，左右各一；屈拇指时于横纹中央定取", "以艾炷灸或艾条温和灸为主，可灸3～5壮或5～10分钟；一般不针，必要时浅刺0.1～0.2寸，或三棱针点刺出血", "退翳明目、疏风止泪、通络止痛", "目痛、目翳、目赤肿痛、迎风流泪等眼疾；拇指关节痛、屈伸不利", null, "施灸宜用小艾炷，灸至局部温热发红即可，不宜久灸伤及指背皮肤；用于目疾时可配合眼周腧穴同用，点刺出血以1～2滴为度", "穴在拇指指间关节背面，皮肤与腱膜菲薄，深刺或反复捻转易损伤指背腱膜与关节囊；灸法须防烫伤，点刺须严格消毒", "拇指关节肿胀、感染、类风湿急性期或局部皮肤破损者禁针禁灸；瘢痕体质、凝血障碍者慎用；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["EX-UE6", "小骨空", "xiao gu kong", 6, "在手指，小指背面，近侧指间关节横纹的中点处，左右各一；屈小指时于横纹中央定取", "以艾炷灸或艾条温和灸为主，可灸3～5壮或5～10分钟；一般不针，必要时浅刺0.1～0.2寸，或三棱针点刺出血", "明目止痛、清热利窍、通利关节", "目赤肿痛、目翳、迎风流泪等眼疾；小指关节疼痛、活动不利", null, "小艾炷着肤灸或艾条悬灸，注意控制灸量与距离；如用点刺，先消毒后快速浅刺，挤出血1～2滴后以干棉球按压", "小指指间关节背面皮薄少肉，灸量过大易起疱留疤，针刺宜浅；指端感觉迟钝者（如糖尿病周围神经病变）须由医师掌握灸温", "局部皮肤感染、破损、冻疮或关节急性炎症期禁针禁灸；有出血倾向者不宜点刺；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["EX-UE7", "腰痛点", "yao tong dian", 7, "在手背，第2、3掌骨间及第4、5掌骨间，腕背侧远端横纹与掌指关节的中点处，一手2穴，左右各一；俯掌，于两处掌骨间隙的中点定取", "直刺或向腕部斜刺0.3～0.5寸，得气为度；可灸，艾条温和灸5～10分钟；亦可用指压按揉代替针刺", "舒筋通络、活血止痛、滑利腰脊", "急性腰扭伤、腰肌劳损、腰痛；手指麻木、手背肿痛", null, "治急性腰扭伤多在进针得气后，令患者缓慢做腰部前屈、后伸、侧弯及旋转活动，留针15～20分钟，边行针边活动腰部", "进针后嘱患者缓慢活动腰部，避免突然大幅度转身造成晕针或组织损伤；体弱、饥饿、精神紧张者宜卧位针刺并密切观察反应", "手背局部感染、外伤或静脉炎处禁刺；孕妇、严重心肺疾病及有出血倾向者慎用；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["EX-UE8", "外劳宫", "wai lao gong", 8, "在手背，第2、3掌骨间，掌指关节后0.5寸的凹陷中，左右各一；俯掌，与掌心劳宫穴前后相对处取穴", "直刺0.5～0.8寸，得气后可行捻转手法；可灸，艾条温和灸5～10分钟，或艾炷灸3～5壮", "温中散寒、健脾消食、舒筋活络", "落枕、颈椎病所致颈项强痛；手背红肿、手指麻木；小儿消化不良、腹泻", null, "治落枕可边行针边令患者缓慢左右转动头颈，留针15～20分钟；小儿施术宜浅刺、轻刺激、不留针或短留针，亦可用指腹按揉代替", "手背静脉网丰富，进针须避开显而易见的血管，出针后按压1～2分钟以防皮下血肿；不宜穿透掌骨间隙刺入掌侧，以免损伤掌侧结构", "手背皮肤感染、湿疹、破损或静脉炎处禁刺；凝血功能差、长期服用抗凝药者慎用；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["EX-UE9", "八邪", "ba xie", 9, "在手背，第1至第5指间指蹼缘后方赤白肉际处，一手4穴，左右共8穴；微握拳或五指张开，于相邻两指间的指蹼缘后方定取", "向掌骨间斜刺0.5～0.8寸，或三棱针点刺出血；可灸，艾条温和灸5～10分钟", "祛风通络、清热消肿、舒利指节", "手背肿痛、手指麻木、指关节活动不利；头项强痛、咽痛；毒蛇咬伤、目痛", null, "针尖向掌骨间隙斜刺，得气后留针15～20分钟，肿痛明显者可在局部红肿处以三棱针散刺出血数滴后再行针刺", "指蹼处皮肤薄、血管神经浅在，进针宜浅，不可穿透掌骨间隙刺入掌侧伤及掌侧腱鞘与神经；点刺出血须严格消毒，血友病等凝血障碍者禁用刺血", "手背及指蹼局部严重感染、蜂窝织炎、外伤出血未止时禁针禁灸；毒蛇咬伤须先接受规范的抗蛇毒血清等急救处理，针刺只作辅助；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["EX-UE10", "四缝", "si feng", 10, "在手指，第2、3、4、5指掌面，近侧指间关节横纹的中央，一手4穴，左右共8穴；仰掌伸指，于四指横纹中点定取", "以三棱针或采血针快速点刺0.1～0.2寸，挤出少量黄白色黏液或血液；一般不灸，亦不留针", "消积导滞、健脾和胃、清热除烦", "小儿疳积、消化不良、厌食消瘦；小儿百日咳、咳喘；蛔虫症", null, "先以75%酒精消毒并固定手指，点刺后轻轻挤压针孔周围，使黏液或血渗出1～3滴，再用干棉球按压；每周1～2次，4次左右为1个疗程，多与捏脊、中药调理配合", "点刺为有创操作，必须一人一针、严格无菌，防止交叉感染与局部化脓；小儿肌肤娇嫩、合作性差，须固定稳妥，避免刺入过深伤及指屈肌腱与指骨骨膜", "局部皮肤感染、湿疹、疥疮或正在发热出疹者不宜点刺；严重营养不良、重度贫血、凝血功能障碍及血友病患儿禁用；请以教材、国家标准和专业医师指导为准。", null, null, true, null],

  ["EX-UE11", "十宣", "shi xuan", 11, "在手指，十指尖端，距指甲游离缘0.1寸（指寸），左右共10穴；掌心向下、手指微屈，于十指尖端正中、指甲游离缘前方0.1寸处逐一取穴", "以三棱针快速点刺出血为主，刺入约0.1寸，挤出血液1～3滴；亦可作浅刺0.1～0.2寸，不留针或短暂留针；一般不灸，不作深刺与大幅度提插捻转", "清热开窍、苏厥醒神、泄热解毒、通络止痛", "高热、神昏、惊厥、中暑；癫痫发作、小儿惊风、癔病发作；咽喉肿痛、急性吐泻、指端麻木", null, "术者一手固定患者手指并充分暴露指尖，另一手持三棱针快刺疾出，轻挤指端使血渗出1～3滴，按拇指至小指次序点刺十指，再以干棉球逐一按压止血；用于急症时须边施术边呼叫120，尽快转送医院", "本穴只作辅助急救手段，高热、昏迷、惊厥、中暑等急症必须先拨打120送医，不得因放血而延误转运与规范救治；点刺为有创操作，须一人一针、严格消毒，操作者双手与穴区皮肤均须常规消毒；指端感觉敏锐、痛感明显，操作要快、浅、准，避免深刺伤及末节指骨骨膜与指屈肌腱鞘，术后按压止血并保持针孔清洁", "出血性疾病（如血友病、血小板减少性紫癜）、凝血功能障碍者及正在服用抗凝药物者禁用点刺放血；指端局部感染、破损、甲沟炎、冻疮或皮肤病处禁用；体质极度虚弱、饥饿、晕针及孕妇慎用；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  /* ---- 经外奇穴·下肢（10 穴） ---- */
  ["EX-LE1", "髋骨", "kuan gu", 1, "在股前区，髌底外上缘直上约2寸，再向外开约1寸处；左右各一，另有在髌底内上缘直上约2寸、向内开约1寸者，合为四穴", "直刺0.5～1寸，局部酸胀为度；可艾灸3～5壮或温灸5～10分钟", "祛风除湿、舒筋活络、通利关节", "膝关节疼痛、屈伸不利；腿痛、鹤膝风、下肢痿软无力", null, "取坐位或仰卧位、膝屈曲，先定髌底上缘再量取外(内)上方凹陷进针，缓慢提插，不留针过久；虚寒证可配合温灸。", "进针宜避开髌骨骨面，靠骨缘过近易引起剧痛或针尖受阻；针后若局部出血肿胀应即刻按压止血。", "膝关节急性外伤、局部感染或皮肤破溃者不宜针刺；有出血倾向、正在抗凝治疗者慎用；孕妇不宜用强刺激。请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["EX-LE2", "鹤顶", "he ding", 2, "在膝前区，髌骨上方，髌底中点上缘的凹陷中；左右各一，屈膝取穴", "直刺0.5～0.8寸，局部酸胀；可艾灸3～5壮或温灸5～10分钟", "通利关节、活络止痛、舒筋利膝", "膝关节酸痛、屈伸不利；鹤膝风、腿足无力、下肢痿痹", null, "屈膝90度使髌骨放松，于髌底正中上缘凹陷处沿皮下浅刺或直刺，得气后行小幅提插捻转，留针15～20分钟。", "该处皮下组织薄、紧邻髌上囊与膝关节腔，进针不可过深过猛，以免刺入关节腔；针具必须严格消毒。", "膝关节肿胀积液、化脓性关节炎或局部皮肤感染者禁用；凝血功能异常者慎用；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["EX-LE3", "百虫窝", "bai chong wo", 3, "在股前区，髌底内侧端上3寸，即血海穴直上1寸处；左右各一", "直刺1～1.5寸，局部酸胀或向膝部放散；可艾灸3～5壮或温灸5～10分钟", "祛风止痒、活血杀虫、清热利湿", "风疹瘙痒、湿疹、疥癣、疮疡；蛔虫病、蛲虫病等虫积腹痛", null, "正坐屈膝或仰卧屈膝，先定血海再上量1寸取穴，直刺得气后行捻转泻法，留针15～20分钟；皮肤瘙痒症可配温和灸。", "本穴多用于皮肤瘙痒诸证，针刺不能替代皮肤病病因诊治；患处已抓破、渗出或继发感染时应避开该处皮肤进针。", "局部皮肤感染、溃疡或严重皮炎者禁针；孕妇及体虚者慎用强刺激；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["EX-LE4", "内膝眼", "nei xi yan", 4, "在膝前区，髌韧带内侧缘的凹陷中；左右各一，与外侧的膝眼穴相对，屈膝90度取穴", "向膝中斜刺0.5～1寸，局部酸胀或向膝内放散；可艾灸3～5壮或温灸5～10分钟", "活血通络、疏利关节、消肿止痛", "膝关节酸痛、屈伸不利、鹤膝风；下肢痿痹、脚气", null, "屈膝使髌韧带紧张、凹陷显露，针尖略向内上方朝膝关节腔方向斜刺，得气后行小幅提插捻转，留针15～20分钟。", "穴下即为膝关节腔与髌下脂肪垫，斜刺角度与深度必须控制，不宜反复大幅提插；关节明显积液或红肿发热时不宜深刺。", "膝关节化脓性感染、结核、急性创伤肿胀者禁用；安装关节假体或局部皮肤破损者禁针；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["EX-LE5", "膝眼", "xi yan", 5, "在膝前区，髌韧带两侧凹陷处，内侧的称内膝眼、外侧的称外膝眼（即犊鼻）；左右各一，屈膝取穴", "向膝中斜刺0.5～1寸，局部酸胀或向膝内放散；可艾灸3～5壮或温灸5～10分钟", "活血通络、疏利关节、消肿止痛", "膝关节疼痛、屈伸不利、鹤膝风；下肢痿痹、脚气、腿痛", null, "屈膝90度，于髌韧带两侧凹陷分别进针，针尖向膝中方向斜刺，得气后捻转留针15～20分钟；两穴常同时取用。", "外侧膝眼邻近胫骨外侧髁与关节间隙，深刺易入关节腔；一次不宜在同侧两穴同时行大幅度强刺激，以免局部反应过重。", "膝关节急性炎症、积液、化脓或局部皮肤感染者禁针；有出血倾向者慎用；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["EX-LE6", "胆囊", "dan nang", 6, "在小腿外侧，腓骨小头前下方凹陷（阳陵泉）直下2寸处；左右各一，也可在阳陵泉下1～2寸范围内寻找明显压痛点定穴", "直刺1～1.5寸，局部酸胀并可向足部放散；可艾灸3～5壮或温灸5～10分钟", "疏肝利胆、清热利湿、理气止痛", "急慢性胆囊炎、胆石症、胆道蛔虫症所致的右胁及上腹疼痛；口苦、黄疸；下肢痿痹、胁痛", null, "正坐或仰卧屈膝，先在阳陵泉下按寻最敏感处再进针，直刺得气后行捻转泻法，留针20～30分钟，疼痛发作期可间歇行针。", "本穴以缓解胆道症状为主，急腹症须同时接受现代医学检查与处理，不可仅凭针刺延误诊断；针刺不能替代排石或抗感染治疗。", "胆道急性梗阻、化脓性胆管炎、胆囊穿孔等急危重症及剧痛原因不明者，禁用针刺代替急救处理；孕妇慎用；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["EX-LE7", "阑尾", "lan wei", 7, "在小腿前外侧，犊鼻（外膝眼）下5寸，胫骨前嵴向外旁开1寸处；左右各一，也可在足三里下1.5～2寸范围内寻找明显压痛点定穴", "直刺1.5～2寸，局部酸胀并可向足背放散；可艾灸3～5壮或温灸5～10分钟", "清热解毒、理气活血、消肿止痛", "急慢性阑尾炎、阑尾周围脓肿所致的右下腹疼痛；消化不良、腹胀；下肢痿痹、足下垂", null, "仰卧屈膝或正坐垂足，于足三里下按压寻得敏感点后直刺，得气后行较强捻转泻法，留针30分钟以上，急性期可每日多次施治。", "本穴对阑尾炎仅有辅助缓解作用，疑似急性阑尾炎必须立即就医评估，出现腹膜刺激征、高热或疼痛加剧时应停止自行针刺；不可因针刺而延误手术时机。", "阑尾穿孔、弥漫性腹膜炎等外科急症禁用针刺替代手术；局部皮肤感染或下肢静脉炎者禁针；孕妇慎用；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["EX-LE8", "内踝尖", "nei huai jian", 8, "在踝区，足内侧面，内踝最凸起处的中点；左右各一，正坐垂足或仰卧取穴", "直刺0.2～0.3寸，或用三棱针点刺出血；可艾灸3～5壮或温灸5～10分钟", "清热利咽、通络止痛、舒筋活络", "牙痛、乳蛾（扁桃体炎）、咽喉肿痛；脚气、小腿内侧肌痉挛、内踝扭伤疼痛", null, "暴露内踝最高点，以指切法固定皮肤后浅刺，或消毒后用三棱针快速点刺放血数滴；不宜深刺与大幅提插。", "内踝处皮肤薄、紧贴骨膜，深刺易刺伤骨膜引起剧痛，且穴下有隐神经与内踝前动脉通行，点刺放血必须严格无菌操作并压迫止血。", "局部皮肤感染、溃疡、血肿者禁针；血友病及血小板明显减少、正在抗凝治疗者禁用点刺放血；糖尿病足或下肢静脉曲张处慎用；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["EX-LE9", "外踝尖", "wai huai jian", 9, "在踝区，足外侧面，外踝最凸起处的中点；左右各一，正坐垂足或仰卧取穴", "直刺0.2～0.3寸，或用三棱针点刺出血；可艾灸3～5壮或温灸5～10分钟", "舒筋活络、通利关节、清热消肿", "脚气、外踝扭伤肿痛、足趾拘挛；淋证、小便不利；牙痛", null, "于外踝最高点以指切法固定皮肤后浅刺，或三棱针点刺挤出少量血液，针后按压针孔；同一部位不宜反复多次放血。", "外踝皮下即为腓骨骨面与腓骨长、短肌腱，穴下有腓肠神经与小隐静脉走行，禁用粗针深刺或大幅提插，以免伤及神经、血管与肌腱。", "局部皮肤感染、破损、急性严重踝扭伤伴明显血肿者禁针；凝血功能障碍、抗凝治疗期间禁用点刺放血；下肢静脉曲张及糖尿病足患者慎用；请以教材、国家标准和专业医师指导为准。", null, null, true, null],
  ["EX-LE10", "八风", "ba feng", 10, "在足背，第1至第5趾间，各趾蹼缘后方赤白肉际处；左右各一，每足4穴，共8穴", "向足背方向斜刺0.5～0.8寸，局部酸胀；或用三棱针点刺出血；可艾灸3～5壮或温灸5～10分钟", "祛风通络、清热解毒、消肿止痛", "足跗肿痛、趾痛、脚气、足趾麻木拘挛；毒蛇咬伤、局部疮疡肿痛；牙痛、头痛", null, "仰卧或正坐垂足，于足背趾缝纹头赤白肉际处向上斜刺，得气后捻转留针10～15分钟；红肿热痛者可用三棱针点刺放血。", "趾缝间皮肤薄、易藏菌，针刺与放血均须严格消毒，针后保持干燥以防感染；下肢静脉曲张、糖尿病足或已有足癣破溃者慎用，放血不宜过深。", "足部皮肤感染、溃疡、坏疽及糖尿病足溃疡者禁用；凝血功能严重异常者禁用点刺放血；孕妇慎用；请以教材、国家标准和专业医师指导为准。", null, null, true, null],

var DISEASES = [
  { id:"dis-constipation", name:"便秘", category:"内科", alias:["功能性便秘"], overview:"以大便秘结不通、排便周期延长或排便艰涩难下为主症的病证，可伴腹胀、口臭、纳差。多因肠胃积热、气机郁滞、气虚推动无力或阴血津液不足所致。", mainPoints:["ST25","TE6","ST36","BL25","CV6"], adjunctPoints:["SP6","LR3","SP15","KI6","EX-B2","EX-UE10"], patternAdd:[{"pattern":"热秘","points":["LI11","ST44"]},{"pattern":"气秘","points":["LR3","GB34"]},{"pattern":"气虚秘","points":["CV6","BL20"]},{"pattern":"血虚秘","points":["SP6","BL17"]}], cautions:"针刺以通调腑气、润肠通便为主，腹部穴位宜缓慢进针并控制深度。应配合增加饮水、膳食纤维与适度活动，养成规律排便习惯。便秘近期明显加重或伴便血、消瘦、腹部包块者，须先就医排除肠道器质性疾病后再行针灸。请以教材、国家标准和专业医师指导为准。", contraindications:"肠梗阻、肠道肿瘤、消化道出血或急腹症所致便秘禁用针刺，须立即转诊；孕妇忌针下腹部、腰骶部穴位及合谷、三阴交等易致堕胎之穴；腹部手术后短期内及局部皮肤感染、破溃处禁针。请以教材、国家标准和专业医师指导为准。", courseHint:"", tags:["肠腑","常用"], source:makeSource('B1') },
  { id:"dis-insomnia", name:"不寐", category:"内科", alias:["失眠"], overview:"以经常不能获得正常睡眠为特征，表现为入睡困难、睡眠浅易醒、醒后难以再睡甚或彻夜不眠，常伴心悸、健忘、头晕、乏力。多与情志所伤、饮食不节、劳倦及病后体虚有关。", mainPoints:["HT7","SP6","GV20","PC6","BL62"], adjunctPoints:["KI6","ST36","BL15","BL20","EX-HN1","EX-HN3","EX-HN10"], patternAdd:[{"pattern":"心脾两虚","points":["BL20","BL15"]},{"pattern":"肝郁化火","points":["LR3","GB34"]},{"pattern":"心肾不交","points":["KI3","KI1"]},{"pattern":"痰热扰心","points":["ST40","PC7"]}], cautions:"针刺以宁心安神、调和阴阳为主，宜在下午或傍晚操作，手法以轻柔平稳为佳。应配合规律作息、减少午后咖啡因摄入并进行情志调摄。若失眠由焦虑抑郁情绪障碍、疼痛或呼吸系统疾病引起，或长期依赖安眠药物，须同时接受相应专业医疗处理。请以教材、国家标准和专业医师指导为准。", contraindications:"严重精神障碍急性期、酒精或镇静药物戒断状态者不宜单独针刺，须转精神心理专科处理；局部皮肤感染、破溃处禁针；有出血倾向或正使用抗凝药物者慎针；孕妇针刺须由专业医师评估，避免强刺激。请以教材、国家标准和专业医师指导为准。", courseHint:"", tags:["心神","常用"], source:makeSource('B1') },
  { id:"dis-hiccup", name:"呃逆", category:"内科", alias:["膈肌痉挛","打嗝"], overview:"以气逆上冲、喉间呃呃连声、声短而频、难以自制为主症。多因饮食不节、情志失调或久病耗伤致胃失和降、膈间气机不利，辨证分寒、热、气滞与虚证。", mainPoints:["CV12","PC6","BL21","ST36","CV22"], adjunctPoints:["LR3","SP4","EX-UE4","BL17","KI3"], patternAdd:[{"pattern":"胃中寒冷","points":["CV4","BL20","ST34"]},{"pattern":"胃火上逆","points":["ST44","LI11","PC8"]},{"pattern":"气机郁滞","points":["LR14","PC6","GB34"]},{"pattern":"脾胃阳虚","points":["CV6","BL20","BL21"]}], cautions:"针刺以和胃降逆、宽膈利气为主，虚寒者可用温和灸，实热者宜泻法；中魁穴多用小艾炷灸或浅刺，点刺出血须严格消毒。若呃逆持续超过四十八小时、反复发作难以缓解，或伴随吞咽困难、体重下降、胸腹痛、呕吐者，须及时就医查明是否存在脑卒中、膈下感染、肿瘤或代谢紊乱等病因，不可自行长期反复针刺。请以教材、国家标准和专业医师指导为准。", contraindications:"上腹部穴位在过饱、胃高度扩张或近期腹部手术后禁深刺，以防刺入腹腔脏器；急腹症、膈下脓肿、疑似脑血管意外所致呃逆者禁用针刺替代诊疗，须立即转诊；局部皮肤感染、破溃处禁针；孕妇腹部及腰骶部穴位禁针，婴幼儿与体弱者须由专业医师操作。请以教材、国家标准和专业医师指导为准。", courseHint:"", tags:["脾胃","气逆"], source:makeSource('B1') },
  { id:"dis-abdominal-pain", name:"腹痛", category:"内科", alias:["胃脘以下腹痛","功能性腹痛"], overview:"指胃脘以下、耻骨毛际以上部位发生疼痛的病证，可表现为胀痛、冷痛、灼痛、刺痛或隐痛，常伴腹胀、排便异常。病机为脏腑气机不利、脉络挛急或失于温养，辨证须先分清寒热虚实与部位。", mainPoints:["CV12","ST25","PC6","ST36","LR3"], adjunctPoints:["SP6","BL25","SP4","CV6","EX-B3"], patternAdd:[{"pattern":"寒邪内积","points":["CV4","BL20","ST34","EX-CA2"]},{"pattern":"饮食停滞","points":["ST21","SP9","CV13"]},{"pattern":"肝郁气滞","points":["LR14","GB34","PC6"]},{"pattern":"脾阳不振","points":["CV6","BL20","BL21"]}], cautions:"针刺前必须明确腹痛性质，虚寒者可用温和灸温中散寒。若腹痛突然加剧、拒按、腹肌板硬，或伴发热、呕吐、便血、停止排气排便、冷汗晕厥，须警惕急性阑尾炎、肠梗阻、穿孔、胰腺炎、宫外孕等急腹症，应立即就医接受专业医疗处理，严禁自行针刺或服用止痛药掩盖病情。请以教材、国家标准和专业医师指导为准。", contraindications:"急腹症、腹膜炎、腹腔内出血及诊断未明的剧烈腹痛禁用针刺，须立即转诊；腹部穴位在过饱、尿潴留、腹部肿块性质未明或近期腹部手术后禁深刺；孕妇下腹部与腰骶部穴位禁针；局部皮肤感染、破溃处禁针。请以教材、国家标准和专业医师指导为准。", courseHint:"", tags:["脾胃","痛证"], source:makeSource('B1') },
  { id:"dis-common-cold", name:"感冒", category:"内科", alias:["上呼吸道感染","伤风"], overview:"由外邪犯肺卫引起的常见外感病证，以鼻塞、流涕、喷嚏、咽痒或痛、恶寒发热、周身酸楚为主症。辨证重在分辨风寒、风热与暑湿，并注意体虚反复易感者。", mainPoints:["LI4","LU7","GV14","BL12","GB20"], adjunctPoints:["TE5","LI11","ST36","LU10","EX-HN3"], patternAdd:[{"pattern":"风寒证","points":["TE5","BL13"]},{"pattern":"风热证","points":["LI11","LU10"]},{"pattern":"暑湿证","points":["PC6","SP9"]},{"pattern":"气虚易感","points":["ST36","CV6"]}], cautions:"针刺以疏风解表、宣通肺卫为主，风寒者可配合温和灸，风热者宜浅刺疾出。治疗期间注意休息、保暖与补充水分。高龄、婴幼儿、孕妇及有心肺基础病者病情变化快，若出现高热不退、气促、胸痛或神志改变，应及时就医明确诊断并接受专业医疗处理，不可仅依赖针刺。请以教材、国家标准和专业医师指导为准。", contraindications:"高热、明显气促或已确诊肺炎等重症者不宜以针刺作为主要处理手段，须转诊；局部皮肤感染、破溃处禁针；有出血倾向或正在使用抗凝药物者慎针；婴幼儿及孕妇须由专业医师评估后操作。请以教材、国家标准和专业医师指导为准。", courseHint:"", tags:["外感","常用"], source:makeSource('B1') },
  { id:"dis-cough", name:"咳嗽", category:"内科", alias:["支气管炎"], overview:"以咳嗽、咯痰为主要表现，或伴咽痒、气急、胸胁牵痛的肺系病证。一般分外感与内伤两类，外感起病急、病程短，内伤多反复发作并伴脏腑虚损表现。", mainPoints:["LU1","LU7","CV22","BL13","CV12"], adjunctPoints:["ST36","BL20","KI3","LR2","EX-B1"], patternAdd:[{"pattern":"风寒袭肺","points":["BL12","TE5"]},{"pattern":"风热犯肺","points":["LI11","LU10"]},{"pattern":"痰湿阻肺","points":["ST40","SP9"]},{"pattern":"肝火犯肺","points":["LR2","GB34"]}], cautions:"针刺以宣肺止咳、理气化痰为主，胸部穴位须按规范浅刺或斜刺，避免深刺伤及肺脏。咳嗽持续超过数周、咯血、明显消瘦或伴发热盗汗者，须先排除肺部严重疾病再行针灸。请以教材、国家标准和专业医师指导为准。", contraindications:"咯血、大量脓痰伴高热、严重呼吸困难者禁用针刺作为主要手段并及时转诊；胸部穴位严禁向内深刺，形瘦体弱者尤须浅刺，以防气胸；局部皮肤感染或破溃处禁针；孕妇及婴幼儿须由专业医师评估。请以教材、国家标准和专业医师指导为准。", courseHint:"", tags:["肺系","常用"], source:makeSource('B1') },
  { id:"dis-cough-neishang", name:"咳嗽（内伤）", category:"内科", alias:["内伤咳嗽","慢性支气管炎"], overview:"起病较缓、病程较长、反复发作的咳嗽，多伴咯痰、气短、乏力或咽干，常因外感引动而加重。病位在肺，与脾、肾、肝相关，辨证以痰湿、痰热、肝火、肺阴亏虚为要。", mainPoints:["LU1","LU7","CV22","BL13","CV12"], adjunctPoints:["ST36","BL20","KI3","LR2","SP9","EX-B1"], patternAdd:[{"pattern":"痰湿蕴肺","points":["ST40","SP9","BL20"]},{"pattern":"痰热郁肺","points":["LI11","LU10","ST44"]},{"pattern":"肝火犯肺","points":["LR2","GB34","LU5"]},{"pattern":"肺阴亏虚","points":["KI6","BL43","LU9"]}], cautions:"内伤咳嗽病程长，针刺以扶正与化痰止咳并重，虚证宜补法或配合温和灸，痰热者可用泻法。胸部穴位须按规范斜刺或浅刺，不可向内深刺。咳嗽持续超过八周、痰中带血、明显消瘦、长期低热或夜间盗汗者，应先就诊排除肺结核、肺部肿瘤等疾病，不可仅靠针刺调理。请以教材、国家标准和专业医师指导为准。", contraindications:"咯血、大量脓痰伴高热、明显呼吸困难者不宜以针刺作为主要处理手段，须及时转诊；胸部及背部穴位严禁向内深刺，形瘦体弱者尤须浅刺，以防气胸；局部皮肤感染、溃疡或瘢痕处禁针；婴幼儿、孕妇及严重心肺功能不全者须由专业医师评估后操作。请以教材、国家标准和专业医师指导为准。", courseHint:"", tags:["肺系","内伤"], source:makeSource('B1') },
  { id:"dis-han-zheng", name:"汗证", category:"内科", alias:["自汗","盗汗"], overview:"指不因外界环境与体力活动而汗出异常的病证，白昼时时汗出、动则益甚者为自汗，睡时汗出、醒则汗止者为盗汗。病机多为肺卫不固、营卫不和、阴虚火旺或心血不足，辨证当分虚实。", mainPoints:["BL13","KI7","HT6","SI3","LI4"], adjunctPoints:["PC6","ST36","BL20","GV14","EX-B2"], patternAdd:[{"pattern":"肺卫不固","points":["BL13","LU9","GV14"]},{"pattern":"阴虚火旺","points":["KI3","KI6","HT6"]},{"pattern":"心血不足","points":["HT7","BL15","BL20"]},{"pattern":"湿热郁蒸","points":["SP9","ST44","LI11"]}], cautions:"针刺以调和营卫、固表敛汗为主，虚证宜补法，可配合温和灸；汗出后腠理疏松，须避风保暖并及时更换湿衣。盗汗伴长期低热、消瘦、咳嗽，或汗出伴心慌、手抖、多食易饥、明显怕热者，须就医排查结核、甲状腺功能亢进、糖尿病及肿瘤等疾病，不可仅以针刺调理。请以教材、国家标准和专业医师指导为准。", contraindications:"大汗淋漓、四肢厥冷、脉细弱等虚脱表现者禁用针刺，须立即按急症处理并送医；高热、严重感染与甲亢危象倾向者不宜单纯针刺；局部皮肤感染、破溃、湿疹或术后伤口处禁针；有出血倾向、严重心功能不全者慎针；婴幼儿及孕妇须由专业医师评估。请以教材、国家标准和专业医师指导为准。", courseHint:"", tags:["汗出异常","虚证"], source:makeSource('B1') },
  { id:"dis-dysentery", name:"痢疾", category:"内科", alias:["细菌性痢疾","肠澼"], overview:"以腹痛、里急后重、下痢赤白黏冻、排便次数增多为主症的肠道病证，多发于夏秋季节。病因为外感时邪疫毒与饮食不洁，病位在肠，与脾胃相关，辨证分湿热、疫毒、寒湿与休息痢。", mainPoints:["CV12","ST25","ST36","LI4","SP9"], adjunctPoints:["CV6","BL25","LI11","SP6","EX-B2"], patternAdd:[{"pattern":"湿热痢","points":["LI11","ST44","SP9"]},{"pattern":"疫毒痢","points":["LI11","PC8","GV14"]},{"pattern":"寒湿痢","points":["CV6","BL20","SP9"]},{"pattern":"休息痢","points":["CV6","ST36","BL20"]}], cautions:"针刺可作辅助调理，但不能替代规范的抗感染与补液治疗。痢疾属传染病，须注意手卫生、餐具消毒与排泄物处理，避免交叉感染。出现高热、频繁呕吐、意识改变、四肢厥冷、尿量明显减少或脓血便不止者，提示中毒性痢疾或脱水等危重情况，须立即就医接受专业医疗处理，不得自行针刺延误抢救。请以教材、国家标准和专业医师指导为准。", contraindications:"中毒性痢疾、休克、严重脱水与电解质紊乱者禁用针刺作为主要手段，须立即转诊并补液；下腹部穴位在急性期不宜强刺激或深刺；局部皮肤感染、破溃处禁针；孕妇下腹部穴与三阴交、合谷禁针；婴幼儿须由专业医师评估后操作。请以教材、国家标准和专业医师指导为准。", courseHint:"", tags:["肠道","传染病"], source:makeSource('B1') },
  { id:"dis-linzheng", name:"淋证", category:"内科", alias:["尿路感染","泌尿系感染"], overview:"以小便频数短涩、滴沥刺痛、欲出未尽，或伴小腹拘急、腰酸为主症。病机为湿热蕴结下焦、膀胱气化不利，病久可见脾肾两虚，临床分热淋、气淋、血淋、石淋与膏淋。", mainPoints:["CV3","CV4","SP6","BL28","LR3"], adjunctPoints:["KI3","BL23","SP9","BL22","EX-LE9"], patternAdd:[{"pattern":"湿热淋证","points":["SP9","BL28","LI11"]},{"pattern":"气滞淋证","points":["LR3","LR14","PC6"]},{"pattern":"血淋","points":["SP10","BL17","KI3"]},{"pattern":"脾肾两虚","points":["BL20","BL23","ST36"]}], cautions:"急性期针刺以清利湿热、通淋止痛为主，宜泻法；慢性反复者宜调补脾肾。须同时多饮水、勿憋尿，并做尿常规等检查明确病因。若出现寒战高热、腰痛剧烈、肉眼血尿、恶心呕吐或尿量减少，提示肾盂肾炎等上尿路感染甚至脓毒症，须立即就医接受规范抗感染治疗，不可仅依赖针刺。请以教材、国家标准和专业医师指导为准。", contraindications:"急性高热、脓毒症、尿路梗阻、结石嵌顿致肾绞痛发作者禁用针刺作为主要手段，须立即转诊；下腹部穴位在尿潴留、膀胱高度充盈或近期盆腔手术后禁深刺；孕妇下腹部穴与三阴交、合谷禁针；局部皮肤感染、破溃处禁针。请以教材、国家标准和专业医师指导为准。", courseHint:"", tags:["膀胱","湿热"], source:makeSource('B1') },
  { id:"dis-urinary-retention", name:"癃闭", category:"内科", alias:["尿潴留","前列腺增生所致排尿困难"], overview:"以小便量少、点滴而出甚至闭塞不通为主症，病势较缓者为癃，小便不通、点滴全无者为闭。病位在膀胱与肾，与肺、脾、肝、三焦相关，辨证分湿热、肺热、肝郁、瘀阻与肾虚。", mainPoints:["CV3","CV4","SP6","BL28","BL39"], adjunctPoints:["KI3","SP9","BL23","LR3","EX-LE9"], patternAdd:[{"pattern":"膀胱湿热","points":["SP9","BL22","LI11"]},{"pattern":"肺热壅盛","points":["LU7","LU5","CV22"]},{"pattern":"肝郁气滞","points":["LR3","LR14","PC6"]},{"pattern":"肾阳亏虚","points":["BL23","GV4","CV6"]}], cautions:"针刺以下腹部与骶部穴位为主，宜用平补平泻，虚证配合温和灸；下腹部穴位须浅刺斜刺，尿潴留时膀胱可高于耻骨联合，深刺极易刺入膀胱。若膀胱高度充盈、经针刺与小腹热敷后仍不能排尿，须尽快就医导尿，急性完全性尿潴留属急症，长时间不解除可损伤肾功能，不得反复等待。请以教材、国家标准和专业医师指导为准。", contraindications:"膀胱高度充盈时严禁在下腹部深刺或直刺，以防刺穿膀胱；前列腺增生、结石、肿瘤、神经源性膀胱等器质性梗阻所致癃闭，针刺不能替代专科处理，须先明确诊断；孕妇下腹部与腰骶部穴位禁针；局部皮肤感染、破溃处禁针。请以教材、国家标准和专业医师指导为准。", courseHint:"", tags:["膀胱","排尿障碍"], source:makeSource('B1') },
  { id:"dis-facial-palsy", name:"面瘫", category:"内科", alias:["周围性面神经麻痹","口眼歪斜"], overview:"以口眼向一侧歪斜、额纹变浅或消失、眼睑闭合不全、鼓腮漏气为主症的周围性面神经病证，可伴耳后疼痛、味觉减退。多因风中经络，与风寒、风热及气血不足有关。", mainPoints:["GB14","ST2","ST4","ST6","TE17","LI4"], adjunctPoints:["GB20","LU7","ST36","SI18","EX-HN4"], patternAdd:[{"pattern":"风寒袭络","points":["TE5","GB20"]},{"pattern":"风热犯络","points":["LI11","LU10"]},{"pattern":"气血不足","points":["ST36","SP6"]},{"pattern":"恢复期面肌拘挛","points":["ST7","BL2"]}], cautions:"急性期面部穴位宜浅刺、轻刺激，不宜使用强电针或长时间留针；恢复期可逐步加强手法。面部应避免风寒直吹，眼睑闭合不全者需用眼药水或眼罩保护角膜。若伴肢体无力、言语不清、吞咽困难或意识改变，须警惕中枢性病变，立即就医接受专业医疗处理。请以教材、国家标准和专业医师指导为准。", contraindications:"疑及中枢性面瘫、脑血管意外或颅内占位者禁用针刺替代急诊处理，须立即转诊；面部皮肤感染、带状疱疹急性期破溃处禁针；耳部与耳前穴位禁深刺；有出血倾向或正使用抗凝药物者慎针。请以教材、国家标准和专业医师指导为准。", courseHint:"", tags:["头面","常用"], source:makeSource('B1') },
  { id:"dis-vomiting", name:"呕吐", category:"内科", alias:["恶心呕吐"], overview:"胃失和降、胃气上逆以致食物或痰涎从口吐出为主要表现的病证，常伴恶心、脘痞、纳呆。有虚实之分，实者多因外邪、食滞、痰饮、肝气，虚者多因脾胃虚弱。", mainPoints:["CV12","PC6","ST36","SP4","BL21"], adjunctPoints:["LR3","CV6","SP9","BL20","EX-UE4"], patternAdd:[{"pattern":"外邪犯胃","points":["LI4","TE5"]},{"pattern":"饮食停滞","points":["ST21","LR13"]},{"pattern":"肝气犯胃","points":["LR3","GB34"]},{"pattern":"脾胃虚寒","points":["CV6","BL20"]}], cautions:"针刺以和胃降逆止呕为主，虚寒者配合温和灸。操作宜取卧位以防晕针，进针手法宜轻柔。呕吐剧烈伴脱水、电解质紊乱，或呈喷射状并伴头痛、意识障碍者，可能提示颅内病变或肠梗阻等危重情况，须立即就医接受专业医疗处理。请以教材、国家标准和专业医师指导为准。", contraindications:"喷射性呕吐疑及颅内压增高、呕吐伴急腹症或肠梗阻者禁用针刺，须立即转诊；严重脱水、休克倾向者禁用针刺作为主要处理；上腹部穴位不可深刺；局部皮肤感染、破溃处禁针；孕妇及婴幼儿须由专业医师评估。请以教材、国家标准和专业医师指导为准。", courseHint:"", tags:["脾胃","常用"], source:makeSource('B1') },
  { id:"dis-piman", name:"痞满", category:"内科", alias:["功能性消化不良","胃痞"], overview:"以自觉胃脘部痞塞胀满、触之无形、按之柔软、不痛或微痛为主症，常伴嗳气、食少、餐后加重。病机多为中焦气机不利、升降失常，与食滞、痰湿、肝郁及脾胃虚弱有关。", mainPoints:["CV12","BL21","PC6","ST36","SP4"], adjunctPoints:["LR3","ST21","SP9","BL20","EX-B3"], patternAdd:[{"pattern":"饮食停滞","points":["ST21","SP9","CV13"]},{"pattern":"肝气犯胃","points":["LR3","GB34","LR14"]},{"pattern":"痰湿内阻","points":["ST40","SP9","CV9"]},{"pattern":"脾胃虚弱","points":["CV6","BL20","ST36"]}], cautions:"针刺以调理中焦、理气消痞为主，进针前不宜空腹或过饱；虚证宜补法并配合温和灸。若痞满伴明显消瘦、吞咽困难、呕血黑便、持续呕吐或贫血，须先行胃镜等检查排除溃疡、梗阻与肿瘤；突发剧烈腹痛、腹肌紧张者按急腹症处理，及时就医接受专业医疗处理。请以教材、国家标准和专业医师指导为准。", contraindications:"急腹症、消化道出血、疑似穿孔或腹膜炎者禁用针刺，须立即转诊；上腹部穴位在过饱或胃高度扩张时禁深刺；局部皮肤感染、破溃处禁针；孕妇腹部及腰骶部穴位禁针，有出血倾向或使用抗凝药物者慎针。请以教材、国家标准和专业医师指导为准。", courseHint:"", tags:["脾胃","气滞"], source:makeSource('B1') },
  { id:"dis-edema", name:"水肿", category:"内科", alias:["肾源性水肿","水气"], overview:"以头面、眼睑、四肢甚至全身浮肿为主症，轻者晨起眼睑浮肿，重者按之凹陷不起，常伴尿少、腹胀或气短。病机为肺失通调、脾失转输、肾失气化致水液泛溢，分阳水与阴水论治。", mainPoints:["CV9","CV6","SP9","SP6","BL22"], adjunctPoints:["ST36","BL20","BL23","KI7","LU7","EX-LE9"], patternAdd:[{"pattern":"风水相搏","points":["LU7","LI4","GV14"]},{"pattern":"脾虚湿困","points":["BL20","ST36","SP9"]},{"pattern":"肾阳亏虚","points":["BL23","CV4","KI3"]},{"pattern":"湿热壅盛","points":["SP9","LI11","BL40"]}], cautions:"针刺以通调水道、健脾温肾为主，虚证宜补法并配合温和灸；水肿部位皮肤菲薄、感觉减退，进针与施灸须控制深度与温度，防止渗液感染与烫伤。水肿常提示心、肝、肾疾病，若出现尿量骤减、气促不能平卧、意识改变、血压明显升高或全身高度浮肿，须立即就医接受专业医疗处理，针刺只作辅助。请以教材、国家标准和专业医师指导为准。", contraindications:"高度浮肿致皮肤紧绷、渗液或合并感染者局部禁针；心功能不全失代偿、肾功能衰竭、严重低蛋白血症及电解质紊乱者禁用针刺替代规范治疗，须先转诊；下腹部与腰骶部穴位在孕妇禁针；有出血倾向或正在透析、使用抗凝药物者慎针。请以教材、国家标准和专业医师指导为准。", courseHint:"", tags:["水液","本虚标实"], source:makeSource('B1') },
  { id:"dis-headache", name:"头痛", category:"内科", alias:["血管神经性头痛","头风"], overview:"以头部疼痛为主要表现的病证，可发于前额、颞侧、巅顶或后枕，性质有胀痛、刺痛、空痛、重痛之别。外感者多起病急，内伤者多反复发作，与肝阳上亢、痰浊、瘀血及气血亏虚有关。", mainPoints:["GB20","GV20","LI4","LR3","TE5"], adjunctPoints:["GB34","ST36","BL10","KI3","EX-HN5","EX-HN1"], patternAdd:[{"pattern":"阳明头痛","points":["ST8","LI4","EX-HN3"]},{"pattern":"少阳头痛","points":["GB8","TE5"]},{"pattern":"太阳头痛","points":["BL10","SI3"]},{"pattern":"厥阴头痛","points":["GV20","LR3"]}], cautions:"针刺以疏通经络、调和气血为主，按疼痛部位循经取穴并配合远端穴位。突发剧烈头痛、伴喷射性呕吐、颈项强直、肢体无力、言语不清或意识改变者，须警惕脑血管意外与颅内感染，应立即就医接受专业医疗处理，不可自行针刺。请以教材、国家标准和专业医师指导为准。", contraindications:"蛛网膜下腔出血、颅内占位、颅内感染及高血压危象所致头痛禁用针刺，须立即转诊；枕部风池等穴须严格掌握针刺方向与深度，不可向内上方深刺，以防伤及延髓；局部皮肤感染、破溃处禁针；孕妇慎用合谷等强刺激穴。请以教材、国家标准和专业医师指导为准。", courseHint:"", tags:["头面","常用"], source:makeSource('B1') },
  { id:"dis-stomachache", name:"胃痛", category:"内科", alias:["胃脘痛","慢性胃炎"], overview:"以上腹胃脘部近心窝处疼痛为主症的病证，常伴胀满、嗳气、泛酸、纳差。多与寒邪、饮食不节、情志不畅及脾胃虚弱有关，辨证当分虚实寒热。", mainPoints:["CV12","BL21","PC6","ST36","LR3"], adjunctPoints:["SP4","CV4","BL20","ST34","EX-B3"], patternAdd:[{"pattern":"寒邪犯胃","points":["CV4","BL20"]},{"pattern":"饮食停滞","points":["ST21","SP9"]},{"pattern":"肝气犯胃","points":["LR3","GB34"]},{"pattern":"脾胃虚寒","points":["CV6","BL20"]}], cautions:"针刺以上腹及远端配穴相合，虚寒者可用温和灸，实热者宜泻法。进针前宜适当进食，避免空腹或过饱时操作。突发剧烈上腹痛、腹肌紧张、呕血或黑便者，须先排除溃疡穿孔、急性胰腺炎等急腹症，及时就医接受专业医疗处理。请以教材、国家标准和专业医师指导为准。", contraindications:"急腹症、消化道出血、疑似穿孔或腹膜炎者禁用针刺，须立即转诊；上腹部穴位在过饱或胃高度扩张时禁深刺，以防刺入腹腔脏器；局部皮肤感染、破溃处禁针；孕妇腹部及腰骶部穴位禁针。请以教材、国家标准和专业医师指导为准。", courseHint:"", tags:["脾胃","常用"], source:makeSource('B1') },
  { id:"dis-diabetes", name:"消渴", category:"内科", alias:["糖尿病","消瘅"], overview:"以多饮、多食、多尿及形体消瘦为主症的病证，按症状偏重分上消、中消、下消。基本病机为阴津亏耗、燥热偏盛，久病可致气阴两虚并累及多个脏腑。", mainPoints:["BL20","CV12","ST36","SP6","LI4"], adjunctPoints:["PC6","SP10","KI3","BL23","EX-B3"], patternAdd:[{"pattern":"上消肺热津伤","points":["LU7","CV23"]},{"pattern":"中消胃热炽盛","points":["ST44","LR3"]},{"pattern":"下消肾阴亏虚","points":["KI3","CV4"]},{"pattern":"气阴两虚","points":["BL20","CV6"]}], cautions:"针灸在本病中属辅助调理手段，不能替代饮食控制、运动管理与降糖药物治疗，治疗前后应监测血糖，并继续遵医嘱用药。患者皮肤愈合能力与抗感染能力较差，操作前后须严格消毒，四肢末端感觉减退处尤须避免损伤。出现明显口渴多尿伴意识模糊、呼吸深快或严重低血糖表现时，属危重情况，须立即就医接受专业医疗处理。请以教材、国家标准和专业医师指导为准。", contraindications:"糖尿病酮症酸中毒、高渗状态及严重低血糖发作时禁用针刺，须立即转诊急救；足部溃疡、坏疽、感染或感觉丧失区域禁针禁灸；血糖极高未控制或伴有严重心脑血管并发症者慎针；有出血倾向或正使用抗凝药物者慎针。请以教材、国家标准和专业医师指导为准。", courseHint:"", tags:["内分泌","辅助调理"], source:makeSource('B1') },
  { id:"dis-asthma-remission", name:"哮病缓解期", category:"内科", alias:["哮喘缓解期","支气管哮喘非急性发作期"], overview:"哮病发作间歇期，喉中哮鸣与喘息暂平，但仍有气短、乏力、易感冒、畏风或动则气喘等本虚表现。病机以肺、脾、肾三脏亏虚为本，痰饮内伏为宿根，调理以扶正固本、减少发作为目标。", mainPoints:["GV14","BL13","CV17","CV22","EX-B1"], adjunctPoints:["BL20","ST36","KI3","CV6","BL23","EX-B2"], patternAdd:[{"pattern":"肺虚证","points":["BL13","LU9","BL12"]},{"pattern":"脾虚证","points":["BL20","ST36","SP9"]},{"pattern":"肾虚证","points":["BL23","KI3","CV4"]},{"pattern":"痰浊内伏","points":["ST40","CV12","SP9"]}], cautions:"缓解期宜在夏秋或发作间歇调治，多用补法并配合温和灸，可取背部与任脉穴交替使用。调理期间不可自行停用医师处方的控制药物。一旦出现喘息加重、口唇紫绀、说话不能成句或意识改变，属急性重度发作，须立即使用急救药物并送医接受专业医疗处理，绝不可仅依赖针刺。请以教材、国家标准和专业医师指导为准。", contraindications:"哮喘持续状态、呼吸衰竭倾向者禁用针刺替代急救处理，须立即转诊；胸部及背部穴位禁止向内深刺，以防气胸；局部皮肤感染、破溃处禁针；婴幼儿、孕妇及心功能不全者须由专业医师评估后操作。请以教材、国家标准和专业医师指导为准。", courseHint:"", tags:["肺系","缓解期"], source:makeSource('B1') },
  { id:"dis-asthma", name:"哮喘", category:"内科", alias:["支气管哮喘","哮病"], overview:"发作时喉中哮鸣有声、呼吸气促、胸闷难以平卧，缓解期可如常人的发作性病证。多因痰饮内伏，遇外邪、饮食、情志或劳倦等诱因而发，久病常累及肺、脾、肾三脏。", mainPoints:["CV22","BL13","LU7","GV14","CV17"], adjunctPoints:["KI3","ST40","SP9","BL20","EX-B1"], patternAdd:[{"pattern":"寒哮","points":["BL12","CV6"]},{"pattern":"热哮","points":["LI11","LU10"]},{"pattern":"痰浊阻肺","points":["ST40","CV12"]},{"pattern":"肺肾气虚","points":["CV4","KI3"]}], cautions:"缓解期针刺以补益肺脾肾、化痰平喘为主，可配合温和灸；发作期操作须谨慎，避免强刺激诱发加重。哮喘急性重度发作、口唇紫绀、不能完整说话或出现意识改变时，属危重情况，须立即使用急救药物并送医接受专业医疗处理，绝不可仅靠针刺。请以教材、国家标准和专业医师指导为准。", contraindications:"哮喘持续状态、呼吸衰竭倾向者禁用针刺替代急救处理，须立即转诊；胸部及背部穴位禁止向内深刺，以防气胸；局部皮肤感染、破溃处禁针；婴幼儿、孕妇及心功能不全者须由专业医师评估后操作。请以教材、国家标准和专业医师指导为准。", courseHint:"", tags:["肺系","发作性"], source:makeSource('B1') },
  { id:"dis-hypochondriac-pain", name:"胁痛", category:"内科", alias:["肋间神经痛","肝胆区疼痛"], overview:"以一侧或两侧胁肋部疼痛为主要表现，可为胀痛、刺痛、隐痛或灼痛，常随情绪波动或劳累增减。病位在肝胆，病机多为肝郁气滞、瘀血阻络、湿热蕴结或肝阴不足。", mainPoints:["LR3","GB34","PC6","LR14","GB24"], adjunctPoints:["GB40","BL18","BL19","SP6","EX-LE6","EX-B3"], patternAdd:[{"pattern":"肝郁气滞","points":["LR14","PC6","GB34"]},{"pattern":"瘀血阻络","points":["BL17","SP10","LR14"]},{"pattern":"湿热蕴结","points":["GB34","BL19","SP9"]},{"pattern":"肝阴不足","points":["LR8","KI3","BL18"]}], cautions:"针刺以疏肝利胆、通络止痛为主，胸胁部穴位宜沿肋间隙斜刺或平刺，严禁向内深刺。胁痛可由胆囊炎、胆石症、肝炎、胰腺疾病、胸膜病变或肋骨骨折引起，若疼痛剧烈持续、伴发热黄疸、呕吐、呼吸困难或外伤史，须及时就医完善检查，明确诊断后再考虑针灸辅助调理。请以教材、国家标准和专业医师指导为准。", contraindications:"胸胁部穴位严禁向内深刺，形瘦者尤须浅刺或斜刺，以防气胸；肋骨骨折、胸膜急性感染、腹腔急性感染及诊断未明的剧烈腹痛者不宜针刺，须先转诊；局部皮肤感染、破溃或带状疱疹急性渗出期禁针；孕妇及有出血倾向者慎针。请以教材、国家标准和专业医师指导为准。", courseHint:"", tags:["肝胆","痛证"], source:makeSource('B1') },
  { id:"dis-diarrhea", name:"泄泻", category:"内科", alias:["腹泻","肠炎"], overview:"以排便次数增多、粪质稀薄甚或如水样为主症的病证，常伴腹痛、肠鸣、腹胀。暴泻多因外感寒湿暑热或饮食不洁，久泻多责之脾肾虚弱与肝郁乘脾。", mainPoints:["ST25","ST36","SP9","CV12","BL25"], adjunctPoints:["CV6","BL20","LR13","SP6","EX-CA2"], patternAdd:[{"pattern":"寒湿困脾","points":["CV6","BL20"]},{"pattern":"湿热伤中","points":["LI11","LR3"]},{"pattern":"食滞肠胃","points":["BL21","ST21"]},{"pattern":"脾肾阳虚","points":["CV4","GV4"]}], cautions:"针刺以健脾化湿、调理肠胃为主，寒湿及虚寒者宜配合温和灸，腹部穴位宜浅刺。治疗期间应补液、清淡饮食。重度腹泻导致明显脱水、电解质紊乱，或伴高热、脓血便者，须及时就医并接受补液等专业医疗处理，不可仅靠针刺。请以教材、国家标准和专业医师指导为准。", contraindications:"感染性腹泻伴高热、中毒症状或脓血便者，以及严重脱水、休克倾向者，禁用针刺作为主要手段并须转诊；下腹部穴位在孕妇禁针；局部皮肤感染、破溃处禁针；年老体弱与婴幼儿脱水风险高，须由专业医师处理。请以教材、国家标准和专业医师指导为准。", courseHint:"", tags:["脾胃","肠腑"], source:makeSource('B1') },
  { id:"dis-palpitations", name:"心悸", category:"内科", alias:["心律失常","惊悸怔忡"], overview:"以自觉心中悸动、惊惕不安、甚则不能自主为主症的病证，常伴胸闷、气短、头晕、失眠。多因心气心血不足、心阳不振、阴虚火旺或水饮凌心、心血瘀阻所致。", mainPoints:["HT7","PC6","CV17","BL15","ST36"], adjunctPoints:["SP6","BL20","GB20","LR3","EX-UE3"], patternAdd:[{"pattern":"心气不足","points":["CV6","BL15"]},{"pattern":"心血不足","points":["BL17","SP6"]},{"pattern":"心阳不振","points":["CV4","GV14"]},{"pattern":"心血瘀阻","points":["BL17","PC4"]}], cautions:"针刺以宁心安神、益气养血为主，手法宜轻柔平稳。心悸伴胸痛、大汗、呼吸困难或晕厥者，须警惕急性心肌梗死等危重情况，应立即就医接受专业医疗处理，不可自行针刺。已确诊心律失常者不宜擅自停用抗心律失常药物。请以教材、国家标准和专业医师指导为准。", contraindications:"急性心肌梗死、严重心力衰竭、未控制的快速性心律失常及晕厥发作者禁用针刺，须立即转诊；胸部穴位须浅刺或斜刺，禁止向内深刺以防气胸与心包损伤；安装心脏起搏器者慎用电针并避免电流通过胸部；局部皮肤感染、破溃处禁针。请以教材、国家标准和专业医师指导为准。", courseHint:"", tags:["心系","常用"], source:makeSource('B1') },
  { id:"dis-xulao", name:"虚劳", category:"内科", alias:["虚损","慢性疲劳综合征"], overview:"以脏腑元气亏虚、久虚不复成劳为主要病机，表现为神疲乏力、气短懒言、面色无华、形寒或潮热、食少便溏、腰膝酸软等。辨证以气血阴阳为纲、五脏为目，多见两脏或多脏同病。", mainPoints:["CV4","CV6","ST36","BL20","BL23"], adjunctPoints:["GV4","BL15","SP6","KI3","EX-B2"], patternAdd:[{"pattern":"气虚证","points":["BL20","ST36","CV6"]},{"pattern":"血虚证","points":["BL17","BL20","SP10"]},{"pattern":"阴虚证","points":["KI3","KI6","BL23"]},{"pattern":"阳虚证","points":["GV4","CV4","BL23"]}], cautions:"虚劳调理以补益为主，宜轻刺激、少而精取穴，多用补法与温和灸，并配合饮食、作息与情志调摄，疗程较长，须定期评估。明显消瘦、长期发热、夜间盗汗、淋巴结肿大或不明原因贫血者，须先就诊排查结核、肿瘤、甲状腺及血液系统疾病；不宜长期自行针刺代替病因检查和规范治疗。请以教材、国家标准和专业医师指导为准。", contraindications:"急性感染发热期、严重贫血、恶病质及生命体征不稳定者禁用针刺，须先转诊评估；有出血倾向、血小板明显减少或正服用抗凝药物者慎针，不宜放血；局部皮肤感染、破溃或压疮处禁针；严重心肺功能不全者不宜在胸背部强刺激；孕妇及婴幼儿须由专业医师评估后操作。请以教材、国家标准和专业医师指导为准。", courseHint:"", tags:["虚损","调理"], source:makeSource('B1') },
  { id:"dis-vertigo", name:"眩晕", category:"内科", alias:["头晕","美尼尔病"], overview:"以头晕目眩、视物旋转为主症，轻者闭目即止，重者如坐舟车并伴恶心呕吐、汗出。辨证常见肝阳上亢、痰湿中阻、气血亏虚与肾精不足，病位多在肝脾肾。", mainPoints:["GB20","GV20","LR3","PC6","ST36"], adjunctPoints:["KI3","SP9","BL20","GB34","EX-HN1","EX-HN10"], patternAdd:[{"pattern":"肝阳上亢","points":["LR2","GB43","EX-HN5"]},{"pattern":"痰湿中阻","points":["ST40","CV12"]},{"pattern":"气血亏虚","points":["BL20","CV6"]},{"pattern":"肾精不足","points":["KI3","GV4"]}], cautions:"针刺以平肝潜阳、健脾化痰、补益气血为主，操作宜取卧位并采用轻柔手法，以免加重眩晕与引发晕针。眩晕首次发作或伴耳鸣听力下降、肢体麻木无力、言语不清、行走不稳者，须先就医明确病因并接受专业医疗处理。请以教材、国家标准和专业医师指导为准。", contraindications:"急性脑血管病、椎基底动脉严重供血不足发作期禁用针刺，须立即转诊；血压极高未控制者慎针并避免强刺激；风池等项部穴位严禁向内上方深刺，以防伤及延髓与椎动脉；局部皮肤感染、破溃处禁针。请以教材、国家标准和专业医师指导为准。", courseHint:"", tags:["头面","常用"], source:makeSource('B1') },
  { id:"dis-epistaxis", name:"血证（鼻衄）", category:"内科", alias:["鼻出血","鼻衄"], overview:"以鼻腔出血为主症，轻者涕中带血，重者血涌如注。多因肺热、胃热、肝火上炎迫血妄行，或气血亏虚、脾不统血所致，辨证须分实热与虚证，并注意出血量与全身状况。", mainPoints:["LI4","LI11","ST44","GV23","BL7"], adjunctPoints:["LU11","ST40","KI3","SP10","EX-HN8","EX-HN3"], patternAdd:[{"pattern":"肺经风热","points":["LU11","LI11","LU7"]},{"pattern":"胃热炽盛","points":["ST44","ST40","CV12"]},{"pattern":"肝火上炎","points":["LR2","GB34","LR3"]},{"pattern":"气血亏虚","points":["BL20","ST36","BL17"]}], cautions:"鼻出血时应先坐位低头、以手指捏紧两侧鼻翼压迫止血并冷敷额鼻部，针刺只作辅助，出血时不宜在头面部强行操作。反复或大量鼻衄者须到耳鼻喉科检查局部原因，并做血常规、凝血功能等检查排除血液系统疾病与高血压。若出血持续不止、出血量大伴头晕心悸面色苍白，须立即就医接受专业医疗处理，不得延误。请以教材、国家标准和专业医师指导为准。", contraindications:"活动性大出血、休克、严重贫血及凝血功能障碍者禁用针刺与放血，须立即转诊；头面部与鼻周皮肤感染、破溃或近期鼻部手术者局部禁针，迎香等鼻周穴位须浅刺并避开血管；高血压未控制、血小板明显减少或正在使用抗凝药物者慎用针刺与点刺出血；孕妇慎针合谷等穴。请以教材、国家标准和专业医师指导为准。", courseHint:"", tags:["血证","急症倾向"], source:makeSource('B1') },
  { id:"dis-impotence", name:"阳痿", category:"内科", alias:["勃起功能障碍","阴痿"], overview:"指青壮年男子临房时阴茎痿软不举、举而不坚或坚而不久，不能完成正常性生活。病机多为肾阳不足、心脾两虚、肝郁气滞或湿热下注、瘀血阻络，常与情志、劳倦及慢性病相关。", mainPoints:["CV4","CV6","BL23","GV4","SP6"], adjunctPoints:["BL32","ST36","KI3","LR3","BL20","EX-CA2"], patternAdd:[{"pattern":"命门火衰","points":["GV4","BL23","CV4"]},{"pattern":"心脾两虚","points":["BL20","HT7","ST36"]},{"pattern":"肝郁气滞","points":["LR3","LR14","PC6"]},{"pattern":"湿热下注","points":["SP9","BL28","LR2"]}], cautions:"针刺以温补肾阳、疏肝健脾为主，虚证宜补法配合温和灸，湿热者用泻法。阳痿常与糖尿病、高血压、动脉硬化、内分泌异常及抗高血压等药物相关，也可能为心理因素所致，应先到专科明确原因并综合处理，同时戒烟限酒、规律运动。针刺调理需耐心，不宜夸大效果。请以教材、国家标准和专业医师指导为准。", contraindications:"下腹部、腰骶部及会阴部皮肤感染、破溃或湿疹处禁针；发热期、急性泌尿生殖系统感染者不宜针刺；有出血倾向或正服用抗凝药物者慎针；严重心血管疾病、未控制的高血压及精神心理疾病急性期须由专业医师评估后操作；孕妇禁针下腹部与腰骶部穴位。请以教材、国家标准和专业医师指导为准。", courseHint:"", tags:["肾系","男科"], source:makeSource('B1') },
  { id:"dis-low-back-pain", name:"腰痛", category:"内科", alias:["腰肌劳损","腰痹"], overview:"以腰部一侧或两侧疼痛为主症，可表现为酸痛、重着、冷痛或刺痛，活动或劳累后加重，休息后减轻。外因多为寒湿、湿热与外伤瘀血，内因多责之肾虚，辨证宜分虚实。", mainPoints:["BL23","BL40","GV3","GV4","BL25"], adjunctPoints:["GB30","BL60","KI3","ST36","EX-B4","EX-UE7"], patternAdd:[{"pattern":"寒湿腰痛","points":["GV3","BL60"]},{"pattern":"瘀血腰痛","points":["BL17","SP10"]},{"pattern":"肾虚腰痛","points":["KI3","CV4"]},{"pattern":"湿热腰痛","points":["SP9","BL22"]}], cautions:"针刺腰骶部穴位须掌握深度与角度，不宜过深直刺，以免伤及内脏或椎管；寒湿与肾虚者可配合温和灸。腰痛剧烈并伴下肢放射痛、大小便功能障碍或鞍区麻木者，提示神经受压，须及时就医接受专业医疗处理，不可自行针刺。请以教材、国家标准和专业医师指导为准。", contraindications:"脊柱骨折、结核、肿瘤骨转移、严重骨质疏松及马尾神经综合征所致腰痛禁用针刺，须转诊；孕妇腰骶部及下腹部穴位禁针，合谷、三阴交等穴亦应避免；腰部皮肤感染、破溃处禁针；有出血倾向者慎针。请以教材、国家标准和专业医师指导为准。", courseHint:"", tags:["腰背","常用"], source:makeSource('B1') },
  { id:"dis-seminal-emission", name:"遗精", category:"内科", alias:["遗泄","滑精"], overview:"指不因性生活而精液自行遗出，有梦而遗者为梦遗，无梦而遗甚至清醒时滑出者为滑精。病机多由肾气不固、阴虚火旺、湿热下注或心脾两虚扰动精室，辨证须分虚实。", mainPoints:["GV4","CV4","BL23","BL15","KI3"], adjunctPoints:["ST36","SP6","BL20","HT7","BL52","EX-CA2"], patternAdd:[{"pattern":"肾气不固","points":["CV6","BL23","GV4"]},{"pattern":"阴虚火旺","points":["KI3","KI6","HT6"]},{"pattern":"湿热下注","points":["SP9","BL28","LR3"]},{"pattern":"心脾两虚","points":["BL20","HT7","ST36"]}], cautions:"针刺以补肾固精、宁心清利为主，虚证宜补法配合温和灸，湿热者用泻法。频繁遗精影响生活者，应先就诊排除前列腺炎、精囊炎及内分泌、神经系统疾病，并注意规律作息、减少烟酒与精神紧张。不宜轻信以针刺可快速改善的说法，也不可因羞于就诊而长期自行处理。请以教材、国家标准和专业医师指导为准。", contraindications:"生殖系统急性感染、发热期及泌尿生殖道损伤未愈者不宜在腰骶部与下腹部针刺；下腹部、腰骶部穴位在孕妇禁针；会阴部皮肤感染、破溃或湿疹处禁针；有出血倾向或正服用抗凝药物者慎针；严重神经症与精神障碍者须由专业医师评估。请以教材、国家标准和专业医师指导为准。", courseHint:"", tags:["肾系","虚损"], source:makeSource('B1') },
  { id:"dis-depression", name:"郁证", category:"内科", alias:["抑郁状态","脏躁"], overview:"以情志不舒、情绪低落、胸胁胀满、善太息为主症，可伴心烦易怒、失眠多梦、咽中如有异物或悲忧善哭。病位在肝，常累及心脾，初起多气滞，日久可化火、伤阴或致心脾两虚。", mainPoints:["GV20","HT7","PC6","LR3","SP6"], adjunctPoints:["ST36","GB34","BL62","KI6","EX-HN3"], patternAdd:[{"pattern":"肝气郁结","points":["LR14","CV17"]},{"pattern":"气郁化火","points":["LR2","GB34"]},{"pattern":"心脾两虚","points":["BL15","BL20"]},{"pattern":"心神失养","points":["HT5","CV14"]}], cautions:"针刺以疏肝解郁、宁心安神为主，须配合心理疏导、规律作息与社会支持，必要时转介精神心理专科。若出现持续情绪低落、兴趣丧失、自责自罪、体重明显下降或有自伤自杀念头，属需要专业医疗处理的情况，应立即由家属陪同就医并加强看护，不可仅依赖针刺。请以教材、国家标准和专业医师指导为准。", contraindications:"有明确自伤自杀风险者禁用单纯针刺处理，须立即转精神心理专科并专人看护；严重精神障碍急性期、躁动或酒精戒断状态者不宜针刺；局部皮肤感染、破溃处禁针；孕妇针刺须由专业医师评估，避免强刺激。请以教材、国家标准和专业医师指导为准。", courseHint:"", tags:["情志","心肝"], source:makeSource('B1') },
  { id:"dis-stroke-sequelae", name:"中风后遗症", category:"内科", alias:["脑卒中后遗症","偏枯"], overview:"中风急性期过后遗留的半身不遂、口舌歪斜、言语不利、吞咽困难或肢体麻木等症状。多属本虚标实，常见气虚血瘀、风痰阻络、肝阳上亢与阴虚风动等证候。", mainPoints:["GV20","GB20","LI11","LI4","ST36","SP6"], adjunctPoints:["TE5","PC6","GB34","LR3","BL40","EX-UE9","EX-LE10"], patternAdd:[{"pattern":"肝阳上亢","points":["LR3","GB43"]},{"pattern":"风痰阻络","points":["ST40","SP9"]},{"pattern":"气虚血瘀","points":["CV6","BL17"]},{"pattern":"阴虚风动","points":["KI3","KI6"]}], cautions:"针刺是恢复期康复治疗的组成部分，须与肢体功能训练、言语训练及药物二级预防配合进行；患侧肢体感觉减退，施灸与电针时须防止烫伤与刺激过量。中风急性期及新发神经功能恶化属急症，须立即送医接受专业医疗处理。请以教材、国家标准和专业医师指导为准。", contraindications:"急性脑出血或脑梗死急性期、颅内压增高及生命体征不稳定者禁用针刺，须立即转诊；血压过高未控制或严重心律失常者慎针；长期卧床伴患肢深静脉血栓者禁止在患肢针刺与按摩，以防肺栓塞；局部皮肤感染、破溃及压疮处禁针。请以教材、国家标准和专业医师指导为准。", courseHint:"", tags:["脑病","康复"], source:makeSource('B1') },
  { id:"dis-benglou", name:"崩漏", category:"妇科", alias:["功能失调性子宫出血","经血非时而下"], overview:"经血非时暴下不止为崩，淋漓日久不尽为漏，二者常互相转化。病机多因脾虚不统、肾虚失固、血热妄行或瘀血阻滞，致冲任损伤、经血失约。", mainPoints:["CV4","CV3","SP1","SP6","LR1"], adjunctPoints:["BL20","ST36","BL17","KI3","SP10","EX-B4"], patternAdd:[{"pattern":"脾虚不统","points":["BL20","ST36","GV20"]},{"pattern":"肾阳虚","points":["GV4","BL23","KI3"]},{"pattern":"血热妄行","points":["LR2","LI11","SP10"]},{"pattern":"血瘀阻滞","points":["SP10","LR3","BL32"]}], cautions:"崩漏属妇科急重病证，出血量多、持续不止或伴头晕心悸、面色苍白等失血表现时，必须立即急诊处理，先行止血与纠正贫血，不可仅依赖针刺。诊断上须排除妊娠相关出血、子宫肌瘤、息肉及恶性病变。针刺调治宜在病情稳定后由专业医师进行，遵循止血、澄源、固本的次序。请以教材、国家标准和专业医师指导为准。", contraindications:"急性大出血、休克倾向或重度贫血者禁用针刺，须立即转诊抢救；妊娠期出血原因未明时禁针下腹部、腰骶部及三阴交、合谷；有出血性疾病或正服用抗凝药者禁用刺络放血；局部皮肤感染处禁刺。", courseHint:"", tags:["月经病","急症转诊"], source:makeSource('B1') },
  { id:"dis-bijing", name:"闭经", category:"妇科", alias:["经闭","原发性闭经","继发性闭经"], overview:"女子年逾正常初潮年龄而月经未至，或已建立规律月经后又中断较长时间者。临床分虚、实两类：虚者多为血海空虚、无血可下；实者多为气滞、寒凝、痰湿阻隔，冲任不通。", mainPoints:["CV4","CV3","SP6","BL23","LR3"], adjunctPoints:["ST36","BL20","SP10","CV6","KI3","EX-CA1"], patternAdd:[{"pattern":"气血亏虚","points":["BL20","ST36","BL17"]},{"pattern":"肝肾不足","points":["BL23","KI3","GV4"]},{"pattern":"气滞血瘀","points":["SP10","LR14","PC6"]},{"pattern":"痰湿阻滞","points":["ST40","SP9","CV9"]}], cautions:"闭经病因复杂，须先经妇科检查与内分泌评估，排除妊娠、哺乳期生理性停经及器质性病变后再行针刺调理。青春期初潮延迟、体重明显下降或过度运动导致停经者，需同时纠正全身状况。请以教材、国家标准和专业医师指导为准。", contraindications:"妊娠期禁针，尤其禁用下腹部、腰骶部穴位及三阴交、合谷；生殖道畸形、宫腔粘连、垂体或卵巢肿瘤等器质性疾病所致闭经，针刺不能替代专科处理；严重营养不良、重度贫血及急性感染者慎用。", courseHint:"", tags:["月经病"], source:makeSource('B1') },
  { id:"dis-buyun", name:"不孕", category:"妇科", alias:["不孕症","原发性不孕","继发性不孕"], overview:"育龄女子在正常性生活且未避孕情况下较长时间未能妊娠。中医多责之肾虚、肝郁、痰湿、血瘀导致冲任失调、胞宫失养，临床需辨虚实并兼顾月经情况。", mainPoints:["CV4","CV3","SP6","BL23","GV4"], adjunctPoints:["ST36","BL20","LR3","KI3","BL32","EX-CA1"], patternAdd:[{"pattern":"肾虚胞寒","points":["GV4","BL23","KI3"]},{"pattern":"肝郁气滞","points":["LR3","LR14","PC6"]},{"pattern":"痰湿内阻","points":["ST40","SP9","CV9"]},{"pattern":"瘀阻胞宫","points":["SP10","BL32","LR3"]}], cautions:"不孕病因涉及排卵、输卵管、子宫及男方因素等多方面，针刺调理须建立在系统检查与明确诊断基础上，并建议夫妇双方同时评估。切勿以针刺替代必要的生殖医学治疗，调治周期通常较长，须配合基础体温或超声监测排卵。请以教材、国家标准和专业医师指导为准。", contraindications:"妊娠期及疑似妊娠者禁针下腹部、腰骶部及三阴交、合谷等穴；急性生殖道感染、盆腔脓肿、发热期不宜针刺；生殖系统肿瘤、输卵管积水需手术者应先接受专科处理；有出血倾向者慎用刺络放血。", courseHint:"", tags:["生殖","需专科评估"], source:makeSource('B1') },
  { id:"dis-chanhou-futong", name:"产后腹痛", category:"妇科", alias:["儿枕痛","产后宫缩痛"], overview:"产后以小腹阵发性疼痛为主症，哺乳时加重，可伴恶露不畅或量少色暗。虚者因血虚胞脉失养，实者因寒凝血瘀、气滞不行，致气血运行不畅而痛。", mainPoints:["CV3","CV4","SP6","ST36","BL32"], adjunctPoints:["CV6","LR3","SP10","BL20","BL23","EX-CA2"], patternAdd:[{"pattern":"血虚证","points":["BL20","BL17","ST36"]},{"pattern":"血瘀证","points":["SP10","BL34","LR3"]},{"pattern":"寒凝证","points":["CV4","CV8","SP10"]},{"pattern":"气滞证","points":["LR14","PC6","LR3"]}], cautions:"产后腹痛多为生理性宫缩痛，可自行缓解，针刺与艾灸仅作辅助，腹部施灸以温热舒适为度，防止烫伤。若疼痛持续加重、拒按伴发热、恶露量多而臭秽，或出现腹壁紧张、反跳痛，须立即就医排除胎盘胎膜残留、产褥感染、盆腔血肿等，不可自行反复按揉或针刺。请以教材、国家标准和专业医师指导为准。", contraindications:"产后大出血、重度贫血、发热或产褥感染者禁用针刺；剖宫产术后切口未愈合者避开伤口及邻近区域；膀胱高度充盈时禁在耻骨上区深刺；有出血倾向或正使用抗凝药物者慎用针刺与放血。", courseHint:"", tags:["产后病","常用"], source:makeSource('B1') },
  { id:"dis-chanhou-niaozhuliu", name:"产后尿潴留", category:"妇科", alias:["产后排尿困难","产后癃闭"], overview:"产后小便不通或排尿困难、点滴而出，小腹胀满，多发生于产后数小时至数日内。病机为膀胱气化不利，常见气虚无力推动、肾阳不足或瘀血阻滞下焦。", mainPoints:["CV3","CV4","SP6","BL28","BL32"], adjunctPoints:["KI3","CV6","BL23","SP9","ST36","EX-LE9"], patternAdd:[{"pattern":"气虚不运","points":["CV6","BL20","ST36"]},{"pattern":"肾阳不足","points":["GV4","BL23","KI3"]},{"pattern":"瘀血阻滞","points":["SP10","BL34","LR3"]},{"pattern":"湿热下注","points":["SP9","LR2","BL22"]}], cautions:"产后尿潴留应首先评估膀胱充盈程度，必要时由医护人员导尿以解除急性尿潴留，针刺可作为辅助促排尿手段。下腹部穴位宜用平补平泻或轻柔手法，膀胱高度充盈时禁在耻骨上区深刺，以免损伤膀胱。若伴发热、腰痛或血尿，须排除泌尿系感染及产道损伤。请以教材、国家标准和专业医师指导为准。", contraindications:"膀胱过度充盈未导尿时禁刺下腹部穴位；产后大出血、重度贫血、发热或产褥感染者不宜针刺；剖宫产术后切口未愈者避开伤口区域；有出血倾向或正使用抗凝药物者慎用。", courseHint:"", tags:["产后病","需专业处理"], source:makeSource('B1') },
  { id:"dis-chanhou-shentong", name:"产后身痛", category:"妇科", alias:["产后关节痛","产后风","产后痹证"], overview:"产褥期内出现肢体关节酸痛、麻木、重着，或伴畏寒恶风，遇冷加重、得温稍缓。多因产后气血亏虚、经脉失养，风寒湿邪乘虚侵袭，亦有瘀血留滞经络者。", mainPoints:["GV20","BL23","GB20","SI3","ST36"], adjunctPoints:["TE5","BL40","BL17","BL20","LI4","EX-CA2","EX-B4"], patternAdd:[{"pattern":"血虚证","points":["BL20","BL17","ST36"]},{"pattern":"风寒证","points":["GV14","BL12","TE5"]},{"pattern":"肾虚证","points":["BL23","GV4","KI3"]},{"pattern":"血瘀证","points":["SP10","LR3","BL17"]}], cautions:"产褥期体质偏虚，取穴宜少而精，手法以轻柔温和为主，可配合艾灸温经散寒，同时注意保暖、避免接触冷水与过度劳累，并保证营养与休息。若关节红肿热痛、晨僵明显或发热，须排查风湿免疫性疾病与产褥感染；出现单侧肢体肿胀疼痛、活动后加重时，应警惕血栓性疾病并立即就医。请以教材、国家标准和专业医师指导为准。", contraindications:"产后大出血、发热或急性感染者不宜针刺；有出血倾向、血小板减少或正服用抗凝药物者禁用强刺激与放血；关节局部红肿热痛、皮肤破损或感染者病变处禁刺禁灸；合并深静脉血栓可疑者严禁在患肢按摩与针刺。", courseHint:"", tags:["产后病","需鉴别诊断"], source:makeSource('B1') },
  { id:"dis-daixiabing", name:"带下病", category:"妇科", alias:["带下异常","白带异常"], overview:"阴道分泌物的量、色、质、气味发生异常，或伴外阴瘙痒、腰酸、小腹坠胀等。多因脾失健运、湿浊下注，或肾阳不足、带脉失约，亦有湿热蕴结者，辨证重在色质气味与全身兼症。", mainPoints:["CV3","CV4","SP6","SP9","GB26"], adjunctPoints:["BL32","BL23","BL20","ST36","LR3","EX-B4"], patternAdd:[{"pattern":"脾虚湿盛","points":["BL20","ST36","SP9"]},{"pattern":"肾阳不足","points":["GV4","BL23","KI3"]},{"pattern":"湿热下注","points":["SP9","LR2","BL34"]},{"pattern":"湿毒蕴结","points":["SP9","LI11","CV2"]}], cautions:"带下异常须先做妇科检查与分泌物检验，明确是否存在滴虫、霉菌、细菌感染或宫颈病变，感染性带下应同时接受对因治疗。针刺期间注意会阴部清洁，避免盆浴与性生活。若带下呈血性或米汤样、气味恶臭并伴消瘦，须尽快专科就诊。请以教材、国家标准和专业医师指导为准。", contraindications:"妊娠期禁针下腹部、腰骶部及三阴交；外阴、阴道及下腹部皮肤黏膜有急性炎症、破损时局部禁刺；急性盆腔炎伴高热、阴道大量出血或怀疑恶性肿瘤者不宜单纯针刺，应及时转诊。", courseHint:"", tags:["带下病"], source:makeSource('B1') },
  { id:"dis-elubujue", name:"恶露不绝", category:"妇科", alias:["恶露不尽","产后恶露不止"], overview:"产后血性恶露持续较长时间仍淋漓不断，或量时多时少、色淡或紫暗有块，可伴小腹坠痛、腰酸乏力。病机常见气虚不摄、血热妄行与瘀血内阻三类。", mainPoints:["CV3","CV4","SP6","SP10","BL32"], adjunctPoints:["BL20","ST36","KI3","BL23","LR3","EX-CA1"], patternAdd:[{"pattern":"气虚不摄","points":["BL20","ST36","GV20"]},{"pattern":"血热妄行","points":["LR2","LI11","SP10"]},{"pattern":"血瘀内阻","points":["SP10","LR3","BL34"]}], cautions:"产后恶露持续时间明显延长，或伴出血量多、腹痛、发热、气味臭秽时，须先行超声等检查排除胎盘胎膜残留、子宫复旧不良与产褥感染，必要时接受清宫或抗感染处理，针刺仅作辅助调理。若出血量骤增、头晕心悸、面色苍白，应按产后出血急诊处理。请以教材、国家标准和专业医师指导为准。", contraindications:"急性大出血、休克倾向或重度贫血者禁用针刺，须立即转诊；怀疑胎盘胎膜残留合并活动性出血者不宜单纯针刺；产褥感染发热期、下腹部皮肤感染者禁刺；有出血性疾病或正服用抗凝药物者禁用刺络放血及强刺激。", courseHint:"", tags:["产后病","需转诊排查"], source:makeSource('B1') },
  { id:"dis-gengnianqi-zonghezheng", name:"更年期综合征", category:"妇科", alias:["围绝经期综合征","经断前后诸证"], overview:"绝经前后出现烘热汗出、烦躁易怒、失眠多梦、心悸、情绪波动及月经紊乱等一组症状。病机以肾气渐衰、天癸将竭为本，常兼肝郁、心火、脾虚，属本虚标实之候。", mainPoints:["CV4","SP6","KI3","HT7","GV20"], adjunctPoints:["PC6","BL23","ST36","LR3","BL15","EX-HN1"], patternAdd:[{"pattern":"肾阴虚","points":["KI3","KI6","BL23"]},{"pattern":"肾阳虚","points":["GV4","CV6","BL23"]},{"pattern":"肝郁化火","points":["LR3","LR2","GB20"]},{"pattern":"心脾两虚","points":["HT7","BL20","BL15"]}], cautions:"本证以整体调治为主，针刺多用于改善烘热、失眠与情绪症状，需配合情志疏导、规律作息与适度运动。症状明显影响生活，或出现绝经后异常阴道流血、心悸胸痛、血压剧烈波动者，应先经专科评估，排除心血管与妇科器质性疾病。请以教材、国家标准和专业医师指导为准。", contraindications:"妊娠期禁针下腹部及三阴交等穴；严重骨质疏松、极度衰弱或伴急性心脑血管事件者不宜针刺；皮肤感染、出血倾向、正服用抗凝药物者慎刺；合并严重精神症状者须由专科医师主导治疗。", courseHint:"", tags:["绝经前后","常用"], source:makeSource('B1') },
  { id:"dis-jingqianqi-zonghezheng", name:"经前期综合征", category:"妇科", alias:["经前紧张综合征","经行情志异常"], overview:"月经来潮前出现情绪烦躁、乳房胀痛、头痛、浮肿、腹胀、失眠等一组症状，经后多自行缓解。病机常与肝郁气滞、阴虚火旺、脾虚湿盛及心脾两虚相关。", mainPoints:["LR3","SP6","CV4","PC6","HT7"], adjunctPoints:["GV20","ST36","BL20","KI3","LR14","EX-HN1"], patternAdd:[{"pattern":"肝郁气滞","points":["LR14","GB34","LR2"]},{"pattern":"阴虚火旺","points":["KI3","KI6","LR2"]},{"pattern":"脾虚湿盛","points":["SP9","BL20","ST40"]},{"pattern":"心脾两虚","points":["HT7","BL15","BL20"]}], cautions:"宜在经前七至十日开始调治，经行后症状缓解期可暂停，同时配合情绪调节、规律睡眠与限盐饮食。症状严重干扰工作生活，或出现明显抑郁、焦虑甚至自伤观念时，须及时转介精神心理专科，不可仅靠针刺。请以教材、国家标准和专业医师指导为准。", contraindications:"妊娠期及疑似妊娠者禁针下腹部与三阴交、合谷等穴；皮肤感染、溃疡处禁刺；有出血倾向或正服用抗凝药物者慎用；合并严重精神障碍、需药物治疗者不应以针刺替代规范诊治。", courseHint:"", tags:["月经病","情志相关"], source:makeSource('B1') },
  { id:"dis-jingxing-toutong", name:"经行头痛", category:"妇科", alias:["月经期头痛","经期偏头痛"], overview:"每逢月经前后或经期出现头痛，多位于前额、巅顶或一侧颞部，可伴头晕、恶心、烦躁，经净后缓解或消失。病机常见肝阳上亢、血虚失养、血瘀阻络与痰湿上扰。", mainPoints:["GV20","EX-HN5","GB20","LI4","LR3"], adjunctPoints:["SP6","SP10","EX-HN3","ST36","BL18","EX-HN1"], patternAdd:[{"pattern":"肝阳上亢","points":["KI3","LR2","GB43"]},{"pattern":"血虚证","points":["BL20","ST36","BL17"]},{"pattern":"血瘀证","points":["SP10","BL17","LR3"]},{"pattern":"痰湿证","points":["ST40","SP9","EX-HN3"]}], cautions:"宜于经前数日开始预防性调治，经期手法宜平和，头面部穴位刺激以酸胀舒适为度，避免强刺激诱发不适。若头痛突然剧烈发作、呈爆炸样，或伴喷射性呕吐、视物模糊、肢体无力、言语不清、发热颈强，须立即急诊排除颅内病变与高血压急症。反复发作者建议记录头痛日记并结合妇科与神经内科评估。请以教材、国家标准和专业医师指导为准。", contraindications:"妊娠期及疑似妊娠者禁用合谷、三阴交等穴，并禁针下腹部；头部皮肤感染、破损、瘢痕处禁刺；高血压未控制、颅内压增高或怀疑脑血管病变者禁用针刺，应先明确诊断；有出血倾向或正服用抗凝药物者慎用放血与强刺激。", courseHint:"", tags:["月经病","常用"], source:makeSource('B1') },
  { id:"dis-penqiangyan", name:"盆腔炎", category:"妇科", alias:["盆腔炎性疾病","附件炎","少腹痛"], overview:"以下腹坠痛或刺痛、腰骶酸痛、带下增多为主症，常在劳累、经期或性交后加重，可伴低热、月经失调。急性期多属湿热瘀阻，慢性期常见气滞血瘀、寒湿凝滞与脾虚湿盛。", mainPoints:["CV4","CV3","SP6","BL32","BL28"], adjunctPoints:["ST36","SP9","LR3","BL23","LI4","EX-B4"], patternAdd:[{"pattern":"湿热瘀阻","points":["SP9","LI11","BL34"]},{"pattern":"气滞血瘀","points":["LR3","SP10","LR14"]},{"pattern":"寒湿凝滞","points":["CV4","CV6","SP9"]},{"pattern":"脾虚湿盛","points":["BL20","ST36","SP9"]}], cautions:"急性盆腔炎伴高热、寒战、下腹剧痛或脓性分泌物时属急症，须立即接受规范的抗感染治疗，不可仅依赖针刺，延误可致盆腔脓肿与不孕。慢性期针刺调治宜配合情志疏导、规律作息、避免劳累受凉，并在专业医师指导下按疗程进行。确诊须依据妇科检查与影像、检验结果，治疗期间避免盆浴与性生活。请以教材、国家标准和专业医师指导为准。", contraindications:"妊娠期及疑似妊娠者禁针下腹部、腰骶部穴位及三阴交、合谷；急性感染高热期、盆腔脓肿形成或需手术者禁用针刺，应先转诊处理；下腹部皮肤感染、破损处禁刺；有出血倾向或正服用抗凝药物者慎用；经期不宜在腹部做强刺激或电针。", courseHint:"", tags:["妇科炎症","急性需转诊"], source:makeSource('B1') },
  { id:"dis-queiru-ganyu", name:"缺乳", category:"妇科", alias:["产后乳汁不足","肝郁缺乳","乳汁不行"], overview:"产后乳汁分泌量少或全无，以肝郁气滞为主要证候者，多见乳房胀硬而痛、乳汁不畅、胸胁胀闷、情志抑郁或烦躁、善太息，脉弦。病机为肝失疏泄、乳络壅阻不通。", mainPoints:["CV17","ST18","SI1","LR3","PC6"], adjunctPoints:["TE1","GB21","ST36","BL20","LR14"], patternAdd:[{"pattern":"肝郁气滞","points":["LR14","GB34","PC6"]},{"pattern":"气血亏虚","points":["ST36","BL20","BL17"]},{"pattern":"乳络壅阻","points":["SI1","TE1","CV17"]}], cautions:"调治同时须指导正确哺乳姿势与含接方式，增加有效吸吮频次，并保证产妇营养、水分摄入与情绪疏导，避免过早添加代乳品。若乳房红肿热痛伴发热，应考虑乳腺炎并及时就医；婴儿体重不增、尿量减少提示摄入不足，需尽快评估喂养方案。请以教材、国家标准和专业医师指导为准。", contraindications:"乳房局部红肿、硬结、脓肿或皮肤破损者，病变区禁针禁灸，不可自行挤压按摩硬块；产后大出血、重度贫血、发热或急性感染者不宜针刺；乳头皲裂合并感染时先处理创面，避免在患处操作；有出血倾向者禁用放血。", courseHint:"", tags:["产后病","乳房病"], source:makeSource('B1') },
  { id:"dis-rushao", name:"乳少", category:"妇科", alias:["产后缺乳","乳汁不足"], overview:"产后乳汁分泌不足或全无，不能满足婴儿需要。虚者多因气血亏虚、乳汁生化无源；实者多因肝郁气滞、乳络壅阻不通，辨证需结合乳房胀与不胀、乳汁稀稠及全身状态。", mainPoints:["CV17","ST18","SI1","SP6","LR3"], adjunctPoints:["ST36","BL20","PC6","TE1","GB21"], patternAdd:[{"pattern":"气血亏虚","points":["ST36","BL20","BL17"]},{"pattern":"肝郁气滞","points":["LR14","PC6","GB34"]},{"pattern":"乳络壅阻","points":["SI1","TE1","CV17"]}], cautions:"针刺同时应指导正确哺乳姿势与含接方式，增加有效吸吮频次，并保证产妇营养、水分与休息，情绪疏导同样重要。若乳房红肿热痛、发热，应考虑乳腺炎并转诊；婴儿体重不增或脱水时须及时就医评估喂养方案。请以教材、国家标准和专业医师指导为准。", contraindications:"乳房局部有红肿、硬结、脓肿或皮肤破损时禁在病变区针刺；产后大出血、重度贫血、发热或急性感染者不宜针刺；乳头皲裂合并感染时应先处理创面，避免在患处操作。", courseHint:"", tags:["产后病"], source:makeSource('B1') },
  { id:"dis-ruyong", name:"乳痈", category:"妇科", alias:["急性乳腺炎","急性化脓性乳腺炎"], overview:"乳房红肿热痛，可伴硬结、压痛、发热恶寒，多见于产后哺乳期。病机为乳汁淤积、乳络不通，复感外邪或胃热肝郁化火，热毒壅聚而成。", mainPoints:["CV17","ST18","GB21","LI11","SI1"], adjunctPoints:["TE1","LI4","LR3","ST36","PC6"], patternAdd:[{"pattern":"初期郁乳期","points":["SI1","TE1","GB21"]},{"pattern":"热毒炽盛","points":["LI11","LI4","GV14"]},{"pattern":"肝郁胃热","points":["LR3","ST44","PC6"]},{"pattern":"脓成期","points":["LI11","ST36"]}], cautions:"本病属需及时处理的感染性疾患，应尽早接受中西医结合治疗；针刺可用于早期辅助消肿通络，并配合排空乳汁、局部护理。若已化脓，必须由外科专业处理，不可依赖针刺，切忌自行挤压按摩硬块，以免炎症扩散。出现高热寒战、乳房波动感或全身中毒症状时须立即转诊。请以教材、国家标准和专业医师指导为准。", contraindications:"乳房已形成脓肿或局部皮肤破溃者，患处禁针禁灸；高热、寒战、败血症倾向或需手术引流者不宜针刺，应转外科处理；妊娠期、哺乳期非患侧穴位操作需谨慎，避免强刺激；有出血倾向者禁用放血。", courseHint:"", tags:["乳房病","需转诊"], source:makeSource('B1') },
  { id:"dis-taiwei-buzheng", name:"胎位不正", category:"妇科", alias:["胎位异常","臀位"], overview:"妊娠后期经产科检查发现胎位非头先露，如臀位、横位等。中医以灸法温通经脉、调整胞宫气血为调理思路，临床常用至阴穴为主，多用于孕晚期特定阶段。", mainPoints:["BL67","BL60","KI1","SP6","CV4"], adjunctPoints:["GB34","LR3","ST36","BL23"], patternAdd:[{"pattern":"气血亏虚","points":["ST36","BL20","BL17"]},{"pattern":"气机郁滞","points":["LR3","CV6","PC6"]},{"pattern":"肾气不足","points":["BL23","GV4","KI3"]}], cautions:"胎位调整必须在产科医师评估与监测下进行，针刺或艾灸至阴穴仅为辅助手段，须在专业医疗机构由有经验人员操作并定期复查胎位与胎心。出现腹痛、阴道流血、流液、胎动异常时立即停止并急诊就医。请以教材、国家标准和专业医师指导为准。", contraindications:"前置胎盘、胎盘早剥、多胎妊娠、羊水过少、子宫畸形、骨盆狭窄、有剖宫产史或先兆早产者禁用此类操作；妊娠期禁针下腹部、腰骶部及三阴交、合谷等穴；有流产、早产史者慎用；局部皮肤破损或感染者禁灸禁刺。", courseHint:"", tags:["妊娠期","需专业监护"], source:makeSource('B1') },
  { id:"dis-tongjing", name:"痛经", category:"妇科", alias:["经行腹痛","原发性痛经"], overview:"行经前后或经期出现下腹部痉挛性疼痛，可放射至腰骶及大腿内侧，常伴恶心、腹泻、冷汗等。病机多为寒凝、气滞、血瘀致冲任气血运行不畅，或气血亏虚、胞脉失养。", mainPoints:["CV4","CV3","SP6","SP8","BL32"], adjunctPoints:["ST36","LR3","CV6","BL23","SP10","EX-CA1","EX-CA2"], patternAdd:[{"pattern":"寒凝血瘀","points":["CV4","SP10","LR2"]},{"pattern":"气滞血瘀","points":["LR3","SP10","LI4"]},{"pattern":"气血虚弱","points":["ST36","BL20","BL17"]},{"pattern":"肝肾亏损","points":["BL23","KI3","LR3"]}], cautions:"宜在经前数日开始预防性调治，经期手法以平和为度；下腹部与腰骶部可配合温和灸法散寒。若疼痛剧烈伴晕厥、发热、异常阴道流血，或痛经进行性加重且逐年明显，需及时就医排除子宫内膜异位症、盆腔炎等继发病因，不宜自行反复针刺。请以教材、国家标准和专业医师指导为准。", contraindications:"妊娠期及疑似妊娠者禁用下腹部、腰骶部穴位与三阴交、合谷；经期不宜在腹部做强刺激或电针；局部皮肤破损、感染者禁刺；出血性疾病、重度贫血及不明原因急腹症者不宜针刺，应先明确诊断。", courseHint:"", tags:["月经病","常用"], source:makeSource('B1') },
  { id:"dis-yinting", name:"阴挺", category:"妇科", alias:["子宫脱垂","阴脱","产肠不收"], overview:"以阴道中有物下坠、甚则脱出阴道口外为主症，常伴小腹坠胀、腰酸、带下增多、劳则加重。病机多因中气下陷、肾气不固，带脉失约、胞宫失于升举，亦可兼湿热下注。", mainPoints:["GV20","CV6","CV4","CV3","EX-CA1","ST36"], adjunctPoints:["SP6","BL23","BL20","GV4","KI3"], patternAdd:[{"pattern":"中气下陷","points":["BL20","ST36","GV20"]},{"pattern":"肾气不固","points":["BL23","GV4","KI3"]},{"pattern":"湿热下注","points":["SP9","LR2","LI11"]}], cautions:"本病以补气升提为调理思路，百会、气海、关元等穴多用灸法或温针，腹部穴位手法宜轻柔，不可深刺。应同时避免久蹲、久立、负重与慢性咳嗽、便秘等增加腹压的因素，并配合盆底肌训练，脱垂较重者须经妇科评估是否需要子宫托或手术，针刺不能替代专科处理。脱出物摩擦糜烂、溃疡或合并感染时，先处理局部创面。请以教材、国家标准和专业医师指导为准。", contraindications:"妊娠期及疑似妊娠者禁针下腹部与腰骶部穴位，并禁针三阴交、合谷等易引起子宫收缩的穴位；脱出物表面溃疡、感染、出血者局部禁刺禁灸；急性生殖道感染伴发热者不宜针刺；合并重度心肺疾病、极度衰弱者不宜强刺激。", courseHint:"", tags:["盆底疾病","需专科评估"], source:makeSource('B1') },
  { id:"dis-yinyang", name:"阴痒", category:"妇科", alias:["外阴瘙痒","阴门瘙痒","阴蚀"], overview:"以外阴及阴道内瘙痒难忍为主症，常伴带下量多、色黄或如豆腐渣样、气味秽浊，甚则灼痛、抓破流水。病机多为湿热下注、肝经郁热，亦有阴虚血燥、肌肤失养者。", mainPoints:["CV3","SP6","SP9","LR3","SP10"], adjunctPoints:["BL32","LI11","GB26","BL23","BL20","EX-LE3"], patternAdd:[{"pattern":"湿热下注","points":["SP9","LR2","LI11"]},{"pattern":"肝经郁热","points":["LR2","LR14","GB34"]},{"pattern":"阴虚血燥","points":["KI3","KI6","BL17"]},{"pattern":"脾虚湿盛","points":["BL20","ST36","SP9"]}], cautions:"阴痒多由感染或局部病变引起，须先做妇科检查与分泌物检验，明确滴虫、霉菌、细菌感染或外阴白斑、糖尿病等病因并对因治疗，针刺仅作辅助止痒。日常应保持外阴清洁干燥，穿宽松棉质内裤，避免烫洗、搔抓与滥用刺激性洗剂。若外阴皮肤增厚变白、出现溃疡或质硬结节，须尽快专科就诊排除恶变。请以教材、国家标准和专业医师指导为准。", contraindications:"妊娠期禁针下腹部及三阴交、合谷等穴；外阴、阴道及下腹部皮肤黏膜急性炎症、破损、渗出时局部禁刺禁灸；急性感染伴发热或怀疑外阴恶性病变者不宜单纯针刺，应及时转诊；糖尿病患者血糖未控制时慎用局部强刺激。", courseHint:"", tags:["带下病","需病原检查"], source:makeSource('B1') },
  { id:"dis-yuejing-budiao", name:"月经不调", category:"妇科", alias:["月经失调","月经周期紊乱"], overview:"泛指月经周期、经量、经色、经质发生异常的一类病证，常见先期、后期、先后无定期及量多量少等表现。多与肝、脾、肾三脏功能失调及冲任气血不和相关，辨证重在察周期、量色与伴随症。", mainPoints:["CV4","CV3","SP6","SP10","LR3"], adjunctPoints:["ST36","BL23","BL20","CV6","KI3","EX-CA1","EX-CA2"], patternAdd:[{"pattern":"肝郁气滞","points":["LR14","PC6","GB34"]},{"pattern":"气血两虚","points":["BL20","ST36","BL17"]},{"pattern":"肾虚不固","points":["BL23","KI3","GV4"]},{"pattern":"血热妄行","points":["LI11","SP10","LR2"]}], cautions:"针刺宜避开经期或经量最多的时段，通常于经前一周开始调理；调经需连续观察数个周期，不可因短期未见变化而自行加大刺激。若出现经量骤增、经期延长超过十日、非经期出血或伴明显贫血、消瘦，应先行妇科检查排除器质性病变。请以教材、国家标准和专业医师指导为准。", contraindications:"妊娠期或疑似妊娠者禁针下腹部及三阴交、合谷等易引起子宫收缩的穴位；皮肤感染、溃疡、瘢痕处禁刺；有出血倾向或正服用抗凝药物者慎用针刺及放血；生殖系统肿瘤、急性盆腔感染未明确诊断前不宜单纯针刺处理。", courseHint:"", tags:["月经病","常用"], source:makeSource('B1') },
  { id:"dis-child-constipation", name:"小儿便秘", category:"儿科", alias:["大便干结","功能性便秘"], overview:"以排便次数明显减少、粪质干硬、排出困难或排便间隔延长为主症，可伴腹胀、腹痛、食欲减退、口臭及便后肛周疼痛出血，多因燥热内结、食积气滞或气虚推动无力所致。", mainPoints:["ST25","EX-UE8","BL25","ST36","TE6"], adjunctPoints:["CV6","CV12","LI4","LI11","SP6","BL20","EX-B2"], patternAdd:[{"pattern":"燥热内结","points":["LI11","ST44"]},{"pattern":"食积便秘","points":["CV12","ST44"]},{"pattern":"气虚便秘","points":["BL20","CV6"]},{"pattern":"血虚便秘","points":["BL20","SP6"]}], cautions:"应以增加膳食纤维与饮水量、训练定时排便、适度活动和腹部顺时针推拿为主，针刺作辅助；婴幼儿腹部穴位须浅刺、轻刺激，不宜深刺或长时间留针。若便秘伴剧烈腹痛、呕吐、腹胀拒按、便血、体重下降或长期依赖开塞露，须就医排除肠梗阻、巨结肠等器质性疾病，不可长期自行处理。请以教材、国家标准和专业医师指导为准。", contraindications:"急腹症表现（腹痛拒按、腹膜刺激征、疑肠梗阻或肠套叠）者禁针禁推拿，须立即转诊；先天性巨结肠、肛门狭窄等器质性病变所致便秘不属单纯针刺适应证；腹部皮肤感染、破损或腹部手术后早期禁刺；有出血倾向者禁用强刺激手法。", courseHint:"", tags:["脾胃","大肠"], source:makeSource('B1') },
  { id:"dis-child-adhd", name:"小儿多动症", category:"儿科", alias:["注意缺陷多动障碍","儿童多动综合征","轻微脑功能障碍"], overview:"以注意力难以集中、活动过度、情绪冲动、坐立不安、做事有始无终为主症，常伴学习困难与同伴交往不良，多与心脾肾不足、阴阳失调及痰热内扰有关，学龄期儿童多见。", mainPoints:["GV20","EX-HN1","EX-HN3","HT7","PC6","SP6"], adjunctPoints:["LI4","LR3","ST36","BL15","BL20","BL23"], patternAdd:[{"pattern":"心脾两虚","points":["BL15","BL20"]},{"pattern":"痰热内扰","points":["ST40","PC8"]},{"pattern":"肝肾阴虚","points":["BL23","KI3"]},{"pattern":"阴虚阳亢","points":["KI3","LR3"]}], cautions:"本病须由儿科或儿童精神科完成评估诊断，针刺只作为综合干预的辅助手段，应同时配合行为矫治、家长培训、教育支持与心理疏导，不宜单纯依靠针刺。手法宜轻、留针时间宜短，避免强刺激引起患儿恐惧与抵触；若出现明显攻击行为、自伤、抽动、睡眠严重紊乱或学习能力急剧下降，须及时转诊专科。请以教材、国家标准和专业医师指导为准。", contraindications:"局部皮肤感染、破损处禁刺；正在使用中枢兴奋剂等药物者须由医师统一评估，不可自行停减药物；癫痫发作未控制、颅内感染或占位性病变所致行为异常者禁针并须先明确病因；婴幼儿囟门未闭者禁刺头顶部穴位；有出血倾向者禁用强刺激手法。", courseHint:"", tags:["心神","行为发育"], source:makeSource('B1') },
  { id:"dis-child-thrush", name:"小儿鹅口疮", category:"儿科", alias:["雪口","口腔念珠菌病","婴幼儿口腔真菌感染"], overview:"以口腔黏膜、舌面及颊部出现白色乳凝块样斑膜、略高起而不易擦去、强行剥离可见潮红糜烂面为主症，轻者无明显不适，重者拒乳哭闹、流涎、影响进食，多因心脾积热上蒸或虚火上浮所致。", mainPoints:["CV23","EX-HN10","LI4","HT7","SP6"], adjunctPoints:["LI11","ST44","PC8","KI3","BL20","EX-UE3"], patternAdd:[{"pattern":"心脾积热","points":["LI11","HT8"]},{"pattern":"虚火上浮","points":["KI3","KI6"]},{"pattern":"脾虚湿泛","points":["ST40","SP9"]},{"pattern":"阴虚火旺","points":["KI3","BL23"]}], cautions:"本病多与口腔念珠菌感染有关，须同时做好奶具、餐具与母亲乳头的清洁消毒，必要时在医师指导下使用抗真菌药物，针刺只作辅助。婴幼儿口腔黏膜娇嫩，口腔内与口周穴位点刺须极轻、极浅并严格无菌，宜由专业人员操作。若白膜蔓延至咽喉、伴发热、拒食、脱水或体重不增，或长期使用抗生素、激素及免疫抑制剂者，须及时就医排查免疫缺陷与全身感染。请以教材、国家标准和专业医师指导为准。", contraindications:"口腔黏膜糜烂、溃疡出血或局部急性炎症明显处禁刺；有出血性疾病、凝血功能障碍或血小板减少者禁用口腔内点刺；伴高热、脱水、呼吸困难或全身播散性感染者禁针，须先抗感染与支持治疗；婴幼儿囟门未闭者禁刺头顶部穴位。", courseHint:"", tags:["口齿","婴儿"], source:makeSource('B1') },
  { id:"dis-child-fever", name:"小儿发热", category:"儿科", alias:["小儿外感发热","急性发热"], overview:"以体温高于正常为主症，可伴面赤、烦躁、口渴、无汗或汗出不畅，多由外感时邪引起，亦可因食积、惊恐等因素而发，小儿传变较快。", mainPoints:["LI11","GV14","LI4","LU11","TE5"], adjunctPoints:["GB20","LU5","LI10","GV4","PC8","EX-UE11","EX-HN6"], patternAdd:[{"pattern":"风寒证","points":["BL12","TE5"]},{"pattern":"风热证","points":["LU11","LI11"]},{"pattern":"食积发热","points":["CV12","ST44"]},{"pattern":"高热动风","points":["LR3","GV4"]}], cautions:"小儿发热变化快，针刺仅可作辅助退热手段，必须同时监测体温、精神、呼吸与皮疹情况并多饮水。三月龄以下婴儿发热、或伴嗜睡、抽搐、颈项强直、呼吸急促、皮肤瘀点者，属急重征象，须立即送医，不得自行针刺。请以教材、国家标准和专业医师指导为准。", contraindications:"高热伴惊厥、意识障碍或休克倾向者禁针，须急诊抢救；有出血倾向或正在使用抗凝药物者禁刺；皮肤感染、破损处禁刺；婴幼儿囟门未闭者禁刺头顶部穴位。", courseHint:"", tags:["外感","急症相关"], source:makeSource('B1') },
  { id:"dis-child-malnutrition", name:"小儿疳积", category:"儿科", alias:["疳证","营养不良","蛋白质能量营养不良"], overview:"由喂养不当或久病伤脾致脾胃运化失健，以形体消瘦、面色萎黄、毛发干枯、食欲异常（或多食易饥或纳呆厌食）、肚腹膨胀、精神不振为主症，重者发育迟缓。", mainPoints:["EX-UE10","CV12","ST36","BL20","BL21"], adjunctPoints:["EX-B2","SP3","ST25","SI3","SP6"], patternAdd:[{"pattern":"脾胃虚弱","points":["CV6","SP3"]},{"pattern":"积滞伤中","points":["ST44","LI11"]},{"pattern":"虫积内扰","points":["BL18","EX-B3","EX-LE3"]},{"pattern":"气血两虚","points":["GV4","BL23"]}], cautions:"四缝点刺属有创操作，须一人一针、严格无菌并由专业人员施行，不可在家自行挑刺；本病以调理饮食、补充营养、治疗原发病和捏脊推拿为根本，针刺仅作辅助。若出现重度消瘦、水肿、生长停滞、反复感染或精神萎靡，须尽快就医评估营养状态与有无慢性消耗性疾病。请以教材、国家标准和专业医师指导为准。", contraindications:"局部皮肤感染、湿疹、疥疮或正在发热出疹者禁点刺；重度营养不良、重度贫血、低蛋白水肿、凝血功能障碍及血友病患儿禁用刺血；极度衰弱或脱水者禁针，须先纠正全身状况；婴幼儿囟门未闭者禁刺头顶部穴位。", courseHint:"", tags:["脾胃","营养不良"], source:makeSource('B1') },
  { id:"dis-child-cough", name:"小儿咳嗽", category:"儿科", alias:["小儿支气管炎","小儿外感咳嗽"], overview:"以咳嗽为主要表现，咳声或重浊或清脆，常伴咳痰、鼻塞流涕、咽痒，多因外邪犯肺、肺气不宣所致，反复发作者常兼脾虚痰盛。", mainPoints:["LU7","LU5","CV22","CV17","BL13"], adjunctPoints:["LI4","ST40","CV12","BL12","GV14","EX-B1","EX-UE10"], patternAdd:[{"pattern":"风寒咳嗽","points":["BL12","TE5"]},{"pattern":"风热咳嗽","points":["LI11","LU11"]},{"pattern":"痰湿咳嗽","points":["ST40","SP9"]},{"pattern":"肺脾气虚","points":["BL20","ST36"]}], cautions:"小儿胸壁薄，胸背部穴位须浅刺斜刺，严禁深刺以免伤及内脏；咳嗽伴气促、鼻翼煽动、口唇发紫或高热不退者提示肺炎等重症可能，须立即就医。请以教材、国家标准和专业医师指导为准。", contraindications:"胸背部皮肤感染、破损处禁刺；有气胸风险者、严重佝偻病胸廓畸形者慎用胸部穴位；咳嗽伴咯血或出血性疾病者禁刺；婴幼儿囟门未闭者禁刺头顶部穴位。", courseHint:"", tags:["肺系","常见病"], source:makeSource('B1') },
  { id:"dis-child-torticollis", name:"小儿肌性斜颈", category:"儿科", alias:["先天性肌性斜颈","小儿斜颈"], overview:"以头向患侧歪斜、颜面转向健侧为特征，患侧胸锁乳突肌可触及肿块或条索状挛缩，多因产伤或胎位因素致局部气血瘀滞、筋脉失养。", mainPoints:["GB20","SI17","LI17","LI4","GB34"], adjunctPoints:["TE5","LI11","SI3","BL10","GB21","EX-UE8"], patternAdd:[{"pattern":"气滞血瘀","points":["LI4","SP10"]},{"pattern":"肝肾不足","points":["BL23","KI3"]},{"pattern":"脾虚筋弱","points":["BL20","ST36"]},{"pattern":"风寒阻络","points":["BL12","TE5"]}], cautions:"本病以小儿推拿、牵伸与体位矫正为主要手段，针刺须由有经验的儿科专业医师操作，颈部进针宜浅、切忌深刺或大幅提插。治疗期间应定期评估头颈活动度与面部对称情况；若一岁以后仍无明显改善或出现斜视、面部发育不对称，须转骨科或小儿外科评估手术。请以教材、国家标准和专业医师指导为准。", contraindications:"颈部血管神经丰富，禁止深刺与反复捣刺；局部皮肤感染、破损或肿块破溃者禁刺；颈椎畸形、脱位或结核等骨性病变所致斜颈者禁针并转诊；有出血倾向者禁用强刺激手法。", courseHint:"", tags:["筋伤","婴儿"], source:makeSource('B1') },
  { id:"dis-child-myopia", name:"小儿近视", category:"儿科", alias:["青少年近视","调节性近视"], overview:"以视远模糊、视近尚清为主症，常伴眼胀、眼干、易疲劳，多因用眼过度、久视伤血及肝肾不足、目失濡养所致，早期多为调节性改变。", mainPoints:["BL1","BL2","GB20","LI4","ST36"], adjunctPoints:["GB37","BL18","BL23","KI3","GB14","EX-HN10","EX-HN5"], patternAdd:[{"pattern":"肝肾不足","points":["BL18","BL23"]},{"pattern":"心脾两虚","points":["BL15","BL20"]},{"pattern":"用眼过度","points":["GB14","GB37"]},{"pattern":"气虚神伤","points":["CV6","GV20"]}], cautions:"眼区穴位进针后禁行提插捻转等强手法，出针后按压片刻以防出血；治疗须配合用眼卫生、增加户外活动与定期验光，视力进行性下降或伴眼痛、视物变形者须转眼科检查。请以教材、国家标准和专业医师指导为准。", contraindications:"眼区及颜面局部有感染、破损或急性眼病（如结膜炎、角膜炎、青光眼急性发作）者禁刺；有出血倾向或高度近视伴眼底病变者慎用眼周穴位；婴幼儿囟门未闭者禁刺头顶部穴位。", courseHint:"", tags:["眼病","青少年"], source:makeSource('B1') },
