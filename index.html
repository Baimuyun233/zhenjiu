  { id:"dis-child-convulsion", name:"小儿惊风", category:"儿科", alias:["惊厥","抽风"], overview:"以四肢抽搐、颈项强直、两目上视、意识不清为主症，起病急骤者多属急惊风，常由外感高热引发；反复发作、抽势无力而缓者多属慢惊风，常与脾虚、阴虚有关。", mainPoints:["GV14","GV20","LI4","LR3","GV4"], adjunctPoints:["PC8","GV26","GB20","KI1","ST40","EX-UE11"], patternAdd:[{"pattern":"急惊风","points":["GV26","LI11"]},{"pattern":"慢惊风","points":["CV4","ST36"]},{"pattern":"痰热惊风","points":["ST40","PC8"]},{"pattern":"惊恐惊风","points":["HT7","BL62"]}], cautions:"惊风属儿科危急重症，发作时应立即侧卧、松解衣领、保持呼吸道通畅并急送医院，针刺只能作为专业人员在急救与对症处理中的辅助措施。反复或持续抽搐、意识不恢复、呼吸异常者，不得延误转诊。请以教材、国家标准和专业医师指导为准。", contraindications:"非专业人员不得自行对抽搐患儿施针；抽搐发作中禁止强行约束肢体或向口中塞入任何物品；颅脑感染、颅内占位、中毒、代谢紊乱所致者须先明确病因并转诊；局部皮肤感染或出血倾向者禁刺。", courseHint:"", tags:["急症","危重转诊"], source:makeSource('B1') },
  { id:"dis-child-drooling", name:"小儿流涎", category:"儿科", alias:["滞颐","小儿唾液过多"], overview:"指小儿涎液不自觉从口角流出、浸渍颐间甚至胸前为主症，三岁以内小儿唾液腺发育与吞咽协调未臻完善者多见；涎液清稀、面白唇淡者多属脾虚不摄，涎液黏稠、口臭便秘者多属脾胃积热。", mainPoints:["CV24","ST4","ST36","SP3","CV12"], adjunctPoints:["CV23","LI4","BL20","SP9","ST44","EX-UE10","EX-UE8"], patternAdd:[{"pattern":"脾胃虚寒","points":["CV6","BL20"]},{"pattern":"脾胃积热","points":["LI11","ST44"]},{"pattern":"脾虚湿盛","points":["SP9","SP6"]},{"pattern":"心脾积热","points":["HT8","PC8"]}], cautions:"口周与面颊皮肤因涎液浸渍易发红糜烂，针刺前须查看局部皮肤，平时应勤用软布轻蘸拭干并涂以保护性软膏，避免用力擦搓。三岁以后仍持续大量流涎，或伴吞咽困难、口齿不清、智力或运动发育落后、口腔溃疡及明显口臭者，须就诊排查神经系统、口腔及消化道疾病。请以教材、国家标准和专业医师指导为准。", contraindications:"口唇、口周及面颊皮肤有感染、湿疹、破损或糜烂者禁刺局部穴位；有出血倾向或凝血功能障碍者禁用强刺激手法；疑有口腔急性感染、疱疹性咽峡炎或吞咽功能障碍者不宜针刺，须先明确病因；婴幼儿囟门未闭者禁刺头顶部穴位。", courseHint:"", tags:["脾胃","婴儿"], source:makeSource('B1') },
  { id:"dis-child-dyspepsia", name:"小儿食积", category:"儿科", alias:["积滞","消化不良"], overview:"因喂养不当、乳食不节致食停中焦，以脘腹胀满、嗳腐吞酸、纳呆、大便不调或酸臭为主症，常伴夜卧不安、手足心热。", mainPoints:["CV12","ST25","ST36","SP4","LI4"], adjunctPoints:["BL21","LI10","ST44","CV6","EX-UE10"], patternAdd:[{"pattern":"乳食内积","points":["LI11","ST44"]},{"pattern":"脾虚夹积","points":["BL20","SP3"]},{"pattern":"积滞化热","points":["LI11","GV14"]},{"pattern":"食积气滞","points":["LR3","PC6"]}], cautions:"婴幼儿形体未充，取穴宜少、手法宜轻，多用浅刺疾出或点刺不留针；饮食调理与定时定量喂养是根本，针刺只作辅助。若出现明显消瘦、长期呕吐、便血或发热不退，应及时就医查明原因。请以教材、国家标准和专业医师指导为准。", contraindications:"局部皮肤感染、破损或瘢痕处禁刺；有出血性疾病、重度营养不良或脱水、急腹症表现者不宜针刺，须先转诊儿科处理；婴幼儿囟门未闭者头顶部穴位禁刺；本症不主张自行在家施针。", courseHint:"", tags:["脾胃","常见病"], source:makeSource('B1') },
  { id:"dis-child-asthma", name:"小儿哮喘", category:"儿科", alias:["小儿支气管哮喘","哮证","喘证"], overview:"以反复发作的喉间哮鸣、呼吸急促、呼气延长、胸闷咳嗽为主症，常于夜间或清晨加重，发作多与接触过敏原、气候变化及呼吸道感染有关；缓解期多见肺脾肾亏虚、痰饮内伏。", mainPoints:["EX-B1","LU5","CV17","CV22","BL13","LU7"], adjunctPoints:["LI4","ST40","CV12","BL12","GV14","KI3","EX-B2"], patternAdd:[{"pattern":"寒哮","points":["BL12","TE5"]},{"pattern":"热哮","points":["LI11","LU11"]},{"pattern":"脾肺气虚","points":["BL20","ST36"]},{"pattern":"肾气不足","points":["CV4","BL23"]}], cautions:"哮喘急性重度发作（不能平卧、说话断续、口唇发紫、精神烦躁或萎靡、三凹征明显）属危急情况，必须立即使用急救药物并送医，不得依赖针刺延误抢救。小儿胸壁薄，胸部与背部穴位须浅刺或斜刺，严禁深刺以免造成气胸；缓解期治疗应配合避免过敏原、规范用药与呼吸功能随访。请以教材、国家标准和专业医师指导为准。", contraindications:"重度发作、呼吸衰竭、意识改变或缺氧明显者禁针，须急诊处理；胸背部皮肤感染、破损处禁刺；严重佝偻病胸廓畸形、肺大疱或气胸病史者慎用胸背部穴位；有出血倾向或正使用抗凝药物者禁用强刺激手法。", courseHint:"", tags:["肺系","过敏性疾病"], source:makeSource('B1') },
  { id:"dis-child-strabismus", name:"小儿斜视", category:"儿科", alias:["目偏视","小儿眼肌麻痹","共同性斜视"], overview:"以双眼不能同时注视同一目标、一眼偏向内或外（亦可偏向上或下）为主症，可伴复视、视物疲劳、头位偏斜或代偿性歪头，多因眼周经筋失养、风邪中络或先天禀赋不足所致。", mainPoints:["EX-HN7","EX-HN4","EX-HN5","BL1","GB20","LI4"], adjunctPoints:["GB14","TE23","ST7","BL62","KI6","LR3","EX-HN10"], patternAdd:[{"pattern":"脾胃气虚","points":["BL20","ST36"]},{"pattern":"肝肾不足","points":["BL23","KI3"]},{"pattern":"风热上扰","points":["GB20","TE5"]},{"pattern":"瘀血阻络","points":["SP10","BL17"]}], cautions:"眼周穴位（球后、鱼腰、太阳等）进针后禁行提插捻转等强手法，出针后须按压片刻，务必避免刺伤眼球与引起球后血肿；眼周针刺必须由具备眼科与针灸经验的医师操作。针刺仅作为改善眼周经筋功能的辅助手段，不能替代散瞳验光、配镜、弱视训练与必要的手术矫正，且宜在视觉发育期内由眼科定期随访。若斜视为颅脑外伤、颅内占位或全身神经肌肉疾病的首发表现，或突然出现复视、眼睑下垂、眼球固定，须立即转诊神经科与眼科。请以教材、国家标准和专业医师指导为准。", contraindications:"眼球、眼睑及结膜有急性感染、破损、术后早期或眼压升高（青光眼）者禁刺眼周穴位；高度近视伴眼底病变、视网膜裂孔或脱离风险者禁用眼周穴位；有出血倾向或正服用抗凝药物者禁用眼部针刺；颅脑外伤、颅内占位或血管病变所致者禁针并须先明确病因；婴幼儿囟门未闭者禁刺头顶部穴位。", courseHint:"", tags:["眼病","经筋"], source:makeSource('B1') },
  { id:"dis-child-diarrhea", name:"小儿泄泻", category:"儿科", alias:["小儿腹泻","婴幼儿腹泻"], overview:"以大便次数增多、粪质稀薄甚至如水样为主症，可夹未消化乳食或黏液，常伴腹胀、肠鸣、食欲减退，四季均可发生而以夏秋为多。", mainPoints:["ST36","ST25","CV6","SP9","BL25"], adjunctPoints:["SP4","CV12","LI11","BL20","CV4","EX-UE8"], patternAdd:[{"pattern":"湿热泻","points":["LI11","LR3"]},{"pattern":"风寒泻","points":["CV8","BL12"]},{"pattern":"伤食泻","points":["CV12","ST44"]},{"pattern":"脾虚泻","points":["BL20","SP3"]}], cautions:"小儿泄泻最须防脱水与电解质紊乱，应同时补液并观察尿量、精神与囟门凹陷情况；针刺以浅刺、轻刺激为宜，腹部穴位不宜深刺。出现高热、频繁呕吐、血便、嗜睡或抽搐者属危重征象，须立即送医。请以教材、国家标准和专业医师指导为准。", contraindications:"重度脱水、休克、明显中毒症状或疑似急腹症者禁针，须急诊处理；腹部皮肤感染、破损处禁刺；婴幼儿囟门未闭者禁刺头顶部穴位；有出血倾向者禁用强刺激手法。", courseHint:"", tags:["脾胃","常见病"], source:makeSource('B1') },
  { id:"dis-child-anorexia", name:"小儿厌食", category:"儿科", alias:["食欲不振","纳呆"], overview:"以较长时间食欲减退、食量明显少于同龄儿童为主症，食少而无精打采，可伴面色少华、形体偏瘦、大便不调，多与脾胃不和或脾胃气虚有关。", mainPoints:["CV12","ST36","SP3","BL20","BL21"], adjunctPoints:["PC6","ST44","CV6","SP6","LI4","EX-UE10","EX-UE4"], patternAdd:[{"pattern":"脾胃不和","points":["CV12","PC6"]},{"pattern":"脾胃气虚","points":["CV6","GV4"]},{"pattern":"胃阴不足","points":["KI3","SP6"]},{"pattern":"肝气犯胃","points":["LR3","GB34"]}], cautions:"应以调整饮食结构、规律进餐和营造良好进食氛围为主，针刺作辅助；婴幼儿背腹部穴位宜浅刺、少留针。若伴明显消瘦、生长迟缓、长期腹泻或反复呕吐，须就医排除慢性疾病与营养素缺乏。请以教材、国家标准和专业医师指导为准。", contraindications:"局部皮肤感染、破损处禁刺；重度营养不良、贫血明显或有出血倾向者慎用针刺，须先评估全身状况；急腹症或消化道畸形所致进食障碍者禁针并转诊；婴幼儿囟门未闭者禁刺头顶部穴位。", courseHint:"", tags:["脾胃","常见病"], source:makeSource('B1') },
  { id:"dis-child-night-blindness", name:"小儿夜盲", category:"儿科", alias:["雀目","维生素A缺乏性眼病","视网膜色素变性相关夜盲"], overview:"以入暮或在暗光环境下视物不清、行动困难、白昼视力尚可为主症，常伴眼干涩、羞明、频频眨眼，多因维生素A缺乏或肝血不足、目失濡养所致；婴幼儿可伴皮肤干燥、生长迟缓。", mainPoints:["BL1","EX-HN4","EX-HN5","GB20","BL18","ST36"], adjunctPoints:["EX-UE5","KI3","BL23","SP6","LU9","GB37","EX-HN10","EX-HN7"], patternAdd:[{"pattern":"肝血不足","points":["BL18","SP6"]},{"pattern":"肝肾阴虚","points":["KI3","BL23"]},{"pattern":"脾虚气弱","points":["BL20","CV6"]},{"pattern":"脾虚湿困","points":["SP9","CV12"]}], cautions:"眼区穴位进针后禁行提插捻转等强手法，出针后须按压片刻防止出血与皮下瘀青。夜盲常提示维生素A缺乏或遗传性视网膜病变，须同时到眼科进行视力、暗适应、眼底与电生理检查，并在医师指导下调整饮食与营养素补充，不可仅靠针刺。婴幼儿维生素A缺乏可伴角膜软化甚至穿孔，出现眼痛、畏光流泪加重、角膜混浊者须立即急诊。请以教材、国家标准和专业医师指导为准。", contraindications:"眼区及颜面局部有感染、破损或急性眼病（结膜炎、角膜炎、虹膜睫状体炎、青光眼急性发作）者禁刺眼周穴位；高度近视伴眼底病变或有视网膜脱离风险者禁用眼周穴位；正在使用抗凝药物、有出血倾向或血小板明显减少者禁用眼部针刺；疑角膜软化、角膜溃疡者禁针并须立即转诊眼科。", courseHint:"", tags:["眼病","营养缺乏"], source:makeSource('B1') },
  { id:"dis-child-night-crying", name:"小儿夜啼", category:"儿科", alias:["夜啼","夜间哭闹"], overview:"指婴儿白天如常而入夜则啼哭不安、时哭时止，甚则通宵达旦，多与脾寒、心热、惊恐等因素有关，需先排除饥饿、尿布潮湿与躯体不适。", mainPoints:["HT7","PC6","GV20","CV4","SP6"], adjunctPoints:["LR3","ST36","KI1","BL15","GV24","EX-HN3"], patternAdd:[{"pattern":"脾寒气滞","points":["CV6","BL20"]},{"pattern":"心经积热","points":["HT8","LI11"]},{"pattern":"惊恐伤神","points":["BL62","KI6","EX-HN1"]},{"pattern":"乳食积滞","points":["CV12","ST44"]}], cautions:"针刺手法须极轻，婴幼儿多用点刺或浅刺不留针，并以调整喂养、作息与睡眠环境为主；若啼哭伴发热、呕吐、腹胀拒按、皮疹或体重不增，应及时就医查明原因，不可一味按夜啼处理。请以教材、国家标准和专业医师指导为准。", contraindications:"囟门未闭的婴儿禁刺头顶部穴位；局部皮肤感染、破损处禁刺；疑有肠套叠、腹股沟疝嵌顿、中耳炎等急症者禁针并须转诊；有出血倾向者禁用强刺激手法。", courseHint:"", tags:["心神","婴儿"], source:makeSource('B1') },
  { id:"dis-child-enuresis", name:"小儿遗尿", category:"儿科", alias:["尿床","夜尿症"], overview:"指五岁以上儿童睡眠中小便自遗、醒后方觉，轻者数夜一次，重者每夜多次，多与膀胱约束失职及脾肾不足相关，可伴面色少华、神疲乏力。", mainPoints:["CV3","CV4","BL23","BL28","SP6"], adjunctPoints:["CV6","BL32","KI3","LR3","GV4","EX-B4","EX-B2"], patternAdd:[{"pattern":"肾气不足","points":["KI3","GV4"]},{"pattern":"脾肺气虚","points":["BL20","LU9"]},{"pattern":"肝经湿热","points":["LR2","SP9"]},{"pattern":"心肾不交","points":["HT7","KI3"]}], cautions:"治疗期间应配合排尿习惯训练、睡前限水与心理疏导，避免斥责患儿；针刺下腹部穴位前务必令其排空小便，手法宜轻。若伴有排尿疼痛、尿频尿急、多饮多尿或脊柱畸形表现，须先排查器质性疾病。请以教材、国家标准和专业医师指导为准。", contraindications:"膀胱未排空时禁刺下腹部穴位；局部皮肤感染、破损者禁刺；脊柱裂、泌尿系畸形或感染所致者不属单纯针刺适应证，须转诊；婴幼儿囟门未闭者禁刺头顶部穴位。", courseHint:"", tags:["肾膀胱","常见病"], source:makeSource('B1') },
  { id:"dis-atrophic-rhinitis", name:"鼻槁", category:"五官科", alias:["萎缩性鼻炎","鼻干燥","臭鼻症"], overview:"以鼻腔干燥、鼻内结痂、嗅觉减退、鼻塞感为主症，痂块脱落时可带血丝，重者呼气有特殊气味。多因肺经燥热、阴津耗伤，或脾虚气弱、气血不足，鼻窍黏膜失于濡养而枯萎。", mainPoints:["LI20","EX-HN8","EX-HN3","LI4","LU7","ST36"], adjunctPoints:["KI3","SP6","BL13","BL20","LU9"], patternAdd:[{"pattern":"肺经燥热","points":["LU10","LI11"]},{"pattern":"阴虚鼻燥","points":["KI3","KI6","LU9"]},{"pattern":"脾虚气弱","points":["BL20","CV6"]},{"pattern":"气血两虚","points":["SP10","BL17"]}], cautions:"鼻部结痂不宜强行挖除，以免黏膜出血与继发感染，可用生理盐水或专用冲洗液湿润软化后轻柔清理；针刺有助改善鼻部气血与干燥感，但不能逆转黏膜萎缩，须由耳鼻喉科评估并坚持鼻腔局部护理；出现持续鼻出血、恶臭加重或单侧病变者应进一步排查。请以教材、国家标准和专业医师指导为准。", contraindications:"鼻部及面部急性感染、黏膜糜烂出血活动期禁针；内迎香等鼻腔内点刺属高危操作，须由专业医师在严格消毒下施行，凝血功能障碍者禁用；上迎香、迎香进针应沿骨面浅刺，不可向眼眶方向深刺；有出血倾向者慎用。", courseHint:"", tags:["鼻病","燥证","常用"], source:makeSource('B1') },
  { id:"dis-allergic-rhinitis", name:"鼻鼽", category:"五官科", alias:["过敏性鼻炎","变应性鼻炎"], overview:"以突发鼻痒、连续喷嚏、大量清涕、鼻塞为主症，发作急、消退快、反复发作。多因肺气虚寒、卫表不固，风寒异气乘虚袭鼻，与肺、脾、肾三脏功能失调相关。", mainPoints:["LI20","GV23","LI4","LU7","BL13"], adjunctPoints:["ST36","BL20","KI3","CV6","GV14","EX-HN3","EX-HN8"], patternAdd:[{"pattern":"肺气虚寒","points":["LU9","CV17"]},{"pattern":"脾气虚弱","points":["SP6","BL20"]},{"pattern":"肾阳不足","points":["CV4","GV4"]}], cautions:"针灸有助于减轻发作频率与程度，个体反应存在差异，不能替代规范的过敏原回避与药物治疗；应尽量查明并减少接触尘螨、花粉、动物皮屑等诱因，注意鼻部保暖。请以教材、国家标准和专业医师指导为准。", contraindications:"鼻部及面部皮肤破损、感染、酒渣鼻急性期局部禁针；有出血倾向或长期使用抗凝药物者慎针；婴幼儿及孕妇针刺须由专业医师评估选穴；哮喘急性重度发作、呼吸困难者须先急救处理。", courseHint:"", tags:["鼻病","过敏","常用"], source:makeSource('B1') },
  { id:"dis-sinusitis", name:"鼻渊", category:"五官科", alias:["鼻窦炎","慢性鼻窦炎","脑漏"], overview:"以鼻流浊涕、量多不止、鼻塞不闻香臭为主症，常伴头昏胀痛、面颊或眉棱骨压痛。多因外邪犯肺、胆腑郁热或脾胃湿热上蒸鼻窍，久则气滞血瘀。", mainPoints:["LI20","GV23","GB20","LI4","LU7"], adjunctPoints:["ST44","GB43","TE5","BL13","SP6","EX-HN3","EX-HN8","EX-HN9"], patternAdd:[{"pattern":"肺经风热","points":["LI11","TE5"]},{"pattern":"胆腑郁热","points":["GB43","LR2"]},{"pattern":"脾胃湿热","points":["ST44","SP9"]},{"pattern":"气虚邪滞","points":["ST36","CV6"]}], cautions:"鼻窦引流不畅、脓涕腥臭或症状持续超过数周者，应到耳鼻喉科行鼻内镜或影像学检查，明确是否存在解剖异常或需手术处理；针刺期间注意保暖、避免用力擤鼻。请以教材、国家标准和专业医师指导为准。", contraindications:"鼻部及颌面部皮肤感染、蜂窝织炎时局部禁针，以防炎症扩散；高热、剧烈头痛伴呕吐、视物改变等疑似眶内或颅内并发症者，须立即转诊，不可针刺；有出血倾向者慎用。", courseHint:"", tags:["鼻病","湿热","常用"], source:makeSource('B1') },
  { id:"dis-tinnitus-deafness", name:"耳鸣耳聋", category:"五官科", alias:["神经性耳鸣","突发性耳聋","耳闭"], overview:"以自觉耳内鸣响、听力减退甚至不闻外声为主症。实证多因风热外袭或肝胆火盛、痰火郁结上扰耳窍；虚证多因肾精亏虚、气血不足致耳窍失养。", mainPoints:["SI19","TE21","GB2","TE17","SI3","GB20"], adjunctPoints:["LR3","KI3","TE5","GB43","BL23","EX-HN10"], patternAdd:[{"pattern":"风热上扰","points":["TE5","LI4"]},{"pattern":"肝胆火盛","points":["LR2","GB43"]},{"pattern":"痰火郁结","points":["ST40","PC6"]},{"pattern":"肾精亏虚","points":["KI3","CV4"]}], cautions:"突发性听力下降属于耳科急症，宜尽早到耳鼻喉科查明原因，不宜单纯依赖针刺而延误治疗时机；耳鸣久治不效者应排查听神经瘤、血管性及药物性因素；针刺耳周腧穴需专业人员操作，避免过深。请以教材、国家标准和专业医师指导为准。", contraindications:"耳周皮肤感染、湿疹、破损处禁针；鼓膜穿孔急性期、外耳道急性化脓性感染者局部禁针；有出血倾向、严重心脑血管疾病者慎用；伴眩晕呕吐、面瘫、剧烈头痛者需先排除中枢性病变。", courseHint:"", tags:["耳病","虚实夹杂","常用"], source:makeSource('B1') },
  { id:"dis-ear-fullness", name:"耳胀耳闭", category:"五官科", alias:["分泌性中耳炎","卡他性中耳炎","咽鼓管功能障碍"], overview:"以耳内胀闷堵塞感、听力减退、自听增强为主症，可伴低音调耳鸣，擤鼻或打哈欠时症状可短暂变化。多因风邪外袭、肺气不宣致耳窍经气痞塞，或肝胆郁热、脾虚湿困、气血瘀阻使耳窍闭塞。", mainPoints:["TE21","SI19","GB2","TE17","GB20","TE5"], adjunctPoints:["LI4","SI3","ST36","GB43","KI3","EX-HN10"], patternAdd:[{"pattern":"风邪外袭","points":["LI4","TE5","EX-HN6"]},{"pattern":"肝胆郁热","points":["LR2","GB43"]},{"pattern":"脾虚湿困","points":["ST40","SP9","BL20"]},{"pattern":"气血瘀阻","points":["SP10","BL17"]}], cautions:"本病须由耳鼻喉科行耳镜、声导抗及鼻咽部检查明确诊断，成人的单侧分泌性中耳炎需重点排除鼻咽部病变；针刺耳周穴位仅为辅助治疗，不能替代咽鼓管功能训练与必要的药物或引流处理；儿童长期耳闷伴听力下降可影响语言发育，应尽早就诊。请以教材、国家标准和专业医师指导为准。", contraindications:"耳周皮肤感染、湿疹、破损及外耳道急性化脓期禁针；鼓膜穿孔、中耳急性感染期不宜耳周深刺；耳门、听宫等穴须由专业人员操作，避免过深伤及深部结构；有出血倾向或长期服用抗凝药者慎针。", courseHint:"", tags:["耳病","耳窍闭塞","常用"], source:makeSource('B1') },
  { id:"dis-floaters", name:"飞蚊症", category:"五官科", alias:["玻璃体混浊","云雾移睛","眼前黑影"], overview:"以眼前出现点状、丝状或絮状黑影飘动、随眼球转动而移位为主症，视力多无明显下降。多见于中老年人及高度近视者，中医多责之肝肾亏虚、精血不能上养目窍，或痰湿内蕴、气滞血瘀致神膏不清。", mainPoints:["BL1","BL2","EX-HN5","GB20","GB37","LR3"], adjunctPoints:["KI3","BL18","BL23","SP6","ST36","EX-HN7"], patternAdd:[{"pattern":"肝肾亏虚","points":["KI3","BL23","GV4"]},{"pattern":"气血不足","points":["ST36","SP6","BL20"]},{"pattern":"痰湿内蕴","points":["ST40","SP9"]},{"pattern":"气滞血瘀","points":["LR3","SP10"]}], cautions:"若黑影突然大量增多、伴闪光感、视野缺损或视力骤降，可能是视网膜裂孔或视网膜脱离的先兆，须立即到眼科散瞳检查，不可自行针刺观察；针刺仅作为改善眼部气血的辅助手段，不能消除玻璃体混浊病灶，也不能替代眼底检查与随访。请以教材、国家标准和专业医师指导为准。", contraindications:"眼周皮肤破损、感染处禁针；睛明、球后等眶内穴位进针深、风险高，须由针灸专业人员操作，不可提插捣刺；高度近视伴视网膜变性、裂孔者禁用眼球按压及剧烈头颈活动；有出血倾向或长期服用抗凝药物者慎用。", courseHint:"", tags:["眼病","云雾移睛","常用"], source:makeSource('B1') },
  { id:"dis-chronic-pharyngitis", name:"喉痹", category:"五官科", alias:["慢性咽炎","慢喉痹","虚火喉痹"], overview:"以咽部干痒不适、异物感、灼热或微痛、晨起恶心、干咳少痰为主症，症状时轻时重、缠绵难愈。多因肺肾阴虚、津不上承，或痰热内蕴、气滞痰凝，亦有脾胃虚弱、清阳不升者。", mainPoints:["CV23","CV22","LI4","LU7","KI6","LU10"], adjunctPoints:["KI3","LU9","LI11","TE5","EX-HN6","EX-LE8"], patternAdd:[{"pattern":"肺肾阴虚","points":["KI3","LU9","CV17"]},{"pattern":"痰热内蕴","points":["ST44","ST40","LI11"]},{"pattern":"气滞痰凝","points":["PC6","ST40"]},{"pattern":"脾虚气陷","points":["ST36","GV20"]}], cautions:"针灸可减轻咽部不适感，但咽部症状持续超过数周、进行性加重，或伴声嘶、吞咽困难、颈部肿块、痰中带血者，必须到耳鼻喉科行喉镜检查，排除肿瘤等器质性病变；治疗期间宜戒烟酒、少食辛辣煎炸，避免过度用嗓与粉尘刺激。请以教材、国家标准和专业医师指导为准。", contraindications:"颈前区皮肤感染、破损处禁针；廉泉、天突针刺方向与深度须严格控制，不可向后深刺伤及气管、甲状腺及血管；少商、商阳点刺放血须在消毒条件下由专业人员操作，凝血功能障碍者禁用；急性喉水肿、呼吸困难或喘鸣者属急症，须立即转诊，不得针刺延误。", courseHint:"", tags:["咽喉病","虚火","常用"], source:makeSource('B1') },
  { id:"dis-myopia", name:"近视", category:"五官科", alias:["近视眼","能近怯远症"], overview:"以视近清晰、视远模糊为主症的眼病。多因用眼过度、久视伤血，致心阳不足、肝肾亏虚，目窍失于濡养，属本虚标实之证。", mainPoints:["BL1","ST2","GB14","TE23","LI4","GB20"], adjunctPoints:["BL18","KI3","BL23","SP6","GV20","EX-HN7","EX-HN1"], patternAdd:[{"pattern":"心阳不足","points":["HT7","GV20"]},{"pattern":"肝肾亏虚","points":["LR3","KI3"]},{"pattern":"脾肾气虚","points":["ST36","BL20"]}], cautions:"针灸可作为改善视疲劳、调节眼周气血的辅助手段，是否改善屈光度需由眼科客观验光判断，不可据此停戴眼镜；应配合每日户外活动、控制近距离用眼时长并保证读写姿势正确。请以教材、国家标准和专业医师指导为准。", contraindications:"眼周皮肤破损、感染处禁针，眶内进针过深有伤及眼球风险，须由专业人员操作；高度近视伴视网膜变性、裂孔或近期闪光感、视野缺损者，不宜做眼球按摩或剧烈头颈活动，应先到眼科散瞳检查；有出血倾向者慎用。", courseHint:"", tags:["眼病","青少年","常用"], source:makeSource('B1') },
  { id:"dis-halitosis", name:"口臭", category:"五官科", alias:["口气","口腔异味","口秽"], overview:"以口中气味秽浊、他人可闻及为主症，晨起或饥饿时加重，常伴口干、口苦、脘腹胀满或便秘。多因胃火炽盛、胃肠积热上蒸，或脾胃湿热、食积不化，亦有肝郁化火及阴虚火旺者。", mainPoints:["ST44","LI4","PC8","PC7","CV23","CV12"], adjunctPoints:["ST36","ST25","SP9","LI11","LR3","EX-LE8","EX-LE10"], patternAdd:[{"pattern":"胃火炽盛","points":["ST45","LI11","ST37"]},{"pattern":"脾胃湿热","points":["SP9","ST40"]},{"pattern":"食积不化","points":["ST21","ST34"]},{"pattern":"肝郁化火","points":["LR2","GB43"]}], cautions:"口臭多数来源于口腔本身，应先到口腔科检查牙周炎、龋齿、舌苔及不良修复体并作口腔清洁，同时排查鼻窦炎、扁桃体隐窝、胃食管反流及幽门螺杆菌感染等常见原因；针刺可辅助调节脾胃与胃肠功能，不能替代病因治疗；治疗期间注意刷牙、清洁舌面、多饮水，减少烟酒、蒜葱及辛辣厚味。请以教材、国家标准和专业医师指导为准。", contraindications:"口腔黏膜溃疡、牙龈急性红肿化脓及颌面部感染者禁局部针刺；内庭、合谷等穴孕妇慎用或禁用；上腹部腧穴饱食后不宜立即针刺，腹部手术史或腹壁疾病者慎用；有出血倾向者慎针，胃脘剧痛、呕血黑便者须急诊处理。", courseHint:"", tags:["口腔病","胃热","常用"], source:makeSource('B1') },
  { id:"dis-mouth-ulcer", name:"口疮", category:"五官科", alias:["口腔溃疡","复发性阿弗他溃疡","口糜"], overview:"以口腔黏膜反复出现单个或多个圆形溃疡、灼痛明显、进食受影响为主症。多因心脾积热上蒸口舌，或阴虚火旺、脾肾阳虚致黏膜失养。", mainPoints:["CV23","CV24","PC8","HT8","SP6"], adjunctPoints:["LI4","ST44","KI3","SP9","BL21","EX-LE8","EX-HN6"], patternAdd:[{"pattern":"心脾积热","points":["ST44","HT7"]},{"pattern":"阴虚火旺","points":["KI3","KI6"]},{"pattern":"脾肾阳虚","points":["CV4","ST36"]}], cautions:"口腔溃疡反复发作、经久不愈或溃疡边缘隆起质硬者，应到口腔科排查白塞病、营养缺乏及口腔黏膜癌变等可能；针刺期间忌辛辣烟酒，保持口腔清洁与规律作息。请以教材、国家标准和专业医师指导为准。", contraindications:"口腔黏膜溃疡面及局部感染处禁止直接针刺；有出血倾向或凝血功能障碍者禁用点刺放血，慎用较强刺激手法；婴幼儿不宜配合留针者、孕妇须由专业医师评估；伴发热、皮疹、外阴溃疡等多系统表现者应转诊专科。", courseHint:"", tags:["口腔病","虚实夹杂","常用"], source:makeSource('B1') },
  { id:"dis-facial-spasm", name:"面肌痉挛", category:"五官科", alias:["面肌抽搐","半侧颜面痉挛"], overview:"以一侧面部肌肉阵发性、不自主抽搐为主症，多从眼轮匝肌开始渐向口角及面颊扩展，情绪紧张或疲劳时加重。多因风阳上扰、气血不足或痰瘀阻络，筋脉失养。", mainPoints:["ST2","ST4","ST6","ST7","GB14","LI4"], adjunctPoints:["SI3","GB20","SP6","LR3","BL62","EX-HN4"], patternAdd:[{"pattern":"风阳上扰","points":["GB43","LR2"]},{"pattern":"气血不足","points":["ST36","SP10"]},{"pattern":"痰瘀阻络","points":["ST40","SP9"]}], cautions:"面部腧穴宜浅刺、轻刺激，不宜使用强电针或大幅度提插捻转，以免加重抽搐；本病需与面瘫后遗症、梅杰综合征及颅内占位压迫鉴别，症状进行性加重或伴其他神经体征者应到神经内科检查。请以教材、国家标准和专业医师指导为准。", contraindications:"面部皮肤感染、湿疹、破损处禁针；有出血倾向或长期服用抗凝药者慎针；近期有面神经损伤、耳部带状疱疹者局部慎用；孕妇及婴幼儿须由专业医师评估后施行。", courseHint:"", tags:["面部病","风证","常用"], source:makeSource('B1') },
  { id:"dis-eye-redness-swelling", name:"目赤肿痛", category:"五官科", alias:["急性结膜炎","天行赤眼","红眼病"], overview:"以目赤灼热、胞睑肿胀、羞明流泪、分泌物增多为主症的眼病。多因外感风热时邪或肝胆火盛上扰目窍，病位在目，与肝、胆、肺关系密切。", mainPoints:["BL1","ST2","TE23","LI4","LR3"], adjunctPoints:["GB20","LI11","LR2","LU11","EX-HN5","EX-HN6"], patternAdd:[{"pattern":"风热外袭","points":["LI11","TE5"]},{"pattern":"肝胆火盛","points":["LR2","GB43","EX-HN7"]},{"pattern":"阴虚火旺","points":["KI3","KI6"]}], cautions:"眼部及眶周腧穴针刺需由专业人员操作，进针轻柔，出针后按压以防局部血肿；本病传染性较强，应注意毛巾、脸盆等个人用品隔离，避免交叉感染；分泌物多时不宜自行热敷或揉眼。请以教材、国家标准和专业医师指导为准。", contraindications:"眼周皮肤破损、感染或瘢痕处禁针；有出血倾向、凝血功能障碍或正在使用抗凝药物者慎用；眼球本身及角膜溃疡、眼内炎等病变不可视为单纯针灸适应症，须转眼科处理；高热、视力骤降、剧烈眼痛者应急诊就医。", courseHint:"", tags:["眼病","风热","常用"], source:makeSource('B1') },
  { id:"dis-tmj-disorder", name:"颞下颌关节紊乱", category:"五官科", alias:["颞颌关节综合征","下颌关节痛","颊车痛"], overview:"以咀嚼时耳前区疼痛、关节弹响、张口受限或下颌运动偏斜为主症。多因风寒袭络、咀嚼筋劳损，或肝肾不足、筋骨失养兼气血瘀滞。", mainPoints:["ST6","ST7","SI19","TE21","LI4","GB20"], adjunctPoints:["TE5","TE17","ST44","LR3","SI3","EX-HN5"], patternAdd:[{"pattern":"风寒袭络","points":["BL12","TE5"]},{"pattern":"阳明胃热","points":["ST44","LI11"]},{"pattern":"肝肾不足","points":["KI3","LR3"]},{"pattern":"气血瘀滞","points":["SP10","BL17"]}], cautions:"耳前区腧穴针刺时针尖应避开颞浅动脉搏动处，下颌骨髁突附近不宜深刺；治疗期间宜进软食，避免大张口、咬硬物、单侧咀嚼及打哈欠过猛；关节持续绞锁、明显移位或外伤后张口受限者应到口腔颌面外科评估。请以教材、国家标准和专业医师指导为准。", contraindications:"关节区皮肤感染、腮腺炎急性期、局部红肿热痛明显者禁针；下颌骨骨折、关节脱位未复位及外伤急性期禁用针刺与手法复位；有出血倾向者慎用；孕妇针刺须由专业医师评估选穴。", courseHint:"", tags:["面部病","关节痛","常用"], source:makeSource('B1') },
  { id:"dis-stiff-tongue", name:"舌强", category:"五官科", alias:["舌强不语","言语謇涩","构音障碍"], overview:"以舌体转动不灵、言语含糊謇涩、吐字不清为主症，重者舌体强硬难以伸卷，可伴饮水呛咳。多因风痰阻络、肝阳上亢，或气虚血瘀、脉络不畅，亦有肝肾阴虚、筋脉失养者，常继发于中风之后。", mainPoints:["CV23","HT5","GV15","GB20","LI4","LR3"], adjunctPoints:["ST40","PC6","SP6","KI3","EX-HN1"], patternAdd:[{"pattern":"风痰阻络","points":["ST40","PC6","GB20"]},{"pattern":"肝阳上亢","points":["LR2","GB43","KI3"]},{"pattern":"气虚血瘀","points":["CV6","SP10","ST36"]},{"pattern":"肝肾阴虚","points":["KI3","BL23"]}], cautions:"舌强常为中风或神经系统疾病的表现，急性起病并伴口角歪斜、肢体无力、言语不能者须立即拨打急救电话，不可自行针刺；病情稳定后的针刺康复应由专业人员实施，并配合言语训练与吞咽功能评估；有饮水呛咳者进食须防误吸，必要时先行吞咽造影检查。请以教材、国家标准和专业医师指导为准。", contraindications:"廉泉向舌根方向深刺风险高，须由专业人员操作，不可刺入过深或大幅度提插；哑门、风府深部邻近延髓，严禁向上深刺与反复捣刺；口腔黏膜溃疡、舌体出血或急性感染时禁局部针刺；血压过高未控制、近期脑出血及颅内压增高者慎用或禁用针刺。", courseHint:"", tags:["舌病","中风后遗症","常用"], source:makeSource('B1') },
  { id:"dis-loss-of-voice", name:"失音", category:"五官科", alias:["声音嘶哑","喉炎","喉瘖"], overview:"以声音嘶哑甚至完全不能发声为主症，可伴咽喉干痒、发声费力。实证多因风寒或风热闭肺、肺气失宣，虚证多因肺肾阴虚、喉失滋润。", mainPoints:["CV23","LU7","LI4","KI6","GV15"], adjunctPoints:["LU5","LU9","KI3","CV17","GV14","EX-LE8","EX-HN6"], patternAdd:[{"pattern":"风寒闭肺","points":["BL12","LU5"]},{"pattern":"风热犯肺","points":["LI11","TE5"]},{"pattern":"肺肾阴虚","points":["KI3","LU9"]},{"pattern":"气滞痰凝","points":["PC6","ST40"]}], cautions:"声音嘶哑持续超过两周不缓解，或伴进行性吞咽痛、颈部肿块、咯血者，必须到耳鼻喉科行喉镜检查，排除声带病变；针刺期间应减少说话、忌烟酒及辛辣刺激，避免清嗓与用力发声。请以教材、国家标准和专业医师指导为准。", contraindications:"颈前区皮肤感染、破损处禁针，喉部腧穴不可深刺以免伤及气管与血管；有出血倾向者慎用；急性喉水肿、呼吸困难、吸气性喘鸣者属急症，须立即转诊，不得针刺延误抢救。", courseHint:"", tags:["咽喉病","声嘶","常用"], source:makeSource('B1') },
  { id:"dis-asthenopia", name:"视疲劳", category:"五官科", alias:["眼疲劳","目倦","久视劳伤"], overview:"以久视后眼胀、眼干涩、视物模糊、眉棱骨酸痛为主症，常伴头昏、注意力下降，休息后减轻。多因久视伤血、目络失养，或肝血不足、肝肾阴虚，亦有肝郁气滞、目窍气血运行不畅者。", mainPoints:["BL1","BL2","EX-HN5","GB20","EX-HN1","LI4"], adjunctPoints:["GB37","ST36","SP6","LR3","BL18","EX-HN4"], patternAdd:[{"pattern":"肝血不足","points":["BL18","SP6"]},{"pattern":"肝肾阴虚","points":["KI3","LR3"]},{"pattern":"肝郁化火","points":["LR2","GB43"]},{"pattern":"脾气虚弱","points":["ST36","BL20"]}], cautions:"针刺有助于缓解眼部酸胀干涩等不适，个体反应存在差异，不能替代验光配镜与眼科检查；应纠正用眼习惯，每近距离用眼一段时间后远眺放松，保证睡眠并改善照明与屏幕对比度；眼干明显者需排查干眼症并作相应处理。请以教材、国家标准和专业医师指导为准。", contraindications:"眼周皮肤炎症、破损或术后早期禁针；眶内穴位须由专业人员操作，避免伤及眼球与眶内血管；眼压明显升高、青光眼急性发作期不宜针刺眼周穴；有出血倾向者慎用。", courseHint:"", tags:["眼病","久视伤血","常用"], source:makeSource('B1') },
  { id:"dis-toothache", name:"牙痛", category:"五官科", alias:["龋齿痛","牙髓炎","智齿冠周炎"], overview:"以牙齿或牙龈疼痛为主症，遇冷热酸甜刺激加重，可放射至面颊与头部。多因风火外袭、胃火炽盛或肾阴不足、虚火上炎所致。", mainPoints:["ST6","ST7","ST44","LI4","LI11"], adjunctPoints:["LI3","TE21","GB20","PC8","ST36","EX-HN5","EX-LE8"], patternAdd:[{"pattern":"风火外袭","points":["TE5","GB20"]},{"pattern":"胃火炽盛","points":["ST45","LI11","EX-LE9"]},{"pattern":"虚火上炎","points":["KI3","LR3"]}], cautions:"针刺仅作缓解疼痛的辅助手段，牙痛的根本原因须由口腔科检查处理，龋齿、牙髓炎、根尖周炎、智齿冠周炎等多需补牙、根管治疗或抗感染；面部肿胀发热、张口受限者应尽早就诊。请以教材、国家标准和专业医师指导为准。", contraindications:"面部及口腔黏膜局部红肿化脓、皮肤破损处禁针，颌面部感染扩散风险高者禁局部针刺；孕妇不宜针刺合谷、三阴交及下腹部、腰骶部腧穴；有出血倾向或正在使用抗凝药者慎用；高热、吞咽困难、颈部肿胀提示间隙感染时须急诊处理。", courseHint:"", tags:["口齿病","止痛","常用"], source:makeSource('B1') },
  { id:"dis-ophthalmoplegia", name:"眼肌麻痹", category:"五官科", alias:["眼外肌麻痹","麻痹性斜视","目偏视"], overview:"以双眼复视、眼球向某一方向转动受限、视物成双，可伴头晕及代偿性头位偏斜为主症，单眼发病多见。多因风邪中络、气血瘀阻使眼肌脉络失养，或脾虚气陷、肝肾阴虚致筋脉弛纵无力。", mainPoints:["BL1","BL2","GB14","ST2","EX-HN5","GB20"], adjunctPoints:["EX-HN7","LI4","ST36","GB37","SP6"], patternAdd:[{"pattern":"风邪中络","points":["TE5","GB20","EX-HN10"]},{"pattern":"脾虚气陷","points":["GV20","BL20","CV6"]},{"pattern":"肝肾阴虚","points":["KI3","LR3","BL18"]},{"pattern":"气血瘀阻","points":["SP10","BL17"]}], cautions:"眼肌麻痹可为糖尿病性神经病变、脑血管病、颅内动脉瘤或重症肌无力等疾病的首发表现，须先由眼科与神经内科明确病因，必要时行头颅影像学检查；突发复视伴剧烈头痛、眼睑下垂、瞳孔异常或肢体无力者须立即急诊；针刺仅作辅助康复手段，不能替代病因治疗。请以教材、国家标准和专业医师指导为准。", contraindications:"眼周及眶周皮肤感染、破损处禁针；睛明、球后、承泣等眶内穴位属高危操作，须由针灸专业人员缓慢进针并避免提插，出现眼球胀痛、突出或复视加重应立即停止处理；眼底出血、青光眼急性发作、眶内占位及凝血功能障碍者禁用眼周深刺；孕妇针刺须由专业医师评估选穴。", courseHint:"", tags:["眼病","复视","常用"], source:makeSource('B1') },
  { id:"dis-ptosis", name:"眼睑下垂", category:"五官科", alias:["上睑下垂","睢目","重症肌无力眼肌型"], overview:"以上眼睑抬举无力、遮盖部分或全部瞳孔、视物受限为主症，可单侧或双侧。多因中气不足、脾虚气陷，或风邪中络、气血瘀阻致眼睑筋脉失养。", mainPoints:["BL1","ST2","GB14","ST6","GV20","BL2"], adjunctPoints:["ST36","SP6","LI4","BL20","SI3","EX-HN4"], patternAdd:[{"pattern":"脾虚气陷","points":["CV6","BL20"]},{"pattern":"风邪中络","points":["GB20","TE5"]},{"pattern":"气血瘀阻","points":["SP10","BL17"]}], cautions:"眼睑下垂可为重症肌无力、动眼神经麻痹、颅内动脉瘤或糖尿病性神经病变的表现，须先由神经内科与眼科明确诊断；若出现晨轻暮重、复视、吞咽困难或呼吸困难，属危重征象，须立即急诊处理，不可自行针刺。请以教材、国家标准和专业医师指导为准。", contraindications:"眼周及眶周皮肤破损、感染处禁针，眶内深刺有损伤眼球与血管的风险，须由专业人员操作；有出血倾向者慎用；重症肌无力危象、呼吸肌受累者禁用针刺替代急救治疗。", courseHint:"", tags:["眼病","痿证","常用"], source:makeSource('B1') },
  { id:"dis-sore-throat", name:"咽喉肿痛", category:"五官科", alias:["急性咽炎","急性扁桃体炎","喉痹"], overview:"以咽喉红肿疼痛、吞咽不利、声音改变为主症，可伴发热、咽干。实者多因风热外袭或肺胃热盛，虚者多因肺肾阴虚、虚火上灼咽喉。", mainPoints:["LU11","LI4","LU10","KI6","GV14"], adjunctPoints:["LI11","LU7","TE5","KI3","CV23","EX-HN6","EX-LE8"], patternAdd:[{"pattern":"风热外袭","points":["TE5","GB20"]},{"pattern":"肺胃热盛","points":["ST44","LI11","EX-UE11"]},{"pattern":"阴虚火旺","points":["KI3","LU9"]}], cautions:"咽喉肿痛伴高热、呼吸困难、张口困难、流涎或颈部肿胀时，可能是扁桃体周围脓肿或急性会厌炎等急症，须立即就医，不可自行针刺观察；少商、商阳点刺放血须由专业人员在消毒条件下操作。请以教材、国家标准和专业医师指导为准。", contraindications:"咽喉局部红肿化脓、黏膜破损处禁针；有出血倾向、凝血功能障碍或正在使用抗凝药物者禁用点刺放血；孕妇慎用合谷等穴；高热不退、声音嘶哑加重伴喘鸣者应转急诊处理。", courseHint:"", tags:["咽喉病","清热","常用"], source:makeSource('B1') },
  { id:"dis-gingival-swelling", name:"龈肿", category:"五官科", alias:["牙龈肿痛","牙宣","牙龈炎"], overview:"以牙龈红肿、胀痛、触之易出血，可伴口臭、咀嚼不适为主症。多因胃火炽盛循经上炎牙龈，或风火外袭，亦有肾阴不足、虚火上浮及气血亏虚、龈肉失养者。", mainPoints:["LI4","ST6","ST7","ST44","PC8","LI11"], adjunctPoints:["ST36","KI3","LI3","GB20","SP10","EX-HN5","EX-LE8"], patternAdd:[{"pattern":"胃火炽盛","points":["ST45","ST37","LI11"]},{"pattern":"风火外袭","points":["TE5","GB20","EX-HN6"]},{"pattern":"阴虚火旺","points":["KI3","KI6","LU9"]},{"pattern":"气血亏虚","points":["ST36","BL20","SP6"]}], cautions:"龈肿多源于牙菌斑与牙石刺激所致的牙龈炎或牙周炎，须到口腔科行洁治与牙周检查，长期牙龈出血、牙龈增生或牙齿松动者不可仅靠针刺处理；针刺可辅助缓解肿痛，不能替代口腔局部治疗；伴发热、面部肿胀、张口受限或吞咽困难者提示感染扩散，须尽快就医。请以教材、国家标准和专业医师指导为准。", contraindications:"牙龈及口腔黏膜急性红肿化脓、皮肤破损处禁局部针刺；合谷为妊娠慎用穴，孕妇不宜针刺；有出血倾向、凝血功能障碍或长期使用抗凝药物者慎用针刺与点刺放血；高热、颌面部蜂窝织炎或间隙感染征象者禁用针刺替代抗感染治疗。", courseHint:"", tags:["口齿病","胃火","常用"], source:makeSource('B1') },
  { id:"dis-infrapatellar-fat-pad-strain", name:"髌下脂肪垫劳损", category:"骨伤科", alias:["髌下脂肪垫损伤","髌下脂肪垫肥大"], overview:"以膝前下方疼痛酸胀、上下楼梯及下蹲时加重、髌韧带两侧按压酸痛为主症。多因膝部反复屈伸、跪蹲劳作或外伤后失治，致局部气血瘀滞、经筋失于濡养。", mainPoints:["EX-LE4","EX-LE5","ST35","ST34","EX-LE2"], adjunctPoints:["ST36","GB34","SP9","BL40","EX-LE1"], patternAdd:[{"pattern":"劳损瘀滞","points":["BL17","LI4"]},{"pattern":"寒湿痹阻","points":["GV4","BL60"]},{"pattern":"肝肾亏虚","points":["KI3","LR3"]}], cautions:"膝眼穴须屈膝取穴、向膝中斜刺并控制深度，不宜反复大幅提插，以免刺入关节腔或加重脂肪垫损伤；膝关节明显肿胀积液或局部发热者应先由骨科评估；日常减少深蹲、跪位与频繁上下楼梯，注意膝部保暖。请以教材、国家标准和专业医师指导为准。", contraindications:"膝前区皮肤破损、感染及化脓性关节炎者禁针；膝关节骨折、脱位或人工关节置换术后局部禁针；关节腔大量积液处不宜深刺；有出血倾向或正在抗凝治疗者慎针。", courseHint:"", tags:["膝痛","慢性劳损"], source:makeSource('B1') },
  { id:"dis-achilles-tendinitis", name:"跟腱炎", category:"骨伤科", alias:["跟腱周围炎","跟腱病"], overview:"以跟腱区疼痛、僵硬、晨起或运动起始时明显，局部可有增粗与压痛为主症。多因跑跳等反复牵拉致局部气血瘀滞、经筋失养。", mainPoints:["BL57","BL60","KI3","BL40"], adjunctPoints:["BL58","BL59","GB34","SP9","EX-LE9"], patternAdd:[{"pattern":"急性期瘀热","points":["LI11","BL17"]},{"pattern":"寒湿痹阻","points":["GV4","BL62"]},{"pattern":"肝肾亏虚","points":["LR3","KI6"]}], cautions:"急性期应减少跑跳并制动休息，局部不宜重手法揉捏，以免加重肌腱损伤；若闻及断裂声、出现提踵无力或局部凹陷，须立即转诊骨科。请以教材、国家标准和专业医师指导为准。", contraindications:"跟腱区皮肤破损、感染禁针；跟腱完全或部分断裂、跟骨撕脱骨折者禁针并转诊；局部糖皮质激素注射后短期内不宜针刺；有出血倾向者慎针。", courseHint:"", tags:["跟腱","运动损伤"], source:makeSource('B1') },
  { id:"dis-ankle-sprain", name:"踝关节扭伤", category:"骨伤科", alias:["踝扭伤","踝关节韧带损伤"], overview:"以踝部扭伤后肿胀、疼痛、活动受限及皮下瘀斑为主症。多因足踝内翻致外侧韧带受损，局部气血瘀滞、经筋不利。", mainPoints:["GB40","BL60","BL62","ST41"], adjunctPoints:["KI3","SP5","GB34","GB41","EX-LE9"], patternAdd:[{"pattern":"急性期气滞血瘀","points":["BL17","LI4"]},{"pattern":"陈旧损伤经筋失养","points":["ST36","BL57"]},{"pattern":"寒湿痹阻","points":["GV4","SP9"]}], cautions:"急性期须先排除骨折与韧带完全断裂；损伤早期宜冷敷、制动、抬高患肢，不宜热敷或强力按揉肿胀处；肿胀严重、不能负重或畸形明显者须行影像学检查。请以教材、国家标准和专业医师指导为准。", contraindications:"局部皮肤破损、开放性伤口禁针；骨折、脱位未复位者禁针并转诊；急性期血肿显著处不宜深刺；孕妇禁用合谷、三阴交等穴。", courseHint:"", tags:["外伤","踝痛"], source:makeSource('B1') },
  { id:"dis-myofascial-pain-syndrome", name:"肌筋膜疼痛综合征", category:"骨伤科", alias:["肌筋膜疼痛综合症","肌纤维织炎"], overview:"以一处或多处肌肉酸胀疼痛、可触及压痛点与紧张条索、按压时诱发放散痛为主症，劳累受凉或情绪紧张后加重。多因慢性劳损、姿势不良兼感风寒湿邪，致经筋气血痹阻不通。", mainPoints:["EX-B2","LI4","LR3","GB34","SP10"], adjunctPoints:["GB20","LI11","ST36","BL17","TE5","EX-UE7"], patternAdd:[{"pattern":"风寒湿痹阻","points":["BL12","GV14"]},{"pattern":"气滞血瘀","points":["BL17","SI3"]},{"pattern":"气血亏虚","points":["BL20","SP6"]},{"pattern":"肝肾不足","points":["KI3","BL23"]}], cautions:"本症须与纤维肌痛症、风湿免疫性疾病、甲状腺功能异常及神经根性疼痛等鉴别，必要时转诊检查；针刺颈项、胸背部穴位须控制角度与深度，避免深刺伤及胸膜与重要血管神经；治疗期间应纠正姿势、适度活动并注意保暖，避免长期固定姿势与过度疲劳。请以教材、国家标准和专业医师指导为准。", contraindications:"局部皮肤破损、感染、血肿及皮下结节破溃处禁针；严重心脑血管疾病、体质极度虚弱、饥饿或精神高度紧张者慎针以防晕针；孕妇禁用合谷、三阴交及腰骶部穴位；有出血倾向或正在抗凝治疗者慎针。", courseHint:"", tags:["肌筋膜","慢性疼痛"], source:makeSource('B1') },
  { id:"dis-rotator-cuff-injury", name:"肩袖损伤", category:"骨伤科", alias:["肩袖肌腱损伤","冈上肌腱损伤"], overview:"以肩部疼痛、外展上举无力、夜间痛及特定范围活动受限为主症，多见于反复过顶运动或肩部退变人群。多因肩部经筋劳损或跌仆闪挫，致局部气血瘀滞、经筋失养。", mainPoints:["LI15","SI9","TE14","SI11","LI14"], adjunctPoints:["SI3","TE5","LI4","GB21","EX-B2"], patternAdd:[{"pattern":"急性期瘀血阻络","points":["BL17","LI4"]},{"pattern":"慢性期气血亏虚","points":["ST36","BL20"]},{"pattern":"风寒湿痹阻","points":["BL12","GV14"]}], cautions:"肩部疼痛伴无力者应先由骨科评估，必要时行影像学检查以排除肩袖撕裂、肩关节脱位与骨折；急性期宜制动休息，不宜强行牵拉与暴力被动活动；针刺肩部穴位应避开腋窝血管神经，慎用大幅度提插捻转。请以教材、国家标准和专业医师指导为准。", contraindications:"肩部皮肤破损、感染禁针；肩袖完全撕裂、肩关节脱位或骨折未愈合、化脓性关节炎、骨结核及肿瘤者禁针并转诊；孕妇禁用肩井，合谷慎用；有出血倾向或正在抗凝治疗者慎针。", courseHint:"", tags:["肩痛","运动损伤"], source:makeSource('B1') },
  { id:"dis-frozen-shoulder", name:"肩周炎", category:"骨伤科", alias:["肩关节周围炎","漏肩风","五十肩"], overview:"以肩部疼痛、夜间加重、主动与被动活动均受限为主症，好发于五十岁左右人群。多与风寒侵袭、气血不足及肩部慢性劳损相关。", mainPoints:["LI15","TE14","SI9","LI11"], adjunctPoints:["SI11","LI14","GB21","TE5","SI3","EX-B2"], patternAdd:[{"pattern":"风寒侵袭","points":["BL12","GV14"]},{"pattern":"气滞血瘀","points":["LI4","BL17"]},{"pattern":"气血亏虚","points":["ST36","SP6"]}], cautions:"针刺肩部穴位应避开腋窝血管神经，进针后避免大幅提插捻转；配合功能锻炼须循序渐进，不可强行牵拉或暴力被动活动。请以教材、国家标准和专业医师指导为准。", contraindications:"肩部皮肤破损、感染禁针；肩关节结核、肿瘤、化脓性关节炎及骨折未愈合者禁针并转诊；孕妇禁用肩井，合谷、三阴交慎用；有出血倾向者慎针。", courseHint:"", tags:["肩痛","活动受限"], source:makeSource('B1') },
  { id:"dis-neck-shoulder-fasciitis", name:"颈肩肌筋膜炎", category:"骨伤科", alias:["颈肩肌筋膜疼痛综合征","颈肩部纤维织炎"], overview:"以颈肩部酸胀疼痛、僵硬沉重、可触及条索或压痛结节为主症，劳累受凉后加重、得温稍减。多因长期伏案劳损，兼受风寒湿邪，致颈肩经筋气血痹阻。", mainPoints:["GB20","SI15","GB21","EX-B2","LI15"], adjunctPoints:["SI3","TE5","BL10","GV14","LI4","EX-UE8"], patternAdd:[{"pattern":"风寒湿袭络","points":["BL12","GV14"]},{"pattern":"气滞血瘀","points":["LI4","BL17"]},{"pattern":"气血不足","points":["ST36","BL20"]}], cautions:"颈肩酸胀须先与颈椎病、肩关节疾病及心肺疾病牵涉痛鉴别；肩井穴不可深刺，以免伤及胸膜顶造成气胸；针刺后注意颈肩保暖，避免长时间低头与固定姿势，配合颈部功能锻炼。请以教材、国家标准和专业医师指导为准。", contraindications:"颈肩局部皮肤破损、感染、溃疡者禁针；颈椎骨折、脱位、结核、肿瘤及严重骨质疏松者禁针并转诊；孕妇禁用肩井，合谷慎用；有出血倾向或正在抗凝治疗者慎针。", courseHint:"", tags:["颈肩痛","肌筋膜"], source:makeSource('B1') },
  { id:"dis-cervical-spondylosis", name:"颈椎病", category:"骨伤科", alias:["项痹","颈椎综合征"], overview:"以颈肩疼痛、上肢麻木或头晕为主症。属本虚标实之项痹，常与长期低头劳损、肝肾不足及风寒湿邪侵袭有关。", mainPoints:["GB20","GV14","BL10","SI3","SI15"], adjunctPoints:["GB21","LI15","TE5","LU7","SI11","EX-B1","EX-B2","EX-UE8"], patternAdd:[{"pattern":"风寒湿型","points":["BL12","GV4"]},{"pattern":"气滞血瘀","points":["LI4","BL17"]},{"pattern":"肝肾不足","points":["BL23","KI3","LR3"]},{"pattern":"气血亏虚","points":["ST36","SP6","BL20"]}], cautions:"颈项部穴位应严格掌握进针角度与深度，避免深刺与大幅度提插造成气胸等风险；出现进行性肢体无力、行走不稳或大小便障碍者须立即转诊，不得自行针刺。请以教材、国家标准和专业医师指导为准。", contraindications:"颈项局部皮肤感染、溃疡者禁针；脊髓型颈椎病伴明显压迫症状、椎动脉型伴严重眩晕者不宜自行针刺，须先由专科评估；颈椎骨折、结核、肿瘤者禁针；出血倾向者慎针。", courseHint:"", tags:["项痹","慢性劳损"], source:makeSource('B1') },
  { id:"dis-stiff-neck", name:"落枕", category:"骨伤科", alias:["失枕","急性颈部软组织损伤"], overview:"以晨起一侧颈项强痛、转头受限、局部压痛为主症。多因睡姿不当、颈部受凉或劳损致项部经气不利、筋脉拘急。", mainPoints:["SI3","GB20","GV14","BL10"], adjunctPoints:["GB21","SI11","LU7","SI14","EX-UE8","EX-B1"], patternAdd:[{"pattern":"风寒袭络","points":["BL12","TE5"]},{"pattern":"气滞血瘀","points":["LI4","BL17"]},{"pattern":"颈项劳损兼肝肾不足","points":["BL23","KI3"]}], cautions:"颈部活动宜缓慢，避免强力扳动与盲目推拿，以防加重损伤；若伴上肢麻木无力、行走不稳，或外伤后剧痛，须先排除颈椎骨折、脱位及脊髓损伤并转诊。请以教材、国家标准和专业医师指导为准。", contraindications:"颈项部皮肤破损、感染、瘢痕处禁针；颈椎骨折、脱位、结核、肿瘤及严重骨质疏松者禁针并转诊；有出血倾向或正在抗凝治疗者慎针；孕妇禁用肩井，合谷、三阴交慎用。", courseHint:"", tags:["颈项痛","急性疼痛"], source:makeSource('B1') },
  { id:"dis-carpal-tunnel-syndrome", name:"腕管综合征", category:"骨伤科", alias:["腕管狭窄症","鼠标手"], overview:"以拇指、食指、中指麻木刺痛、夜间加重、甩手后减轻为主症。多因腕部长期劳损致气血运行不畅、经筋失养。", mainPoints:["PC7","PC6","HT7","LU9"], adjunctPoints:["TE4","LI5","SI5","PC8","EX-UE9"], patternAdd:[{"pattern":"气滞血瘀","points":["LI4","BL17"]},{"pattern":"寒湿阻络","points":["TE5","BL12"]},{"pattern":"气血亏虚","points":["ST36","SP6"]}], cautions:"腕部穴位以浅刺为主，避免损伤正中神经及腕部血管；若出现大鱼际肌肉萎缩、感觉持续减退，应转诊手外科评估，不宜单纯依赖针刺。请以教材、国家标准和专业医师指导为准。", contraindications:"腕部皮肤破损、感染禁针；腕部骨折、脱位、化脓性腱鞘炎者禁针并转诊；孕妇慎用合谷；有出血倾向者慎针。", courseHint:"", tags:["腕手麻木","周围神经"], source:makeSource('B1') },
  { id:"dis-wrist-elbow-strain", name:"腕肘关节劳损", category:"骨伤科", alias:["腕肘部慢性软组织劳损","桡骨茎突狭窄性腱鞘炎","肱骨内上髁炎"], overview:"以肘部或腕部酸痛、用力握持与旋转前臂时加重、局部压痛及活动不利为主症。多因长期重复性手工劳作或姿势不良，致腕肘经筋劳损、气血瘀滞，日久筋失所养。", mainPoints:["LI11","LI10","EX-UE1","TE4","PC7"], adjunctPoints:["EX-UE3","LI4","LI5","TE5","EX-UE9"], patternAdd:[{"pattern":"风寒阻络","points":["GV14","BL12"]},{"pattern":"气滞血瘀","points":["BL17","LI4"]},{"pattern":"劳损气血不足","points":["ST36","BL20"]}], cautions:"治疗期间应减少患肢重复用力与长时间屈伸腕肘，必要时佩戴护具制动；肘尖穴以艾灸为主，一般不针，若用针刺只作沿皮浅刺；腕部穴位宜浅刺，避开桡动脉与神经干，出现触电样放散感应立即退针；若手指麻木持续或肌力下降，须转诊评估。请以教材、国家标准和专业医师指导为准。", contraindications:"肘腕部皮肤破损、感染、溃疡者禁针；疑似骨折、脱位及化脓性腱鞘炎、化脓性关节炎者禁针并转诊；局部血肿明显处不宜针刺；孕妇慎用合谷；有出血倾向或正在抗凝治疗者慎针。", courseHint:"", tags:["肘腕痛","慢性劳损"], source:makeSource('B1') },
  { id:"dis-tennis-elbow", name:"网球肘", category:"骨伤科", alias:["肱骨外上髁炎"], overview:"以肘外侧局限性疼痛、用力握物或前臂旋转时加重为主症。多因前臂伸肌群反复牵拉劳损，致局部气血瘀滞、经筋失养。", mainPoints:["LI11","LI10","LI4","TE5"], adjunctPoints:["LU5","LU7","SI3","EX-UE1"], patternAdd:[{"pattern":"风寒阻络","points":["GV14","BL12"]},{"pattern":"气滞血瘀","points":["BL17","LR3"]},{"pattern":"劳损气血不足","points":["ST36","SP6"]}], cautions:"治疗期间应减少患肢用力握持与反复旋转动作，必要时佩戴护具制动；局部肿胀明显或疼痛顽固不缓解者需由骨科进一步评估。请以教材、国家标准和专业医师指导为准。", contraindications:"肘部皮肤破损、感染禁针；局部明显肿胀、怀疑骨折或关节感染者禁针并转诊；有出血倾向或正在抗凝治疗者慎针。", courseHint:"", tags:["肘痛","慢性劳损"], source:makeSource('B1') },
  { id:"dis-knee-osteoarthritis", name:"膝骨关节炎", category:"骨伤科", alias:["膝痹","退行性膝关节炎","骨性关节炎"], overview:"以膝关节疼痛、上下楼梯加重、晨起僵硬、活动后减轻为主症。多因年老肝肾不足、筋骨失养，兼夹风寒湿邪与劳损。", mainPoints:["ST35","ST34","SP9","GB34","ST36"], adjunctPoints:["SP10","BL40","KI10","LR8","EX-LE2","EX-LE5"], patternAdd:[{"pattern":"风寒湿痹","points":["BL60","GV4"]},{"pattern":"瘀血阻滞","points":["BL17","LI4"]},{"pattern":"肝肾亏虚","points":["KI3","LR3"]},{"pattern":"湿热蕴结","points":["LI11","ST44"]}], cautions:"膝关节明显肿胀、关节腔积液或急性外伤时，应先由骨科评估，不宜在肿胀处反复深刺；日常应控制体重、避免过度负重与频繁爬楼。请以教材、国家标准和专业医师指导为准。", contraindications:"膝关节皮肤破损、感染及化脓性关节炎者禁针；关节置换术后局部慎针；严重骨质疏松、凝血功能障碍者慎针；孕妇不宜针刺合谷、三阴交及腰骶部。", courseHint:"", tags:["膝痛","退行性变"], source:makeSource('B1') },
  { id:"dis-knee-mcl-injury", name:"膝内侧副韧带损伤", category:"骨伤科", alias:["膝关节内侧副韧带损伤","膝内侧韧带扭伤"], overview:"以膝内侧疼痛、肿胀、局部压痛、外翻应力下疼痛加重及行走不稳为主症，多因膝关节外翻位扭伤所致。病机为局部经筋损伤、气血瘀滞，日久则经筋失养、关节失稳。", mainPoints:["SP10","SP9","EX-LE4","LR8","ST34"], adjunctPoints:["EX-LE5","EX-LE2","GB34","ST36","KI10","BL40","EX-LE1"], patternAdd:[{"pattern":"急性期瘀血肿胀","points":["BL17","LI4"]},{"pattern":"慢性期经筋失养","points":["ST36","BL20"]},{"pattern":"寒湿痹阻","points":["GV4","BL60"]}], cautions:"急性损伤须先由骨科检查，必要时行应力位影像学检查以排除韧带完全断裂与骨折；损伤早期宜冷敷、弹性绷带固定并抬高患肢，不宜热敷或在肿胀处强力按揉；恢复期在专业指导下循序渐进进行股四头肌与本体感觉训练。请以教材、国家标准和专业医师指导为准。", contraindications:"膝关节及周围皮肤破损、感染、溃疡者禁针；骨折、脱位未复位及韧带完全断裂者禁针并转诊；关节明显积液、红肿发热处不宜深刺；孕妇不宜针刺合谷、三阴交及腰骶部。", courseHint:"", tags:["膝痛","韧带损伤"], source:makeSource('B1') },
  { id:"dis-chest-costal-sprain", name:"胸胁迸伤", category:"骨伤科", alias:["岔气","胸胁屏伤","胸壁软组织扭挫伤"], overview:"以搬抬重物、用力屏气或突然转体后出现胸胁部刺痛或胀痛、呼吸咳嗽及转侧时加重、局部无明显畸形为主症。多因气机壅滞、瘀血内停，致胸胁经络气血运行受阻。", mainPoints:["PC6","TE6","GB34","LR3","CV17"], adjunctPoints:["LU7","TE5","GB41","SP21","BL17","EX-UE2","EX-UE3"], patternAdd:[{"pattern":"气机郁滞","points":["LI4","BL18"]},{"pattern":"瘀血内停","points":["BL17","BL14"]},{"pattern":"寒湿凝滞","points":["BL12","GV14"]}], cautions:"胸胁疼痛剧烈并伴气促、心悸、大汗、面色苍白或咯血者，须先排除心绞痛、心肌梗死、气胸及肋骨骨折，立即急诊处理，不得自行针刺；胸胁部穴位应斜刺或沿皮平刺并严格控制深度，禁止直刺深刺，以免造成气胸；损伤后宜适当休息，避免用力屏气、剧烈咳嗽与大幅度转体。请以教材、国家标准和专业医师指导为准。", contraindications:"胸胁部皮肤破损、感染及带状疱疹破损处禁针；肋骨骨折、血气胸、严重心肺疾病及剧痛原因不明者禁针并转诊；孕妇禁用合谷及腰骶部、下腹部穴位；体质极度虚弱、易晕针者慎针。", courseHint:"", tags:["胸胁痛","岔气"], source:makeSource('B1') },
  { id:"dis-lumbar-muscle-strain", name:"腰肌劳损", category:"骨伤科", alias:["慢性腰肌劳损","功能性腰痛"], overview:"以腰部酸痛、劳累后加重、休息后减轻、反复发作为主症。多因久坐久立、姿势不良或反复负重致腰部经筋气血瘀滞。", mainPoints:["BL23","BL25","GV3","BL40"], adjunctPoints:["BL32","BL57","GB30","KI3","EX-UE7","EX-B4"], patternAdd:[{"pattern":"寒湿腰痛","points":["BL60","SP9"]},{"pattern":"瘀血阻滞","points":["BL17","LI4"]},{"pattern":"肾气亏虚","points":["GV4","CV4"]}], cautions:"腰痛病因复杂，针刺前应明确诊断，避免与腰椎骨折、结核、肿瘤及内脏牵涉痛混淆；同时纠正姿势并加强核心肌群训练，不宜长期单纯依赖针刺。请以教材、国家标准和专业医师指导为准。", contraindications:"腰部皮肤破损、感染禁针；腰椎骨折、结核、肿瘤、化脓性脊柱炎及出现马尾综合征表现者禁针并转诊；孕妇腰骶部禁针；有出血倾向者慎针。", courseHint:"", tags:["腰痛","慢性劳损"], source:makeSource('B1') },
  { id:"dis-l3-transverse-process-syndrome", name:"腰三横突综合征", category:"骨伤科", alias:["第三腰椎横突综合征","腰三横突炎"], overview:"以第三腰椎横突尖端处局限性压痛、腰部酸痛、久坐久站或弯腰后加重为主症，可向臀部及大腿后侧放散。多因腰部反复劳损或姿势不良，致横突周围经筋气血瘀阻。", mainPoints:["EX-B2","BL24","EX-B4","BL40"], adjunctPoints:["BL23","BL25","GB30","BL57","EX-UE7","KI3"], patternAdd:[{"pattern":"寒湿痹阻","points":["GV4","SP9"]},{"pattern":"瘀血阻滞","points":["BL17","LI4"]},{"pattern":"肾气亏虚","points":["CV4","LR3"]}], cautions:"腰部局限性压痛明显者应先排除腰椎骨折、结核、肿瘤及腰椎间盘突出症；第三腰椎横突处进针不宜过深，体型消瘦者尤须注意，以免伤及腹后壁与腹腔脏器；急性期避免久坐久站与弯腰负重，缓解后配合腰背肌功能锻炼。请以教材、国家标准和专业医师指导为准。", contraindications:"腰部皮肤破损、感染禁针；腰椎骨折、脱位、结核、肿瘤及化脓性脊柱炎者禁针并转诊；孕妇腰骶部禁针；安装心脏起搏器者禁用腰骶部电针；有出血倾向或正在抗凝治疗者慎针。", courseHint:"", tags:["腰痛","慢性劳损"], source:makeSource('B1') },
  { id:"dis-lumbar-spinal-stenosis", name:"腰椎管狭窄", category:"骨伤科", alias:["腰椎管狭窄症","间歇性跛行"], overview:"以腰腿疼痛麻木、行走一段距离后加重、蹲坐或前屈后减轻的间歇性跛行为主症。多因年老肝肾不足、筋骨退变，兼夹劳损与寒湿，致椎管及神经根受压、经络气血痹阻。", mainPoints:["EX-B2","GV3","BL23","BL25","BL40"], adjunctPoints:["BL32","BL37","BL57","GB34","BL60","EX-B4"], patternAdd:[{"pattern":"肾气亏虚","points":["CV4","KI3"]},{"pattern":"寒湿痹阻","points":["GV4","SP9"]},{"pattern":"瘀血阻络","points":["BL17","LI4"]}], cautions:"出现鞍区麻木、大小便功能障碍或下肢肌力进行性下降时提示马尾受压，须立即急诊处理，不得自行针刺；夹脊穴深部邻近椎管与体腔，须由专业医师掌握进针角度与深度；间歇性跛行明显者应减少长时间站立行走与负重，必要时由骨科评估手术指征。请以教材、国家标准和专业医师指导为准。", contraindications:"腰骶部皮肤破损、感染禁针；椎管内肿瘤、结核、感染、骨折及需手术减压的严重狭窄者禁针并转诊；孕妇腰骶部禁针；安装心脏起搏器者禁用腰骶部电针；有出血倾向或正在抗凝治疗者慎针。", courseHint:"", tags:["腰腿痛","退行性变"], source:makeSource('B1') },
  { id:"dis-lumbar-disc-herniation", name:"腰椎间盘突出", category:"骨伤科", alias:["腰椎间盘突出症","腰腿痛"], overview:"以腰痛伴下肢放射性疼痛麻木、咳嗽或用力时加重为主症。多因劳损或外伤致经络气血瘀阻、经筋失于濡养。", mainPoints:["GV3","BL23","BL25","GB30","BL40"], adjunctPoints:["BL54","BL37","BL57","GB34","BL60","EX-B4"], patternAdd:[{"pattern":"寒湿痹阻","points":["GV4","SP9"]},{"pattern":"瘀血阻络","points":["BL17","LI4"]},{"pattern":"肝肾亏虚","points":["KI3","LR3"]}], cautions:"出现下肢肌力进行性下降、鞍区麻木或大小便功能障碍，提示马尾受压，须立即急诊处理，不得自行针刺；环跳、秩边深部邻近坐骨神经，应由专业人员操作。请以教材、国家标准和专业医师指导为准。", contraindications:"腰臀部及下肢皮肤破损、感染禁针；椎管内肿瘤、结核、严重椎管狭窄及马尾综合征者禁针并转诊；孕妇腰骶部及合谷、三阴交禁针；安装心脏起搏器者禁用腰骶部电针。", courseHint:"", tags:["腰腿痛","放射痛"], source:makeSource('B1') },
  { id:"dis-plantar-fasciitis", name:"足底筋膜炎", category:"骨伤科", alias:["跖筋膜炎","足底筋膜劳损"], overview:"以晨起下床第一步或久坐起立时足底跟部刺痛、行走片刻后减轻、久行后又加重为主症。多因久站久行、体重增加或鞋具不当，使足底筋膜反复牵拉，局部气血瘀滞、经筋失养。", mainPoints:["KI1","KI3","BL57","BL60","SP4"], adjunctPoints:["BL40","KI2","KI6","GB34","BL58","EX-LE10","EX-LE9"], patternAdd:[{"pattern":"肾气亏虚","points":["GV4","CV4"]},{"pattern":"寒湿痹阻","points":["SP9","BL62"]},{"pattern":"瘀血阻滞","points":["BL17","LI4"]}], cautions:"足底疼痛应先排除跟骨骨折、跖筋膜断裂、痛风、感染及肿瘤等；减少长时间站立行走与硬地赤足活动，选择有足弓支撑的缓冲鞋垫，并配合足底筋膜与小腿三头肌牵伸训练；糖尿病患者足部感觉减退，针刺须格外慎重并注意预防感染。请以教材、国家标准和专业医师指导为准。", contraindications:"足底及足跟皮肤破损、感染、溃疡、坏疽者禁针；跟骨骨折、骨髓炎、局部肿瘤及痛风急性发作红肿处禁针并转诊；糖尿病足、下肢静脉曲张及凝血功能障碍者慎针。", courseHint:"", tags:["足痛","慢性劳损"], source:makeSource('B1') },
  { id:"dis-heel-pain", name:"足跟痛", category:"骨伤科", alias:["跟痛症","足底筋膜炎","跟骨骨刺"], overview:"以晨起下床第一步或久坐后站立时足跟刺痛、行走片刻后减轻为主症。多因肾气不足、足跟长期受力劳损致经筋失养。", mainPoints:["KI3","BL60","BL57","KI4"], adjunctPoints:["BL40","BL61","KI6","BL58","EX-LE10","EX-LE9"], patternAdd:[{"pattern":"肾气亏虚","points":["GV4","CV4"]},{"pattern":"寒湿痹阻","points":["SP9","BL62"]},{"pattern":"瘀血阻滞","points":["BL17","LI4"]}], cautions:"足跟痛应先排除跟骨骨折、感染及肿瘤；减少长时间站立与行走，选择软底缓冲鞋并配合足底筋膜牵伸训练。请以教材、国家标准和专业医师指导为准。", contraindications:"足跟部皮肤破损、感染、溃疡者禁针；跟骨骨折、骨髓炎、局部肿瘤者禁针并转诊；糖尿病患者足部感觉减退者慎针；有出血倾向者慎针。", courseHint:"", tags:["足痛","慢性劳损"], source:makeSource('B1') },
  { id:"dis-sciatica", name:"坐骨神经痛", category:"骨伤科", alias:["腰腿痛","坐骨神经痛症"], overview:"以沿臀部向后外侧至下肢放射的疼痛麻木为主症，行走、咳嗽或用力时加重。多因经络气血痹阻、经筋失于濡养，常继发于腰椎病变。", mainPoints:["GB30","BL40","BL54","GB34"], adjunctPoints:["BL37","BL57","BL60","GB39","EX-B4"], patternAdd:[{"pattern":"寒湿痹阻","points":["GV4","SP9"]},{"pattern":"瘀血阻络","points":["BL17","LI4"]},{"pattern":"肝肾亏虚","points":["BL23","KI3","LR3"]}], cautions:"环跳、秩边深部邻近坐骨神经，须由专业医师控制进针深度与角度；出现大小便障碍、鞍区麻木或肌力迅速下降者须急诊处理，不得自行针刺。请以教材、国家标准和专业医师指导为准。", contraindications:"腰臀及下肢皮肤破损、感染禁针；椎管内肿瘤、结核、严重椎管狭窄及马尾综合征者禁针并转诊；孕妇腰骶部及合谷、三阴交禁针；安装心脏起搏器者禁用相关部位电针。", courseHint:"", tags:["腰腿痛","神经痛"], source:makeSource('B1') },
  { id:"dis-alopecia-areata", name:"斑秃", category:"皮外科", alias:["油风","圆形脱发"], overview:"突然发生的局限性斑片状脱发，脱发区头皮光滑、无炎症与自觉症状，边界清楚。多与情志刺激、劳累、睡眠不足及免疫异常有关，部分可自愈，也有反复或进展为全秃者。", mainPoints:["GV20","GB20","KI3","SP6","BL17"], adjunctPoints:["LI4","SP10","ST36","EX-HN1","BL23"], patternAdd:[{"pattern":"血热生风","points":["SP10","LI11","GB20"]},{"pattern":"气滞血瘀","points":["LR3","BL17","EX-HN1"]},{"pattern":"气血两虚","points":["ST36","CV6","BL20"]},{"pattern":"肝肾不足","points":["KI3","BL23","LR3"]}], cautions:"脱发局部可采用浅刺或梅花针轻叩，以皮肤微红为度，避免出血与过度刺激造成新的毛囊损伤。脱发原因较多，应先排除甲状腺功能异常、贫血、自身免疫病及药物因素，必要时到皮肤科检查。治疗期间规律作息、均衡饮食、稳定情绪，避免频繁烫染与强力牵拉头发；恢复通常需数月，不宜期待短期速效。请以教材、国家标准和专业医师指导为准。", contraindications:"脱发区头皮有炎症、破损、感染或渗出者局部禁针；瘢痕性脱发与头皮萎缩区禁针；有出血倾向、凝血功能障碍或正在使用抗凝药物者慎针；孕妇下腹部、腰骶部及合谷、三阴交等穴禁针或慎针；婴幼儿囟门未闭者头部禁针。", courseHint:"一般隔日一次，十至十五次为一疗程，疗程间隔七至十天。", tags:["皮肤病","脱发"], source:makeSource('B1') },
  { id:"dis-acne", name:"痤疮", category:"皮外科", alias:["粉刺","寻常痤疮"], overview:"青春期及青壮年常见的毛囊皮脂腺慢性炎症，好发于面部、前胸与后背。皮损以粉刺、丘疹、脓疱为主，重者可见结节与囊肿，多与肺胃蕴热、痰湿瘀阻及冲任失调相关。", mainPoints:["LI4","LI11","GV14","ST44","SP10"], adjunctPoints:["ST36","BL13","BL40","EX-HN6","LU5"], patternAdd:[{"pattern":"肺经风热","points":["LU5","LI11","GV14","EX-HN6"]},{"pattern":"脾胃湿热","points":["ST44","SP9","CV12","EX-HN6"]},{"pattern":"痰瘀互结","points":["SP10","ST40","BL17"]},{"pattern":"冲任不调","points":["CV4","SP6","KI3"]}], cautions:"面部针刺宜浅刺、轻刺激，避开红肿脓疱与破溃处，防止炎症扩散与留疤。日常应温和清洁、避免挤压皮损，减少高糖、高脂与乳制品摄入，规律作息并保持情绪平稳。以结节囊肿为主、伴明显瘢痕或伴有月经异常等内分泌表现者，应到皮肤科或相关专科进一步诊治，针刺仅作辅助调理。请以教材、国家标准和专业医师指导为准。", contraindications:"面部炎症明显、有脓疱破溃或感染者局部禁针；瘢痕体质者面部禁针；有出血倾向、凝血功能障碍或正在使用抗凝药物者慎针；孕妇下腹部、腰骶部及合谷、三阴交等穴禁针或慎针；正在使用维A酸类药物致皮肤敏感脆弱者慎针；婴幼儿不宜针刺。", courseHint:"一般每周二至三次，十次为一疗程，疗程间隔五至七天。", tags:["皮肤病","面部","常用"], source:makeSource('B1') },
  { id:"dis-herpes-zoster", name:"带状疱疹", category:"皮外科", alias:["蛇串疮","缠腰火丹"], overview:"沿单侧神经分布区出现成簇水疱，排列呈带状，伴明显灼痛或刺痛，多因肝经郁热、脾虚湿蕴或气滞血瘀，致湿热火毒蕴结肌肤而成。", mainPoints:["LI4","GB34","LR3","SP10","BL40"], adjunctPoints:["GB43","SP9","ST36","GV14","EX-B2"], patternAdd:[{"pattern":"肝经郁热","points":["LR3","GB43","LI11"]},{"pattern":"脾虚湿蕴","points":["SP9","CV12","BL20"]},{"pattern":"气滞血瘀","points":["SP10","BL17","LI4"]}], cautions:"带状疱疹应尽早就医，尤其在发病早期规范抗病毒治疗对预后重要，针刺仅作为辅助止痛与促进恢复的手段。皮疹部位禁止在破损、糜烂或感染处直接针刺；出现眼部受累、面瘫、剧烈头痛或发热等特殊类型表现时须立即转诊。请以教材、国家标准和专业医师指导为准。", contraindications:"疱疹破溃、糜烂、渗出或继发感染处禁针、禁拔罐；免疫功能严重低下、凝血功能障碍或正在使用抗凝药物者禁用放血与强刺激手法；孕妇腰骶部与下腹部禁针；疼痛性质改变或皮疹泛发者先转诊排查。", courseHint:"", tags:["皮外","湿热火毒","神经痛"], source:makeSource('B1') },
  { id:"dis-erysipelas", name:"丹毒", category:"皮外科", alias:["流火","急性网状淋巴管炎"], overview:"由细菌感染引起的皮肤及皮下组织急性炎症，好发于小腿与面部，表现为边界清楚的鲜红色斑片，局部灼热、肿胀、触痛，常伴发热、恶寒与附近淋巴结肿大。起病急、进展快，可反复发作。", mainPoints:["GV14","LI11","LI4","BL40","SP10"], adjunctPoints:["SP9","ST44","ST36","TE5","EX-UE11","EX-HN6"], patternAdd:[{"pattern":"风热毒蕴","points":["TE5","GB20","LI11"]},{"pattern":"湿热下注","points":["SP9","ST44","BL40"]},{"pattern":"热毒炽盛","points":["GV14","LU11","EX-UE11"]},{"pattern":"正虚毒恋","points":["ST36","BL20","SP10"]}], cautions:"丹毒属急性细菌感染，必须尽早由专业医师诊治，以抗生素等规范抗感染治疗为主，针刺只能作为辅助手段，绝不可替代药物治疗。严禁在红肿灼热部位直接针刺、放血或挤压，以免感染扩散；放血类操作仅限专业医师在严格消毒下施行。患肢应抬高休息，减少活动，积极治疗足癣、皮肤破损与下肢静脉功能不全等诱因。出现高热寒战、红肿迅速扩大、水疱坏死或意识改变等重症表现时须立即急诊就医。请以教材、国家标准和专业医师指导为准。", contraindications:"红肿热痛部位及周围皮肤严禁针刺、放血、拔罐与挤压；高热、寒战等全身中毒症状明显或疑有脓毒症者禁针并立即转诊；有出血倾向、凝血功能障碍或正在使用抗凝药物者禁放血；糖尿病及下肢血管病变者慎用放血并加强创面管理；孕妇下腹部、腰骶部及合谷、三阴交等穴禁针或慎针。", courseHint:"急性期以抗感染治疗为主，针刺辅助须待专业医师评估后施行。", tags:["感染","急症","需就医"], source:makeSource('B1') },
  { id:"dis-chloasma", name:"黄褐斑", category:"皮外科", alias:["肝斑","黧黑斑"], overview:"颜面部出现对称性淡褐色至深褐色色素沉着斑，多见于育龄期女性，常与内分泌变化、日晒、遗传及情绪因素相关。斑片边界多较清楚，无自觉症状，常随日晒、劳累和情绪波动而加深。", mainPoints:["LI4","SP6","LR3","BL18","BL23"], adjunctPoints:["ST36","SP10","KI3","GB34","EX-HN5"], patternAdd:[{"pattern":"肝郁气滞","points":["LR3","PC6","GB34","EX-HN1"]},{"pattern":"脾虚湿盛","points":["SP9","ST36","BL20"]},{"pattern":"肝肾不足","points":["KI3","BL23","CV4"]},{"pattern":"气滞血瘀","points":["SP10","BL17","LI4"]}], cautions:"面部取穴宜浅刺轻刺并严格消毒，避免损伤血管造成瘀斑与色素加重。防晒是防治基础，应避免暴晒并规律使用防晒措施；同时保持作息规律、情绪平和，慎用成分不明的祛斑产品。针刺对本病多为辅助调理，起效缓慢；若色斑近期明显变化或伴月经紊乱等内分泌表现，应到皮肤科或妇科进一步检查。请以教材、国家标准和专业医师指导为准。", contraindications:"面部皮肤破损、炎症或感染者局部禁针；瘢痕体质者面部禁针；有出血倾向、凝血功能障碍或正在使用抗凝药物者慎针；孕妇下腹部、腰骶部及合谷、三阴交等穴禁针或慎针；面部血管瘤、色素痣等皮损处禁针。", courseHint:"一般每周二至三次，十次为一疗程，需连续数疗程并配合防晒。", tags:["皮肤病","面部","色素沉着"], source:makeSource('B1') },
  { id:"dis-pruritus", name:"皮肤瘙痒症", category:"皮外科", alias:["风瘙痒","老年性瘙痒症"], overview:"以全身或局部皮肤阵发性瘙痒为主要表现，初起无原发皮损，因反复搔抓可见抓痕、血痂、色素沉着及苔藓样变。多见于老年人及秋冬季，常与血虚风燥、湿热内蕴及环境干燥有关。", mainPoints:["LI11","SP10","BL17","GB31","SP6"], adjunctPoints:["LI4","TE5","ST36","LR3","EX-HN6","EX-LE3"], patternAdd:[{"pattern":"风热血热","points":["LI11","GV14","EX-HN6"]},{"pattern":"血虚风燥","points":["BL17","SP10","ST36"]},{"pattern":"湿热内蕴","points":["SP9","ST44","GB34"]},{"pattern":"阴虚内热","points":["KI3","KI10","SP6"]}], cautions:"本病应先查找并处理内在原因，应排查糖尿病、肝胆疾病、肾脏疾病、甲状腺功能异常、血液病及药物因素，老年人尤其不可只作对症止痒。施术前须检查皮肤有无破损与感染，搔抓破溃处禁针；日常避免热水烫洗、过度搓擦与碱性洗涤用品，坚持润肤保湿、穿着棉质衣物并忌辛辣与饮酒。瘙痒剧烈、持续不缓解或伴黄疸、消瘦、发热者应及时就医。请以教材、国家标准和专业医师指导为准。", contraindications:"皮肤抓痕破溃、继发感染处禁针；有出血倾向、凝血功能障碍或正在使用抗凝药物者慎针；孕妇下腹部、腰骶部及合谷、三阴交等穴禁针或慎针；高热、恶病质或全身状态差者不宜针刺；婴幼儿不宜自行针刺。", courseHint:"一般隔日一次，十次为一疗程，疗程间隔五至七天。", tags:["皮肤病","瘙痒","常用"], source:makeSource('B1') },
  { id:"dis-neurodermatitis", name:"神经性皮炎", category:"皮外科", alias:["牛皮癣","慢性单纯性苔藓"], overview:"以阵发性剧痒和皮肤苔藓样变为主要表现的慢性瘙痒性皮肤病，好发于颈项、肘部、腘窝及腰骶等处。皮损初为扁平丘疹，逐渐融合成片、皮纹加深、边界清楚，常因搔抓与情绪波动而加重。", mainPoints:["LI11","SP10","GB20","BL17","EX-HN6"], adjunctPoints:["LI4","TE5","SP6","LR3","GB34","EX-LE3"], patternAdd:[{"pattern":"肝郁化火","points":["LR3","PC6","GB34"]},{"pattern":"风湿蕴阻","points":["LI11","SP9","ST40"]},{"pattern":"血虚风燥","points":["BL17","SP10","ST36"]}], cautions:"颈项与肘腘等处的皮损以围刺或邻近取穴为常用方式，皮损表面增厚处不宜反复深刺，以免加重损伤与感染。本病与精神紧张、焦虑关系密切，应规律作息、减少搔抓与摩擦、避免饮酒及辛辣刺激，并注意剪短指甲。皮损范围广、瘙痒剧烈影响睡眠或久治不缓解者，应到皮肤科进一步诊治。请以教材、国家标准和专业医师指导为准。", contraindications:"皮损局部有破损、渗出或感染者禁针；瘢痕体质者皮损区慎用围刺与强刺激；有出血倾向、凝血功能障碍或正在使用抗凝药物者慎针；孕妇下腹部、腰骶部及合谷、三阴交等穴禁针或慎针；精神高度紧张不能配合或晕针者不宜针刺。", courseHint:"", tags:["皮肤病","瘙痒"], source:makeSource('B1') },
  { id:"dis-eczema", name:"湿疹", category:"皮外科", alias:["湿疮","湿疹样皮炎"], overview:"以多形性皮损、渗出倾向、剧烈瘙痒与反复作为特点的皮肤炎症，可泛发或局限，常对称分布。急性期多见红斑、丘疹、水疱与渗液，慢性期以皮肤增厚、粗糙、苔藓样变为主。", mainPoints:["LI11","SP10","ST36","SP6","BL40"], adjunctPoints:["LI4","SP9","BL13","TE5","EX-LE3"], patternAdd:[{"pattern":"湿热浸淫","points":["SP9","ST44","GV14"]},{"pattern":"脾虚湿蕴","points":["SP9","BL20","CV12"]},{"pattern":"血虚风燥","points":["BL17","SP10","KI3"]},{"pattern":"风湿热并重","points":["LI11","GB31","EX-HN6"]}], cautions:"皮损部位以远端取穴与邻近非皮损区取穴为主，渗液、糜烂处不可直接针刺，防止继发感染与皮疹扩散。治疗期间避免热水烫洗、搔抓、碱性洗涤剂以及辛辣、海鲜等诱发食物，配合润肤保湿与情绪调畅。皮损泛发、伴发热或继发感染者应及时皮肤科就诊，针刺仅作辅助调理。请以教材、国家标准和专业医师指导为准。", contraindications:"皮损区皮肤破损、糜烂、渗液或化脓者局部禁针；对酒精、金属针具过敏者慎用；有出血倾向或正在使用抗凝药物者慎针；孕妇下腹部、腰骶部及合谷、三阴交等穴禁针或慎针；婴幼儿、高热及泛发性重症湿疹不宜自行针刺，应转诊专业医疗处理。", courseHint:"一般隔日一次，十次为一疗程，疗程间隔五至七天，具体以专业医师判断为准。", tags:["皮肤病","瘙痒","常用"], source:makeSource('B1') },
  { id:"dis-urticaria", name:"荨麻疹", category:"皮外科", alias:["风疹块","瘾疹"], overview:"皮肤突发大小不等风团，色红或苍白，瘙痒剧烈，时起时消、消退后不留痕迹，多因风邪外袭、湿热内蕴或血虚生风所致。", mainPoints:["LI11","SP10","BL40","ST36","LI4"], adjunctPoints:["LU11","SP6","GB31","TE5","EX-LE3"], patternAdd:[{"pattern":"风热犯表","points":["LI11","TE5","GV14"]},{"pattern":"风寒束表","points":["BL12","LU7","GV14"]},{"pattern":"胃肠湿热","points":["ST44","SP9","CV12"]},{"pattern":"血虚风燥","points":["BL20","SP6","KI3"]}], cautions:"荨麻疹若伴喉头水肿、呼吸困难、胸闷或血压下降，必须立即拨打急救电话，属过敏性休克危象。一般皮疹反复不愈者应就医查找过敏原，针刺仅作为辅助止痒与调节免疫的手段。请以教材、国家标准和专业医师指导为准。", contraindications:"皮肤风团破溃、渗液或继发感染处禁针及禁拔罐；有出血倾向或正在使用抗凝药物者禁用放血、拔罐；孕妇腰骶部与下腹部禁针，合谷、三阴交慎针；对金属或消毒剂过敏者慎用。", courseHint:"", tags:["皮外","风邪","瘙痒"], source:makeSource('B1') },
  { id:"dis-convulsion", name:"抽搐", category:"急症", alias:["痉证","惊厥"], overview:"以四肢不自主抽动、颈项强直、角弓反张，或伴神志不清为主症，多因热极生风、肝风内动或阴血亏虚所致。可见于高热、颅内病变及代谢异常等。", mainPoints:["GV26","GV14","LI4","LR3","GB34"], adjunctPoints:["PC6","PC3","ST40","SP6"], patternAdd:[{"pattern":"热极生风","points":["LI11","GV14","PC3","EX-UE11","EX-HN6"]},{"pattern":"肝风内动","points":["LR3","GB20","GV20"]},{"pattern":"阴虚风动","points":["KI3","SP6","BL23"]},{"pattern":"痰浊蒙窍","points":["CV12","ST40","PC5"]}], cautions:"抽搐发作时必须立即拨打急救电话，保持呼吸道通畅、防止舌咬伤与跌倒损伤，针刺只能作为辅助处理。婴幼儿、孕妇及颅脑疾病患者须由专业医师判断病因与治疗，不得暗示针刺可以替代急救与抗惊厥治疗。请以教材、国家标准和专业医师指导为准。", contraindications:"发作期肢体强直抽搐时不强行针刺或按压，以免折针、断针及二次损伤；颅内压增高、脑出血、中毒及代谢危象者禁自行针刺，立即转诊；皮肤感染、破损处禁针。", courseHint:"", tags:["急症","肝风","辅助处理"], source:makeSource('B1') },
  { id:"dis-biliary-colic", name:"胆绞痛", category:"急症", alias:["胆石症绞痛","胆囊炎疼痛"], overview:"右上腹或剑突下阵发性绞痛，常向右肩背放射，伴恶心呕吐、口苦，多因肝胆气滞、湿热蕴结或砂石阻滞胆道而发。", mainPoints:["GB34","GB24","LR3","LI4","CV12"], adjunctPoints:["GB40","BL19","PC6","ST36","EX-LE6"], patternAdd:[{"pattern":"肝胆气滞","points":["LR3","GB34","PC6"]},{"pattern":"湿热蕴结","points":["GB40","SP9","BL19"]},{"pattern":"砂石阻滞","points":["GB24","BL18","ST36"]}], cautions:"胆绞痛必须立即拨打急救电话或就医，需影像学检查明确有无结石嵌顿、胆道梗阻或胆囊穿孔，针刺仅作为辅助止痛手段。出现高热、黄疸、寒战或腹膜炎体征时提示病情危重，须急诊处理。请以教材、国家标准和专业医师指导为准。", contraindications:"疑有胆囊穿孔、急性化脓性胆管炎、重症胰腺炎者禁自行针刺，立即转诊；右上腹皮肤感染、破损或手术切口未愈处禁针；孕妇上腹部与腰骶部慎针；有出血倾向者禁用放血类操作。", courseHint:"", tags:["急症","胆腑","辅助止痛"], source:makeSource('B1') },
  { id:"dis-high-fever", name:"高热", category:"急症", alias:["发热","体温升高"], overview:"体温明显升高，常伴面赤、口渴、烦躁、汗出或无汗，多由外感邪毒或里热炽盛所致。须查明发热原因，警惕感染与危重疾病。", mainPoints:["LI11","GV14","PC9","LU11","ST36"], adjunctPoints:["LI4","TE5","GV26","KI3","EX-HN6"], patternAdd:[{"pattern":"外感风热","points":["LI4","TE5","GV14"]},{"pattern":"肺热壅盛","points":["LU5","LU11","CV17"]},{"pattern":"热入营血","points":["PC3","BL15","SP10"]},{"pattern":"阴虚发热","points":["KI3","KI6","BL23"]}], cautions:"高热必须立即拨打急救电话或就医，查明病因是首要环节，针刺仅可作为辅助退热手段。婴幼儿、老年人、孕妇及免疫功能低下者应尽早由专业医师处理，不得暗示针刺可替代抗感染、补液等治疗。请以教材、国家标准和专业医师指导为准。", contraindications:"持续高热伴意识改变、抽搐、皮疹、颈项强直或血压下降者禁自行针刺，须立即转诊；高热脱水、循环不稳定者慎用针刺；皮肤破损、感染处禁针；有出血倾向者禁用放血类操作。", courseHint:"", tags:["急症","热证","辅助退热"], source:makeSource('B1') },
  { id:"dis-febrile-convulsion", name:"高热惊厥", category:"急症", alias:["热性惊厥","急惊风","小儿惊厥"], overview:"以高热同时出现四肢抽搐、两目上视、牙关紧闭、意识不清为主症的急性病证，多见于婴幼儿及儿童，常由外感高热、颅内感染等引起。", mainPoints:["GV26","GV14","LI4","LR3","EX-UE11"], adjunctPoints:["GB20","LI11","PC6","KI1","GB34","EX-HN3"], patternAdd:[{"pattern":"风热动风","points":["LI11","GB20","TE5","EX-HN6"]},{"pattern":"暑热动风","points":["PC6","EX-HN5","GV14"]},{"pattern":"痰热蒙窍","points":["ST40","CV12","PC6"]},{"pattern":"阴虚风动","points":["KI3","SP6","LR3"]}], cautions:"发作时须立即拨打 120 并尽快送医，先将患儿侧卧、松解衣领、清除口鼻分泌物，防止误吸与跌伤，切勿强行按压肢体或撬牙。控制体温、查明病因（必要时排除颅内感染）为救治关键，针刺仅为辅助止痉手段，不能替代急救与抗惊厥治疗。婴幼儿针刺应由专业医师操作，手法宜轻浅。请以教材、国家标准和专业医师指导为准。", contraindications:"抽搐发作时不可强行留针或强行约束肢体；颅内高压、颅内出血、严重心肺衰竭者禁用针刺；皮肤感染、破损处禁针；婴幼儿囟门未闭处禁针；有出血倾向者禁刺放血。", courseHint:"", tags:["急症","儿科","止痉"], source:makeSource('B1') },
  { id:"dis-syncope-emergency", name:"昏厥", category:"急症", alias:["晕厥","厥证","血管迷走性晕厥"], overview:"以突发短暂意识丧失、面色苍白、四肢厥冷、移时自苏为主症的急性病证，多因气机逆乱、清窍失养而发。须先排除心脑血管意外、低血糖、失血等危重病因。", mainPoints:["GV26","GV20","PC6","LI4","GV25"], adjunctPoints:["ST36","CV6","KI1","EX-HN3","LU9"], patternAdd:[{"pattern":"气厥实证","points":["LR3","PC6","GV26"]},{"pattern":"气厥虚证","points":["CV6","ST36","GV20"]},{"pattern":"血厥","points":["SP10","BL17","ST36"]},{"pattern":"痰厥","points":["ST40","CV12","PC6"]}], cautions:"昏厥属急症，必须第一时间拨打 120 并保持呼吸道通畅、平卧抬高下肢、松解衣领，针刺仅为辅助促醒手段，绝不能替代急救与病因处理。若意识不恢复、伴抽搐、偏瘫、胸痛、呼吸异常或大出血，须立即转送医院。针刺操作应由专业医师施行。请以教材、国家标准和专业医师指导为准。", contraindications:"头部外伤、可疑颅内出血、严重心肺功能不全、休克失代偿期禁用或慎用针刺；皮肤感染、破损、溃疡处禁针；有出血倾向或正在使用抗凝药物者禁刺放血；孕妇禁针合谷及下腹部、腰骶部穴位。", courseHint:"", tags:["急症","开窍醒神","先呼救"], source:makeSource('B1') },
  { id:"dis-acute-abdominal-pain", name:"急性腹痛", category:"急症", alias:["急腹症","腹痛"], overview:"突发腹部疼痛，可伴恶心、呕吐、腹胀、排便异常，多因寒凝、食滞、气滞或湿热内阻，致腑气不通、气血壅滞。须先排除外科急腹症。", mainPoints:["CV12","ST25","ST36","LI4","SP4"], adjunctPoints:["PC6","LR3","BL25","CV6","EX-B3"], patternAdd:[{"pattern":"寒凝腹痛","points":["CV6","CV4","ST36"]},{"pattern":"食滞腹痛","points":["CV12","ST44","BL21"]},{"pattern":"气滞腹痛","points":["LR3","PC6","GB34"]},{"pattern":"湿热腹痛","points":["ST44","SP9","BL25"]}], cautions:"急性腹痛的病因复杂，必须立即就医排查外科急腹症，未明确诊断前禁用止痛类手法掩盖病情，针刺仅为辅助手段。孕妇、腹部有手术史或腹主动脉瘤风险者禁用腹部深刺。请以教材、国家标准和专业医师指导为准。", contraindications:"疑有穿孔、梗阻、内出血、异位妊娠或急性胰腺炎者禁止自行针刺，立即转诊；孕妇下腹部禁针；腹部皮肤感染、破损或瘢痕处禁针；饱食后不宜立即针刺腹部穴位。", courseHint:"", tags:["急症","腹痛","需先排查"], source:makeSource('B1') },
  { id:"dis-drowning-resuscitation", name:"溺水后复苏辅助", category:"急症", alias:["淹溺","溺水后昏迷"], overview:"溺水后出现意识丧失、呼吸心跳微弱或停止、面色青紫、喉中痰鸣、四肢厥冷等表现的危重状态，针刺仅用于心肺复苏与常规急救过程中的辅助促醒。", mainPoints:["GV26","PC6","GV25","KI1","CV17","CV6"], adjunctPoints:["ST36","ST40","LR3","GV20","EX-UE11","EX-HN6"], patternAdd:[{"pattern":"水淹窍闭","points":["GV26","GV20","KI1"]},{"pattern":"痰湿阻肺","points":["ST40","LU7","CV17"]},{"pattern":"阳气暴脱","points":["CV8","CV4","ST36"]},{"pattern":"复苏后神昏","points":["EX-HN1","PC6","GV20"]}], cautions:"必须立即拨打 120 并即刻施行心肺复苏、开放气道、人工呼吸与必要的除颤，针刺绝不能替代或延误心肺复苏，不得因针刺而中断胸外按压。复苏成功后仍须送医观察，警惕迟发性肺损伤与脑缺氧损害。所有急救与针刺操作均应由专业医务人员实施。请以教材、国家标准和专业医师指导为准。", contraindications:"心跳呼吸未恢复、正在实施心肺复苏时不得因针刺中断按压；颈椎、脊柱可疑损伤者禁止随意搬动头颈；肋骨骨折、胸部外伤者禁用胸部穴位深刺；皮肤破损、感染处禁针；凝血功能障碍者禁刺放血；孕妇禁针合谷及下腹部、腰骶部穴位。", courseHint:"", tags:["急症","心肺复苏优先","辅助促醒"], source:makeSource('B1') },
  { id:"dis-intractable-vomiting", name:"呕吐不止", category:"急症", alias:["呕吐","急性胃肠炎呕吐"], overview:"呕吐频繁、难以自行缓解，或伴恶心、脘腹胀满、食入即吐，多因胃失和降、气逆于上，可由饮食不节、外邪犯胃或肝气犯胃引起。", mainPoints:["CV12","PC6","ST36","BL21","SP4"], adjunctPoints:["CV13","LR3","ST44","BL20","EX-UE4"], patternAdd:[{"pattern":"寒邪犯胃","points":["CV6","CV12","ST36"]},{"pattern":"食滞内停","points":["CV13","ST44","BL21"]},{"pattern":"肝气犯胃","points":["LR3","PC6","GB34"]},{"pattern":"脾胃虚寒","points":["CV6","BL20","SP6"]}], cautions:"呕吐不止可导致脱水与电解质紊乱，反复或剧烈呕吐必须立即拨打急救电话或就医，针刺仅为辅助止呕措施。喷射性呕吐、呕血、剧烈头痛或意识改变提示危重情况，须立即转诊。请以教材、国家标准和专业医师指导为准。", contraindications:"呕血、黑便、剧烈头痛、意识障碍或疑有颅内病变者禁自行针刺，立即转诊；孕妇妊娠剧吐须由专业医师处理；腹部皮肤破损、感染处禁针；严重脱水者先补液纠正后再考虑针刺。", courseHint:"", tags:["急症","胃气上逆","辅助止呕"], source:makeSource('B1') },
  { id:"dis-renal-colic", name:"肾绞痛", category:"急症", alias:["尿石症绞痛","输尿管结石疼痛"], overview:"突发腰部或侧腹部剧烈绞痛，向下腹、会阴及大腿内侧放射，常伴恶心呕吐、血尿或尿频尿急，多因砂石阻滞、水道不通、气血瘀阻所致。", mainPoints:["BL23","SP6","CV3","BL40","KI3"], adjunctPoints:["BL28","LR3","ST36","CV4","EX-B4"], patternAdd:[{"pattern":"湿热下注","points":["SP9","BL28","CV3"]},{"pattern":"气滞血瘀","points":["LR3","SP10","BL40"]},{"pattern":"肾气不足","points":["KI3","BL23","CV4"]}], cautions:"肾绞痛必须立即拨打急救电话或就医，需明确有无结石梗阻、肾积水或感染，针刺仅作为辅助解痉止痛手段。出现高热寒战、无尿或血压下降时提示病情危重，须急诊处理，不得暗示针刺可以替代排石与抗感染治疗。请以教材、国家标准和专业医师指导为准。", contraindications:"疑有脓肾、尿路感染性休克或孤立肾梗阻者禁自行针刺，立即转诊；孕妇下腹部与腰骶部禁针；腰部皮肤感染、破损处禁针；肾功能不全者慎用强刺激手法。", courseHint:"", tags:["急症","水道","辅助解痉"], source:makeSource('B1') },
  { id:"dis-collapse-syndrome", name:"脱证", category:"急症", alias:["休克","亡阴亡阳","虚脱"], overview:"以面色苍白、汗出淋漓、四肢厥冷、脉微欲绝、神志淡漠或不清为主症的危重证候，为阴阳气血严重耗损、正气欲脱之象，多见于大失血、重度感染、心功能衰竭等。", mainPoints:["CV4","CV8","CV6","GV20","ST36"], adjunctPoints:["GV26","KI1","PC6","BL23","SP6","EX-UE11"], patternAdd:[{"pattern":"气脱","points":["CV6","ST36","GV20"]},{"pattern":"血脱","points":["BL17","SP10","ST36"]},{"pattern":"亡阴","points":["KI6","KI3","CV4"]},{"pattern":"亡阳","points":["CV8","CV4","GV26"]}], cautions:"脱证为危急重症，须立即拨打 120，在专业急救下给予吸氧、建立静脉通路、补充血容量等生命支持，针刺只能作为辅助措施，不得延误或替代抢救。禁止因针刺而中断监护与转运。艾灸神阙、关元须由专业医师操作并防止烫伤。请以教材、国家标准和专业医师指导为准。", contraindications:"休克未纠正、血压测不出、严重凝血功能障碍者不宜针刺；皮肤破损、感染、水肿渗液处禁针禁灸；神阙禁针；孕妇禁针下腹部及腰骶部穴位；不宜在末梢循环极差部位行放血疗法。", courseHint:"", tags:["急症","回阳固脱","危重转诊"], source:makeSource('B1') },
  { id:"dis-syncope", name:"晕厥", category:"急症", alias:["昏厥","血管迷走性晕厥"], overview:"突发短暂神志不清、面色苍白、四肢厥冷、汗出，多因气机逆乱、清窍失养所致。需先判断意识、呼吸与脉搏，排除心脑血管等危重病因。", mainPoints:["GV26","PC9","PC8","ST36","CV4"], adjunctPoints:["LI4","GV20","KI1","CV6","EX-UE11"], patternAdd:[{"pattern":"虚证","points":["CV6","ST36","GV20"]},{"pattern":"实证","points":["LI4","LR3","PC9"]},{"pattern":"痰浊蒙窍","points":["CV12","ST40","PC5"]},{"pattern":"气随血脱","points":["CV8","SP6","BL20"]}], cautions:"晕厥属急症，必须立即拨打急救电话或送医，针刺仅作为急救与促醒的辅助手段，不得替代急救与病因治疗。施术时让患者平卧、头低位并保持呼吸道通畅，密切观察意识、呼吸与脉搏变化。出现意识不清、呼吸脉搏异常时以心肺复苏和转运为先。请以教材、国家标准和专业医师指导为准。", contraindications:"意识未恢复、生命体征不稳定者禁用针刺操作；皮肤感染、破损处禁针；有出血倾向或正在使用抗凝药物者慎用；孕妇腰骶部、下腹部及合谷、三阴交等穴禁针或慎针。", courseHint:"", tags:["急症","促醒","急救"], source:makeSource('B1') },
  { id:"dis-heat-stroke", name:"中暑", category:"急症", alias:["暑厥","热射病"], overview:"在高温或烈日环境下出现头晕、头痛、口渴、恶心、汗出或无汗、乏力，重者高热、神志异常。核心病机为暑热内闭、气阴耗伤。", mainPoints:["GV26","LI11","PC9","GV14","SI3"], adjunctPoints:["ST36","PC6","CV12","LI4","EX-HN6","EX-HN9"], patternAdd:[{"pattern":"暑热闭窍","points":["GV26","PC9","LI11"]},{"pattern":"气阴两伤","points":["CV6","ST36","KI3"]},{"pattern":"暑湿困阻","points":["SP9","CV12","ST40"]}], cautions:"发现中暑必须立即拨打急救电话或送医，同时迅速将患者移至阴凉通风处、松解衣物并物理降温，针刺只是辅助措施。高热、无汗、意识障碍者提示病情危重，须由专业医疗人员处理，不得暗示针刺可替代急救与输液降温治疗。请以教材、国家标准和专业医师指导为准。", contraindications:"高热超高热、意识障碍、抽搐、休克或循环衰竭者不自行针刺，立即转诊；大汗淋漓、血压偏低者慎用强刺激手法；皮肤破损、感染处禁针。", courseHint:"", tags:["急症","暑证","辅助处理"], source:makeSource('B1') },
  { id:"dis-severe-heatstroke", name:"中暑重症", category:"急症", alias:["热射病","重症中暑","暑厥"], overview:"在高温高湿环境中出现高热、无汗或大汗、神志模糊甚至昏迷、抽搐、皮肤灼热为主症的危急病证，为暑热内闭、耗气伤阴、甚则动风蒙窍所致。", mainPoints:["GV14","LI11","LI4","PC6","EX-UE11","BL40"], adjunctPoints:["ST36","KI1","GV26","PC3","EX-HN5","EX-HN6"], patternAdd:[{"pattern":"暑热蒙心","points":["GV26","PC6","EX-UE11","EX-HN9"]},{"pattern":"气阴两伤","points":["ST36","KI6","CV6"]},{"pattern":"热盛动风","points":["LR3","GB34","GV14"]},{"pattern":"暑湿困阻","points":["ST40","CV12","SP9"]}], cautions:"属急危重症，须立即拨打 120，迅速将患者转移至阴凉通风处、去除衣物、持续物理降温并补充液体，针刺与放血仅为辅助退热醒神手段，不能替代降温、补液及器官支持治疗。意识不清者禁止喂水，防止误吸。耳尖、十宣放血须由专业医师在严格消毒下操作。请以教材、国家标准和专业医师指导为准。", contraindications:"循环衰竭、血压过低、明显脱水未纠正者慎用或禁刺放血；皮肤灼伤、破损、感染处禁针；凝血功能障碍或使用抗凝药物者禁刺血；孕妇禁针合谷及下腹部、腰骶部穴位；昏迷患者不宜强行针刺留针而不予监护。", courseHint:"", tags:["急症","清暑泄热","物理降温"], source:makeSource('B1') }

/* ===== 数据：针灸禁忌科普 ===== */

var CONTRA_ITEMS = [
  { id:"ci-g1-01", group:"绝对禁忌", title:"皮肤感染溃疡瘢痕处禁刺", level:"danger", summary:"针刺部位皮肤有感染、溃疡或瘢痕时，禁止在该处进针。", items:["疖肿、脓疱、湿疹渗液、真菌感染区域一律不针","溃疡面、烧伤创面、开放性伤口及其周边不针","手术瘢痕、增生性瘢痕、萎缩性瘢痕处不进针","同一部位皮肤未愈合前，不得在邻近点反复施针","辨认不清时先停止，请皮肤科或上级医师确认"], why:"破损皮肤已失去屏障作用，针孔会把体表细菌带入皮下甚至深部组织，局部血供差、修复慢，感染易扩散，瘢痕组织质地异常也易滞针、弯针。", instead:"改为在健康皮肤上选穴，避开病灶并留出安全距离；皮肤问题先由皮肤科处理，愈合后再评估针刺；若进针后局部红肿热痛加重，立即停止并就医。", tags:["皮肤","感染","进针部位"] },
  { id:"ci-g1-02", group:"绝对禁忌", title:"凝血障碍与抗凝用药禁刺", level:"danger", summary:"凝血功能严重障碍或正在抗凝治疗者，禁止针刺与放血。", items:["血友病、血小板显著减少者不施针、不刺络放血","服用华法林、利伐沙班等抗凝药期间禁止针刺","正在使用肝素者，禁止深刺与大面积拔罐放血","近期有自发出血、皮下大片瘀斑者禁止针刺","必须施治时先查凝血指标并由医师书面评估"], why:"凝血机制受损时针孔难以自行闭合，可持续渗血，形成皮下血肿、瘀斑，深部血肿还会压迫神经与血管，严重时造成失血。", instead:"优先改用不破皮的方法，如按揉、艾灸、耳穴贴压；确需针刺必须经专科评估凝血指标并停用抗凝药达安全窗口；出现持续出血时直接压迫止血并送医。", tags:["凝血","抗凝药","出血风险"] },
  { id:"ci-g1-03", group:"绝对禁忌", title:"恶性肿瘤局部禁针刺", level:"danger", summary:"肿瘤病灶及其局部区域，禁止针刺，也不得直接刺入肿块。", items:["禁止在肿瘤病灶表面及边缘进针","禁止把针刺直接刺入肿块内做探查或处理","禁止在病灶区域做刺络放血与强刺激手法","放疗、化疗后局部皮肤破损处同样禁止针刺","肿瘤相关症状须由肿瘤科统一评估后处理"], why:"病灶局部血供异常、组织脆性大，针刺易引起出血、坏死灶扩散与继发感染，也可能干扰规范治疗的疗效判断。", instead:"缓解恶心、乏力、疼痛等症状时，可在远离病灶处由有经验的医师选穴；治疗方案须由肿瘤科确定，针刺只作为辅助并全程记录，任何局部异常立即转诊。", tags:["肿瘤","局部禁刺","转诊"] },
  { id:"ci-g1-04", group:"绝对禁忌", title:"脏器穿孔急腹症禁针刺", level:"danger", summary:"疑似脏器穿孔或急腹症时，禁止针刺止痛，须立即急诊处理。", items:["突发剧烈腹痛、腹肌板硬者禁止针刺腹部","禁止用针刺缓解腹痛来掩盖病情变化","禁止对急腹症患者施行腹部深刺与电针","不明原因腹痛未确诊前，不得以针刺代观察","发现腹膜刺激征立即禁食禁水并转急诊"], why:"腹痛是判断病情的关键信号，针刺止痛会掩盖压痛与反跳痛，延误穿孔、腹膜炎、肠梗阻等急症的诊断，腹部深刺还可能加重已损伤的脏器。", instead:"立即停止操作，保持禁食禁水与平卧，监测血压脉搏，尽快拨打 120 或转急诊外科；针刺只能在外科明确排除急腹症后由医师决定是否使用。", tags:["急腹症","脏器穿孔","急救"] },
  { id:"ci-g1-05", group:"绝对禁忌", title:"醉酒与精神失常者禁针", level:"danger", summary:"醉酒或精神失常无法配合者，禁止针刺，避免弯针断针。", items:["醉酒后意识不清、步态不稳者禁止针刺","精神失常、躁动无法沟通者禁止针刺","此类情况不得留针，也不得使用电针","禁止用针刺处理醉酒，更禁止针后驾车","确需治疗须待意识清醒并能配合后再评估"], why:"患者无法准确反馈针感与不适，体位随时变动，易造成弯针、断针、滞针甚至刺伤内脏，针后晕针也难以及时发现与处理。", instead:"先让患者安静休息、侧卧防误吸，由家属陪护观察；出现意识障碍、呕吐不止或呼吸异常，立即拨打 120；待清醒配合、家属陪同并签署知情同意后再考虑施针。", tags:["醉酒","精神失常","配合度"] },
  { id:"ci-g2-01", group:"相对禁忌", title:"过度饥饿或疲劳时暂缓针刺", level:"warn", summary:"空腹或极度疲劳时针刺易诱发晕针，应先休息进食再操作。", items:["饥饿、熬夜、连续劳累时不宜立即针刺","先让受术者安静休息片刻再评估状态","可进食少量温热易消化食物或糖水","仍感乏力头晕时应改期，不勉强施针"], why:"饥饿与疲劳时血糖偏低、气血不足，机体对针刺刺激的调节能力下降，容易出现心慌、出汗、头晕等晕针反应。", instead:"先安排平卧休息并补充温热糖水，待精神与体力恢复后再针刺；取穴宜少、手法宜轻，若状态未改善则改约时间。", tags:["晕针预防","状态评估"] },
  { id:"ci-g2-02", group:"相对禁忌", title:"剧烈运动后不宜立即针刺", level:"warn", summary:"运动后气血未平、心率偏快，应休息至平静再行针刺。", items:["运动后先静坐或平卧休息十至二十分钟","待呼吸、心率平稳后再考虑针刺","汗湿衣物及时更换，避免当风受凉","针刺时取穴宜少、刺激量宜轻"], why:"剧烈运动后气血运行加速、腠理开张，此时针刺叠加刺激，可能加重心脏负担并诱发头晕、心慌等不适。", instead:"休息至呼吸心率恢复常态并擦干汗液后再操作；如仍有心悸、气短，暂不针刺并观察，必要时就医评估。", tags:["运动后","晕针预防"] },
  { id:"ci-g2-03", group:"相对禁忌", title:"大汗大渴时先补液再针刺", level:"warn", summary:"大汗或明显口渴提示津液不足，应先补充水分再评估施针。", items:["大汗、口渴明显时暂缓针刺操作","先少量多次饮用温开水补充津液","擦干汗液、注意保暖，避免直接吹风","待口渴缓解、汗出减少后再行针刺"], why:"大量出汗与明显口渴提示体液丢失、津液亏耗，此时针刺可能加重循环负担，也更容易出现头晕乏力等不适。", instead:"先补液并安静休息，观察口渴与出汗是否缓解；若伴明显乏力、心慌或持续大量出汗，应推迟针刺并及时就医查明原因。", tags:["津液亏耗","状态评估"] },
  { id:"ci-g2-04", group:"相对禁忌", title:"极度虚弱者慎针并减轻刺激", level:"warn", summary:"极度虚弱者耐受力差，宜卧位轻刺、少取穴并全程观察。", items:["极度虚弱者不宜采用强刺激手法","一律取卧位，避免坐位或站立施针","取穴宜少，留针期间密切观察反应","出现面色变化、冷汗时立即停止操作"], why:"极度虚弱者正气不足、对刺激的耐受性低，较强刺激或体位不当容易引起晕针，甚至加重原有虚弱状态。", instead:"先评估整体状况，采用卧位、少穴、轻刺激的方式短时操作；若虚弱明显或原因不明，建议先查明病因、调养身体或转诊，暂不勉强针刺。", tags:["体质虚弱","轻刺激"] },
  { id:"ci-g2-05", group:"相对禁忌", title:"严重心肺功能不全需先评估", level:"warn", summary:"严重心肺功能不全者针刺风险高，须经专业人员评估后进行。", items:["严重心肺功能不全者不自行施针","操作前须由专业医师评估能否针刺","选择舒适体位，避免俯卧压迫胸腹","现场备好应急物品并缩短操作时间"], why:"心肺功能严重受损者对体位改变与刺激的耐受差，针刺可能诱发心慌、气促或加重缺氧，存在较高风险。", instead:"先请专科医师评估病情与耐受能力，在其同意与指导下由有经验的医师操作，取穴少、手法轻、时间短；若出现胸闷、气促、心悸，立即停止操作并送医。", tags:["心肺疾病","风险评估"] },
  { id:"ci-g3-01", group:"部位禁忌", title:"胸背部腧穴不可深刺直刺", level:"danger", summary:"胸背肋骨间隙深刺可刺破胸膜与肺，引发气胸，属高风险操作。", items:["胸背部穴位应浅刺或沿皮斜刺、平刺，严禁垂直深刺","肋间隙进针控制在皮下及浅层肌肉，不追求强烈针感","留针时叮嘱受术者保持平静呼吸，避免大口吸气与剧烈咳嗽","针后出现胸闷、胸痛、憋气、干咳，立即停止操作并送医","肺气肿、桶状胸及极度消瘦者，胸背部操作更需收紧深度"], why:"胸壁与肺之间只隔一层薄胸膜，肋骨间隙进针过深会穿透胸膜伤及肺组织，气体进入胸腔即形成气胸，可在短时间内出现呼吸困难。", instead:"改用远端取穴或背部膀胱经浅刺、拔罐、艾灸等替代方式；一旦怀疑气胸，先停止操作、让受术者半卧位安静休息并给氧，必要时拨打 120 送医并说明进针部位与深度。", tags:["胸背","气胸","进针深度"] },
  { id:"ci-g3-02", group:"部位禁忌", title:"颈项后颈区严禁深刺乱刺", level:"danger", summary:"颈项与后颈部深刺可伤椎动脉、延髓，风险极高，禁止盲目操作。", items:["颈项部与枕后区域禁止深刺、反复提插和大幅度捻转","进针方向避开中线与枕骨大孔方向，只做浅层斜刺或平刺","不做快速旋转手法，不长时间留针于颈部深层","受术者出现眩晕、视物旋转、恶心、言语含糊，立即停止操作","有颈椎畸形、骨质增生或外伤史者，颈部操作需先评估"], why:"颈项深层紧邻椎动脉与延髓生命中枢，进针过深或方向偏差可造成血管损伤、血肿压迫甚至脑干损伤，后果严重且难以逆转。", instead:"优先选择远端穴位、颈肩部肌肉浅刺、温和艾灸或推拿松解；出现眩晕或意识改变时先停止操作、平卧并保持呼吸道通畅，必要时拨打 120 送医。", tags:["颈项","椎动脉","延髓"] },
  { id:"ci-g3-03", group:"部位禁忌", title:"眼区与眶周只可浅刺轻刺", level:"danger", summary:"眼球、眶内与后颈深层均不宜深刺，损伤可致血肿、复视甚至失明。", items:["眼部周围不做深刺与大幅度提插，只宜浅刺或沿皮轻刺","眶内与眼球附近禁止反复捣刺，不使用电针强刺激","出针后按压局部片刻，观察有无肿胀、瘀血与复视","出现眼痛、视物重影、眼球突出，立即停止操作并转诊眼科","高度近视、青光眼、眼部术后及出血倾向者，眼区不予操作"], why:"眶内血管丰富、眼球壁与视神经结构脆弱，针尖误入眶内可造成球后出血、血肿压迫，严重时影响视力；后颈深层同属危险区，故一并从严。", instead:"眼周仅做轻柔点按或改用远端取穴、耳穴压豆等替代方法；一旦出现眶内血肿或视力异常，先停止操作、局部冷敷制动，立即送眼科急诊处理。", tags:["眼区","眶周","血肿"] },
  { id:"ci-g3-04", group:"部位禁忌", title:"孕妇下腹与腰骶部禁刺", level:"danger", summary:"孕期下腹部与腰骶部禁止针刺，强刺激可诱发宫缩与流产早产。", items:["孕妇下腹部、腰骶部及合谷、三阴交等穴禁止针刺","上述部位也不宜艾灸、拔罐、电针与强刺激推拿","孕期就诊须主动告知孕周与既往流产、早产史","有先兆流产表现者，停止一切腹部与腰骶部操作","若操作后出现腹痛、腰酸、阴道流血，立即送医产科"], why:"下腹与腰骶部分布着与子宫、盆腔相连的神经与血流联系，强刺激可通过反射引起子宫收缩，增加流产、早产与胎盘异常的风险。", instead:"孕期不适以休息、体位调整和产科评估为主，确需针灸时由有产科经验的医师选取上肢等远端安全穴位；出现宫缩或出血，先停止操作、左侧卧位休息并立即送产科。", tags:["孕妇","腰骶","下腹"] },
  { id:"ci-g3-05", group:"部位禁忌", title:"婴幼儿囟门与大血管神经干区慎刺", level:"warn", summary:"囟门未闭区及大血管、神经干走行处不宜深刺，操作须格外轻浅。", items:["囟门未闭合的婴幼儿，头部中线区域禁止针刺与按压","颈侧、腋窝、腹股沟、腘窝等大血管处避开搏动点进针","神经干走行部位忌用强电针与大幅度提插，以免麻痛放电","进针以浅、快、轻为原则，不留针或缩短留针时间","操作中哭闹剧烈、肢体抽动或面色改变，立即停止操作"], why:"婴幼儿颅骨与囟门尚未闭合，深刺易伤及颅内组织；大血管处进针可致出血、血肿，神经干受强刺激或直接损伤则引起放射性麻痛与功能障碍。", instead:"婴幼儿优先采用小儿推拿、穴位贴敷等非侵入方式，针刺须由儿科针灸经验的医师操作；出现局部血肿或肢体麻木无力，先停止操作、压迫止血并制动，及时送医评估。", tags:["婴幼儿","囟门","血管神经"] },
  { id:"ci-g4-01", group:"人群禁忌", title:"孕妇禁刺下腹腰骶与催产穴", level:"danger", summary:"孕期禁止针刺下腹部、腰骶部及合谷、三阴交等敏感穴。", items:["下腹部、腰骶部、骶尾部的穴位禁止针刺","合谷、三阴交、至阴等穴禁止针刺","确需治疗时避开上述区域，术者手法要轻","取穴宜少，留针宜短，专人陪同，避免刺激过强","就诊时必须主动说明怀孕周数及既往孕产史"], why:"下腹与腰骶穴位靠近子宫，合谷、三阴交等穴对子宫有较强兴奋作用，强刺激可能诱发子宫收缩，增加腹痛、出血甚至流产或早产的风险。", instead:"暂停腹部与腰骶针灸，改用头部、上肢远端及耳穴等相对安全部位，或采用轻柔推拿、饮食起居与情志调理；孕期是否针灸由产科与针灸科医师共同评估，不得自行操作。", tags:["孕妇","禁刺穴","流产风险"] },
  { id:"ci-g4-02", group:"人群禁忌", title:"婴幼儿囟门禁刺并浅刺少针", level:"danger", summary:"前囟未闭者禁止针刺囟门，婴幼儿须浅刺、少针、快出针。", items:["未闭合的囟门及颅缝处禁止进针","头颈部穴位慎用，深度须严格限制","只取少量穴位，用细针浅刺，快速出针","治疗时家长固定患儿体位，防止活动造成弯针","哭闹挣扎剧烈时先安抚，再行操作"], why:"婴幼儿囟门未闭，下方仅隔皮肤与脑膜即为脑组织，直刺可能造成颅内损伤或出血；小儿形体未充、耐受力差，刺激过强易致惊厥或晕针。", instead:"优先采用小儿推拿、捏脊、穴位贴敷等无创方法；确需针刺者由有儿科针灸经验的医师施行，取穴少、手法轻、留针短，全程由家长陪护并密切观察面色与反应。", tags:["婴幼儿","囟门","浅刺"] },
  { id:"ci-g4-03", group:"人群禁忌", title:"高龄体弱者宜卧位轻刺激", level:"warn", summary:"高龄与体弱者耐受差，应取卧位、手法轻、留针短。", items:["一律取卧位施针，不宜站立或坐位留针","手法宜轻，禁用强捻转提插与大幅刺激","取穴宜精少，留针时间适当缩短","针刺前先评估心肺功能、进食与疲劳状态","操作中随时询问感受，出现不适立即停止"], why:"高龄及久病体弱者的心血管调节与应激能力下降，饥饿、疲劳或体位改变时容易发生晕针，表现为头晕、心悸、出冷汗甚至血压下降、跌倒。", instead:"先安神进食、休息片刻再施针，采用轻柔手法并缩短留针时间，全程有人陪护；有严重心脑血管疾病或极度虚弱者先请相关科室评估，暂缓针刺或改用温和的推拿与艾灸。", tags:["高龄","体弱","晕针预防"] },
  { id:"ci-g4-04", group:"人群禁忌", title:"出血抗凝与起搏器者禁电针", level:"danger", summary:"凝血障碍、抗凝用药及装起搏器者，禁止针刺与电针。", items:["血友病、血小板明显减少者禁止针刺","长期服用抗凝或抗血小板药物者禁止盲目针刺","装有心脏起搏器者严禁电针，电流不得通过胸部","经医师评估准予针刺时，取穴少、进针浅、手法轻","出针后充分按压，留意瘀斑、肿胀与持续疼痛"], why:"此类人群凝血机制受损、出血时间延长，细针穿刺也可能持续渗血或形成血肿压迫神经血管；电针电流可干扰起搏器工作，严重时影响心脏正常节律。", instead:"先复查凝血指标并咨询专科医师，改用按揉、艾灸、耳穴压丸等无创方式；起搏器人群只做轻柔手针并全程心电监护，出现血肿立即冷敷压迫并就医，出现心悸、头晕立即停止并拨打 120。", tags:["出血倾向","抗凝药","起搏器"] },
  { id:"ci-g5-01", group:"异常处理", title:"晕针的识别与处理", level:"danger", summary:"针刺中突然头晕心慌、面色苍白出汗，多为晕针，须立即停针急救。", items:["立即停止针刺并全部起针，扶患者平卧、注意保暖","轻者取头低脚高位，解开衣带，喂温开水或糖水","重者掐按或针刺人中、内关、足三里等急救穴位","若神志不清、呼吸微弱、血压下降，立即拨打120","未完全恢复前不得继续留针或再次进针"], why:"多因患者紧张、空腹、疲劳、体弱或刺激过强，引起脑部供血不足和植物神经反应，严重时可危及生命。", instead:"以预防为主：初次接受针刺者取卧位、取穴宜少、手法宜轻，进针前先问进食与紧张情况；出现头晕心慌等先兆即刻停针处理，缓解后当日不再针刺，症状重或不缓解时立即送医，必要时拨打120。", tags:["晕针","急救"] },
  { id:"ci-g5-02", group:"异常处理", title:"滞针的识别与处理", level:"warn", summary:"针下涩滞、捻转提插困难且患者诉痛，多为滞针，应停止强行操作。", items:["立即停止捻转提插，不可强行拔针或用力硬拽","安抚患者放松，可在滞针穴位附近再刺一针缓解痉挛","单向捻转所致者反向捻回，体位变动者先恢复原体位","配合局部按摩或温敷，待肌肉松弛后缓慢起针","若仍不能起针或疼痛剧烈，立即送医，必要时拨打120"], why:"常见于患者紧张致肌肉痉挛、单向捻转使肌纤维缠住针身，或留针期间体位改变、留针过久。", instead:"起针受阻时先安抚放松，再按反向捻转、恢复体位、按摩温敷的顺序处理；长时间无法起针或疼痛剧烈者不要反复强拉，交由有经验的医师处理或及时转诊。", tags:["滞针","起针困难"] },
  { id:"ci-g5-03", group:"异常处理", title:"弯针的识别与处理", level:"warn", summary:"针身弯曲、提插捻转受阻或针柄歪斜，即为弯针，须停手顺势起针。", items:["立即停止一切手法操作，不可强拔、猛抽或旋转","弯曲较轻者，顺着针身弯曲的方向缓慢退出","弯曲较重者，先恢复原来体位，再分段顺势起针","多处弯曲或退针困难时，不可硬拔，请有经验医师处理","若针身折断留于体内，固定局部、立即拨打120送医"], why:"多因进针用力过猛、患者留针期间变动体位或局部肌肉强烈收缩，使针身在体内折弯。", instead:"预防为主：进针前摆好并固定体位，留针期间嘱患者不要移动；起针遇阻先检查体位与针身，顺势退出，反复尝试无效时停止操作并转诊。", tags:["弯针","体位"] },
  { id:"ci-g5-04", group:"异常处理", title:"断针的识别与处理", level:"danger", summary:"针身折断、针柄与针体分离，属危急情况，须立即停针并送医。", items:["立即停止针刺与一切手法，安抚患者不要乱动","嘱患者保持原有体位，切勿屈伸、挤压局部","断端露出皮肤者，用镊子夹住断端顺针身方向取出","断端陷入皮下者，轻压针孔周围使其露出后再取","无法取出或断端游走时，立即拨打120，不可自行切开"], why:"多因针具质量差、反复使用致针身锈蚀折损，或进针用力过猛、患者体位突然变动、肌肉痉挛所致，断针可随活动深入体内伤及组织。", instead:"预防最关键：用针前逐支检查针身有无弯折、锈蚀，剔除残次针具；一旦断针，先停手、固定体位，按上述步骤处理，取出困难时立即拨打120送医，途中保持体位不动。", tags:["断针","急救","针具检查"] },
  { id:"ci-g5-05", group:"异常处理", title:"血肿与气胸的识别与处理", level:"danger", summary:"起针后局部青紫肿痛为血肿，若突发胸痛气促须警惕气胸，立即停针。", items:["立即停止操作并起针，安抚患者保持安静","血肿：先冷敷或轻压止血，24小时后再热敷助吸收","气胸征象：胸痛、呼吸困难、面色发绀、患侧呼吸音弱","疑为气胸：取半卧位、吸氧并立即拨打120急送医院","不可自行穿刺排气，也不要按摩、拍打胸背部"], why:"针具伤及血管可致局部血肿；在胸背部、锁骨上窝等部位进针过深刺破胸膜和肺组织，空气进入胸膜腔即形成气胸，严重时可危及生命。", instead:"小血肿多可自行吸收，勿揉搓，24小时后可温敷；这些部位进针宜浅刺、斜刺或平刺，留针时嘱患者勿深呼吸与咳嗽；一旦出现气胸征象，先停针、半卧位吸氧、立即拨打120，由医院专业处理。", tags:["血肿","气胸","急救"] }
];

var CONTRA_GROUPS = ["绝对禁忌","相对禁忌","部位禁忌","人群禁忌","异常处理"];
function contraOf(group){
  if (!group) return CONTRA_ITEMS;
  return CONTRA_ITEMS.filter(function(x){ return x.group === group; });
}
function getContra(id){
  for (var i = 0; i < CONTRA_ITEMS.length; i++) if (CONTRA_ITEMS[i].id === id) return CONTRA_ITEMS[i];
  return null;
}
var CONTRA_LEVEL = {
  danger:{ label:'禁止', cls:'err' },
  warn:{ label:'谨慎', cls:'warn' },
  info:{ label:'提示', cls:'' }
};

/* ===== 数据：题目 ===== */

  { id:"q-0019", type:"multi", stem:"属于足太阴脾经的络穴与郄穴分别是", options:["地机","丰隆","外关","公孙"], answer:["B","C"], explanation:"公孙为足太阴脾经络穴，地机为脾经郄穴；丰隆为胃经络穴，外关为三焦经络穴。", tags:["特定穴","足太阴脾经"], difficulty:2, source:makeSource('D1') },

  { id:"q-0031", type:"single", stem:"手太阴肺经的井穴是", options:["少商","商阳","少冲","中冲"], answer:"A", explanation:"手太阴肺经起于中府、止于少商，少商位于拇指末节桡侧，指甲根角侧上方0.1寸，为肺经井穴。商阳属手阳明大肠经。", tags:["手太阴肺经","特定穴","定位"], difficulty:1, source:makeSource('D1') },

  { id:"q-0035", type:"single", stem:"八脉交会穴中，通于带脉的是", options:["申脉","公孙","足临泣","外关"], answer:"A", explanation:"八脉交会穴中足临泣通带脉，外关通阳维脉，申脉通阳跷脉，公孙通冲脉，四者主治范围各不相同。", tags:["足少阳胆经","特定穴","配穴"], difficulty:2, source:makeSource('D1') },
  { id:"q-0036", type:"single", stem:"足少阴肾经的原穴是", options:["涌泉","然谷","太溪","复溜"], answer:"C", explanation:"足少阴肾经原穴为太溪，位于内踝尖与跟腱之间的凹陷中；涌泉为井穴，然谷为荥穴，复溜为经穴。", tags:["足少阴肾经","特定穴","定位"], difficulty:1, source:makeSource('D1') },
