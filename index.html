  { id:"q-0039", type:"single", stem:"手太阴肺经的郄穴是", options:["经渠","尺泽","孔最","列缺"], answer:"A", explanation:"手太阴肺经的郄穴为孔最，位于腕掌侧远端横纹上7寸，主治本经急性病证，尤善治咯血。", tags:["手太阴肺经","特定穴","主治"], difficulty:1, source:makeSource('D1') },
  { id:"q-0040", type:"single", stem:"阴维脉的郄穴是", options:["筑宾","跗阳","交信","阳交"], answer:"C", explanation:"阴维脉的郄穴为筑宾，阳维脉的郄穴为阳交，阳跷脉的郄穴为跗阳，三者不可混淆。", tags:["足少阴肾经","特定穴","归经"], difficulty:3, source:makeSource('D1') },
  { id:"q-0041", type:"single", stem:"胃的募穴是", options:["天枢","中脘","章门","关元"], answer:"B", explanation:"胃的募穴为中脘，位于脐上4寸；天枢为大肠募穴，章门为脾募穴，关元为小肠募穴。", tags:["任脉","特定穴","定位"], difficulty:1, source:makeSource('D1') },
  { id:"q-0042", type:"single", stem:"心的背俞穴是", options:["巨阙","心俞","厥阴俞","膻中"], answer:"D", explanation:"心的背俞穴为心俞，位于第5胸椎棘突下旁开1.5寸；厥阴俞为心包背俞穴，膻中、巨阙均为募穴。", tags:["足太阳膀胱经","特定穴","定位"], difficulty:2, source:makeSource('D1') },
  { id:"q-0043", type:"single", stem:"八会穴中，脏会是", options:["膈俞","中脘","章门","膻中"], answer:"A", explanation:"八会穴中脏会章门、腑会中脘、气会膻中、血会膈俞，四者不可互混。", tags:["足厥阴肝经","特定穴","主治"], difficulty:2, source:makeSource('D1') },
  { id:"q-0044", type:"single", stem:"八会穴中，脉会是", options:["大杼","绝骨","太渊","阳陵泉"], answer:"C", explanation:"八会穴中脉会太渊，因太渊为脉之大会；大杼为骨会，绝骨为髓会，阳陵泉为筋会。", tags:["手太阴肺经","特定穴","主治"], difficulty:2, source:makeSource('D1') },
  { id:"q-0045", type:"single", stem:"三焦的下合穴是", options:["下巨虚","委阳","委中","上巨虚"], answer:"B", explanation:"三焦的下合穴为委阳，位于腘横纹上，股二头肌腱的内侧缘；委中为膀胱下合穴，上、下巨虚分别为大肠、小肠下合穴。", tags:["足太阳膀胱经","特定穴","定位"], difficulty:3, source:makeSource('D1') },
  { id:"q-0046", type:"multi", stem:"下列腧穴中，属于原穴的有", options:["太溪","郄门","太冲","神门"], answer:["A","B","C"], explanation:"神门为心经原穴，太溪为肾经原穴，太冲为肝经原穴；郄门为心包经郄穴，不属于原穴。", tags:["特定穴","归经","手少阴心经"], difficulty:2, source:makeSource('D1') },
  { id:"q-0047", type:"multi", stem:"下列腧穴中，属于郄穴的有", options:["外丘","飞扬","孔最","梁丘"], answer:["C","D"], explanation:"十六郄穴中，孔最为肺经郄穴，梁丘为胃经郄穴；外丘虽为胆经郄穴而同名易混的阳交属阳维脉，飞扬为膀胱经络穴。", tags:["特定穴","足阳明胃经","手太阴肺经"], difficulty:3, source:makeSource('D1') },
  { id:"q-0048", type:"multi", stem:"下列腧穴中，属于背俞穴的有", options:["胆俞","膀胱俞","中脘","大肠俞","天枢"], answer:["A","C","E"], explanation:"大肠俞、胆俞、膀胱俞均位于足太阳膀胱经背腰部，为相应脏腑的背俞穴；天枢、中脘分别为大肠、胃的募穴。", tags:["足太阳膀胱经","特定穴","定位"], difficulty:2, source:makeSource('D1') },
  { id:"q-0049", type:"multi", stem:"下列腧穴中，属于八会穴的有", options:["悬钟","大杼","外关","阳陵泉"], answer:["B","C","D"], explanation:"阳陵泉为筋会，悬钟（绝骨）为髓会，大杼为骨会；外关为八脉交会穴，通阳维脉，不属于八会穴。", tags:["特定穴","足少阳胆经","足太阳膀胱经"], difficulty:2, source:makeSource('D1') },
  { id:"q-0050", type:"multi", stem:"下列八脉交会穴与其所通奇经的配对中，正确的有", options:["列缺通阴跷脉","申脉通阳跷脉","后溪通督脉","公孙通冲脉"], answer:["B","C","D"], explanation:"后溪通督脉、公孙通冲脉、申脉通阳跷脉均正确；列缺通任脉而非阴跷脉，阴跷脉与照海相通。", tags:["特定穴","配穴","经络循行"], difficulty:2, source:makeSource('D1') },
  { id:"q-0051", type:"multi", stem:"下列腧穴中，属于下合穴的有", options:["阴陵泉","足三里","上巨虚","阳陵泉"], answer:["A","B","D"], explanation:"足三里为胃下合穴，上巨虚为大肠下合穴，阳陵泉为胆下合穴；阴陵泉为脾经合穴，不属于六腑下合穴。", tags:["特定穴","足阳明胃经","足少阳胆经"], difficulty:2, source:makeSource('D1') },
  { id:"q-0052", type:"judge", stem:"阴经的输穴与本经的原穴常为同一腧穴。", options:["正确","错误"], answer:"T", explanation:"阴经以输为原，如太渊、太白、太溪、太冲等既是本经输穴，又是本经原穴；阳经则另有单独的原穴。", tags:["特定穴","归经"], difficulty:2, source:makeSource('D1') },
  { id:"q-0053", type:"judge", stem:"手阳明大肠经的络穴是偏历。", options:["正确","错误"], answer:"T", explanation:"手阳明大肠经的络穴为偏历，位于腕背侧远端横纹上3寸，别走手太阴肺经。", tags:["手阳明大肠经","特定穴","定位"], difficulty:1, source:makeSource('D1') },
  { id:"q-0054", type:"judge", stem:"足阳明胃经的合穴是上巨虚。", options:["正确","错误"], answer:"F", explanation:"足阳明胃经的合穴为足三里；上巨虚虽属胃经，但是大肠的下合穴，二者不应混淆。", tags:["足阳明胃经","特定穴","归经"], difficulty:2, source:makeSource('D1') },
  { id:"q-0055", type:"judge", stem:"大包为脾之大络，公孙为脾经络穴，二者均属脾的络脉范畴。", options:["正确","错误"], answer:"T", explanation:"十五络脉中，足太阴脾经的络穴为公孙，另设脾之大络大包，故脾经相关的络穴有两个，主治侧重不同。", tags:["足太阴脾经","特定穴","主治"], difficulty:3, source:makeSource('D1') },
  { id:"q-0056", type:"judge", stem:"胆的募穴是章门。", options:["正确","错误"], answer:"F", explanation:"胆的募穴为日月，位于第7肋间隙，前正中线旁开4寸；章门为脾的募穴，同时又是八会穴中的脏会。", tags:["足少阳胆经","特定穴","定位"], difficulty:2, source:makeSource('D1') },
  { id:"q-0057", type:"blank", stem:"足太阳膀胱经的{{1}}穴为京骨，足少阴肾经的{{2}}穴为太溪。", options:[], answer:[["原","原穴"],["原","原穴"]], explanation:"京骨为足太阳膀胱经原穴，太溪为足少阴肾经原穴；原穴是脏腑原气留止之处，多用于脏腑病证。", tags:["特定穴","足太阳膀胱经","足少阴肾经"], difficulty:1, source:makeSource('D1') },
  { id:"q-0058", type:"blank", stem:"十二经的募穴均位于{{1}}部，而背俞穴均位于{{2}}部。", options:[], answer:[["胸腹","胸腹部"],["背腰","背腰部"]], explanation:"募穴是脏腑之气汇聚于胸腹部的腧穴，背俞穴是脏腑之气输注于背腰部的腧穴，二者常配合使用，即俞募配穴法。", tags:["特定穴","定位","配穴"], difficulty:2, source:makeSource('D1') },
  { id:"q-0059", type:"match", stem:"为左列腧穴选配所通奇经：公孙、列缺、后溪、足临泣、内关、外关、照海、申脉。", options:["冲脉","任脉","督脉","带脉","阴维","阳维","阴跷","阳跷"], answer:[0,1,2,3,4,5,6,7], explanation:"八脉交会穴的相通关系为：公孙通冲脉、内关通阴维脉、列缺通任脉、照海通阴跷脉、后溪通督脉、申脉通阳跷脉、外关通阳维脉、足临泣通带脉。", tags:["特定穴","经络循行","配穴"], difficulty:3, source:makeSource('D1') },
  { id:"q-0060", type:"match", stem:"为左列特定穴选配右列腧穴：肺经井穴、肺经原穴、肺经络穴、肺经郄穴、胃经合穴、胃经络穴、胃募穴兼腑会、筋会兼胆下合穴。", options:["足三里","丰隆","中脘","阳陵泉","列缺","太渊","孔最","少商","太溪"], answer:[7,5,4,6,0,1,2,3], explanation:"少商、太渊、列缺、孔最分别为手太阴肺经的井穴、原穴、络穴、郄穴；足三里为胃经合穴兼胃下合穴，丰隆为胃经络穴，中脘为胃募穴兼腑会，阳陵泉为筋会兼胆下合穴。", tags:["特定穴","手太阴肺经","足阳明胃经"], difficulty:2, source:makeSource('D1') },
  { id:"q-0061", type:"single", stem:"合谷穴的标准定位是", options:["在手背，第1、2掌骨间，第2掌骨桡侧的中点处","在手背，第2、3掌骨间，第2掌骨尺侧的中点处","在腕背侧远端横纹上，拇长伸肌腱与拇短伸肌腱之间","在手背，第1、2掌骨底结合部前方的凹陷中"], answer:"A", explanation:"合谷为手阳明大肠经原穴，位于手背第1、2掌骨间、第2掌骨桡侧的中点处，与第1、2掌骨底前方的太冲相区别。", tags:["手阳明大肠经","定位","特定穴"], difficulty:1, source:makeSource('D1') },
  { id:"q-0062", type:"single", stem:"足三里定位时所用的“一横指”是指", options:["患者食指、中指并拢的宽度","医者拇指指间关节的宽度","患者小指近端指间关节的宽度","患者拇指指间关节的宽度"], answer:"C", explanation:"足三里在犊鼻下3寸、胫骨前嵴外一横指处，此处“一横指”为食指与中指并拢的宽度，属指寸定位法（中指同身寸、一夫法）的应用。", tags:["足阳明胃经","定位","定位方法"], difficulty:1, source:makeSource('D1') },
  { id:"q-0063", type:"single", stem:"三阴交穴位于", options:["内踝尖上2寸，胫骨内侧缘前缘","内踝尖上4寸，胫骨内侧髁下缘凹陷中","外踝尖上3寸，腓骨前缘处","内踝尖上3寸，胫骨内侧缘后际"], answer:"B", explanation:"三阴交为足太阴脾经穴，在内踝尖上3寸、胫骨内侧缘后际；D为阴陵泉，A为悬钟（绝骨）。", tags:["足太阴脾经","定位","交会穴"], difficulty:1, source:makeSource('D1') },
  { id:"q-0064", type:"single", stem:"内关穴的定位是腕掌侧远端横纹上2寸，位于", options:["指伸肌腱的尺侧缘","掌长肌腱与桡侧腕屈肌腱之间","尺侧腕屈肌腱的桡侧缘","桡侧腕屈肌腱的桡侧缘"], answer:"D", explanation:"内关为手厥阴心包经络穴、八脉交会穴，在腕掌侧远端横纹上2寸、掌长肌腱与桡侧腕屈肌腱（两筋）之间。", tags:["手厥阴心包经","定位","特定穴"], difficulty:1, source:makeSource('D1') },
  { id:"q-0065", type:"single", stem:"下列各穴中，一般列为孕妇禁针的是", options:["合谷","手三里","曲池","外关"], answer:"A", explanation:"合谷为手阳明大肠经原穴，孕妇禁针以防引起子宫收缩；手三里、曲池、外关一般不列为孕妇禁针穴。", tags:["手阳明大肠经","禁忌","定位"], difficulty:2, source:makeSource('D1') },
  { id:"q-0066", type:"single", stem:"太冲穴所属的经脉是", options:["足阳明胃经","足少阳胆经","足厥阴肝经","足少阴肾经"], answer:"C", explanation:"太冲在足背第1、2跖骨间、跖骨底结合部前方凹陷中，为足厥阴肝经的输穴与原穴。", tags:["足厥阴肝经","归经","定位"], difficulty:1, source:makeSource('D1') },
  { id:"q-0067", type:"single", stem:"风池穴位于", options:["第7颈椎棘突下凹陷中，后正中线上","第7颈椎棘突与肩峰最外侧点连线的中点","耳尖直上，入发际1.5寸处","枕骨之下，胸锁乳突肌上端与斜方肌上端之间的凹陷中"], answer:"B", explanation:"风池属足少阳胆经，在枕骨之下、胸锁乳突肌上端与斜方肌上端之间凹陷中；C为大椎，D为肩井。", tags:["足少阳胆经","定位","定位方法"], difficulty:1, source:makeSource('D1') },
  { id:"q-0068", type:"single", stem:"百会穴的简便取穴方法是", options:["两瞳孔连线与头部正中线的交点","后发际正中直上5寸","两眉头连线的中点","两耳尖连线与头部正中线的交点"], answer:"D", explanation:"百会在头部前发际正中直上5寸，简便取穴为两耳尖连线与头部正中线的交点处。", tags:["督脉","定位","定位方法"], difficulty:1, source:makeSource('D1') },
  { id:"q-0069", type:"single", stem:"关元穴的定位是前正中线上", options:["脐中下3寸","脐中下4寸","脐中上4寸","脐中下1.5寸"], answer:"A", explanation:"关元为任脉穴、小肠募穴，在脐中下3寸、前正中线上；脐下1.5寸为气海，脐上4寸为中脘。", tags:["任脉","定位","特定穴"], difficulty:1, source:makeSource('D1') },
  { id:"q-0070", type:"single", stem:"风池、肩井、阳陵泉、环跳四穴同属的经脉是", options:["足少阳胆经","足太阳膀胱经","手少阳三焦经","足阳明胃经"], answer:"C", explanation:"风池、肩井、阳陵泉、环跳均为足少阳胆经腧穴，故同属胆经。", tags:["足少阳胆经","定位","归经"], difficulty:2, source:makeSource('D1') },
  { id:"q-0071", type:"single", stem:"下列八脉交会穴中，通阴维脉的是", options:["外关","后溪","列缺","内关"], answer:"B", explanation:"内关为手厥阴心包经络穴，八脉交会穴中通阴维脉，主治胃、心、胸病症；外关通阳维脉，后溪通督脉，列缺通任脉。", tags:["手厥阴心包经","特定穴","定位"], difficulty:2, source:makeSource('D1') },
  { id:"q-0072", type:"single", stem:"用“一夫法”定取足三里时，3寸应如何量取", options:["患者四指并拢后再加一横指","食、中、无名指、小指并拢的宽度","食、中二指并拢的宽度","拇指指间关节的宽度"], answer:"D", explanation:"一夫法为食、中、无名指、小指四指并拢的宽度，即3寸，故犊鼻下3寸可用一夫法量取，再加胫骨前嵴外一横指定位。", tags:["足阳明胃经","定位方法","定位"], difficulty:2, source:makeSource('D1') },
  { id:"q-0073", type:"single", stem:"太溪穴的定位是", options:["内踝尖与跟腱之间的凹陷中","内踝尖下1寸凹陷中","外踝尖与跟腱之间的凹陷中","内踝尖上3寸，胫骨内侧缘后际"], answer:"A", explanation:"太溪为足少阴肾经输穴、原穴，在内踝尖与跟腱之间的凹陷中；内踝尖下1寸凹陷为照海。", tags:["足少阴肾经","定位","特定穴"], difficulty:1, source:makeSource('D1') },
  { id:"q-0074", type:"single", stem:"后溪穴属于五输穴中的", options:["井穴","荥穴","输穴","合穴"], answer:"C", explanation:"后溪为手太阳小肠经输穴，又为八脉交会穴通督脉，位于第5掌指关节后方赤白肉际凹陷中。", tags:["手太阳小肠经","特定穴","定位"], difficulty:2, source:makeSource('D1') },
  { id:"q-0075", type:"single", stem:"环跳穴的定位常采用", options:["侧卧伸腿，股骨大转子最凸点与髂前上棘连线的中点","俯卧，第4腰椎棘突下旁开1.5寸","正坐，第7颈椎棘突与肩峰连线的中点","侧卧屈髋屈膝，股骨大转子最凸点与骶管裂孔连线的外1/3与内2/3交点"], answer:"B", explanation:"环跳在臀部，侧卧屈髋屈膝取穴，位于股骨大转子最凸点与骶管裂孔连线的外1/3与内2/3交点处。", tags:["足少阳胆经","定位","定位方法"], difficulty:2, source:makeSource('D1') },
  { id:"q-0076", type:"multi", stem:"与内关穴定位与操作有关的正确说法有", options:["针刺宜尽量深刺以追求强烈麻电感","位于腕掌侧远端横纹上2寸，掌长肌腱与桡侧腕屈肌腱之间","位于腕背侧远端横纹上2寸，尺骨与桡骨间隙中点","为手厥阴心包经络穴，又为八脉交会穴通阴维脉","针刺时若出现向中指放散的触电样麻感，应立即退针调整"], answer:["B","C","E"], explanation:"B所述为外关穴位置，E违背内关穴下有正中神经、忌深刺强刺激的安全要求，故均错误；A、C、D正确。", tags:["手厥阴心包经","定位","刺灸法"], difficulty:2, source:makeSource('D1') },
  { id:"q-0077", type:"multi", stem:"关于三阴交穴，下列叙述正确的有", options:["为足太阴、少阴、厥阴三经交会之处","孕妇禁针禁灸，以免引起子宫收缩","位于外踝尖上3寸，腓骨前缘处","进针宜尽量深刺，以针感放散至足底为佳","位于内踝尖上3寸，胫骨内侧缘后际"], answer:["B","C","D"], explanation:"三阴交在内踝尖上3寸、胫骨内侧缘后际，D所述为悬钟（绝骨）之位；E违背其不可向后深刺、以免伤及胫后血管神经的操作要求；A、B、C正确。", tags:["足太阴脾经","禁忌","定位"], difficulty:2, source:makeSource('D1') },
  { id:"q-0078", type:"multi", stem:"关于关元穴，下列叙述正确的有", options:["孕妇禁用针刺与重灸","为培元固本要穴，常用艾条温和灸或隔姜灸","本穴只针不灸，属禁灸之穴","位于脐中下4寸，前正中线上","为小肠募穴，又为任脉与足三阴经交会穴"], answer:["A","D","E"], explanation:"关元在脐中下3寸（脐下4寸为中极），故A错误；关元为培元要穴，常用灸法，E称禁灸亦错误；B、C、D正确。", tags:["任脉","定位","禁忌"], difficulty:3, source:makeSource('D1') },
  { id:"q-0079", type:"multi", stem:"针刺风池穴时，符合安全要求的做法有", options:["小儿囟门未闭者不宜针刺","得气后以小幅捻转为主，使酸胀感向头项或眼部放散","针尖微向下，朝鼻尖方向缓慢斜刺0.8～1.2寸","向内侧、内上方深刺以增强针感","严格掌握进针方向与深度，不宜大幅反复提插"], answer:["A","B","D"], explanation:"风池深部邻近椎动脉与延髓，严禁向内、向内上方深刺，故B错误；A、C、D均符合其安全操作要求。", tags:["足少阳胆经","刺灸法","禁忌"], difficulty:2, source:makeSource('D1') },
  { id:"q-0080", type:"multi", stem:"关于合谷穴，下列叙述正确的有", options:["在手背，第1、2掌骨间，第2掌骨桡侧的中点处","为手阳明大肠经原穴","为手太阴肺经络穴","四总穴歌称“面口合谷收”，善治头面五官病症","孕妇禁针，尤其禁用强刺激"], answer:["B","C","E"], explanation:"列缺才是手太阴肺经络穴，故B错误；A、C、D分别正确表述了合谷的特定穴属性、主治特点与孕妇禁忌。", tags:["手阳明大肠经","定位","特定穴"], difficulty:1, source:makeSource('D1') },
  { id:"q-0081", type:"multi", stem:"关于肩井穴，下列叙述正确的有", options:["属足少阳胆经","孕妇禁用针刺与强刺激","深部为胸膜顶与肺尖，操作须防止造成气胸","常规直刺1.5～2寸以增强通乳之效","位于第7颈椎棘突与肩峰最外侧点连线的中点"], answer:["B","C","D"], explanation:"肩井穴下为肺尖，一般直刺0.3～0.5寸或向后斜刺，严禁深刺，故E错误；A、B、C均为正确表述。", tags:["足少阳胆经","刺灸法","禁忌"], difficulty:2, source:makeSource('D1') },
  { id:"q-0082", type:"judge", stem:"足三里位于犊鼻下3寸，胫骨前嵴外一横指处。", options:["正确","错误"], answer:"T", explanation:"足三里为足阳明胃经合穴、胃之下合穴，标准定位即犊鼻下3寸、胫骨前嵴外一横指处。", tags:["足阳明胃经","定位","特定穴"], difficulty:1, source:makeSource('D1') },
  { id:"q-0083", type:"judge", stem:"内关为手厥阴心包经的络穴，又是八脉交会穴之一。", options:["正确","错误"], answer:"T", explanation:"内关既是手厥阴心包经的络穴，又是八脉交会穴中通阴维脉的穴位，主治胃、心、胸病症。", tags:["手厥阴心包经","特定穴","归经"], difficulty:1, source:makeSource('D1') },
  { id:"q-0084", type:"judge", stem:"太冲是足厥阴肝经的输穴，也是肝经的原穴。", options:["正确","错误"], answer:"T", explanation:"太冲位于足背第1、2跖骨间，为足厥阴肝经输穴，同时是肝经原穴，临床应用广泛。", tags:["足厥阴肝经","特定穴","定位"], difficulty:1, source:makeSource('D1') },
  { id:"q-0085", type:"judge", stem:"为增强针感，风池穴可向内侧、内上方深刺。", options:["正确","错误"], answer:"F", explanation:"风池深部邻近椎动脉与延髓，严禁向内侧或内上方深刺，应针尖微向下朝鼻尖方向斜刺并控制深度。", tags:["足少阳胆经","刺灸法","禁忌"], difficulty:1, source:makeSource('D1') },
  { id:"q-0086", type:"judge", stem:"百会穴位于前发际正中直上5寸；小儿囟门未闭者禁用针刺。", options:["正确","错误"], answer:"T", explanation:"百会在头顶正中，前发际正中直上5寸（两耳尖连线与正中线交点）；囟门未闭的婴幼儿禁针，气虚下陷者可用灸法。", tags:["督脉","定位","禁忌"], difficulty:2, source:makeSource('D1') },
  { id:"q-0087", type:"blank", stem:"合谷穴的简便取穴：以对侧{{1}}横纹压在虎口{{2}}上，拇指尖所指处即是。", options:[], answer:[["拇指指间关节","拇指指关节"],["指蹼缘","指蹼"]], explanation:"合谷在手背第1、2掌骨间、第2掌骨桡侧的中点处，临床常用上述简便取穴法定取。", tags:["手阳明大肠经","定位","定位方法"], difficulty:2, source:makeSource('D1') },
  { id:"q-0088", type:"blank", stem:"关元穴在下腹部，脐中下{{1}}寸，{{2}}上。", options:[], answer:[["3"],["前正中线"]], explanation:"关元为任脉穴、小肠募穴，在脐中下3寸、前正中线上，仰卧排空膀胱后取穴。", tags:["任脉","定位","特定穴"], difficulty:1, source:makeSource('D1') },
  { id:"q-0089", type:"match", stem:"将下列特定穴类别与其对应的代表穴位配对：手阳明经原穴、手太阴经络穴、足阳明经合穴、手太阴经原穴。", options:["合谷","列缺","足三里","太渊"], answer:[0,1,2,3], explanation:"原穴配合谷（A），络穴配列缺（B），下合穴配足三里（C），八会穴之脉会配太渊（D），故为D、B、C、A。", tags:["特定穴","定位","归经"], difficulty:2, source:makeSource('D1') },
  { id:"q-0090", type:"match", stem:"将下列穴位与其定位配对：关元、三阴交、足三里、内关。", options:["脐中下3寸","内踝尖上3寸","犊鼻下3寸","腕掌侧远端横纹上2寸"], answer:[0,1,2,3], explanation:"足三里在犊鼻下3寸（C），关元在脐中下3寸（A），三阴交在内踝尖上3寸（B），内关在腕掌侧远端横纹上2寸（D）。", tags:["定位","定位方法","任脉"], difficulty:3, source:makeSource('D1') },
  { id:"q-0091", type:"single", stem:"针刺时针身与皮肤表面呈45°角刺入，这种进针角度称为", options:["斜刺","直刺","平刺","横刺"], answer:"A", explanation:"针身与皮肤表面呈45°角左右刺入为斜刺；直刺为90°，平刺（横刺）约15°，斜刺多用于肌肉较薄或内有重要脏器的部位。", tags:["刺灸法","刺灸法操作"], difficulty:1, source:makeSource('D1') },
  { id:"q-0092", type:"single", stem:"膀胱经背部穴肺俞的常规刺法是", options:["直刺1.5寸","向外深刺","斜刺","向内深刺"], answer:"C", explanation:"肺俞位于背部，深部为胸腔，应向内斜刺0.5～0.8寸，不可直刺或深刺，以免伤及肺脏引起气胸。", tags:["足太阳膀胱经","禁忌","刺灸法"], difficulty:2, source:makeSource('D1') },
  { id:"q-0093", type:"single", stem:"针刺得气时患者局部的典型感觉是", options:["剧烈锐痛","局部麻木无感","触电样放射至足底","酸麻胀重"], answer:"B", explanation:"得气时患者针刺部位出现酸、麻、胀、重等感觉，医者则觉针下沉紧，是针刺取效的重要标志。", tags:["刺灸法","得气"], difficulty:1, source:makeSource('D1') },
  { id:"q-0094", type:"single", stem:"下列穴位中，孕妇一般不宜针刺的是", options:["曲池","合谷","足三里","内关"], answer:"D", explanation:"合谷可行气活血、通经催产，孕妇慎用或禁针；足三里、内关、曲池一般不属孕妇禁穴。", tags:["禁忌","手阳明大肠经"], difficulty:2, source:makeSource('D1') },
  { id:"q-0095", type:"single", stem:"艾炷灸包括的两大类是", options:["直接灸与间接灸","温和灸与雀啄灸","艾条灸与温针灸","回旋灸与太乙灸"], answer:"A", explanation:"艾炷灸按是否将艾炷直接置于皮肤上，分为直接灸（化脓灸、非化脓灸）与间接灸（隔姜灸、隔蒜灸、隔盐灸等）。", tags:["刺灸法","灸法"], difficulty:1, source:makeSource('D1') },
  { id:"q-0096", type:"single", stem:"艾条灸中，将艾条点燃端与皮肤保持一定距离、上下移动如鸟雀啄食的灸法是", options:["回旋灸","隔姜灸","雀啄灸","温和灸"], answer:"C", explanation:"雀啄灸是艾条点燃端与施灸部位垂直、上下移动如雀啄食状；温和灸为固定距离悬灸，回旋灸为反复旋转移动。", tags:["刺灸法","灸法"], difficulty:2, source:makeSource('D1') },
  { id:"q-0097", type:"single", stem:"针刺过程中患者出现头晕目眩、面色苍白、汗出心慌，首要处理是", options:["继续留针观察","加大捻转刺激","改用温针灸","立即停止针刺并起针"], answer:"B", explanation:"上述表现为晕针，应立即停止针刺、全部起针，扶患者平卧并保暖，轻者饮温开水即可恢复。", tags:["刺灸法","异常情况处理"], difficulty:2, source:makeSource('D1') },
  { id:"q-0098", type:"single", stem:"眼区腧穴的针刺操作要求是", options:["可行温针灸","进针宜缓慢，不宜提插捻转","大幅度提插以催气","快速捻转以增强针感"], answer:"D", explanation:"眼区穴如睛明、承泣，进针宜缓慢，不宜提插捻转，出针后按压针孔片刻，以防出血形成血肿。", tags:["禁忌","刺灸法操作"], difficulty:2, source:makeSource('D1') },
  { id:"q-0099", type:"single", stem:"起针后局部出现小血肿，正确的处理是", options:["先冷敷后热敷","立即用力揉按","马上热敷","继续在该处针刺"], answer:"A", explanation:"微量皮下出血所致小血肿，先冷敷止血，24小时后再热敷或轻揉，以促进瘀血吸收消散。", tags:["刺灸法","异常情况处理"], difficulty:2, source:makeSource('D1') },
  { id:"q-0100", type:"single", stem:"针刺时发生断针且针身断端露出皮肤，正确的处理是", options:["立即让患者活动肢体","继续进针使其穿出","用镊子夹住断端取出","用手按压皮肤挤针"], answer:"C", explanation:"断针后应嘱患者保持原体位、勿移动，若断端露出皮肤可用镊子夹出；若完全陷入皮下，需在X线下定位后手术取出。", tags:["刺灸法","异常情况处理"], difficulty:2, source:makeSource('D1') },
  { id:"q-0101", type:"single", stem:"施灸的先后顺序一般是", options:["先下部后上部，先阴部后阳部","先背部后头面，先四肢后躯干","可任意选择，无先后之分","先上部后下部，先阳部后阴部"], answer:"B", explanation:"一般先灸上部、后灸下部，先灸阳部、后灸阴部，先灸少部、后灸多部，使灸力循序深入。", tags:["刺灸法","灸法"], difficulty:2, source:makeSource('D1') },
  { id:"q-0102", type:"single", stem:"平刺时针身与皮肤表面的夹角约为", options:["90°","15°","30°","45°"], answer:"D", explanation:"平刺又称横刺、沿皮刺，针身与皮肤表面约呈15°角，适用于皮薄肉少之处，如头面部腧穴。", tags:["刺灸法","刺灸法操作"], difficulty:1, source:makeSource('D1') },
  { id:"q-0103", type:"single", stem:"天突穴的针刺操作要求是", options:["先直刺0.2寸，再将针尖转向下方沿胸骨后缘刺入","直刺1寸以上","向两侧斜刺1.5寸","仅可灸不可针"], answer:"A", explanation:"天突位于胸骨上窝，深部有气管与血管，应先直刺0.2寸，再将针尖转向下方、紧靠胸骨后面刺入，不可向左右深刺。", tags:["任脉","禁忌","刺灸法"], difficulty:3, source:makeSource('D1') },
  { id:"q-0104", type:"single", stem:"针刺得气后，为了取得更好效果，通常应", options:["一味加大捻转幅度","延长留针至2小时以上","根据病情施以适当补泻手法","立即快速出针"], answer:"C", explanation:"得气是针刺取效的关键，得气后应根据病证的虚实施以相应的补泻手法，而非盲目加大刺激。", tags:["刺灸法","得气"], difficulty:2, source:makeSource('D1') },
  { id:"q-0105", type:"single", stem:"一般病证留针的时间通常为", options:["1～2分钟","2～3小时","6小时以上","20～30分钟"], answer:"B", explanation:"一般病证留针20～30分钟，其间可间歇行针；慢性、顽固性疾病可适当延长，小儿及体弱者宜短。", tags:["刺灸法","刺灸法操作"], difficulty:1, source:makeSource('D1') },
  { id:"q-0106", type:"multi", stem:"下列属于艾炷灸中直接灸的有", options:["非化脓灸","隔姜灸","隔盐灸","化脓灸"], answer:["B","C"], explanation:"直接灸是将艾炷直接置于皮肤上施灸，包括化脓灸与非化脓灸；隔姜灸、隔盐灸属间接灸。", tags:["刺灸法","灸法"], difficulty:2, source:makeSource('D1') },
  { id:"q-0107", type:"multi", stem:"下列属于间接灸的有", options:["隔盐灸","化脓灸","隔姜灸","隔蒜灸"], answer:["A","C","D"], explanation:"间接灸是在艾炷与皮肤之间垫隔药物，常用隔姜灸、隔蒜灸、隔盐灸、隔附子饼灸；化脓灸属直接灸。", tags:["刺灸法","灸法"], difficulty:2, source:makeSource('D1') },
  { id:"q-0108", type:"multi", stem:"影响针刺深度的主要因素有", options:["患者职业","体质强弱","年龄大小","针刺部位"], answer:["A","B","D"], explanation:"针刺深度应综合考虑体质、年龄、部位和病情：体弱、年老、小儿及皮薄肉少处宜浅，肌肉丰厚处及急性病可适当深刺；患者职业与针刺深度无关。", tags:["刺灸法","刺灸法操作"], difficulty:2, source:makeSource('D1') },
  { id:"q-0109", type:"multi", stem:"下列穴位中，孕妇应当禁针或慎针的有", options:["三阴交","至阴","足三里","合谷"], answer:["B","C","D"], explanation:"合谷、三阴交、至阴均有通经活血、催产下胎之效，孕妇应禁针或慎针；足三里为强壮要穴，一般不属孕妇禁穴。", tags:["禁忌","配穴"], difficulty:3, source:makeSource('D1') },
  { id:"q-0110", type:"multi", stem:"出现晕针后，应采取的措施有", options:["重者立即送医急救","继续留针观察变化","立即停止针刺并起针","扶患者平卧并注意保暖"], answer:["A","C","D"], explanation:"晕针处理应立即停针起针、平卧保暖、饮温开水或糖水；若出现昏迷、血压下降等重证需立即急救，绝不可继续留针。", tags:["刺灸法","异常情况处理"], difficulty:2, source:makeSource('D1') },
  { id:"q-0111", type:"multi", stem:"关于滞针的处理，正确的做法有", options:["强行用力猛拔","嘱患者放松并消除紧张","在针穴附近循按或再刺一针","向相反方向将针捻回"], answer:["A","B","D"], explanation:"滞针多因患者紧张致肌肉痉挛或单向捻转过度，应安抚患者、循按局部或再刺一针，反向捻回即可退出，切忌强拔。", tags:["刺灸法","异常情况处理"], difficulty:3, source:makeSource('D1') },
  { id:"q-0112", type:"judge", stem:"实热证、阴虚发热者一般不适宜使用灸法。", options:["正确","错误"], answer:"T", explanation:"灸法性温，能温经散寒，实热证与阴虚发热者灸之易助热伤阴，故一般不适宜施灸。", tags:["刺灸法","禁忌"], difficulty:2, source:makeSource('D1') },
  { id:"q-0113", type:"judge", stem:"针刺眼区穴位（如睛明、承泣）时，可以反复提插捻转以增强针感。", options:["正确","错误"], answer:"F", explanation:"眼区血管丰富，进针宜缓慢，不宜提插捻转，出针后按压针孔片刻，防止出血引起血肿。", tags:["禁忌","刺灸法操作"], difficulty:2, source:makeSource('D1') },
  { id:"q-0114", type:"judge", stem:"胸、背部腧穴可以直刺并深刺，不会造成不良后果。", options:["正确","错误"], answer:"F", explanation:"胸背部深部为肺脏，直刺深刺易刺伤肺脏引起气胸，故应斜刺或平刺，并严格控制深度。", tags:["禁忌","刺灸法操作"], difficulty:2, source:makeSource('D1') },
  { id:"q-0115", type:"judge", stem:"小儿囟门未闭处及孕妇的腰骶部，一般不宜施灸。", options:["正确","错误"], answer:"T", explanation:"小儿囟门未合者禁灸该处；孕妇腰骶部与下腹部不宜施灸，以免动胎。", tags:["禁忌","灸法"], difficulty:2, source:makeSource('D1') },
  { id:"q-0116", type:"judge", stem:"出针后应立即用干棉球按压针孔片刻，以防出血。", options:["正确","错误"], answer:"T", explanation:"出针后用消毒干棉球按压针孔片刻，可防止出血及血肿形成，眼区等血管丰富处尤应如此。", tags:["刺灸法","刺灸法操作"], difficulty:1, source:makeSource('D1') },
  { id:"q-0117", type:"blank", stem:"针身与皮肤表面呈90°角刺入称{{1}}；呈45°角左右刺入称{{2}}。", options:[], answer:[["直刺"],["斜刺"]], explanation:"直刺为90°垂直刺入，适用于肌肉丰厚处；斜刺约45°，适用于肌肉较薄或邻近重要脏器的部位。", tags:["刺灸法","刺灸法操作"], difficulty:2, source:makeSource('D1') },
  { id:"q-0118", type:"blank", stem:"艾炷灸时每燃尽一个艾炷称为一{{1}}；针刺入腧穴后所产生的经气感应称为{{2}}。", options:[], answer:[["壮"],["得气"]], explanation:"施灸时每燃尽一个艾炷称为一壮，是艾炷灸的计量单位；得气指针刺后患者出现酸麻胀重、医者觉针下沉紧的经气感应。", tags:["刺灸法","得气"], difficulty:2, source:makeSource('D1') },
  { id:"q-0119", type:"match", stem:"将下列间接灸法与各自的主要适应证配对（：隔姜灸、隔蒜灸、隔盐灸、隔附子饼灸。", options:["寒性呕吐","肿疡初起","中风脱证","命门火衰）"], answer:[0,1,2,3], explanation:"隔姜灸温胃止呕、散寒止痛，用于寒性呕吐与风寒湿痹；隔蒜灸清热解毒、杀虫，用于肿疡初起、蛇虫咬伤；隔盐灸回阳固脱，用于中风脱证；隔附子饼灸温补肾阳，用于命门火衰、疮疡久溃不敛。", tags:["刺灸法","灸法"], difficulty:3, source:makeSource('D1') },
  { id:"q-0120", type:"match", stem:"将下列异常情况与首选处理措施配对（：晕针、滞针、弯针、血肿。", options:["停针平卧","反向捻回","顺弯退出","先冷后热）"], answer:[0,1,2,3], explanation:"晕针须立即停针起针并平卧保暖；滞针宜循按局部或反向捻回；弯针应顺其弯曲方向缓慢退出；血肿先冷敷止血、后热敷促其吸收。", tags:["刺灸法","异常情况处理"], difficulty:3, source:makeSource('D1') }
];

<script>
/* =====================================================================
   页面：经络与穴位
   路由：#/meridians、#/meridian/{id}、#/acupoints、#/acupoint/{code}
   ===================================================================== */

/* ===== 通用：页面头部与小部件 ===== */
function pageHead(title, sub, backHash){
  return '' +
  '<div class="page-head">' +
    (backHash ? '<a class="back-btn" href="' + backHash + '" aria-label="返回">‹</a>' : '') +
    '<div class="page-head-t">' +
      '<h1>' + esc(title) + '</h1>' +
      (sub ? '<div class="card-note">' + sub + '</div>' : '') +
    '</div>' +
  '</div>';
}
/* 定义列表行：label + 内容（内容里可以带 HTML） */
function dlRow(label, value, cls){
  if (value == null || value === '') value = PENDING;
  return '<div class="dl">' +
           '<div class="dl-k">' + esc(label) + '</div>' +
           '<div class="dl-v' + (cls ? ' ' + cls : '') + '">' + value + '</div>' +
         '</div>';
}
function pType(list){
  if (!list || !list.length) return '';
  return list.map(function(t){
    var meta = POINT_TYPES[t] || POINT_TYPES['其他'];
    return '<span class="ptag" style="--pt:' + meta.color + '">' + esc(meta.short) + '<i>' + esc(t) + '</i></span>';
  }).join('');
}
/* 来源行：只展示可确认的信息（标准号 / 书名 / 发布者 / 年份） */
function srcLine(src, label){
  if (!src) return '';
  var bits = [];
  if (src.standardNo) bits.push(src.standardNo + (src.book ? '《' + src.book + '》' : ''));
  else if (src.book) bits.push(src.book);
  if (src.publisher) bits.push(src.publisher);
  if (src.year) bits.push(src.year + '年');
  if (!bits.length) return '';
  return '<div class="src-line">' +
           '<span class="src-t"><b>' + esc(label || '来源') + '：</b>' + esc(bits.join(' · ')) + '</span>' +
         '</div>';
}
var SAFE_NOTE = '请以教材、国家标准和专业医师指导为准。';

/* ===== 页面：经络与穴位（十四经 + 经外奇穴） ===== */

/* 经外奇穴按部位分五组，代码前缀即组别 */
var EX_GROUPS = [
  { prefix: 'EX-HN', label: '头颈部', note: '头面、五官与颈项病症常用；眼区与项部穴位须注意深度与角度。' },
  { prefix: 'EX-CA', label: '胸腹部', note: '以妇科与腹部病症为主，孕妇禁用或慎用。' },
  { prefix: 'EX-B',  label: '背部',   note: '定喘、夹脊、腰眼等；胸背部进针须防气胸，夹脊穴要掌握深度与角度。' },
  { prefix: 'EX-UE', label: '上肢',   note: '四缝、十宣、八邪、腰痛点等；点刺放血类穴位须严格消毒。' },
  { prefix: 'EX-LE', label: '下肢',   note: '膝眼、鹤顶、胆囊、阑尾、八风等；多用于膝踝病症与急腹症辅助。' }
];
function extraPointsOf(prefix){
  var out = [];
  for (var i = 0; i < ACUPOINTS.length; i++){
    var a = ACUPOINTS[i];
    if (a.meridianId !== 'ex') continue;
    if (!prefix || String(a.code).toUpperCase().indexOf(prefix) === 0) out.push(a);
  }
  return out;
}

/* 经外奇穴总览：与“十四经”并列的独立区块，不再混进经脉列表里 */
function extraSection(){
  var all = extraPointsOf('');
  var groups = EX_GROUPS.map(function(g){
    var list = extraPointsOf(g.prefix);
    if (!list.length) return '';
    return '<div class="ex-block">' +
      '<div class="ex-head">' +
        '<b>' + esc(g.label) + '</b>' +
        '<span class="chip">' + list.length + ' 穴</span>' +
        '<span class="card-note">' + esc(g.prefix) + '</span>' +
      '</div>' +
      '<div class="pt-row">' + list.map(function(a){
        return '<a class="pt-chip" href="#/acupoint/' + encodeURIComponent(a.code) + '">' +
          esc(a.name) + '<i>' + esc(a.code) + '</i></a>';
      }).join('') + '</div>' +
      '<div class="card-note">' + esc(g.note) + '</div>' +
    '</div>';
  }).join('');

  return '' +
  '<div class="sec-head">' +
    '<h2>经外奇穴</h2>' +
    '<span class="chip acc">' + all.length + ' 穴</span>' +
  '</div>' +
  '<section class="card">' +
    '<div class="card-note">经外奇穴有固定名称、位置与主治，但<b>不归入十四经</b>，是独立于经脉体系的一组穴位；代码按部位编排（EX-HN 头颈 / EX-CA 胸腹 / EX-B 背 / EX-UE 上肢 / EX-LE 下肢）。</div>' +
    '<div class="row" style="margin:8px 0 4px">' +
      '<a class="btn sm" href="#/acupoints?m=ex">查看全部奇穴</a>' +
      '<a class="btn sm" href="#/search?m=ex">在检索中筛选</a>' +
    '</div>' +
    groups +
    '<div class="card-note" style="margin-top:8px">四缝、十宣、耳尖、八邪等点刺类奇穴须严格消毒；' +
      '<b>放血与点刺只作辅助手段，高热、昏迷、惊厥等急症必须先拨打 120 送医</b>。' + SAFE_NOTE + '</div>' +
  '</section>';
}

PAGES.meridians = function(){
  var st = dataStats();
  var written = {};
  for (var i = 0; i < ACUPOINTS.length; i++){
    var id = ACUPOINTS[i].meridianId;
    written[id] = (written[id] || 0) + 1;
  }

  /* 只列十四条经脉；经外奇穴单独成区，不混在这里 */
  var groups = MERIDIANS;
  var items = groups.map(function(m){
    var have = written[m.id] || 0;
    var total = m.acupointCount || 1;
    var rate = Math.round(have / total * 100);
    return '' +
    '<a class="m-item" href="#/meridian/' + m.id + '">' +
      '<span class="m-badge t-' + m.type + '">' + esc(m.abbr) + '</span>' +
      '<span class="m-main">' +
        '<span class="m-name">' + esc(m.name) + '</span>' +
        '<span class="m-meta">' + esc(m.typeLabel) + ' · 单侧 ' + m.acupointCount + ' 穴 · 表里：' + esc(m.pair) + '</span>' +
      '</span>' +
      '<span class="m-side">' +
        (have >= m.acupointCount
          ? '<span class="chip acc">已收录</span>'
          : '<span class="chip warn">' + have + '/' + m.acupointCount + '</span>') +
        '<span class="m-rate" aria-hidden="true"><i style="width:' + rate + '%"></i></span>' +
      '</span>' +
    '</a>';
  }).join('');

  var exCount = (getMeridian('ex').acupointCount || 0);
  var merCount = ACUPOINTS.length - exCount;

  return '' +
  pageHead('经络与穴位', '十二正经 + 任脉 + 督脉（' + st.total + ' 个经穴）与经外奇穴（' + exCount + ' 穴）两部分') +
  '<section class="card">' +
    '<div class="row">' +
      '<span class="stat"><b>' + MERIDIANS.length + '</b><span>条经脉</span></span>' +
      '<span class="stat"><b>' + st.total + '</b><span>十四经穴</span></span>' +
      '<span class="stat"><b>' + exCount + '</b><span>经外奇穴</span></span>' +
      '<span class="stat"><b>' + merCount + '</b><span>合计</span></span>' +
    '</div>' +
    '<div class="row" style="margin-top:10px">' +
      '<a class="btn sm" href="#/acupoints">穴位总表</a>' +
      '<a class="btn sm" href="#/search">检索筛选</a>' +
      '<a class="btn sm" href="#/diseases">病症配穴</a>' +

<script>
/* ===== 检索：部位分区、匹配、高亮 ===== */

/* 部位分区用关键词判定，顺序即优先级。
   同一个穴可能同时命中多个词（如“腕横纹上”既像上肢又像关节），
   所以规则从“解剖部位”排到“关节横纹”，先命中先算。 */
var REGIONS = [
  { id:'head',  label:'头面颈项', kw:['头','额','巅','面','颊','颧','鼻','口','唇','目','眼','眶','眉','耳','颞','枕','颈','项','咽喉','喉','下颌','上颌','颏','齿','腮'] },
  { id:'chest', label:'胸胁',     kw:['胸','胁','肋','乳','缺盆','腋','锁骨','剑突','膻中'] },
  { id:'abdomen', label:'腹腰',   kw:['腹','脐','耻骨','小腹','少腹','季胁','腰','髂','气冲','腹股沟','带脉'] },
  { id:'back',  label:'脊背',     kw:['背','脊','椎','肩胛','骶','尾骨','项后','风府','大椎'] },
  { id:'upper', label:'上肢',     kw:['肩','臂','肘','腕','掌','指','手','上臂','前臂','鱼际','虎口','腋后','腋前','寸口','桡','尺','肱'] },
  { id:'lower', label:'下肢',     kw:['足','踝','小腿','膝','胫','股','髋','臀','腿','趾','跟','腘','足背','足心','内踝','外踝','腓'] },
  { id:'trunk', label:'躯干其他', kw:[] }
];
var REGION_LABEL = {};
REGIONS.forEach(function(r){ REGION_LABEL[r.id] = r.label; });

/* 经外奇穴的代码自带部位信息：EX-HN 头颈 / EX-CA 胸腹 / EX-B 背 / EX-UE 上肢 / EX-LE 下肢 */
var EXTRA_REGION = {
  'EX-HN': 'head', 'EX-CA': 'abdomen', 'EX-B': 'back', 'EX-UE': 'upper', 'EX-LE': 'lower'
};
function extraRegionOf(code){
  var m = /^(EX-[A-Z]{1,3})\d+$/.exec(String(code || '').toUpperCase());
  return m ? (EXTRA_REGION[m[1]] || '') : '';
}

function regionOf(a){
  if (a.region) return a.region;
  var byCode = extraRegionOf(a.code);
  if (byCode){ a.region = byCode; return a.region; }
  var s = (a.location.full || '') + (a.anatomy || '');
  for (var i = 0; i < REGIONS.length; i++){
    var kw = REGIONS[i].kw;
    for (var j = 0; j < kw.length; j++){
      if (s.indexOf(kw[j]) > -1){ a.region = REGIONS[i].id; return a.region; }
    }
  }
  a.region = 'trunk';
  return a.region;
}
function regionCounts(list){
  var c = {};
  for (var i = 0; i < list.length; i++){
    var id = regionOf(list[i]);
    c[id] = (c[id] || 0) + 1;
  }
  return c;
}

/* 拼音检索用：去掉空格与声调，统一小写 */
function pinyinKey(a){
  if (a._py === undefined) a._py = String(a.pinyin || '').toLowerCase().replace(/[\s'’·-]/g, '');
  return a._py;
}
/* 代码检索用：LU1 / lu-1 / lu 1 都能命中 */
function codeKey(a){
  if (a._ck === undefined) a._ck = String(a.code || '').toLowerCase().replace(/[\s-]/g, '');
  return a._ck;
}

function matchKeyword(a, kw){
  if (!kw) return true;
  var k = kw.toLowerCase().trim();
  if (!k) return true;
  var k2 = k.replace(/[\s-]/g, '');
  return a.code.toLowerCase().indexOf(k) > -1
      || a.name.indexOf(kw.trim()) > -1
      || pinyinKey(a).indexOf(k2) > -1
      || codeKey(a).indexOf(k2) > -1
      || (a.meridianName || '').indexOf(kw.trim()) > -1
      || (a.location.full || '').indexOf(kw.trim()) > -1
      || (a.indications || '').indexOf(kw.trim()) > -1
      || (a.functions || '').indexOf(kw.trim()) > -1
      || (a.specific || []).join('').indexOf(kw.trim()) > -1;
}

/* 综合筛选：传进来的都是字符串，空串表示不限 */
function filterAcupoints(q){
  q = q || {};
  var out = [];
  for (var i = 0; i < ACUPOINTS.length; i++){
    var a = ACUPOINTS[i];
    if (q.m && a.meridianId !== q.m) continue;
    if (q.r && regionOf(a) !== q.r) continue;
    if (q.s && a.specific.indexOf(q.s) === -1) continue;
    if (q.kw && !matchKeyword(a, q.kw)) continue;
    out.push(a);
  }
  var sort = q.sort || 'meridian';
  if (sort === 'name'){
    out.sort(function(x, y){ return x.name.localeCompare(y.name, 'zh-Hans-CN'); });
  } else if (sort === 'code'){
    out.sort(function(x, y){
      if (x.meridianAbbr === y.meridianAbbr) return x.order - y.order;
      return x.meridianAbbr < y.meridianAbbr ? -1 : 1;
    });
  } else if (sort === 'region'){
    out.sort(function(x, y){
      var rx = REGIONS.findIndex(function(r){ return r.id === regionOf(x); });
      var ry = REGIONS.findIndex(function(r){ return r.id === regionOf(y); });
      if (rx === ry) return x.order - y.order;
      return rx - ry;
    });
  } else {
    /* 默认按经脉流注顺序；经外奇穴排在十四经之后 */
    var seq = {};
    allMeridianGroups().forEach(function(m, i){ seq[m.id] = i * 1000; });
    out.sort(function(x, y){
      var sx = (seq[x.meridianId] == null ? 99000 : seq[x.meridianId]) + x.order;
      var sy = (seq[y.meridianId] == null ? 99000 : seq[y.meridianId]) + y.order;
      return sx - sy;
    });
  }
  return out;
}

/* 高亮命中片段：先转义再插标记，避免 XSS 与破坏标签 */
function hl(text, kw){
  var s = esc(text == null ? '' : text);
  if (!kw) return s;
  var k = esc(kw.trim());
  if (!k) return s;
  var idx = s.toLowerCase().indexOf(k.toLowerCase());
  if (idx === -1) return s;
  return s.slice(0, idx) + '<mark class="hl">' + s.slice(idx, idx + k.length) + '</mark>' + s.slice(idx + k.length);
}

/* 查询串拼装：空值不写进去，保证地址简短可读 */
function qsOf(obj){
  var parts = [];
  Object.keys(obj).forEach(function(k){
    var v = obj[k];
    if (v === '' || v == null || v === undefined) return;
    parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(v));
  });
  return parts.length ? '?' + parts.join('&') : '';
}
function searchHash(q){
  return '#/search' + qsOf(q);
}

/* 历史搜索：最多留 8 条 */
var RECENT_KEY = 'zj:recentSearch';
function recentSearches(){
  var a = Store.read('recentSearch', []);
  return Object.prototype.toString.call(a) === '[object Array]' ? a : [];
}
function pushRecent(kw){
  kw = String(kw || '').trim();
  if (kw.length < 1) return;
  var a = recentSearches().filter(function(x){ return x !== kw; });
  a.unshift(kw);
  Store.write('recentSearch', a.slice(0, 8));
}
</script>

<script>
/* =====================================================================
   页面：检索与筛选
   路由：#/search?kw=&m=&r=&s=&sort=
   ===================================================================== */

/* 把当前查询串（去空值）拼回来，用于切换某个筛选条件 */
function qWith(cur, patch){
  var q = {
    kw: cur.kw || '', m: cur.m || '', r: cur.r || '',
    s: cur.s || '', sort: cur.sort || ''
  };
  Object.keys(patch).forEach(function(k){ q[k] = patch[k]; });
  return q;
}
function activeFilterCount(cur){
  var n = 0;
  if (cur.m) n++;
  if (cur.r) n++;
  if (cur.s) n++;
  if (cur.sort && cur.sort !== 'meridian') n++;
  return n;
}

var SORTS = [
  { id:'meridian', label:'按流注' },
  { id:'code',     label:'按代码' },
  { id:'name',     label:'按穴名' },
  { id:'region',   label:'按部位' }
];

function acupointCard(a, kw){
  var reg = REGION_LABEL[regionOf(a)] || '';
  return '' +
  '<a class="acupoint-card" href="#/acupoint/' + encodeURIComponent(a.code) + '">' +
    '<div class="ac-name">' +
      '<span class="ac-code">' + esc(a.code) + '</span>' +
      '<b>' + hl(a.name, kw) + '</b>' +
      '<em>' + hl(a.pinyin, kw) + '</em>' +
      '<span class="chip">' + esc(a.meridianName) + '</span>' +
      '<span class="chip">' + esc(reg) + '</span>' +
    '</div>' +
    '<div class="ac-loc">' + hl(a.location.primary, kw) + '</div>' +
    '<div class="ac-foot">' + pType(a.specific) +
      (a.precautions ? '<span class="chip warn">有安全提示</span>' : '') +
    '</div>' +
  '</a>';
}

/* 检索结果区：单独抽成函数，输入时只重绘这一块。
   输入框、【筛选】按钮与筛选面板都不在重绘范围内 ——
   一旦重建输入框，中文输入法的合成会话就会被打断（候选框消失、拼音被强制上屏）。 */
function searchResultsHtml(cur, opts){
  cur = cur || {};
  opts = opts || {};
  var filtered = filterAcupoints(cur);
  var fcount = activeFilterCount(cur);
  var mCur = getMeridian(cur.m);

  var wl = filtered.length
    ? (filtered.length > 200
        ? '<span class="chip warn">仅显示前 200 条，请缩小范围</span>'
        : '')
    : '';

  var body = filtered.length
    ? filtered.slice(0, 200).map(function(a){ return acupointCard(a, cur.kw); }).join('') +
      (filtered.length > 200 ? '<div class="empty-box">仅显示前 200 条，请用关键词或筛选条件缩小范围。</div>' : '')
    : '<div class="empty-box">没有符合条件的穴位。<br>试试减少筛选条件，或换一个关键词（支持穴名、拼音、代码、主治）。</div>';

  if (opts.bodyOnly) return body;

  return '<div class="result-head">' +
      '<h2>' + filtered.length + ' 个结果</h2>' +
      (mCur ? '<span class="chip acc">' + esc(mCur.name) + '</span>' : '') +
      (cur.r ? '<span class="chip acc">' + esc(REGION_LABEL[cur.r] || cur.r) + '</span>' : '') +
      (cur.s ? '<span class="chip acc">' + esc(cur.s) + '</span>' : '') +
      (cur.kw ? '<span class="chip">关键词：' + esc(cur.kw) + '</span>' : '') +
      wl +
    '</div>' +
    '<section>' + body + '</section>';
}

/* 筛选面板内容：输入关键词时连它一起刷新（面板里没有输入框，
   替换 innerHTML 不会碰到输入元素，所以不影响中文输入法的合成）。 */
function filterPanelHtml(cur){
  var counts = regionCounts(filterAcupoints({ m: cur.m, s: cur.s, kw: cur.kw }));
  var fcount = activeFilterCount(cur);

  var mChips = '' +
    '<a class="f-chip' + (!cur.m ? ' on' : '') + '" href="' + searchHash(qWith(cur, { m:'' })) + '">全部</a>' +
    allMeridianGroups().map(function(m){
      return '<a class="f-chip' + (cur.m === m.id ? ' on' : '') + '" href="' +
        searchHash(qWith(cur, { m: m.id })) + '">' + esc(m.abbr) + '<small>' + m.acupointCount + '</small></a>';
    }).join('');

  var rChips = '' +
    '<a class="f-chip' + (!cur.r ? ' on' : '') + '" href="' + searchHash(qWith(cur, { r:'' })) + '">不限</a>' +
    REGIONS.map(function(g){
      if (!counts[g.id]) return '';
      return '<a class="f-chip' + (cur.r === g.id ? ' on' : '') + '" href="' +
        searchHash(qWith(cur, { r: g.id })) + '">' + esc(g.label) + '<small>' + counts[g.id] + '</small></a>';
    }).join('');

  var allTypes = Object.keys(POINT_TYPES).filter(function(t){ return t !== '其他'; });
  var sChips = '' +
    '<a class="f-chip' + (!cur.s ? ' on' : '') + '" href="' + searchHash(qWith(cur, { s:'' })) + '">不限</a>' +
    allTypes.map(function(t){
      return '<a class="f-chip' + (cur.s === t ? ' on' : '') + '" href="' +
        searchHash(qWith(cur, { s: t })) + '">' + esc(t) + '</a>';
    }).join('');

  var sortChips = SORTS.map(function(o){
    return '<a class="f-chip' + ((cur.sort || 'meridian') === o.id ? ' on' : '') + '" href="' +
      searchHash(qWith(cur, { sort: o.id === 'meridian' ? '' : o.id })) + '">' + esc(o.label) + '</a>';
  }).join('');

  return '' +
    '<div class="f-group"><div class="f-label">经络</div><div class="f-row">' + mChips + '</div></div>' +
    '<div class="f-group"><div class="f-label">部位</div><div class="f-row">' + rChips + '</div></div>' +
    '<div class="f-group"><div class="f-label">特定穴</div><div class="f-row">' + sChips + '</div></div>' +
    '<div class="f-group"><div class="f-label">排序</div><div class="f-row">' + sortChips + '</div></div>' +
    (fcount ? '<div class="row"><a class="btn sm" href="#/search">清空全部筛选</a></div>' : '');
}

function recentBoxHtml(cur){
  var recent = recentSearches();
  if (!recent.length) return '';
  return '<div class="search-hint" style="margin-top:8px">最近：' +
    recent.map(function(k){
      return '<a class="chip" href="' + searchHash(qWith(cur, { kw:k })) + '">' + esc(k) + '</a>';
    }).join(' ') + '</div>';
}

PAGES.search = function(r){
  var cur = {
    kw: r.query.kw || '',
    m: (r.query.m || '').toLowerCase(),
    r: r.query.r || '',
    s: r.query.s || '',
    sort: r.query.sort || ''
  };
  var fcount = activeFilterCount(cur);

  return '' +
  pageHead('穴位检索', '按经络、部位、特定穴与关键词筛选，共收录 ' + ACUPOINTS.length + ' 穴') +

  '<section class="card">' +
    '<div class="search-bar">' +
      '<div class="search-input-wrap">' +
        '<span class="ic" aria-hidden="true">⌕</span>' +
        '<input id="kw" class="inp search-input" type="search" inputmode="search" autocomplete="off" ' +
          'enterkeyhint="search" autocorrect="off" autocapitalize="off" spellcheck="false" ' +
          'placeholder="穴名 / 拼音 / 代码 / 主治，如 合谷 hegu LI4" value="' + esc(cur.kw) + '" ' +
          'aria-label="关键词检索">' +
        (cur.kw ? '<button class="search-clear" type="button" data-clear-kw="1" aria-label="清空关键词">×</button>' : '') +
      '</div>' +
      '<button class="filter-toggle" type="button" id="btnFilter" aria-expanded="false" aria-controls="filterPanel">' +
        '筛选' + (fcount ? '<span class="dot">' + fcount + '</span>' : '') +
      '</button>' +
    '</div>' +

    /* 面板与结果区各自套一层容器：输入时只换它们的内容，输入框与按钮原地不动 */
    '<div class="filter-panel" id="filterPanel">' + filterPanelHtml(cur) + '</div>' +
    '<div id="searchRecent">' + recentBoxHtml(cur) + '</div>' +
  '</section>' +

  '<div id="searchResults">' + searchResultsHtml(cur) + '</div>' +

  '<section class="card">' +
    '<div class="card-t"><h3>检索用法</h3></div>' +
    '<ul>' +
      '<li>关键词支持：穴名（合谷）、拼音（hegu / he gu）、代码（LI4 / li4）、归经、主治与功效用词。</li>' +
      '<li>筛选与关键词会写进地址，例如 <code>#/search?m=lu&r=chest&kw=咳</code>，可直接收藏或分享。</li>' +
      '<li>' + DATA_SCOPE_NOTE + SAFE_NOTE + '</li>' +
    '</ul>' +
  '</section>';
};

/* ===== 检索页交互：输入防抖 + 筛选面板 ===== */
/* 中文输入法（IME）关键规则：只要用户还在输入，就绝对不能让检索页整页重绘。
   整页重绘 = 输入框被销毁重建 = 合成会话作废（候选框不弹、拼音被强制上屏、
   输入焦点丢失，连下一个拼音都打不进去）。所以：
     · composition 进行中：什么都不做（不重绘、不写地址）；
     · 普通输入：只替换 #searchResults / #filterPanel / #searchRecent 的内容，
       输入框与【筛选】按钮原地不动；
     · 地址用 history.replaceState 同步（不触发 hashchange，所以不会连锁重绘），
       不支持时静默放弃，不影响当前显示。 */
(function(){
  var timer = 0;
  var composing = false;

  function currentQuery(){
    var r = (typeof parseHash() === 'function') ? parseHash() : { query:{} };
    return r.query || {};
  }
  function queryOf(kw){
    var q = currentQuery();
    return {
      kw: kw == null ? (q.kw || '') : kw,
      m: (q.m || '').toLowerCase(),
      r: q.r || '',
      s: q.s || '',
      sort: q.sort || ''
    };
  }
  /* 只改地址，不触发 hashchange —— hashchange 会走 render()，输入框就没了 */
  function syncHash(url){
    if (location.hash === url) return;
    try {
      if (window.history && history.replaceState) history.replaceState(null, '', url);
    } catch (err){
      /* file:// 下个别浏览器不允许写地址栏：放弃，功能不受影响 */
    }
  }
  /* 清空按钮跟着关键词出现/消失，但只在输入框外面动手（不能重建 .search-input-wrap） */
  function syncClearBtn(kw){
    var inp = document.getElementById('kw');
    var wrap = (inp && inp.parentNode) ? inp.parentNode : document.querySelector('.search-input-wrap');
    if (!wrap || !wrap.children) return;
    var btn = null, i;
    for (i = 0; i < wrap.children.length; i++){
      if (wrap.children[i].getAttribute && wrap.children[i].getAttribute('data-clear-kw')) btn = wrap.children[i];
    }
    if (kw && !btn){
      btn = document.createElement('button');
      btn.className = 'search-clear';
      btn.setAttribute('type', 'button');
      btn.setAttribute('data-clear-kw', '1');
      btn.setAttribute('aria-label', '清空关键词');
      btn.textContent = '×';
      wrap.appendChild(btn);
    } else if (!kw && btn){
      wrap.removeChild(btn);
    }
  }
  /* 输入时只刷这几块，输入元素本身永不重建 */
  function liveUpdate(kw){
    var box = document.getElementById('searchResults');
    if (!box) return false;
    var cur = queryOf(kw);
    box.innerHTML = searchResultsHtml(cur);
    var panel = document.getElementById('filterPanel');
    if (panel) panel.innerHTML = filterPanelHtml(cur);
    var recent = document.getElementById('searchRecent');
    if (recent) recent.innerHTML = recentBoxHtml(cur);
    syncClearBtn(cur.kw);
    return true;
  }
  function goSearch(patch){
    var cur = queryOf(null);
    Object.keys(patch).forEach(function(k){ cur[k] = patch[k]; });
    syncHash(searchHash(cur));
    if (!liveUpdate(cur.kw) && typeof render === 'function') render();
  }

  function isComposingEvent(e){
    return !!e.isComposing || composing || e.keyCode === 229;
  }

  document.addEventListener('compositionstart', function(e){
    var t = e.target;
    if (!t || t.id !== 'kw') return;
    composing = true;
    clearTimeout(timer);
  });
  document.addEventListener('compositionend', function(e){
    var t = e.target;
    if (!t || t.id !== 'kw') return;
    composing = false;
    clearTimeout(timer);
    /* 合成结束后按最终文本检索一次 */
    var kw = t.value.trim();
    if (kw) pushRecent(kw);
    goSearch({ kw: kw });
  });

  document.addEventListener('input', function(e){
    var t = e.target;
    if (!t || t.id !== 'kw') return;
    /* 浏览器自己报的 isComposing 最可信；万一 compositionend 没送到（切窗口、点别处），
       下一个非合成 input 就把 composing 复位，避免以后再也不刷新结果 */
    if (!e.isComposing && e.keyCode !== 229) composing = false;
    clearTimeout(timer);
    if (isComposingEvent(e)){
      /* 合成中：连地址也先不动，等选字结束再写，避免任何页面级动作干扰输入法 */
      return;
    }
    timer = setTimeout(function(){
      var kw = t.value.trim();
      if (kw) pushRecent(kw);
      goSearch({ kw: kw });
    }, 200);
  });
  document.addEventListener('keydown', function(e){
    var t = e.target;
    if (!t || t.id !== 'kw') return;
    /* 输入法候选框里的回车（keyCode 229）不是“确认搜索”，不能拦截 */
    if (isComposingEvent(e)) return;
    if (e.key === 'Enter'){
      clearTimeout(timer);
      goSearch({ kw: t.value.trim() });
    }
    if (e.key === 'Escape'){ t.value = ''; goSearch({ kw: '' }); }
  });
  document.addEventListener('click', function(e){
    var t = e.target;
    if (!t || !t.closest) return;
    if (t.closest('[data-clear-kw]')){
      var inp = document.getElementById('kw');
      if (inp) inp.value = '';
      goSearch({ kw: '' });
      return;
    }
    var btn = t.closest('#btnFilter');
    if (btn){
      var panel = document.getElementById('filterPanel');
      if (panel){
        var open = panel.classList.toggle('open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
    }
  });

  /* 输入时不再整页重绘，所以不需要“重绘后恢复焦点”那套补丁了。
     只有整页跳转（用筛选标签、从别的页面回来）才会走这里，
     这时按地址把输入框的值对齐一下即可。 */
  var prevAfter = window.afterRender;
  window.afterRender = function(r){
    if (typeof prevAfter === 'function') prevAfter(r);
    if (r.page !== 'search' || composing) return;
    var el = document.getElementById('kw');
    if (!el) return;
    var cur = (r.query && r.query.kw) || '';
    if (el.value !== cur) el.value = cur;
  };
})();
</script>

<script>
/* =====================================================================
   组件：通用模态框
   ===================================================================== */
var MODAL_STACK = [];

function modalOpen(html, opts){
  opts = opts || {};
  var wrap = document.createElement('div');
  wrap.className = 'modal';
  wrap.innerHTML =
    '<div class="modal-mask" data-modal-close="1"></div>' +
    '<div class="modal-box" role="dialog" aria-modal="true" aria-label="' + esc(opts.title || '对话框') + '">' +
      html +
    '</div>';
  document.body.appendChild(wrap);
  MODAL_STACK.push(wrap);
  var box = wrap.querySelector('.modal-box');
  var first = box.querySelector('textarea, input, select, button');
  if (first) first.focus();
  return { el:wrap, box:box, close:function(){ modalClose(wrap); } };
}
function modalClose(el){
  if (!el) return;
  var i = MODAL_STACK.indexOf(el);
  if (i > -1) MODAL_STACK.splice(i, 1);
  if (el.parentNode) el.parentNode.removeChild(el);
}
function modalTop(){ return MODAL_STACK.length ? MODAL_STACK[MODAL_STACK.length - 1] : null; }
function modalCloseTop(){ modalClose(modalTop()); }

document.addEventListener('click', function(e){
  var t = e.target;
  if (!t || !t.closest) return;
  if (t.closest('[data-modal-close]')){
    var m = t.closest('.modal');
    if (m) modalClose(m);
  }
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && MODAL_STACK.length){
    e.stopPropagation;
    modalCloseTop();
  }
});

/* =====================================================================
   组件：笔记编辑器（收藏 + 笔记 + 标签）
   ===================================================================== */
function noteTarget(ref){
  var parts = String(ref || '').split(':');
  var kind = parts[0], id = parts.slice(1).join(':');
  if (kind === 'acupoint'){
    var a = getAcupoint(id);
    return { kind:kind, id:id, title:(a ? a.code + ' ' + a.name : id), sub:(a ? a.meridianName + ' · ' + a.location.primary : '') };
  }
  if (kind === 'disease'){
    var d = (typeof DISEASES !== 'undefined' ? DISEASES : []).filter(function(x){ return x.id === id; })[0];
    return { kind:kind, id:id, title:(d ? d.name : id), sub:'病症配穴' };
  }
  if (kind === 'question'){
    return { kind:kind, id:id, title:id, sub:'习题' };
  }
  return { kind:kind, id:id, title:id, sub:'' };
}

function openNoteEditor(ref){
  var t = noteTarget(ref);
  var cur = Prefs.note(ref) || { text:'', tags:[] };
  var faved = Prefs.has('favorites', ref);

  var m = modalOpen(
    '<div class="modal-head">' +
      '<h2>' + esc(t.title) + '</h2>' +
      '<button class="icon-btn" type="button" data-modal-close="1" aria-label="关闭">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
      '</button>' +
    '</div>' +
    (t.sub ? '<div class="card-note">' + esc(t.sub) + '</div>' : '') +
    '<div class="f-group" style="margin-top:10px">' +
      '<div class="f-label">笔记内容</div>' +
      '<textarea id="noteText" class="inp" placeholder="记录取穴心得、易错点、老师讲的重点…">' + esc(cur.text || '') + '</textarea>' +
    '</div>' +
    '<div class="f-group">' +
      '<div class="f-label">标签（用逗号或空格分隔）</div>' +
      '<input id="noteTags" class="inp" type="text" placeholder="例如：重点 易错 手太阴" value="' + esc((cur.tags || []).join(' ')) + '">' +
      '<div class="row" style="margin-top:6px">' +
        ['重点','易错','已掌握','待复习'].map(function(x){
          return '<button class="btn sm" type="button" data-tag-add="' + x + '">+ ' + x + '</button>';
        }).join('') +
      '</div>' +
    '</div>' +
    '<div class="modal-foot">' +
      '<button class="btn" type="button" id="noteFav">' + (faved ? '★ 取消收藏' : '☆ 收藏') + '</button>' +
      (cur.text || (cur.tags || []).length ? '<button class="btn" type="button" id="noteDel">删除笔记</button>' : '') +
      '<button class="btn primary" type="button" id="noteSave">保存</button>' +
    '</div>',
    { title:'笔记：' + t.title }
  );

  var txt = m.box.querySelector('#noteText');
  var tagsEl = m.box.querySelector('#noteTags');

  m.el.addEventListener('click', function(e){
    var t2 = e.target;
    if (!t2 || !t2.getAttribute) return;
    var add = t2.getAttribute('data-tag-add');
    if (add){
      var cur2 = tagsEl.value.trim();
      if (cur2.indexOf(add) === -1) tagsEl.value = (cur2 ? cur2 + ' ' : '') + add;
      return;
    }
    if (t2.id === 'noteSave'){
      var tags = tagsEl.value.split(/[,，\s]+/).filter(function(s){ return s; });
      Prefs.setNote(ref, txt.value.trim(), tags);
      modalClose(m.el);
      toast('已保存');
      render();
      return;
    }
    if (t2.id === 'noteDel'){
      Prefs.setNote(ref, '', []);
      modalClose(m.el);
      toast('笔记已删除');
      render();
      return;
    }
    if (t2.id === 'noteFav'){
      var added = Prefs.toggle('favorites', ref);
      t2.textContent = added ? '★ 取消收藏' : '☆ 收藏';
      toast(added ? '已加入收藏' : '已取消收藏');
      render();
    }
  });
}

/* =====================================================================
   页面：我的收藏
   ===================================================================== */
var FAV_TYPES = [
  { id:'all', label:'全部' },
  { id:'acupoint', label:'穴位' },
  { id:'disease', label:'病症' },
  { id:'question', label:'题目' }
];

PAGES.favorites = function(r){
  var kind = r.query.type || 'all';
  var list = Prefs.list('favorites');
  var items = list.map(function(ref){
    var parts = String(ref).split(':');
    return { ref:ref, kind:parts[0], id:parts.slice(1).join(':'), t:noteTarget(ref) };
  });
  var counts = { all:items.length };
  items.forEach(function(x){ counts[x.kind] = (counts[x.kind] |0) + 1; });
  var shown = kind === 'all' ? items : items.filter(function(x){ return x.kind = kind; });

  var kindChips = FAV_TYPES.map(function(k){

/* =====================================================================
   页面：我的笔记
   ===================================================================== */
/* 笔记条目区单独成函数：输入关键词时只刷这一块，输入框不重建
   （重建输入框会打断中文输入法的合成，导致候选框消失、拼音被强制上屏）。 */
function noteItemsHtml(kw, tag){
  kw = kw || '';
  tag = tag || '';
  var all = Prefs.notes();
  var rows = Object.keys(all).map(function(ref){
    return { ref:ref, note:all[ref], t:noteTarget(ref) };
  });
  var filtered = rows.filter(function(x){
    if (tag && (x.note.tags || []).indexOf(tag) === -1) return false;
    if (!kw) return true;
    var a = x.t.kind === 'acupoint' ? getAcupoint(x.t.id) : null;
    var hay = [x.t.title, x.t.sub, x.note.text, (x.note.tags || []).join(' '),
      a ? a.indications : '', a ? a.location.full : ''].join(' ');
    return hay.toLowerCase().indexOf(kw.toLowerCase()) > -1;
  });
  filtered.sort(function(a, b){
    return String(b.note.updatedAt || '').localeCompare(String(a.note.updatedAt || ''));
  });
  var out = filtered.length ? filtered.map(function(x){
    var note = x.note;
    var when = note.updatedAt ? String(note.updatedAt).slice(0, 16).replace('T', ' ') : '';
    var href = x.t.kind === 'acupoint' ? '#/acupoint/' + encodeURIComponent(x.t.id)
      : (x.t.kind === 'disease' ? '#/disease/' + encodeURIComponent(x.t.id) : '');
    return '<div class="note-item">' +
      '<div class="note-head">' +
        '<b>' + hl(x.t.title, kw) + '</b>' +
        '<span class="chip">' + esc(x.t.kind === 'acupoint' ? '穴位' : x.t.kind === 'disease' ? '病症' : '题目') + '</span>' +
        '<span style="flex:1 1 auto"></span>' +
        '<span class="note-time">' + esc(when) + '</span>' +
      '</div>' +
      '<div class="note-body">' + hl(note.text || '（空）', kw) + '</div>' +
      ((note.tags || []).length ? '<div class="note-tags">' + note.tags.map(function(t){
        return '<a class="chip" href="#/notes?tag=' + encodeURIComponent(t) + '">' + esc(t) + '</a>';
      }).join('') + '</div>' : '') +
      '<div class="row" style="margin-top:8px">' +
        (href ? '<a class="btn sm" href="' + href + '">打开</a>' : '') +
        '<button class="btn sm" type="button" data-note="' + esc(x.ref) + '">编辑</button>' +
      '</div>' +
    '</div>';
  }).join('') : '<div class="empty-box">没有匹配的笔记。</div>';
  return '<div class="result-head"><h2>' + filtered.length + ' 条笔记</h2>' +
    (kw ? '<span class="chip">关键词：' + esc(kw) + '</span>' : '') + '</div>' +
    '<section>' + out + '</section>';
}

/* 标签条单独成函数：输入关键词时连它一起刷新（标签条里没有输入框）。
   标签链接带上关键词，点进去后筛选条件不丢。 */
function noteTagChipsHtml(kw, tag){
  var tagCount = {};
  var all = Prefs.notes();
  Object.keys(all).forEach(function(ref){
    (all[ref].tags || []).forEach(function(t){ tagCount[t] = (tagCount[t] || 0) + 1; });
  });
  if (!Object.keys(tagCount).length){
    return '<div class="card-note">还没有标签。写笔记时可以加标签，方便按主题复习。</div>';
  }
  var q = function(extra){
    var parts = [];
    if (kw) parts.push('kw=' + encodeURIComponent(kw));
    if (extra) parts.push(extra);
    return '#/notes' + (parts.length ? '?' + parts.join('&') : '');
  };
  return '<div class="f-row">' +
    '<a class="f-chip' + (!tag ? ' on' : '') + '" href="' + q('') + '">全部标签</a>' +
    Object.keys(tagCount).sort(function(a, b){ return tagCount[b] - tagCount[a]; }).map(function(t){
      return '<a class="f-chip' + (tag === t ? ' on' : '') + '" href="' + q('tag=' + encodeURIComponent(t)) + '">' +
        esc(t) + '<small>' + tagCount[t] + '</small></a>';
    }).join('') + '</div>';
}

PAGES.notes = function(r){
  var kw = r.query.kw || '';
  var tag = r.query.tag || '';
  var total = Object.keys(Prefs.notes()).length;
  var matched = noteItemsHtml(kw, tag).match(/<h2>(\d+) 条笔记<\/h2>/);

  return '' +
  pageHead('我的笔记', '共 ' + total + ' 条，' + (matched ? matched[1] : '0') + ' 条符合当前条件', '#/me') +

    '<div class="search-bar">' +
      '<div class="search-input-wrap">' +
        '<span class="ic" aria-hidden="true">⌕</span>' +
        '<input id="noteKw" class="inp search-input" type="search" enterkeyhint="search" autocomplete="off" placeholder="搜索笔记内容 / 穴位 / 标签" value="' + esc(kw) + '" aria-label="搜索笔记">' +
      '</div>' +
      '<a class="btn" href="#/notes">清空</a>' +
    '</div>' +
    '<div id="noteTagBar">' + noteTagChipsHtml(kw, tag) + '</div>' +
  '</section>' +
  '<div id="noteItems">' + noteItemsHtml(kw, tag) + '</div>' +
  '<section class="card"><div class="card-note">笔记保存在本机 <code>zj:notes</code>，支持导出导入；内容不逐条核对，' + SAFE_NOTE + '</div></section>';
};

/* 笔记页搜索：防抖 200ms；只更新条目区与标签条，输入框永不重建
   （重建输入框会打断中文输入法的合成 → 候选框消失、拼音被强制上屏）。 */
(function(){
  var timer = 0;
  var composing = false;

  /* 只改地址，不触发 hashchange（hashchange → render() → 输入框被销毁重建） */
  function syncHash(url){
    if (location.hash === url) return;
    try {
      if (window.history && history.replaceState) history.replaceState(null, '', url);
    } catch (err){
      /* file:// 下个别浏览器不允许写地址栏：放弃，功能不受影响 */
    }
  }
  function apply(kw){
    var tag = parseHash().query.tag || '';
    var parts = [];
    if (kw) parts.push('kw=' + encodeURIComponent(kw));
    if (tag) parts.push('tag=' + encodeURIComponent(tag));
    syncHash('#/notes' + (parts.length ? '?' + parts.join('&') : ''));
    var box = document.getElementById('noteItems');
    if (box){
      box.innerHTML = noteItemsHtml(kw, tag);
      var tags = document.getElementById('noteTagBar');
      if (tags) tags.innerHTML = noteTagChipsHtml(kw, tag);
      return;
    }
    if (typeof render === 'function') render();
  }

  document.addEventListener('compositionstart', function(e){
    if (!e.target || e.target.id !== 'noteKw') return;
    composing = true;
    clearTimeout(timer);
  });
  document.addEventListener('compositionend', function(e){
    var t = e.target;
    if (!t || t.id !== 'noteKw') return;
    composing = false;
    clearTimeout(timer);
    apply(t.value.trim());
  });
  document.addEventListener('input', function(e){
    var t = e.target;
    if (!t || t.id !== 'noteKw') return;
    /* 浏览器自己报的 isComposing 最可信；compositionend 万一没送到也能自愈 */
    if (!e.isComposing && e.keyCode !== 229) composing = false;
    clearTimeout(timer);
    if (composing || e.isComposing || e.keyCode === 229) return;   /* 合成中什么都不做 */
    timer = setTimeout(function(){ apply(t.value.trim()); }, 200);
  });

  /* 输入不再整页重绘，只需在整页跳转后把输入框的值对齐地址 */
  var prev = window.afterRender;
  window.afterRender = function(r){
    if (typeof prev === 'function') prev(r);
    if (r.page !== 'notes' || composing) return;
    var el = document.getElementById('noteKw');
    if (!el) return;
    var cur = (r.query && r.query.kw) || '';
    if (el.value !== cur) el.value = cur;
  };
})();
</script>

<script>
/* =====================================================================
   页面：习题自测

   进度：zj:progress；错题：zj:wrongQuestions；收藏：zj:quizBookmarks
   ===================================================================== */

var QTYPES = [

var QTYPE_LABEL = {};
QTYPES.forEach(function(t){ QTYPE_LABEL[t.id] = t.label; });
var LETTERS = ['A', 'B', 'C', 'D', 'E'];

function qProgress(){
  var p = Store.read('progress', {});

  p.quizDone = p.quizDone || 0;
  p.quizRight = p.quizRight || 0;
  p.quizSessions = p.quizSessions || 0;

}
function qSetProgress(patch){

function wrongBook(){

}

function markWrong(id, mem){
  var w = wrongBook();
  var rec = w[id] || { times:0 };
  rec.times = (rec.times || 0) + 1;
  rec.at = new Date().toISOString();
  if (mem != null) rec.mem = mem;
  w[id] = rec;
  Store.write('wrongQuestions', w);
}
function clearWrong(id){
  var w = wrongBook();
  if (w[id]){ delete w[id]; Store.write('wrongQuestions', w); }
}
function bookmarkIds(){ return Prefs.list('quizBookmarks'); }

/* 选项展示顺序：按会话种子打乱，保证同一会话内稳定 */
function orderOptions(q, seed){
  var n = q.options.length;
  if (q.type === 'judge' || !n) return [0, 1, 2, 3, 4].slice(0, n);
  var idx = [];
  for (var i = 0; i < n; i++) idx.push(i);
  var s = seed || 1;
  for (var j = n - 1; j > 0; j--){
    s = (s * 9301 + 49297) % 233280;
    var k = Math.floor(s / 233280 * (j + 1));
    var t = idx[j]; idx[j] = idx[k]; idx[k] = t;
  }
  return idx;
}
/* 把答案表示成“显示位上的字母集合” */
function answerLetters(q, order){
  if (q.type === 'single' || q.type === 'multi'){
    var ans = (typeof q.answer === 'string') ? [q.answer] : q.answer;
    var L = [];
    ans.forEach(function(a){
      var orig = LETTERS.indexOf(a);
      var disp = order.indexOf(orig);
      if (disp > -1) L.push(LETTERS[di]);
    });
    return L.sort();
  }
  if (q.type === 'judge') return [q.answer === 'T' ? '0' : '1'];
  return [];
}
function scoreAnswer(q, pick){
  if (q.type === 'single') return pick === q.answer;
  if (q.type === 'multi'){
    var a = (q.answer || []).slice().sort().join('');
    var b = (pick || []).slice().sort().join('');
    return a === b && a.length > 0;
  }
  if (q.type === 'judge') return pick === q.answer;
  if (q.type === 'blank'){
    var ok = true;
    (q.answer || []).forEach(function(alts, i){
      var v = String((pick && pick[i]) || '').trim();
      var hit = (alts || []).some(function(x){ return String(x).trim() === v; });
      if (!hit && v) ok = false;
      if (!v) ok = false;
    });
    return ok;
  }
  if (q.type === 'match'){
    var mOk = true;
    (q.answer || []).forEach(function(right, i){
      if (String((pick || [])[i]) !== String(right)) mOk = fse;
    });
    return mOk;
  }
  return false;
}
function answerText(q){
  if (q.type === 'single') return q.answer + '．' + q.options[LETTERS.indexOf(q.answer)];
  if (q.type === 'multi') return q.answer.join('、') + '．' + (q.answer || []).map(function(a){ return q.options[LETTERS.indexOf(a)]; }).join(' / ');
  if (q.type === 'judge') return q.answer === 'T' ? '正确' : '错误';
  if (q.type === 'blank') return (q.answer || []).map(function(a){ return a.join(' 或 '); }).join('；');
  if (q.type === 'match'){
    var left = matchLeft(q);
    return (q.answer || []).map(function(r, i){ return (left[i] || ('第' + (i + 1) + '项')) + '→' + q.options[r]; }).join('；');
  }
  return '—';
}
/* 配对题左列：题干冒号后以顿号分隔 */
function matchLeft(q){
  var m = /[：:]\s*([^。]+)。?/.exec(q.stem);
  if (!m) return [];
  return m[1].split(/[、,，]/).map(function(s){ return s.trim(); }).filter(Boolean);
}
function renderStem(q){
  var s = esc(q.stem);
  if (q.type === 'blank'){
    s = s.replace(/\{\{(\d+)\}\}/g, function(m, n){
      return '<input class="inp blank-in" data-blank="' + n + '" type="text" aria-label="第' + n + '空">';
    });
  }
  return s;
}

/* ===== 会话状态（存 LocalStorage，刷新可续做） ===== */
var QUIZ = { on:false, ids:[], i:0, answers:{}, seed:1, built:false };

function quizBuild(filter){
  var pool = QUESTIONS.filter(function(q){
    if (filter.types && filter.types.length && filter.types.indexOf(q.type) === -1) return false;
    if (filter.tag && (q.tags || []).indexOf(filter.tag) === -1) return false;
    if (filter.diff && String(q.difficulty) !== String(filter.diff)) return false;
    return true;
  });
  var ids = pool.map(function(q){ return q.id; });
  if (filter.shuffle !== false){
    var s = 12345 + ids.length;
    for (var i = ids.length - 1; i > 0; i--){
      s = (s * 9301 + 49297) % 233280;
      var k = Math.floor(s / 233280 * (i + 1));
      var t = ids[i]; ids[i] = ids[k]; ids[k] = t;
    }
  }
  if (filter.limit && ids.length > filter.limit) ids = ids.slice(0, filter.limit);
  return ids;
}
function quizSave(){
  Store.write('session', {
    on: QUIZ.on, ids: QUIZ.ids, i: QUIZ.i, answers: QUIZ.answers,
    seed: QUIZ.seed, filter: QUIZ.filter || null, at: new Date().toISOString()
  });
}
function quizRestore(){
  var s = Store.read('session', null);
  if (!s || !s.on || !s.ids || !s.ids.length) return false;
  QUIZ.on = true; QUIZ.ids = s.ids; QUIZ.i = s.i || 0;
  QUIZ.answers = s.answers || {}; QUIZ.seed = s.seed || 1; QUIZ.filter = s.filter || null;
  return true;
}

/* ===== 页面：习题首页（设置） ===== */
PAGES.quiz = function(r){

    return t.short + ' ' + (byType[t.id] || 0);
  }).join(' · ')) +

  '<section class="card">' +
    '<div class="ring">' +
      '<div><div class="score-big">' + rate + '%</div><div class="card-note">累计正确率</div></div>' +
      '<div style="flex:1 1 auto">' +
        '<div class="row">' +
          '<span class="stat"><b>' + p.quizDone + '</b><span>已答题次</span></span>' +
          '<span class="stat"><b>' + wrong.length + '</b><span>错题</span></span>' +
          '<span class="stat"><b>' + marks.length + '</b><span>收藏题</span></span>' +
          '<span class="stat"><b>' + p.quizSessions + '</b><span>练习轮次</span></span>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="row" style="margin-top:12px">' +
      (canResume
        ? '<a class="btn primary" href="#/quiz/run">继续上次练习（' + Math.min(session.i + 1, session.ids.length) + '/' + session.ids.length + '）</a>'
        : '') +
      '<button class="btn primary" type="button" id="quizStart">开始新一轮（' + QUESTIONS.length + ' 题）</button>' +
    '</div>' +
    '<div class="row" style="margin-top:8px">' +
      '<a class="btn sm" href="#/quiz/run?start=quick10">快速 10 题</a>' +
      '<a class="btn sm" href="#/wrong">错题本（' + wrong.length + '）</a>' +
      '<a class="btn sm" href="#/bookmarks">收藏题（' + marks.length + '）</a>' +
    '</div>' +
  '</section>' +

  '<section class="card">' +
    '<div class="card-t"><h3>按题型练习</h3></div>' +
    '<div class="f-row">' +
      QTYPES.map(function(t){
        return '<a class="f-chip" href="#/quiz/run?type=' + t.id + '">' + esc(t.label) + '<small>' + (byType[t.id] || 0) + '</small></a>';
      }).join('') +
    '</div>' +
    '<div class="f-label" style="margin-top:12px">按难度</div>' +
    '<div class="f-row">' +
      ['1','2','3'].map(function(d){
        var n = QUESTIONS.filter(function(q){ return String(q.difficulty) === d; }).length;
        return '<a class="f-chip" href="#/quiz/run?diff=' + d + '">' + (d === '1' ? '易' : d === '2' ? '中' : '难') + '<small>' + n + '</small></a>';

      Object.keys(tags).sort(function(a, b){ return tags[b] - tags[a]; }).slice(0, 18).map(function(t){
        return '<a class="f-chip" href="#/quiz/run?tag=' + encodeURIComponent(t) + '">' + esc(t) + '<small>' + tags[t] + '</small></a>';
      }).join('') +
    '</div>' +
  '</section>' +

  '<section class="card">' +
    '<div class="card-t"><h3>答题说明</h3></div>' +
    '<ul>' +
      '<li>单选、多选、判断点选项后立即判分；填空与配对填好后点“提交答案”。</li>' +
      '<li>答错自动进错题本；每道题都能收藏，收藏与错题都存在本机。</li>' +
      '<li>题目为依据教材与国标要点自拟的练习题，不是考试真题；“' + PENDING + '”标记同样适用于题目来源。' + SAFE_NOTE + '</li>' +
